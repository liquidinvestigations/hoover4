[project]
name = "hoover4-mcp-collection-search-server"
version = "0.1.0"
description = "MCP server exposing ACL-bounded Hoover4 collection search over Manticore and ClickHouse"
requires-python = ">=3.11,<4.0"
dependencies = [
    # fastmcp v2 is required, not the bundled `mcp.server.fastmcp`: this server reads
    # per-request HTTP headers to resolve the caller's ACL, and
    # `fastmcp.server.dependencies.get_http_headers` is the supported way to do that.
    "fastmcp>=2.12,<3",
    "pydantic>=2.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    # The server's `instructions` is a Jinja template rendered from the tools it
    # registers, not a string literal. See collection_search_server/prompts/.
    "jinja2>=3.1",
    # agent_common's own dependencies, declared here as well because the image installs
    # `./agent_common` before this package (see the Dockerfile) and pip resolves the
    # two separately.
    "minio>=7.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
hoover4-collection-search-server = "collection_search_server.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["collection_search_server*"]

# The prompt templates are data, and setuptools ships no non-Python file unless told to.
# `_blocks/` is a plain directory rather than a package, so it needs its own glob.
[tool.setuptools.package-data]
"collection_search_server.prompts" = ["*.md.j2", "_blocks/*.md.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
