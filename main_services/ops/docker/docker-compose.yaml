services:

  zookeeper:
    image: zookeeper:3.9
    container_name: zookeeper
    hostname: zookeeper
    memswap_limit: 6000M
    mem_limit: 6000M
    networks:
      - hoover4
    restart: unless-stopped

  manticore:
    image: manticoresearch/manticore:14.1.0
    container_name: manticore
    ports:
      - '0.0.0.0:${MANTICORE_SQL_PORT}:9306'
      - '0.0.0.0:${MANTICORE_HTTP_PORT}:9308'
    volumes:
      - manticore_data_v14:/var/lib/manticore
    memswap_limit: 19000M
    mem_limit: 19000M
    ulimits:
      nproc: 65535
      nofile:
         soft: 65535
         hard: 65535
      memlock:
        soft: -1
        hard: -1
    restart: unless-stopped
    networks:
      - hoover4
    environment:
      - TELEMETRY=0
    user: 999:999

  clickhouse:
    container_name: clickhouse
    image: clickhouse/clickhouse-server:25.8
    cap_add:
      - SYS_NICE
      - NET_ADMIN
      - IPC_LOCK
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - CLICKHOUSE_DB=hoover4
      - CLICKHOUSE_USER=hoover4
      - CLICKHOUSE_PASSWORD=hoover4
    ports:
      - '0.0.0.0:${CLICKHOUSE_HTTP_PORT}:8123'
      - '0.0.0.0:${CLICKHOUSE_NATIVE_PORT}:9000'
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      # - ./data:/var/lib/clickhouse/user_files
      - ./clickhouse-server-config-override.xml:/etc/clickhouse-server/config.d/clickhouse-server-config-override.xml
    healthcheck:
      test: wget --no-verbose --tries=1 http://127.0.0.1:8123/ping || exit 1
      interval: 13s
      timeout: 15s
      retries: 6
    memswap_limit: 19000M
    mem_limit: 19000M
    restart: unless-stopped
    depends_on:
      - zookeeper
    networks:
      - hoover4

  clickhouse-monitoring:
    image: ghcr.io/duyet/clickhouse-monitoring:2cc8058
    environment:
      - "CLICKHOUSE_HOST=http://clickhouse:8123"
      - CLICKHOUSE_USER=hoover4
      - CLICKHOUSE_PASSWORD=hoover4
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - '0.0.0.0:${CLICKHOUSE_MONITORING_PORT}:3000'
    volumes:
      - clickhouse_monitoring:/var/lib/clickhouse-monitoring
    memswap_limit: 6000M
    mem_limit: 6000M
    restart: unless-stopped
    networks:
      - hoover4

  ch-ui:
    image: ghcr.io/caioricciuti/ch-ui:sha-6227281d8c096e4259a1b96c92aa3f8d784a3c2b
    ports:
      - '0.0.0.0:${CH_UI_PORT}:5521'
    depends_on:
      clickhouse:
        condition: service_healthy
    memswap_limit: 6000M
    mem_limit: 6000M
    restart: unless-stopped
    environment:
      VITE_CLICKHOUSE_URL: "$EXTERNAL_CLICKHOUSE_URL"
      VITE_CLICKHOUSE_USER: "hoover4"
      VITE_CLICKHOUSE_PASS: "hoover4"
    networks:
      - hoover4


  # ========================
  #         TEMPORAL
  # ========================
  temporal-cassandra:
    container_name: temporal-cassandra
    image: cassandra:${CASSANDRA_VERSION}
    # image: scylladb/scylla -- SLOWER
    networks:
      - hoover4
    ports:
      - 127.0.0.1:${CASSANDRA_PORT}:9042
    environment:
      - MAX_HEAP_SIZE=4G
      - HEAP_NEWSIZE=512M
      #- disk_access_mode="mmap_index_only" -- is default
    volumes:
      - temporal_cassandra:/var/lib/cassandra
    healthcheck:
      test: cqlsh -u cassandra -p cassandra -e 'describe cluster'
      interval: 15s
      timeout: 13s
      retries: 6
      start_period: 4s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 6000M
        reservations:
          cpus: '1'
          memory: 5000M
    restart: unless-stopped

  temporal-elasticsearch:
    container_name: temporal-elasticsearch
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms2048m -Xmx2048m
      - xpack.security.enabled=false
    image: elasticsearch:${ELASTICSEARCH_VERSION}
    networks:
      - hoover4
    ports:
      - 127.0.0.1:${ELASTICSEARCH_PORT}:9200
    volumes:
      - temporal_elasticsearch:/var/lib/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 13s
      retries: 6
      start_period: 4s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 12048M
        reservations:
          cpus: '1'
          memory: 1500M
    restart: unless-stopped

  temporal:
    container_name: temporal
    depends_on:
      temporal-elasticsearch:
        condition: service_healthy
      temporal-cassandra:
        condition: service_healthy
    environment:
      - CASSANDRA_SEEDS=temporal-cassandra
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
    image: temporalio/auto-setup:${TEMPORAL_VERSION}
    networks:
      - hoover4
    ports:
      - 127.0.0.1:${TEMPORAL_GRPC_PORT}:7233
      - 127.0.0.1:${TEMPORAL_HTTP_PORT}:7243
    labels:
      kompose.volume.type: configMap
    healthcheck:
      test: ['CMD-SHELL', 'tctl --address temporal:7233 workflow list --pagesize 1']
      interval: 15s
      timeout: 13s
      retries: 6
      start_period: 4s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 6000M
        reservations:
          cpus: '1'
          memory: 500M
    restart: unless-stopped

  temporal-ui:
    container_name: temporal-ui
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    image: temporalio/ui:${TEMPORAL_UI_VERSION}
    networks:
      - hoover4
    ports:
      - 127.0.0.1:${TEMPORAL_UI_PORT}:8080
    healthcheck:
      test: ['CMD-SHELL', 'curl --silent --fail http://temporal-ui:8080/api/v1/settings? || exit 1']
      interval: 15s
      timeout: 13s
      retries: 6
      start_period: 4s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 6000M
        reservations:
          cpus: '1'
          memory: 500M
    restart: unless-stopped


  # ========================
  #          S3
  # ========================

  minio-s3:
    container_name: minio-s3
    image: minio/minio:${MINIO_VERSION}
    volumes:
      - minio_data:/data
    networks:
      - hoover4
    ports:
      - "0.0.0.0:${MINIO_CONSOLE_PORT}:8084"
      - "0.0.0.0:${MINIO_API_PORT}:9000"
    environment:
      MINIO_ACCESS_KEY: hoover4
      MINIO_SECRET_KEY: hoover4-secret
      MINIO_BROWSER_REDIRECT_URL: "http://localhost:${MINIO_CONSOLE_PORT}"
      MINIO_UPDATE: "off"
      MINIO_API_REQUESTS_MAX: "600"
      MINIO_API_REQUESTS_DEADLINE: "2m"
      MINIO_DRIVE_SYNC: "on"
      GOMAXPROCS: "20"
    command: server /data  --console-address :8084
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 15s
      timeout: 13s
      retries: 6
      start_period: 4s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 6000M
        reservations:
          cpus: '1'
          memory: 500M
    restart: unless-stopped


  redis:
    image: redis:6.0.9
    hostname: redis
    container_name: redis
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "3000mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - '127.0.0.1:${REDIS_PORT}:6379'
    networks:
      - hoover4
    deploy:
      resources:
        limits:
          memory: 4000M
        reservations:
          memory: 300M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 13s
      retries: 6
      start_period: 4s
    restart: unless-stopped


  hoover4-worker:
    # image: hoover4-worker
    container_name: hoover4-worker
    build:
      context: ../../processing
      dockerfile: Dockerfile
    command: bash -exc "uv run main.py migrate && uv run main.py worker"
    networks:
      - hoover4
    restart: unless-stopped
    memswap_limit: 29000M
    mem_limit: 29000M
    volumes:
      # Host path for ingest test data. Defaults to the in-repo (git-tracked)
      # testdata dir so the stack comes up out of the box; override with
      # HOOVER4_TESTDATA_DIR to point at a larger external dataset. The source
      # must EXIST — podman refuses to auto-create a missing bind-mount source.
      - ${HOOVER4_TESTDATA_DIR:-../../../testdata}:/testdata
      - ../../processing:/app
      # EasyOCR's model cache (~100 MB, downloaded from the internet on first
      # use). Persisted so a container recreate does not re-download it in N
      # concurrent worker processes at once; named *_cache so --reset keeps it
      # (deploy.py CACHE_VOLUME_SUFFIXES).
      - easyocr_models_cache:/root/.EasyOCR
      # Secrets rule: the ini stores the host PATH, deploy.py renders it as a mount
      # source, and the container reads the file. No key value ever enters a .env, a
      # compose file, a log line or a command line. /dev/null when no provider is set.
      - ${LLM_API_KEY_FILE_HOST:-/dev/null}:/run/secrets/llm_api_key:ro
    depends_on:
      temporal:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      - "NER_URL=${NER_URL}"
      # The CPU twin remote.py falls back to on a CONNECT failure. deploy.py renders
      # this only when hoover4-ner-spacy is actually in the base compose file --
      # announcing a fallback url for a container that does not exist would cost a
      # connect timeout per batch before failing anyway.
      - "NER_URL_FALLBACK=${NER_URL_FALLBACK:-}"
      # The full research agent, for the P_agent ResearchTask workflow. Same network.
      - "RESEARCH_AGENT_URL=${RESEARCH_AGENT_URL:-http://hoover4-full-research-agent:8000}"
      # Provider switches and GPU-failure behaviour, rendered from hoover4.ini by
      # deploy.py. Consumed by the pipeline starting in Part 2.
      - "NER_PROVIDER=${NER_PROVIDER:-gpu}"
      - "EMBEDDINGS_PROVIDER=${EMBEDDINGS_PROVIDER:-gpu}"
      - "PDF_OCR_PROVIDER=${PDF_OCR_PROVIDER:-tesseract}"
      # Stack-wide language DEFAULTS. A dataset inherits these until the admin page
      # writes a dataset_settings row for it, after which that row wins (D6).
      - "TESSERACT_LANGUAGES=${TESSERACT_LANGUAGES:-eng}"
      - "EASYOCR_LANGUAGES=${EASYOCR_LANGUAGES:-en}"
      # The OCR tier, one endpoint per engine. Empty means "this engine produces no
      # variants", which is the normal state for EasyOCR on a box with no GPU tier —
      # `tasks/ocr_client.py` records a skip and succeeds rather than consuming retries.
      # There is deliberately no fallback BETWEEN engines: the engine is part of the
      # storage key (`ocr_easyocr_en` vs `ocr_tesseract_eng`), so serving one from the
      # other would file the text under a name that did not produce it.
      - "OCR_TESSERACT_URL=${OCR_TESSERACT_URL:-}"
      - "OCR_EASYOCR_URL=${OCR_EASYOCR_URL:-}"
      - "GPU_FALLBACK=${GPU_FALLBACK:-true}"
      - "GPU_CONNECT_TIMEOUT_MS=${GPU_CONNECT_TIMEOUT_MS:-2000}"
      - "GPU_CIRCUIT_BREAK_SECONDS=${GPU_CIRCUIT_BREAK_SECONDS:-60}"
      # The LLM provider, for `main.py refresh-llm-catalog`. The worker discovers the
      # model list into `llm_models` and writes the chat/summarisation choices into
      # `server_settings`; ids are matched by PATTERN against what the account actually
      # returns, because NIM retires them and a hardcoded id becomes a 404 months later.
      # The key is a bind-mounted file, never an env value.
      - "LLM_BASE_URL=${LLM_BASE_URL:-}"
      - "LLM_MODEL=${LLM_MODEL:-}"
      - "LLM_API_KEY_FILE=/run/secrets/llm_api_key"

  hoover4-website:
    # image: hoover4-website
    container_name: hoover4-website
    build:
      context: ../../../website
      dockerfile: Dockerfile
    command: bash -c "while true; do dx serve --fullstack --package frontend --renderer web --port 8080 --addr 0.0.0.0 --open false --hot-reload false; sleep 1; echo restarting...; done"
    restart: unless-stopped
    memswap_limit: 9000M
    mem_limit: 9000M
    volumes:
      - ../../../website/frontend:/app/frontend
      - ../../../website/common:/app/common
      - ../../../website/backend:/app/backend
      - ../../../website/Cargo.toml:/app/Cargo.toml
      - ../../../website/Cargo.lock:/app/Cargo.lock
      - hoover4-website-target:/app/frontend/target
      - ${LLM_API_KEY_FILE_HOST:-/dev/null}:/run/secrets/llm_api_key:ro
    ports:
      - "0.0.0.0:12345:8080"
    environment:
      - CLICKHOUSE_URL=http://clickhouse:8123
      - MANTICORE_URL=http://manticore:9308
      - PDF_TO_HTML_ENDPOINT=http://hoover4-processing-pdf-to-html:19027/
      - S3_ENDPOINT=http://minio-s3:9000
      # Temporal's HTTP API, used to start workflows from the admin UI. The code
      # defaults to localhost:7243 for running the website outside Docker; inside the
      # container localhost is the container itself, so it must be set explicitly.
      - TEMPORAL_HTTP_URL=http://temporal:7243
      # Temporal's *UI*, used only to build deep links rendered in the admin pages.
      # Unlike the API above this is followed by the admin's browser, so it has to be
      # an address reachable from the host, not from inside the container network.
      - TEMPORAL_UI_URL=${TEMPORAL_UI_URL:-http://localhost:21909}
      # Demo switch: when true, anonymous guest-* sessions are treated as admins.
      - HOOVER4_DEMO_MODE=${HOOVER4_DEMO_MODE:-false}
      # Max concurrent Manticore queries during search fan-out (default 8).
      # - HOOVER4_SEARCH_MAX_PARALLELISM=8
      # AI Chat: the research agent from compose/agents.yaml (same stack, same
      # `hoover4` network). Chat returns an error message in the transcript
      # when this is unreachable, so the site works fine without the agents running.
      - HOOVER4_AGENT_URL=${HOOVER4_AGENT_URL:-http://hoover4-internal-search-agent:8000}
      # The internet-tools agent, selected by the chat composer's "Internet tools" box.
      # Must be set explicitly for the same reason as TEMPORAL_HTTP_URL above: the code
      # default is a loopback port published on the *host*, which inside this container
      # resolves to the container itself. Leaving it unset is what made every
      # internet-tools turn fail with "AI agent unreachable at http://localhost:9090".
      - HOOVER4_FULL_AGENT_URL=${HOOVER4_FULL_AGENT_URL:-http://hoover4-full-research-agent:8000}
      - HOOVER4_AGENT_TIMEOUT_SECONDS=${HOOVER4_AGENT_TIMEOUT_SECONDS:-300}
      # Retries for one chat turn: 4 attempts, backing off 2/4/8 s.
      - HOOVER4_AGENT_ATTEMPTS=${HOOVER4_AGENT_ATTEMPTS:-4}
      - HOOVER4_AGENT_RETRY_BASE_MS=${HOOVER4_AGENT_RETRY_BASE_MS:-2000}
      # The chat title/summary generator (api/chat/summarize.rs) calls the LLM
      # directly, not through the agent — summarising must not drag MCP tools into
      # the call. `LLM_MODEL` has no default in the code on purpose (the served name
      # changes with the model), so **unset means the summariser silently does
      # nothing**: every conversation keeps its truncated first message as a title
      # and never gets a summary. Both are rendered from hoover4.ini by deploy.py.
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      # The API key is a bind-mounted file, never an env value: hoover4.ini stores
      # the host path, deploy.py mounts it here, and summarize.rs reads it. With no
      # provider key configured the mount source is /dev/null and the code falls
      # back to its local default.
      - LLM_API_KEY_FILE=/run/secrets/llm_api_key
    networks:
      - hoover4
    depends_on:
      temporal:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  hoover4-processing-pdf-to-html:
    container_name: hoover4-processing-pdf-to-html
    build:
      context: ./pdf-to-html
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:${PDF_TO_HTML_PORT}:19027"
    networks:
      - hoover4
    restart: unless-stopped
    memswap_limit: 9000M
    mem_limit: 9000M
    volumes:
      - ./pdf-to-html:/app
    entrypoint: ["/usr/bin/python", "/app/pdf2html_server.py"]
    working_dir: /app

  # ------------------------------------------------------------------ NER: CPU twin
  # In the BASE file, not an overlay, and never optional. deploy.py's
  # `_ner_spacy_twin_enabled` tests for this service's presence *here* before it will
  # announce NER_URL_FALLBACK, because announcing a fallback url for a container that
  # does not exist is worse than having none: tasks/remote.py would spend a connect
  # timeout on it before failing, on every batch.
  hoover4-ner-spacy:
    container_name: hoover4-ner-spacy
    build:
      context: ../../ner_spacy
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${NER_SPACY_PORT}:8000"
    networks:
      - hoover4
    restart: unless-stopped
    memswap_limit: 4000M
    mem_limit: 4000M
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      # Must differ from the GPU tier's model id. entity_hit carries nlp_model in its
      # ORDER BY, so the two providers' rows coexist; sharing an id would make the
      # twin overwrite the GPU's rows and its watermark, and the files it handled
      # during an outage would then never be reprocessed when the GPU came back.
      - NLP_MODEL_ID=${NLP_MODEL_ID_SPACY:-ner-spacy-xx}
      - NER_CONCURRENCY=${NER_SPACY_CONCURRENCY:-2}
      - NER_QUEUE_DEPTH=${NER_SPACY_QUEUE_DEPTH:-16}
      - HOOVER4_CONFIG_FINGERPRINT=${HOOVER4_CONFIG_FINGERPRINT:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      # The model is baked into the image, so there is no download to wait for.
      start_period: 30s

volumes:
  clickhouse_data:
    driver: local
  manticore_data_v14:
    driver: local
  minio_data:
    driver: local
  elasticsearch_data:
    driver: local
  temporal_elasticsearch:
    driver: local
  temporal_cassandra:
    driver: local
  clickhouse_monitoring:
    driver: local
  hoover4-website-target:
    driver: local
  easyocr_models_cache:
    driver: local
  # vllm_huggingface_cache:
  #   driver: local
  # litellm_postgres_data:
  #   driver: local
  # ollama:
  #   driver: local
  # open-webui2:
  #   driver: local
networks:
  hoover4:
    name: hoover4
    # external: true



