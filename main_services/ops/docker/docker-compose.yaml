services:

  zookeeper:
    image: zookeeper:3.9
    container_name: zookeeper
    hostname: zookeeper
    memswap_limit: 6000M
    mem_limit: 6000M
    networks:
      - hoover4
    restart: unless-stopped

  manticore:
    image: manticoresearch/manticore:14.1.0
    container_name: manticore
    ports:
      - '${INFRA_BIND_IP:-0.0.0.0}:${MANTICORE_SQL_PORT}:9306'
      - '${INFRA_BIND_IP:-0.0.0.0}:${MANTICORE_HTTP_PORT}:9308'
    volumes:
      - manticore_data_v14:/var/lib/manticore
    memswap_limit: 19000M
    mem_limit: 19000M
    ulimits:
      nproc: 65535
      nofile:
         soft: 65535
         hard: 65535
      memlock:
        soft: -1
        hard: -1
    restart: unless-stopped
    networks:
      - hoover4
    environment:
      - TELEMETRY=0
    user: 999:999

  clickhouse:
    container_name: clickhouse
    image: clickhouse/clickhouse-server:25.8
    cap_add:
      - SYS_NICE
      - NET_ADMIN
      - IPC_LOCK
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - CLICKHOUSE_DB=hoover4
      - CLICKHOUSE_USER=hoover4
      - CLICKHOUSE_PASSWORD=hoover4
    ports:
      - '${INFRA_BIND_IP:-0.0.0.0}:${CLICKHOUSE_HTTP_PORT}:8123'
      - '${INFRA_BIND_IP:-0.0.0.0}:${CLICKHOUSE_NATIVE_PORT}:9000'
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      # - ./data:/var/lib/clickhouse/user_files
      - ./clickhouse-server-config-override.xml:/etc/clickhouse-server/config.d/clickhouse-server-config-override.xml
    healthcheck:
      test: wget --no-verbose --tries=1 http://127.0.0.1:8123/ping || exit 1
      interval: 13s
      timeout: 15s
      retries: 6
    memswap_limit: 19000M
    mem_limit: 19000M
    restart: unless-stopped
    depends_on:
      - zookeeper
    networks:
      - hoover4

  clickhouse-monitoring:
    image: ghcr.io/duyet/clickhouse-monitoring:2cc8058
    environment:
      - "CLICKHOUSE_HOST=http://clickhouse:8123"
      - CLICKHOUSE_USER=hoover4
      - CLICKHOUSE_PASSWORD=hoover4
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - '${INFRA_BIND_IP:-0.0.0.0}:${CLICKHOUSE_MONITORING_PORT}:3000'
    volumes:
      - clickhouse_monitoring:/var/lib/clickhouse-monitoring
    memswap_limit: 6000M
    mem_limit: 6000M
    restart: unless-stopped
    networks:
      - hoover4

  ch-ui:
    image: ghcr.io/caioricciuti/ch-ui:sha-6227281d8c096e4259a1b96c92aa3f8d784a3c2b
    ports:
      - '${INFRA_BIND_IP:-0.0.0.0}:${CH_UI_PORT}:5521'
    depends_on:
      clickhouse:
        condition: service_healthy
    memswap_limit: 6000M
    mem_limit: 6000M
    restart: unless-stopped
    environment:
      VITE_CLICKHOUSE_URL: "$EXTERNAL_CLICKHOUSE_URL"
      VITE_CLICKHOUSE_USER: "hoover4"
      VITE_CLICKHOUSE_PASS: "hoover4"
    networks:
      - hoover4


  # ========================
  #         TEMPORAL
  # ========================
  temporal-cassandra:
    container_name: temporal-cassandra
    image: cassandra:${CASSANDRA_VERSION}
    # image: scylladb/scylla -- SLOWER
    networks:
      - hoover4
    ports:
      - 127.0.0.1:${CASSANDRA_PORT}:9042
    environment:
      - MAX_HEAP_SIZE=4G
      - HEAP_NEWSIZE=512M
      #- disk_access_mode="mmap_index_only" -- is default
    volumes:
      - temporal_cassandra:/var/lib/cassandra
    healthcheck:
      test: cqlsh -u cassandra -p cassandra -e 'describe cluster'
      interval: 15s
      timeout: 13s
      retries: 6
      start_period: 4s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 6000M
        reservations:
          cpus: '1'
          memory: 5000M
    restart: unless-stopped

  temporal-elasticsearch:
    container_name: temporal-elasticsearch
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms2048m -Xmx2048m
      - xpack.security.enabled=false
    image: elasticsearch:${ELASTICSEARCH_VERSION}
    networks:
      - hoover4
    ports:
      - 127.0.0.1:${ELASTICSEARCH_PORT}:9200
    volumes:
      - temporal_elasticsearch:/var/lib/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 13s
      retries: 6
      start_period: 4s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 12048M
        reservations:
          cpus: '1'
          memory: 1500M
    restart: unless-stopped

  temporal:
    container_name: temporal
    depends_on:
      temporal-elasticsearch:
        condition: service_healthy
      temporal-cassandra:
        condition: service_healthy
    environment:
      - CASSANDRA_SEEDS=temporal-cassandra
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      # Fixed for the life of the Cassandra keyspace; changing it needs
      # `./deploy --reset-temporal`, which deploy.py's preflight insists on.
      - NUM_HISTORY_SHARDS=${NUM_HISTORY_SHARDS}
    image: temporalio/auto-setup:${TEMPORAL_VERSION}
    networks:
      - hoover4
    ports:
      - 127.0.0.1:${TEMPORAL_GRPC_PORT}:7233
      - 127.0.0.1:${TEMPORAL_HTTP_PORT}:7243
    volumes:
      # The image ships `dynamicconfig/docker.yaml` as an empty file, which leaves
      # every matching and persistence tunable at its demo default. The DIRECTORY is
      # mounted rather than the file: a single-file bind mount follows the inode it was
      # created with, so any editor that writes-and-renames silently leaves the
      # container reading the old contents.
      - ${HOOVER4_REPO_ROOT}/main_services/ops/docker/temporal-dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    labels:
      kompose.volume.type: configMap
    healthcheck:
      test: ['CMD-SHELL', 'tctl --address temporal:7233 workflow list --pagesize 1']
      interval: 15s
      timeout: 13s
      retries: 6
      start_period: 4s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 6000M
        reservations:
          cpus: '1'
          memory: 500M
    restart: unless-stopped

  temporal-ui:
    container_name: temporal-ui
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    image: temporalio/ui:${TEMPORAL_UI_VERSION}
    networks:
      - hoover4
    ports:
      - 127.0.0.1:${TEMPORAL_UI_PORT}:8080
    healthcheck:
      test: ['CMD-SHELL', 'curl --silent --fail http://temporal-ui:8080/api/v1/settings? || exit 1']
      interval: 15s
      timeout: 13s
      retries: 6
      start_period: 4s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 6000M
        reservations:
          cpus: '1'
          memory: 500M
    restart: unless-stopped


  # ========================
  #          S3
  # ========================

  garage:
    container_name: garage
    image: dxflrs/garage:${GARAGE_VERSION}@${GARAGE_IMAGE_DIGEST}
    networks:
      - hoover4
    ports:
      - "${INFRA_BIND_IP:-0.0.0.0}:${GARAGE_S3_PORT}:3900"
      # The admin API on loopback only: there is no web console (the one that exists
      # speaks the v1 API and Garage 2.x refuses it), so this port is how a human
      # inspects the cluster with curl.
      - "127.0.0.1:${GARAGE_ADMIN_PORT}:3903"
    volumes:
      - ${HOOVER4_REPO_ROOT}/main_services/ops/docker/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    environment:
      # Local-deployment constants, exactly like the ClickHouse and Manticore
      # credentials in this file. Garage enforces minimum lengths: an access key id
      # under 8 characters and a secret under 16 are refused at bootstrap, and
      # GARAGE_RPC_SECRET must be 32 bytes of hex even on a single node.
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET:-cbc5a1dbd1c832a3bdcb0abff4e5ffc950035febf867de39e9b079cec8863e1d}
      - GARAGE_ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN:-hoover4-garage-admin-token}
    # `mem_limit`/`memswap_limit` are the pair that actually applies here;
    # `deploy.resources.limits` is ignored by the v2 compose spec outside Swarm. LMDB is
    # mmap-backed, so the container's total reads near the limit as page cache -- see
    # garage/Readme.md.
    mem_limit: 4000M
    memswap_limit: 4000M
    healthcheck:
      # CMD form, not CMD-SHELL: the image is FROM scratch and has no shell.
      test: ["CMD", "/garage", "status"]
      interval: 15s
      timeout: 13s
      retries: 6
      start_period: 4s
    restart: unless-stopped

  # Turns a blank node into a usable cluster: layout, key, bucket, grant. Idempotent,
  # so it runs on every deploy rather than only the first.
  garage-init:
    container_name: garage-init
    build:
      context: ./garage
      dockerfile: Dockerfile
      args:
        GARAGE_IMAGE: dxflrs/garage:${GARAGE_VERSION}@${GARAGE_IMAGE_DIGEST}
    networks:
      - hoover4
    depends_on:
      garage:
        condition: service_healthy
    environment:
      - GARAGE_ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN:-hoover4-garage-admin-token}
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET:-cbc5a1dbd1c832a3bdcb0abff4e5ffc950035febf867de39e9b079cec8863e1d}
      - GARAGE_CAPACITY=${GARAGE_CAPACITY:-300G}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-hoover4-blobs-rw}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-hoover4-garage-blob-secret-key-0}
      - S3_SYSTEM_BUCKET=${S3_SYSTEM_BUCKET:-hoover4-system}
      - S3_COLLECTION_BUCKET_PREFIX=${S3_COLLECTION_BUCKET_PREFIX:-hoover4-c-}
    mem_limit: 512M
    memswap_limit: 512M
    restart: "no"

  redis:
    image: redis:6.0.9
    hostname: redis
    container_name: redis
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "3000mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - '127.0.0.1:${REDIS_PORT}:6379'
    networks:
      - hoover4
    deploy:
      resources:
        limits:
          memory: 4000M
        reservations:
          memory: 300M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 13s
      retries: 6
      start_period: 4s
    restart: unless-stopped


  hoover4-worker:
    # image: hoover4-worker
    container_name: hoover4-worker
    build:
      context: ../../processing
      dockerfile: Dockerfile
    command: bash -exc "uv run main.py migrate && uv run main.py worker"
    networks:
      - hoover4
    restart: unless-stopped
    # An ini key because this and the common-worker count have to be chosen together:
    # each worker process carries its own interpreter and its own Magika model.
    #
    # podman-compose renders `memswap_limit` as memory PLUS swap, not as the total, so
    # equal values give "N of RAM and N of swap" rather than "N and no swap" -- confirm
    # with `docker inspect <c> --format '{{.HostConfig.Memory}} {{.HostConfig.MemorySwap}}'`
    # rather than reading the intent off this file.
    memswap_limit: ${HOOVER4_WORKER_MEM_LIMIT:-29000M}
    mem_limit: ${HOOVER4_WORKER_MEM_LIMIT:-29000M}
    # NOT a number to tune here. deploy.py derives it from the single ini key that also
    # sets the Temporal worker's graceful shutdown period, adding a margin for the
    # activities that get cancelled at the end of it. The default 10 seconds this
    # replaces is what made the SDK's graceful period unreachable: the runtime sent
    # SIGKILL while activities were still being told to stop, so they were never told.
    stop_grace_period: ${HOOVER4_WORKER_STOP_GRACE_PERIOD:-90s}
    volumes:
      # Host path for ingest test data. Defaults to the in-repo (git-tracked)
      # testdata dir so the stack comes up out of the box; override with
      # HOOVER4_TESTDATA_DIR to point at a larger external dataset. The source
      # must EXIST — podman refuses to auto-create a missing bind-mount source.
      - ${HOOVER4_TESTDATA_DIR:-../../../testdata}:/testdata
      - ../../processing:/app
      # EasyOCR's model cache (~100 MB, downloaded from the internet on first
      # use). Persisted so a container recreate does not re-download it in N
      # concurrent worker processes at once; named *_cache so --reset keeps it
      # (deploy.py CACHE_VOLUME_SUFFIXES).
      - easyocr_models_cache:/root/.EasyOCR
      # Secrets rule: the ini stores the host PATH, deploy.py renders it as a mount
      # source, and the container reads the file. No key value ever enters a .env, a
      # compose file, a log line or a command line. /dev/null when no provider is set.
      - ${LLM_API_KEY_FILE_HOST:-/dev/null}:/run/secrets/llm_api_key:ro
    depends_on:
      temporal:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      # The bucket and the key exist only after the bootstrap has run. `ensure_bucket`
      # would create the bucket anyway, but only if the key already has permission to,
      # which is itself something the bootstrap grants.
      garage-init:
        condition: service_completed_successfully
    environment:
      - "NER_URL=${NER_URL}"
      - "S3_ENDPOINT=${S3_ENDPOINT:-http://garage:3900}"
      - "S3_ACCESS_KEY=${S3_ACCESS_KEY:-hoover4-blobs-rw}"
      - "S3_SECRET_KEY=${S3_SECRET_KEY:-hoover4-garage-blob-secret-key-0}"
      - "S3_SYSTEM_BUCKET=${S3_SYSTEM_BUCKET:-hoover4-system}"
      - "S3_COLLECTION_BUCKET_PREFIX=${S3_COLLECTION_BUCKET_PREFIX:-hoover4-c-}"
      # The CPU twin remote.py falls back to on a CONNECT failure. deploy.py renders
      # this only when [main_services] ner_spacy_enabled is true, which is the same key
      # that pulls in compose/ner-spacy.yaml -- announcing a fallback url for a
      # container that does not exist would cost a connect timeout per batch before
      # failing anyway. The key defaults to false.
      - "NER_URL_FALLBACK=${NER_URL_FALLBACK:-}"
      # The full research agent, for the P_agent ResearchTask workflow. Same network.
      - "RESEARCH_AGENT_URL=${RESEARCH_AGENT_URL:-http://hoover4-full-research-agent:8000}"
      # The documents-only agent. A durable turn in a thread with internet tools off
      # goes here, so a conversation does not answer some questions with the open web
      # and some without.
      - "INTERNAL_SEARCH_AGENT_URL=${INTERNAL_SEARCH_AGENT_URL:-http://hoover4-internal-search-agent:8000}"
      # Provider switches and GPU-failure behaviour, rendered from hoover4.ini by
      # deploy.py. Read by the pipeline worker.
      - "NER_PROVIDER=${NER_PROVIDER:-gpu}"
      - "EMBEDDINGS_PROVIDER=${EMBEDDINGS_PROVIDER:-gpu}"
      # Embeddings + reranker base URL (one server serves both /v1/embeddings and
      # /v1/rerank). Empty when embeddings_provider = none: the embed activity fails
      # fast naming the setting rather than hanging on a dead host.
      - "EMBEDDINGS_URL=${EMBEDDINGS_URL:-}"
      - "RERANK_URL=${RERANK_URL:-}"
      - "PDF_OCR_PROVIDER=${PDF_OCR_PROVIDER:-tesseract}"
      # Stack-wide language DEFAULTS. A dataset inherits these until the admin page
      # writes a dataset_settings row for it, after which that row wins.
      - "TESSERACT_LANGUAGES=${TESSERACT_LANGUAGES:-eng}"
      - "EASYOCR_LANGUAGES=${EASYOCR_LANGUAGES:-en}"
      # Same root the website's creation form lists, mounted from the same host dir.
      - "DATASETS_MOUNT_PATH=${DATASETS_MOUNT_PATH:-/testdata}"
      # The OCR tier, one endpoint per engine. Empty means "this engine produces no
      # variants", which is the normal state for EasyOCR on a box with no GPU tier —
      # `tasks/ocr_client.py` records a skip and succeeds rather than consuming retries.
      # There is deliberately no fallback BETWEEN engines: the engine is part of the
      # storage key (`ocr_easyocr_en` vs `ocr_tesseract_eng`), so serving one from the
      # other would file the text under a name that did not produce it.
      - "OCR_TESSERACT_URL=${OCR_TESSERACT_URL:-}"
      - "OCR_EASYOCR_URL=${OCR_EASYOCR_URL:-}"
      # The searchable-PDF assembler (compose/ocr-pdf.yaml). Empty means no OCR'd-PDF
      # variants are produced at all — the activity records a skip and succeeds, exactly
      # like an OCR engine with no endpoint.
      - "OCR_PDF_URL=${OCR_PDF_URL:-}"
      # The regex entity scanner (compose/regex-entity-scanner.yaml). Always present, so
      # the scan stage has no absent-endpoint branch to carry.
      - "REGEX_SCANNER_URL=${REGEX_SCANNER_URL:-http://hoover4-regex-entity-scanner:19705}"
      # Worker fleet sizing. Unset everywhere by default: each tier's own default is a
      # measurement, not a guess, and the common tier's process count already follows
      # the host's core count. Set one to override that for this deployment.
      - "HOOVER4_COMMON_WORKERS=${HOOVER4_COMMON_WORKERS:-}"
      - "HOOVER4_COMMON_CONCURRENCY=${HOOVER4_COMMON_CONCURRENCY:-}"
      - "HOOVER4_TIKA_CONCURRENCY=${HOOVER4_TIKA_CONCURRENCY:-}"
      - "HOOVER4_OCR_CONCURRENCY=${HOOVER4_OCR_CONCURRENCY:-}"
      - "HOOVER4_NLP_CONCURRENCY=${HOOVER4_NLP_CONCURRENCY:-}"
      - "HOOVER4_EMBED_CONCURRENCY=${HOOVER4_EMBED_CONCURRENCY:-}"
      - "HOOVER4_INDEXING_CONCURRENCY=${HOOVER4_INDEXING_CONCURRENCY:-}"
      # A rendered .env is substituted INTO this file; it does not reach the container by
      # itself. Without this line the worker reads no graceful shutdown period, falls
      # back to its own default, and the ini key silently stops deciding anything.
      - "HOOVER4_WORKER_GRACEFUL_SHUTDOWN_SECONDS=${HOOVER4_WORKER_GRACEFUL_SHUTDOWN_SECONDS:-60}"
      - "GPU_FALLBACK=${GPU_FALLBACK:-true}"
      - "GPU_CONNECT_TIMEOUT_MS=${GPU_CONNECT_TIMEOUT_MS:-2000}"
      - "GPU_CIRCUIT_BREAK_SECONDS=${GPU_CIRCUIT_BREAK_SECONDS:-60}"
      # The LLM provider, for `main.py refresh-llm-catalog`. The worker discovers the
      # model list into `llm_models` and writes the chat/summarisation choices into
      # `server_settings`; ids are matched by PATTERN against what the account actually
      # returns, because NIM retires them and a hardcoded id becomes a 404 months later.
      # The key is a bind-mounted file, never an env value.
      - "LLM_BASE_URL=${LLM_BASE_URL:-}"
      - "LLM_MODEL=${LLM_MODEL:-}"
      - "LLM_API_KEY_FILE=/run/secrets/llm_api_key"

  # Long operations a person can start: ingests, re-indexes, and the backup and restore
  # paths that need file access to the stores. Split out of hoover4-worker so that its
  # load is bounded by the runtime rather than by the queues behaving: a restore that
  # saturated the pipeline fleet would stall ingestion with nothing in the pipeline to
  # blame. It runs the SAME image as the worker; only the command and the budget differ.
  hoover4-ops:
    container_name: hoover4-ops
    build:
      context: ../../processing
      dockerfile: Dockerfile
    # No `migrate` here. The worker owns that, and two containers racing the migration
    # runner at boot is how a checksum mismatch becomes an outage on both of them.
    command: bash -exc "uv run main.py worker operations"
    networks:
      - hoover4
    restart: unless-stopped
    mem_limit: ${HOOVER4_OPS_MEM_LIMIT:-4000M}
    memswap_limit: ${HOOVER4_OPS_MEM_LIMIT:-4000M}
    cpus: ${HOOVER4_OPS_CPUS:-4}
    # It is a Temporal worker, so it drains exactly like the pipeline fleet does and
    # takes the same period from the same ini key.
    stop_grace_period: ${HOOVER4_WORKER_STOP_GRACE_PERIOD:-90s}
    volumes:
      - ../../processing:/app
      # The backup root, read-write. A host path if one is configured, otherwise the
      # managed volume named here, so this container comes up on a box where no backup
      # directory has been created — podman refuses a missing bind-mount source.
      - ${HOOVER4_OPS_BACKUP_DIR:-ops_backups}:/backups
      # The three stores' data directories, READ-ONLY. Read-only because nothing here
      # may write into a live store's files: the backup paths read, and the restore
      # paths go through each store's own protocol, which is the only writer that
      # knows how to keep a store consistent with itself.
      - clickhouse_data:/stores/clickhouse:ro
      - manticore_data_v14:/stores/manticore:ro
      - garage_data:/stores/garage/data:ro
      - garage_meta:/stores/garage/meta:ro
      - ${LLM_API_KEY_FILE_HOST:-/dev/null}:/run/secrets/llm_api_key:ro
    depends_on:
      temporal:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    environment:
      - "S3_ENDPOINT=${S3_ENDPOINT:-http://garage:3900}"
      - "S3_ACCESS_KEY=${S3_ACCESS_KEY:-hoover4-blobs-rw}"
      - "S3_SECRET_KEY=${S3_SECRET_KEY:-hoover4-garage-blob-secret-key-0}"
      - "S3_SYSTEM_BUCKET=${S3_SYSTEM_BUCKET:-hoover4-system}"
      - "S3_COLLECTION_BUCKET_PREFIX=${S3_COLLECTION_BUCKET_PREFIX:-hoover4-c-}"
      # Same passthrough as the worker, and for the same reason: a rendered .env is
      # substituted INTO this file and does not reach the container by itself.
      - "HOOVER4_WORKER_GRACEFUL_SHUTDOWN_SECONDS=${HOOVER4_WORKER_GRACEFUL_SHUTDOWN_SECONDS:-60}"
      - "HOOVER4_OPERATIONS_CONCURRENCY=${HOOVER4_OPERATIONS_CONCURRENCY:-}"
      - "HOOVER4_BACKUP_ROOT=/backups"

  hoover4-website:
    # image: hoover4-website
    container_name: hoover4-website
    build:
      context: ../../../website
      dockerfile: Dockerfile
    command: bash -c "while true; do dx serve --fullstack --package frontend --renderer web --port 8080 --addr 0.0.0.0 --open false --hot-reload false; sleep 1; echo restarting...; done"
    restart: unless-stopped
    memswap_limit: 9000M
    mem_limit: 9000M
    volumes:
      - ../../../website/frontend:/app/frontend
      - ../../../website/common:/app/common
      - ../../../website/backend:/app/backend
      - ../../../website/Cargo.toml:/app/Cargo.toml
      - ../../../website/Cargo.lock:/app/Cargo.lock
      # /app/target, not /app/frontend/target: the workspace manifest is at /app, so
      # that is where cargo writes. Mounted one directory too deep, the volume held
      # nothing and the 3 GB build tree lived in the container's writable layer — which
      # is why recreating this container cost a multi-minute cold rebuild, during which
      # every page 500s.
      - hoover4-website-target:/app/target
      # Read-only, and the same host directory the worker gets: the dataset-creation
      # form lists the subfolders under DATASETS_MOUNT_PATH and offers their names, so
      # the website has to be able to see them. Read-only because it never writes there
      # — a form that could create directories in the ingest root would be a way to
      # ingest arbitrary host paths.
      - ${HOOVER4_TESTDATA_DIR:-../../../testdata}:/testdata:ro
      - ${LLM_API_KEY_FILE_HOST:-/dev/null}:/run/secrets/llm_api_key:ro
    ports:
      - "${WEBSITE_BIND_IP:-0.0.0.0}:12345:8080"
    environment:
      - CLICKHOUSE_URL=http://clickhouse:8123
      - MANTICORE_URL=http://manticore:9308
      - PDF_TO_HTML_ENDPOINT=http://hoover4-processing-pdf-to-html:19027/
      - "S3_ENDPOINT=${S3_ENDPOINT:-http://garage:3900}"
      - "S3_SYSTEM_BUCKET=${S3_SYSTEM_BUCKET:-hoover4-system}"
      - "S3_COLLECTION_BUCKET_PREFIX=${S3_COLLECTION_BUCKET_PREFIX:-hoover4-c-}"
      # Blob-store credentials. Passed in rather than compiled in: the backend used to
      # carry the literals in two source files, which is exactly how a credential
      # survives the day it is rotated. Same defaults and same names the agent
      # containers use (compose/agents.yaml).
      - "S3_ACCESS_KEY=${S3_ACCESS_KEY:-hoover4-blobs-rw}"
      - "S3_SECRET_KEY=${S3_SECRET_KEY:-hoover4-garage-blob-secret-key-0}"
      # Temporal's HTTP API, used to start workflows from the admin UI. The code
      # defaults to localhost:7243 for running the website outside Docker; inside the
      # container localhost is the container itself, so it must be set explicitly.
      - TEMPORAL_HTTP_URL=http://temporal:7243
      # Temporal's *UI*, used only to build deep links rendered in the admin pages.
      # Unlike the API above this is followed by the admin's browser, so it has to be
      # an address reachable from the host, not from inside the container network.
      - TEMPORAL_UI_URL=${TEMPORAL_UI_URL:-http://localhost:21909}
      # Demo switch: when true, anonymous guest-* sessions are treated as admins.
      - HOOVER4_DEMO_MODE=${HOOVER4_DEMO_MODE:-false}
      # Root the dataset-creation form lists subfolders of. The form never accepts a
      # free-text path: an admin picks a name from this listing, and the backend joins it
      # here, so the ingest root cannot be pointed anywhere else from the browser.
      - DATASETS_MOUNT_PATH=${DATASETS_MOUNT_PATH:-/testdata}
      # The OCR tier, read-only from here: the dataset OCR panel lists the languages
      # Tesseract can actually serve (from its /health, not from configuration) and
      # renders the EasyOCR half disabled when there is no endpoint for it. Offering a
      # language whose traineddata is not in the image would fail per file, hours later.
      - OCR_TESSERACT_URL=${OCR_TESSERACT_URL:-}
      - OCR_EASYOCR_URL=${OCR_EASYOCR_URL:-}
      - OCR_PDF_URL=${OCR_PDF_URL:-}
      # The explainer proxy's upstream. A card that cannot be fetched degrades the
      # details view; it never fails a search.
      - REGEX_SCANNER_URL=${REGEX_SCANNER_URL:-http://hoover4-regex-entity-scanner:19705}
      # Search limits, both optional (ini: search_max_parallelism /
      # search_timeout_seconds). Unset = the backend's defaults: 8 Manticore queries in
      # flight process-wide, 30 s per shard query. The empty default is deliberate —
      # `${VAR:-}` renders an empty string, which the backend treats as unset.
      - HOOVER4_SEARCH_MAX_PARALLELISM=${HOOVER4_SEARCH_MAX_PARALLELISM:-}
      - HOOVER4_SEARCH_TIMEOUT_SECONDS=${HOOVER4_SEARCH_TIMEOUT_SECONDS:-}
      # AI Chat: the research agent from compose/agents.yaml (same stack, same
      # `hoover4` network). Chat returns an error message in the transcript
      # when this is unreachable, so the site works fine without the agents running.
      - HOOVER4_AGENT_URL=${HOOVER4_AGENT_URL:-http://hoover4-internal-search-agent:8000}
      # The internet-tools agent, selected by the chat composer's "Internet tools" box.
      # Must be set explicitly for the same reason as TEMPORAL_HTTP_URL above: the code
      # default is a loopback port published on the *host*, which inside this container
      # resolves to the container itself. Leaving it unset is what made every
      # internet-tools turn fail with "AI agent unreachable at http://localhost:9090".
      - HOOVER4_FULL_AGENT_URL=${HOOVER4_FULL_AGENT_URL:-http://hoover4-full-research-agent:8000}
      # How long the agent may stay SILENT before the turn is called dead, not how long
      # the turn may take: a research turn streams for as long as it keeps working, and
      # bounding the total instead cuts healthy turns at five minutes with an error that
      # reads like a corrupt stream. The absolute ceiling is the second knob.
      - HOOVER4_AGENT_TIMEOUT_SECONDS=${HOOVER4_AGENT_TIMEOUT_SECONDS:-300}
      - HOOVER4_AGENT_TOTAL_TIMEOUT_SECONDS=${HOOVER4_AGENT_TOTAL_TIMEOUT_SECONDS:-1800}
      # Retries for one chat turn: 4 attempts, backing off 2/4/8 s. Once the agent has
      # streamed anything, a replay repeats every provider call it has made, so at most
      # HOOVER4_AGENT_STREAM_RESUMES of those attempts may be spent mid-stream (0 = none).
      - HOOVER4_AGENT_ATTEMPTS=${HOOVER4_AGENT_ATTEMPTS:-4}
      - HOOVER4_AGENT_RETRY_BASE_MS=${HOOVER4_AGENT_RETRY_BASE_MS:-2000}
      - HOOVER4_AGENT_STREAM_RESUMES=${HOOVER4_AGENT_STREAM_RESUMES:-1}
      # The chat title/summary generator (api/chat/summarize.rs) calls the LLM
      # directly, not through the agent — summarising must not drag MCP tools into
      # the call. `LLM_MODEL` has no default in the code on purpose (the served name
      # changes with the model), so **unset means the summariser silently does
      # nothing**: every conversation keeps its truncated first message as a title
      # and never gets a summary. Both are rendered from hoover4.ini by deploy.py.
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      # The API key is a bind-mounted file, never an env value: hoover4.ini stores
      # the host path, deploy.py mounts it here, and summarize.rs reads it. With no
      # provider key configured the mount source is /dev/null and the code falls
      # back to its local default.
      - LLM_API_KEY_FILE=/run/secrets/llm_api_key
      # `/admin/ai_status` probes. Same URLs the worker uses; without them the
      # page falls back to compose DNS names that are not on this container's network
      # (the GPU tier publishes via host.containers.internal).
      - HOOVER4_CONFIG_FINGERPRINT=${HOOVER4_CONFIG_FINGERPRINT:-}
      - EMBEDDINGS_PROVIDER=${EMBEDDINGS_PROVIDER:-}
      - EMBEDDINGS_URL=${EMBEDDINGS_URL:-}
      - RERANK_URL=${RERANK_URL:-}
      - NER_PROVIDER=${NER_PROVIDER:-}
      - NER_URL=${NER_URL:-}
      - NER_URL_FALLBACK=${NER_URL_FALLBACK:-}
      - PDF_OCR_PROVIDER=${PDF_OCR_PROVIDER:-tesseract}
      - OCR_TESSERACT_URL=${OCR_TESSERACT_URL:-}
      - HOOVER4_BROWSER_MCP_URL=${HOOVER4_BROWSER_MCP_URL:-http://hoover4-mcp-browser:8087}
    networks:
      - hoover4
    depends_on:
      temporal:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  hoover4-processing-pdf-to-html:
    container_name: hoover4-processing-pdf-to-html
    build:
      context: ./pdf-to-html
      dockerfile: Dockerfile
    ports:
      - "${INFRA_BIND_IP:-0.0.0.0}:${PDF_TO_HTML_PORT}:19027"
    networks:
      - hoover4
    restart: unless-stopped
    memswap_limit: 9000M
    mem_limit: 9000M
    volumes:
      - ./pdf-to-html:/app
    entrypoint: ["/usr/bin/python", "/app/pdf2html_server.py"]
    working_dir: /app

volumes:
  clickhouse_data:
    driver: local
  manticore_data_v14:
    driver: local
  elasticsearch_data:
    driver: local
  garage_meta:
    driver: local
  garage_data:
    driver: local
  temporal_elasticsearch:
    driver: local
  temporal_cassandra:
    driver: local
  clickhouse_monitoring:
    driver: local
  hoover4-website-target:
    driver: local
  easyocr_models_cache:
    driver: local
  # The default backup root, used when no host directory is configured. Not named
  # *_cache: a backup is the one thing a reset must not remove.
  ops_backups:
    driver: local
  # vllm_huggingface_cache:
  #   driver: local
  # litellm_postgres_data:
  #   driver: local
  # ollama:
  #   driver: local
  # open-webui2:
  #   driver: local
networks:
  hoover4:
    name: hoover4
    # external: true



