  hoover4-worker:
    # image: hoover4-worker
    container_name: hoover4-worker
    build:
      context: ../../processing
      dockerfile: Dockerfile
    command: bash -exc "uv run main.py migrate && uv run main.py worker"
    networks:
      - hoover4
    restart: unless-stopped
    memswap_limit: 29000M
    mem_limit: 29000M
    volumes:
      # Host path for ingest test data. Defaults to the in-repo (git-tracked)
      # testdata dir so the stack comes up out of the box; override with
      # HOOVER4_TESTDATA_DIR to point at a larger external dataset. The source
      # must EXIST — podman refuses to auto-create a missing bind-mount source.
      - ${HOOVER4_TESTDATA_DIR:-../../../testdata}:/testdata
      - ../../processing:/app
    depends_on:
      temporal:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      - "NER_URL=${NER_URL}"
      # The full research agent, for the P_agent ResearchTask workflow. Same network.
      - "RESEARCH_AGENT_URL=${RESEARCH_AGENT_URL:-http://hoover4-full-research-agent:8000}"

  hoover4-website:
    # image: hoover4-website
    container_name: hoover4-website
    build:
      context: ../../../website
      dockerfile: Dockerfile
    command: bash -c "while true; do dx serve --fullstack --package frontend --renderer web --port 8080 --addr 0.0.0.0 --open false --hot-reload false; sleep 1; echo restarting...; done"
    restart: unless-stopped
    memswap_limit: 9000M
    mem_limit: 9000M
    volumes:
      - ../../../website/frontend:/app/frontend
      - ../../../website/common:/app/common
      - ../../../website/backend:/app/backend
      - ../../../website/Cargo.toml:/app/Cargo.toml
      - ../../../website/Cargo.lock:/app/Cargo.lock
      - hoover4-website-target:/app/frontend/target
    ports:
      - "0.0.0.0:12345:8080"
    environment:
      - CLICKHOUSE_URL=http://clickhouse:8123
      - MANTICORE_URL=http://manticore:9308
      - PDF_TO_HTML_ENDPOINT=http://hoover4-processing-pdf-to-html:19027/
      - S3_ENDPOINT=http://minio-s3:9000
      # Temporal's HTTP API, used to start workflows from the admin UI. The code
      # defaults to localhost:7243 for running the website outside Docker; inside the
      # container localhost is the container itself, so it must be set explicitly.
      - TEMPORAL_HTTP_URL=http://temporal:7243
      # Temporal's *UI*, used only to build deep links rendered in the admin pages.
      # Unlike the API above this is followed by the admin's browser, so it has to be
      # an address reachable from the host, not from inside the container network.
      - TEMPORAL_UI_URL=${TEMPORAL_UI_URL:-http://localhost:8081}
      # Demo switch: when true, anonymous guest-* sessions are treated as admins.
      - HOOVER4_DEMO_MODE=${HOOVER4_DEMO_MODE:-false}
      # Max concurrent Manticore queries during search fan-out (default 8).
      # - HOOVER4_SEARCH_MAX_PARALLELISM=8
      # AI Chat: the research agent from ai_services/docker-compose.yaml, reached over
      # the shared `hoover4` network. Chat returns an error message in the transcript
      # when this is unreachable, so the site works fine without the AI tier running.
      - HOOVER4_AGENT_URL=${HOOVER4_AGENT_URL:-http://hoover4-internal-search-agent:8000}
      # The internet-tools agent, selected by the chat composer's "Internet tools" box.
      # Must be set explicitly for the same reason as TEMPORAL_HTTP_URL above: the code
      # default is a loopback port published on the *host*, which inside this container
      # resolves to the container itself. Leaving it unset is what made every
      # internet-tools turn fail with "AI agent unreachable at http://localhost:9090".
      - HOOVER4_FULL_AGENT_URL=${HOOVER4_FULL_AGENT_URL:-http://hoover4-full-research-agent:8000}
      - HOOVER4_AGENT_TIMEOUT_SECONDS=${HOOVER4_AGENT_TIMEOUT_SECONDS:-300}
      # Retries for one chat turn: 4 attempts, backing off 2/4/8 s.
      - HOOVER4_AGENT_ATTEMPTS=${HOOVER4_AGENT_ATTEMPTS:-4}
      - HOOVER4_AGENT_RETRY_BASE_MS=${HOOVER4_AGENT_RETRY_BASE_MS:-2000}
      # The chat title/summary generator (api/chat/summarize.rs) calls vLLM directly,
      # not through the agent — summarising must not drag MCP tools into the call.
      # `LLM_MODEL` has no default in the code on purpose (the served name changes with
      # the model), so **unset means the summariser silently does nothing**: every
      # conversation keeps its truncated first message as a title and never gets a
      # summary. Keep this in step with ai_services/docker-compose.yaml.
      - LLM_BASE_URL=${LLM_BASE_URL:-http://hoover4-vllm:8000/v1}
      - LLM_MODEL=${LLM_MODEL:-qwen3.5-2b}
      - LLM_API_KEY=${LLM_API_KEY:-hoover4-local-key}
    networks:
      - hoover4
    depends_on:
      temporal:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  hoover4-processing-pdf-to-html:
    container_name: hoover4-processing-pdf-to-html
    build:
      context: ./pdf-to-html
      dockerfile: Dockerfile
    ports:
      - "19027:19027"
    networks:
      - hoover4
    restart: unless-stopped
    memswap_limit: 9000M
    mem_limit: 9000M
    volumes:
      - ./pdf-to-html:/app
    entrypoint: ["/usr/bin/python", "/app/pdf2html_server.py"]
    working_dir: /app

volumes:
  clickhouse_data:
    driver: local
  manticore_data_v14:
    driver: local
  minio_data:
    driver: local
  elasticsearch_data:
    driver: local
  temporal_elasticsearch:
    driver: local
  temporal_cassandra:
    driver: local
  clickhouse_monitoring:
    driver: local
  hoover4-website-target:
    driver: local
