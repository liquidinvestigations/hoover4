services:

  zookeeper:
    image: zookeeper:3.9
    container_name: zookeeper
    hostname: zookeeper
    memswap_limit: 6000M
    mem_limit: 6000M
    networks:
      - hoover4
    restart: unless-stopped

  manticore:
    image: manticoresearch/manticore:14.1.0
    container_name: manticore
    ports:
      - '9306:9306'
      - '9308:9308'
    volumes:
      - manticore_data_v14:/var/lib/manticore
    memswap_limit: 19000M
    mem_limit: 19000M
    ulimits:
      nproc: 65535
      nofile:
         soft: 65535
         hard: 65535
      memlock:
        soft: -1
        hard: -1
    restart: unless-stopped
    networks:
      - hoover4
    environment:
      - TELEMETRY=0
    user: 999:999

  clickhouse:
    container_name: clickhouse
    image: clickhouse/clickhouse-server:25.8
    cap_add:
      - SYS_NICE
      - NET_ADMIN
      - IPC_LOCK
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - CLICKHOUSE_DB=hoover4
      - CLICKHOUSE_USER=hoover4
      - CLICKHOUSE_PASSWORD=hoover4
    ports:
      - '8123:8123'
      - '9000:9000'
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      # - ./data:/var/lib/clickhouse/user_files
      - ./clickhouse-server-config-override.xml:/etc/clickhouse-server/config.d/clickhouse-server-config-override.xml
    healthcheck:
      test: wget --no-verbose --tries=1 http://127.0.0.1:8123/ping || exit 1
      interval: 13s
      timeout: 15s
      retries: 6
    memswap_limit: 19000M
    mem_limit: 19000M
    restart: unless-stopped
    depends_on:
      - zookeeper
    networks:
      - hoover4

  clickhouse-monitoring:
    image: ghcr.io/duyet/clickhouse-monitoring:2cc8058
    environment:
      - "CLICKHOUSE_HOST=http://clickhouse:8123"
      - CLICKHOUSE_USER=hoover4
      - CLICKHOUSE_PASSWORD=hoover4
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - 3000:3000
    volumes:
      - clickhouse_monitoring:/var/lib/clickhouse-monitoring
    memswap_limit: 6000M
    mem_limit: 6000M
    restart: unless-stopped
    networks:
      - hoover4

  ch-ui:
    image: ghcr.io/caioricciuti/ch-ui:sha-6227281d8c096e4259a1b96c92aa3f8d784a3c2b
    ports:
      - '5521:5521'
    depends_on:
      clickhouse:
        condition: service_healthy
    memswap_limit: 6000M
    mem_limit: 6000M
    restart: unless-stopped
    environment:
      VITE_CLICKHOUSE_URL: "$EXTERNAL_CLICKHOUSE_URL"
      VITE_CLICKHOUSE_USER: "hoover4"
      VITE_CLICKHOUSE_PASS: "hoover4"
    networks:
      - hoover4


  # ========================
  #         TEMPORAL
  # ========================
  temporal-cassandra:
    container_name: temporal-cassandra
    image: cassandra:${CASSANDRA_VERSION}
    # image: scylladb/scylla -- SLOWER
    networks:
      - hoover4
    ports:
      - 127.0.0.1:9042:9042
    environment:
      - MAX_HEAP_SIZE=4G
      - HEAP_NEWSIZE=512M
      #- disk_access_mode="mmap_index_only" -- is default
    volumes:
      - temporal_cassandra:/var/lib/cassandra
    healthcheck:
      test: cqlsh -u cassandra -p cassandra -e 'describe cluster'
      interval: 15s
      timeout: 13s
      retries: 6
      start_period: 4s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 6000M
        reservations:
          cpus: '1'
          memory: 5000M
    restart: unless-stopped

  temporal-elasticsearch:
    container_name: temporal-elasticsearch
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms2048m -Xmx2048m
      - xpack.security.enabled=false
    image: elasticsearch:${ELASTICSEARCH_VERSION}
    networks:
      - hoover4
    ports:
      - 127.0.0.1:9200:9200
    volumes:
      - temporal_elasticsearch:/var/lib/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 13s
      retries: 6
      start_period: 4s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 12048M
        reservations:
          cpus: '1'
          memory: 1500M
    restart: unless-stopped

  temporal:
    container_name: temporal
    depends_on:
      temporal-elasticsearch:
        condition: service_healthy
      temporal-cassandra:
        condition: service_healthy
    environment:
      - CASSANDRA_SEEDS=temporal-cassandra
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
    image: temporalio/auto-setup:${TEMPORAL_VERSION}
    networks:
      - hoover4
    ports:
      - 127.0.0.1:7233:7233
      - 127.0.0.1:7243:7243
    labels:
      kompose.volume.type: configMap
    healthcheck:
      test: ['CMD-SHELL', 'tctl --address temporal:7233 workflow list --pagesize 1']
      interval: 15s
      timeout: 13s
      retries: 6
      start_period: 4s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 6000M
        reservations:
          cpus: '1'
          memory: 500M
    restart: unless-stopped

  temporal-ui:
    container_name: temporal-ui
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    image: temporalio/ui:${TEMPORAL_UI_VERSION}
    networks:
      - hoover4
    ports:
      - 127.0.0.1:8081:8080
    healthcheck:
      test: ['CMD-SHELL', 'curl --silent --fail http://temporal-ui:8080/api/v1/settings? || exit 1']
      interval: 15s
      timeout: 13s
      retries: 6
      start_period: 4s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 6000M
        reservations:
          cpus: '1'
          memory: 500M
    restart: unless-stopped


  # ========================
  #          S3
  # ========================

  minio-s3:
    container_name: minio-s3
    image: minio/minio:${MINIO_VERSION}
    volumes:
      - minio_data:/data
    networks:
      - hoover4
    ports:
      - "8084:8084"
      - "9004:9000"
      - "9123:8123"
    environment:
      MINIO_ACCESS_KEY: hoover4
      MINIO_SECRET_KEY: hoover4-secret
      MINIO_BROWSER_REDIRECT_URL: "http://localhost:8084"
      MINIO_UPDATE: "off"
      MINIO_API_REQUESTS_MAX: "600"
      MINIO_API_REQUESTS_DEADLINE: "2m"
      MINIO_DRIVE_SYNC: "on"
      GOMAXPROCS: "20"
    command: server /data  --console-address :8084
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 15s
      timeout: 13s
      retries: 6
      start_period: 4s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 6000M
        reservations:
          cpus: '1'
          memory: 500M
    restart: unless-stopped


  redis:
    image: redis:6.0.9
    hostname: redis
    container_name: redis
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "3000mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - '127.0.0.1:6379:6379'
    networks:
      - hoover4
    deploy:
      resources:
        limits:
          memory: 4000M
        reservations:
          memory: 300M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 13s
      retries: 6
      start_period: 4s
    restart: unless-stopped


