# Temporal dynamic config, mounted over the zero-byte file `auto-setup` ships.
#
# Deliberately small. Most of this server's defaults are already right for a
# single-node deployment, and a key set to its own default is noise that reads as a
# decision. Measured against this pipeline: raising `matching.numTaskqueue*Partitions`
# above the default of 4 made a fan-out across many concurrent workflows *slower*, and
# `history.persistenceMaxQPS` defaults higher than any value worth writing here, so
# setting it would be a throttle rather than a lift.

# A workflow that fans out over a plan accumulates several history events per item, and
# the 51,200-event hard cap fails the whole plan with nothing partial recorded.
# ProcessItemsBatched continues as new well before that; this makes the approach visible
# in the server log rather than only in the failure.
limit.historyCount.warn:
  - value: 10000
