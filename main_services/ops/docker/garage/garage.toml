# Single-node Garage. Defaults everywhere except the four values below.

metadata_dir = "/var/lib/garage/meta"
data_dir     = "/var/lib/garage/data"
db_engine    = "lmdb"

# One node, so one copy. Garage refuses to start with a replication factor it cannot
# satisfy from the layout.
replication_factor = 1

rpc_bind_addr = "[::]:3901"
# The container name, not the address Garage would auto-detect: the auto-detected one is
# a host LAN address the other containers cannot route to.
rpc_public_addr = "garage:3901"

[s3_api]
# Garage's own default here is "garage", and that value breaks every S3 client that has
# not been told about it: SigV4 signs the region into the credential scope, so a client
# using the universal default answers `AuthorizationHeaderMalformed … unexpected scope`,
# an error that reads like a credential problem and is not one. Declaring the region
# every client already assumes is what keeps "point it at a different endpoint" a
# one-line change. Changing this value means editing every S3 client in the tree.
s3_region     = "us-east-1"
api_bind_addr = "[::]:3900"
root_domain   = ".s3.garage"

[s3_web]
bind_addr   = "[::]:3902"
root_domain = ".web.garage"

[admin]
api_bind_addr = "[::]:3903"
