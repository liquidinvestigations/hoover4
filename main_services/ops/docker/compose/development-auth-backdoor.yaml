# This overlay adds the development sign-in backdoor. The [main_services] key
# development_auth_backdoor_enabled selects it, and its default is false. A public
# deployment never loads this file.
#
# hoover4-development-auth-backdoor is a header-setting reverse proxy in front of the
# website. It asserts one fixed identity on every request, with no sign-in step, from
# hoover4.ini's proxy_username and proxy_groups. A production deployment runs a real
# identity provider in its place. The provider asserts the same four header names, read
# by parse_headers in website/backend/src/auth/session_middleware.rs, so the swap needs
# no code change.
#
# This container takes the published port 12345 instead of hoover4-website, because the
# two cannot both bind it. The !override tag below clears the website's own ports.
# Nothing else removes a list-valued key that the base compose file set. Under this
# host's compose provider, an overlay's ports list is appended to the base list,
# never replacing it.
services:
  hoover4-website:
    ports: !override []

  hoover4-development-auth-backdoor:
    image: nginx:alpine
    container_name: hoover4-development-auth-backdoor
    restart: unless-stopped
    ports:
      - "${WEBSITE_BIND_IP:-0.0.0.0}:12345:8080"
    volumes:
      - ${HOOVER4_REPO_ROOT}/main_services/ops/docker/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      # Rendered into conf.d by the image's own entrypoint, which fills
      # NGINX_LOCAL_RESOLVERS from the container's /etc/resolv.conf. It has to be a
      # template rather than a plain file because that address belongs to the
      # container network and is not known until the container starts.
      - ${HOOVER4_REPO_ROOT}/main_services/ops/docker/nginx-resolver.conf.template:/etc/nginx/templates/00-resolver.conf.template:ro
    environment:
      # Switches on /docker-entrypoint.d/15-local-resolvers.envsh, which is what
      # exports NGINX_LOCAL_RESOLVERS for the template above. Without it the variable
      # is empty and nginx refuses to start.
      - NGINX_ENTRYPOINT_LOCAL_RESOLVERS=1
    healthcheck:
      # dx serve inside hoover4-website answers 500 on every route until its first
      # compile finishes, which takes minutes cold. The generous retry budget below
      # rides that out instead of marking this container unhealthy for it.
      #
      # -O /dev/null, not the bare form: busybox wget saves the response to a file
      # named after the URL, "index.html" for "/", in its working directory. The
      # first probe writes it and every probe after that refuses because the file is
      # already there -- reporting "unhealthy" on a server that answers 200 every
      # time, which is what this container actually did until this line was fixed.
      test: wget --no-verbose --tries=1 -O /dev/null http://127.0.0.1:8080/ || exit 1
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 30s
    networks:
      - hoover4
    depends_on:
      - hoover4-website

networks:
  hoover4:
    name: hoover4
    external: true
