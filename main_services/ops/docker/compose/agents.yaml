# Always-on overlay: the six MCP servers and the two research agents.
#
# These belong to the MAIN stack, not ai_services: they read ClickHouse and
# Manticore directly and serve the website's chat.
# ai_services never calls into main_services — that one-way dependency is what makes
# the GPU tier optional.
services:
  # ------------------------------------------------------- MCP: Hoover4 collections
  # The RAG path. Searches the Manticore shards and ClickHouse text of exactly the
  # collections the calling user may read (see main_services/agents/collection_search_server).
  hoover4-mcp-collections:
    build:
      # Context is the agents directory, not this server's: agent_common/ is vendored in
      # (the rerank client, the RRF/floor fusion and the query-side embedding client).
      context: ${HOOVER4_REPO_ROOT}/main_services/agents
      dockerfile: collection_search_server/Dockerfile
    image: hoover4-mcp-collections:local
    container_name: hoover4-mcp-collections
    ports:
      - "127.0.0.1:${MCP_COLLECTIONS_PORT}:8085"
    environment:
      - HOST=0.0.0.0
      - PORT=8085
      - CLICKHOUSE_URL=${CLICKHOUSE_URL:-http://clickhouse:8123}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-hoover4}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-hoover4}
      - MANTICORE_URL=${MANTICORE_URL:-http://manticore:9308}
      # Shared bearer token as a bind-mounted file (deploy.py); acl.py falls back to
      # it when MCP_SHARED_SECRET is unset.
      - MCP_SHARED_SECRET_FILE=/run/secrets/mcp_shared_secret
      # The default result count and the hard cap the model's `max_results` is clamped to.
      - SEARCH_MAX_RESULTS=${SEARCH_MAX_RESULTS:-50}
      - SEARCH_MAX_ALLOWED_RESULTS=${SEARCH_MAX_ALLOWED_RESULTS:-200}
      # What the result set WEIGHS. The per-hit ceiling alone is not a bound: 46 hits at
      # 1200 characters is a 27 800-token prompt. The budget is divided over the hits, so
      # a big result set returns a line each instead of a page each.
      - SEARCH_SNIPPET_CHARS=${SEARCH_SNIPPET_CHARS:-1200}
      - SEARCH_SNIPPET_BUDGET_CHARS=${SEARCH_SNIPPET_BUDGET_CHARS:-24000}
      - SEARCH_MIN_SNIPPET_CHARS=${SEARCH_MIN_SNIPPET_CHARS:-120}
      # Per-kind floor over the keyword/vector rankings. Kept well below SEARCH_MAX_RESULTS
      # on purpose: a floor of 10 per kind reserves 20 slots and max_results stops meaning
      # anything, which is how an 8-result search returned 20.
      - COLLECTION_SEARCH_MIN_PER_KIND=${COLLECTION_SEARCH_MIN_PER_KIND:-3}
      - COLLECTION_SEARCH_MAX_PER_KIND=${COLLECTION_SEARCH_MAX_PER_KIND:-15}
      # The hybrid half: query embeddings + the cross-encoder reranker (one server
      # serves both). Empty disables the vector branch and the search is keyword-only.
      - EMBEDDINGS_URL=${EMBEDDINGS_URL:-}
      - RERANK_URL=${RERANK_URL:-}
      - GPU_CONNECT_TIMEOUT_MS=${GPU_CONNECT_TIMEOUT_MS:-2000}
      - GPU_CIRCUIT_BREAK_SECONDS=${GPU_CIRCUIT_BREAK_SECONDS:-60}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ${MCP_SHARED_SECRET_FILE_HOST:-/dev/null}:/run/secrets/mcp_shared_secret:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8085/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - hoover4

  # --------------------------------------------------------------- MCP: whois
  hoover4-mcp-whois:
    build:
      context: ${HOOVER4_REPO_ROOT}/main_services/agents/whois_search_server
      dockerfile: Dockerfile
    image: hoover4-mcp-whois:local
    container_name: hoover4-mcp-whois
    ports:
      - "127.0.0.1:${MCP_WHOIS_PORT}:8082"
    environment:
      - HOST=0.0.0.0
      - PORT=8082
      - SERVER_NAME=${WHOIS_SERVER_NAME:-whois_lookup}
      - SERVER_INSTRUCTIONS=${WHOIS_SERVER_INSTRUCTIONS:-Domain registration lookup.}
      - WHOIS_RATE_LIMITING=${WHOIS_RATE_LIMITING:-true}
      - WHOIS_RATE_LIMIT_MS=${WHOIS_RATE_LIMIT_MS:-100}
      - WHOIS_TIMEOUT=${WHOIS_TIMEOUT:-30.0}
      - WHOIS_MAX_RETRIES=${WHOIS_MAX_RETRIES:-3}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
    networks:
      - hoover4

  # Metasearch: THE web search server. One `web_search` tool covering four HTML scrapers,
  # the ddgs library (text and news) and Wikipedia, merged with reciprocal rank fusion and
  # then reordered by the GPU tier's cross-encoder. Every open-web source lives behind
  # this one tool and must stay there — several overlapping "search the web" tools is a
  # choice a small model makes badly.
  #
  # The scrapers have no API keys, so expect one to rot — METASEARCH_SOURCES turns a
  # broken one off without a rebuild, and the response's `degraded` list is how you notice.
  #
  # RERANK_URL is the GPU tier's /v1 base (deploy.py renders it from the same setting as
  # EMBEDDINGS_URL). Empty means no reranking: search still works, the results come back
  # in RRF order, and `rerank_applied: false` says so on the card.
  hoover4-mcp-metasearch:
    build:
      # Context is the agents directory, not this server's: agent_common/ is vendored in.
      context: ${HOOVER4_REPO_ROOT}/main_services/agents
      dockerfile: metasearch_server/Dockerfile
    image: hoover4-mcp-metasearch:local
    container_name: hoover4-mcp-metasearch
    ports:
      - "127.0.0.1:${MCP_METASEARCH_PORT}:8086"
    environment:
      - HOST=0.0.0.0
      - PORT=8086
      - SERVER_NAME=${METASEARCH_SERVER_NAME:-hoover4_metasearch}
      - METASEARCH_SOURCES=${METASEARCH_SOURCES:-ddg,brave,yahoo,ddg_api,ddg_news,wikipedia}
      - METASEARCH_SOURCE_TIMEOUT=${METASEARCH_SOURCE_TIMEOUT:-8}
      - METASEARCH_OVERALL_TIMEOUT=${METASEARCH_OVERALL_TIMEOUT:-20}
      - METASEARCH_ENGINE_TIMEOUT=${METASEARCH_ENGINE_TIMEOUT:-8}
      - METASEARCH_RRF_K=${METASEARCH_RRF_K:-60}
      # The result policy: 15 results, always reranked. The floor is per kind and must stay well
      # under the cap — 10 across three kinds reserves 30 and overrides the cap entirely.
      - METASEARCH_MIN_PER_KIND=${METASEARCH_MIN_PER_KIND:-3}
      - METASEARCH_MAX_PER_KIND=${METASEARCH_MAX_PER_KIND:-15}
      # Rerank logit below which a result no longer earns a reserved floor slot. 0 is the
      # cross-encoder's own decision boundary; it is model-specific, so it is a knob.
      - METASEARCH_RESERVE_MIN_SCORE=${METASEARCH_RESERVE_MIN_SCORE:-0}
      - MAX_RESULTS=${METASEARCH_MAX_RESULTS:-15}
      - SEARCH_SNIPPET_CHARS=${METASEARCH_SNIPPET_CHARS:-400}
      - WIKIPEDIA_LANGUAGE=${WIKIPEDIA_LANGUAGE:-en}
      # Reranking, and the breaker in front of it.
      - RERANK_URL=${RERANK_URL:-}
      - RERANK_TIMEOUT_SECONDS=${RERANK_TIMEOUT_SECONDS:-25}
      - GPU_CONNECT_TIMEOUT_MS=${GPU_CONNECT_TIMEOUT_MS:-2000}
      - GPU_CIRCUIT_BREAK_SECONDS=${GPU_CIRCUIT_BREAK_SECONDS:-60}
      # Search-detail artifacts: bytes to MinIO, one index row in ClickHouse.
      - CHAT_ARTIFACTS_ENABLED=${CHAT_ARTIFACTS_ENABLED:-true}
      - CLICKHOUSE_URL=${CLICKHOUSE_URL:-http://clickhouse:8123}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-hoover4}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-hoover4}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio-s3:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-hoover4}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-hoover4-secret}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8086/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - hoover4

  # Browser: a router in front of one Chromium + one playwright-mcp sidecar PER CHAT.
  # The image is ~1.5 GB (Chromium, fonts, Node, two extensions) and that is expected.
  #
  # Memory is the reason BROWSER_MAX_CONTEXTS is 8 and not 32: this is a whole browser
  # per conversation, not a browser context. It has to be a whole browser — playwright-mcp
  # attached with --cdp-endpoint shares one context across every client on that endpoint,
  # measured, so the isolation boundary has to sit one level lower.
  #
  # SECURITY: this server is driven by an LLM and sits on the same network as
  # clickhouse:8123 and temporal:7233, which answer unauthenticated. Every URL-shaped
  # argument of every forwarded tool is checked against browser_use_server/urlcheck.py
  # first — public http/https only, and the host must resolve exclusively to public
  # addresses. The sidecar's own --blocked-origins is the second line, not the first.
  # Do not weaken either.
  hoover4-mcp-browser:
    build:
      # Context is the agents directory, not this server's: agent_common/ is vendored in.
      context: ${HOOVER4_REPO_ROOT}/main_services/agents
      dockerfile: browser_use_server/Dockerfile
    image: hoover4-mcp-browser:local
    container_name: hoover4-mcp-browser
    ports:
      - "127.0.0.1:${MCP_BROWSER_PORT}:8087"
    environment:
      - HOST=0.0.0.0
      - PORT=8087
      - SERVER_NAME=${BROWSER_SERVER_NAME:-hoover4_browser}
      - BROWSER_NAV_TIMEOUT=${BROWSER_NAV_TIMEOUT:-30}
      - BROWSER_ACTION_TIMEOUT=${BROWSER_ACTION_TIMEOUT:-15}
      - BROWSER_MAX_CONTEXTS=${BROWSER_MAX_CONTEXTS:-8}
      - BROWSER_IDLE_SECONDS=${BROWSER_IDLE_SECONDS:-900}
      - BROWSER_MAX_TABS_PER_CHAT=${BROWSER_MAX_TABS_PER_CHAT:-6}
      - BROWSER_WINDOW_WIDTH=${BROWSER_WINDOW_WIDTH:-1280}
      - BROWSER_WINDOW_HEIGHT=${BROWSER_WINDOW_HEIGHT:-720}
      # Page captures: screenshot always, MHTML under the cap.
      - CAPTURE_MAX_SNAPSHOT_BYTES=${CAPTURE_MAX_SNAPSHOT_BYTES:-8388608}
      - CAPTURE_TIMEOUT_SECONDS=${CAPTURE_TIMEOUT_SECONDS:-20}
      - CHAT_ARTIFACTS_ENABLED=${CHAT_ARTIFACTS_ENABLED:-true}
      - CLICKHOUSE_URL=${CLICKHOUSE_URL:-http://clickhouse:8123}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-hoover4}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-hoover4}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio-s3:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-hoover4}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-hoover4-secret}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    # Chromium fills the default 64 MB /dev/shm and then crashes on content-heavy pages.
    # With up to eight browsers live at once this is the difference between "slow" and
    # "the container dies mid-answer".
    shm_size: 2gb
    # A real init as PID 1, because Chromium is a process TREE. PID 1 here is the Python
    # server, which never calls wait() on grandchildren, so every renderer and crashpad
    # handler a closed browser leaves behind stays a zombie forever — 104 of them were
    # counted on a stack that had been up for hours. Zombies hold a PID each and the
    # container's PID space is not large; the failure mode at the end of that road is
    # "cannot fork", which surfaces as an unrelated browser launch failing. `init: true`
    # gives the container a subreaper whose whole job is reaping them.
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8087/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      # The template browser and its sidecar start at boot, which is a Chromium launch
      # plus a node process. 40s was not enough once Node was in the picture.
      start_period: 90s
    networks:
      - hoover4

  # ------------------------------------------------------------------- Agents
  # Internal search agent: collection RAG only. This is what the website's AI Chat page
  # talks to, and the reason its tool set is narrow — a chat about the user's documents
  # should not quietly turn into a web search.
  hoover4-internal-search-agent:
    build:
      context: ${HOOVER4_REPO_ROOT}/main_services/agents/research_agent
      dockerfile: Dockerfile
    image: hoover4-research-agent:local
    container_name: hoover4-internal-search-agent
    ports:
      - "127.0.0.1:${INTERNAL_SEARCH_AGENT_PORT}:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      # The LLM API key and the MCP shared secret are bind-mounted files, never env
      # values (deploy.py; hoover4.ini stores host paths). agent.py falls back to the
      # _FILE vars when the plain ones are unset.
      - LLM_API_KEY_FILE=/run/secrets/llm_api_key
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.0}
      # Token streaming. It must stay off on vLLM 0.11, where streamed tool-call deltas
      # arrive without `arguments` and never accumulate, so the agent silently makes zero
      # tool calls. Verified safe on vLLM 0.17.1 + Qwen3.5. Flip to false if that ever
      # regresses — the symptom is an agent that answers from nothing with no tool calls.
      - LLM_STREAMING=${LLM_STREAMING:-true}
      # Rendered by deploy.py from the active LLM provider in hoover4.ini.
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - AGENT_NAME=${INTERNAL_SEARCH_AGENT_NAME:-Internal Search Agent}
      - AGENT_PROFILE=internal_search
      # Left EMPTY on purpose. The canonical prompt — including the Manticore MATCH
      # syntax the model needs to search well — lives in
      # main_services/agents/collection_search_server/collection_search_server/prompts.py, and
      # reaches the model twice: as the MCP server's `instructions` at tool-discovery
      # time, and as the agent's default system prompt. A multi-paragraph prompt inlined
      # as a YAML default was unreadable and drifted from the tool descriptions.
      # Set this only to override for an experiment.
      - SYSTEM_PROMPT=${INTERNAL_SEARCH_AGENT_SYSTEM_PROMPT:-}
      - MCP_SERVERS=http://hoover4-mcp-collections:8085/mcp
      - MCP_SHARED_SECRET_FILE=/run/secrets/mcp_shared_secret
      - RELOAD=false
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-}
      # llm_call_events / ai_service_telemetry writers. Best-effort;
      # chat still works if ClickHouse is unreachable.
      - CLICKHOUSE_URL=${CLICKHOUSE_URL:-http://clickhouse:8123}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-hoover4}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-hoover4}
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE:-Hoover4_Processing}
    volumes:
      - ${LLM_API_KEY_FILE_HOST:-/dev/null}:/run/secrets/llm_api_key:ro
      - ${MCP_SHARED_SECRET_FILE_HOST:-/dev/null}:/run/secrets/mcp_shared_secret:ro
    depends_on:
      - hoover4-mcp-collections
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - hoover4

  # Full research agent: collections plus the open-web tools. Two callers: the chat
  # page when "Internet tools" is ticked (HOOVER4_FULL_AGENT_URL on the website
  # service), and the Temporal long-running research task (RESEARCH_AGENT_URL on the
  # worker). Both address it by container name over the shared `hoover4` network — the
  # published loopback port below is for host-side debugging only.
  hoover4-full-research-agent:
    build:
      context: ${HOOVER4_REPO_ROOT}/main_services/agents/research_agent
      dockerfile: Dockerfile
    image: hoover4-research-agent:local
    container_name: hoover4-full-research-agent
    ports:
      - "127.0.0.1:${FULL_RESEARCH_AGENT_PORT}:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      # See the internal search agent: keys are bind-mounted files, never env values.
      - LLM_API_KEY_FILE=/run/secrets/llm_api_key
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.0}
      # Token streaming. It must stay off on vLLM 0.11, where streamed tool-call deltas
      # arrive without `arguments` and never accumulate, so the agent silently makes zero
      # tool calls. Verified safe on vLLM 0.17.1 + Qwen3.5. Flip to false if that ever
      # regresses — the symptom is an agent that answers from nothing with no tool calls.
      - LLM_STREAMING=${LLM_STREAMING:-true}
      # Rendered by deploy.py from the active LLM provider in hoover4.ini.
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - AGENT_NAME=${FULL_RESEARCH_AGENT_NAME:-Full Research Agent}
      - AGENT_PROFILE=full_research
      # As above: empty means "use the canonical prompt from the agent package". The
      # collection MCP server contributes the MATCH syntax through its own instructions,
      # so it does not need repeating here.
      - SYSTEM_PROMPT=${FULL_RESEARCH_AGENT_SYSTEM_PROMPT:-}
      # One search server, one browser router, one whois. Do not add a second
      # web-search server here; every source belongs inside metasearch.
      - MCP_SERVERS=http://hoover4-mcp-collections:8085/mcp,http://hoover4-mcp-metasearch:8086/mcp,http://hoover4-mcp-browser:8087/mcp,http://hoover4-mcp-whois:8082/mcp
      - MCP_SHARED_SECRET_FILE=/run/secrets/mcp_shared_secret
      - RELOAD=false
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-}
      - CLICKHOUSE_URL=${CLICKHOUSE_URL:-http://clickhouse:8123}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-hoover4}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-hoover4}
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE:-Hoover4_Processing}
    volumes:
      - ${LLM_API_KEY_FILE_HOST:-/dev/null}:/run/secrets/llm_api_key:ro
      - ${MCP_SHARED_SECRET_FILE_HOST:-/dev/null}:/run/secrets/mcp_shared_secret:ro
    depends_on:
      - hoover4-mcp-collections
      - hoover4-mcp-metasearch
      - hoover4-mcp-browser
      - hoover4-mcp-whois
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - hoover4

