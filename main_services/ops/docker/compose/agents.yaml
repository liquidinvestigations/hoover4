# Always-on overlay: collections, todo, and the two research agents.
#
# Browser, metasearch and whois live in internet-tools.yaml, selected by
# [main_services] internet_tools_enabled. These belong to the MAIN stack, not
# ai_services: they read ClickHouse and Manticore directly and serve the website's
# chat. ai_services never calls into main_services. That one-way dependency is what
# makes the GPU tier optional.
services:
  # ------------------------------------------------------- MCP: Hoover4 collections
  # The RAG path. Searches the Manticore shards and ClickHouse text of exactly the
  # collections the calling user may read (see main_services/agents/collection_search_server).
  hoover4-mcp-collections:
    build:
      # Context is the agents directory, not this server's: agent_common/ is vendored in
      # (the rerank client, the RRF/floor fusion and the query-side embedding client).
      context: ${HOOVER4_REPO_ROOT}/main_services/agents
      dockerfile: collection_search_server/Dockerfile
    image: hoover4-mcp-collections:local
    container_name: hoover4-mcp-collections
    ports:
      - "127.0.0.1:${MCP_COLLECTIONS_PORT}:8085"
    environment:
      - HOST=0.0.0.0
      - PORT=8085
      - CLICKHOUSE_URL=${CLICKHOUSE_URL:-http://clickhouse:8123}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-hoover4}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-hoover4}
      - MANTICORE_URL=${MANTICORE_URL:-http://manticore:9308}
      # Shared bearer token as a bind-mounted file (deploy.py); acl.py falls back to
      # it when MCP_SHARED_SECRET is unset.
      - MCP_SHARED_SECRET_FILE=/run/secrets/mcp_shared_secret
      # The default result count and the hard cap the model's `max_results` is clamped to.
      - SEARCH_MAX_RESULTS=${SEARCH_MAX_RESULTS:-50}
      - SEARCH_MAX_ALLOWED_RESULTS=${SEARCH_MAX_ALLOWED_RESULTS:-200}
      # What the result set WEIGHS, measured on the whole serialised response. Neither the
      # count nor a per-snippet ceiling is a bound: capping the count at 200 while
      # budgeting only snippet text left 50 000 characters of ids and paths on top, and
      # the prompt grew from 27 800 tokens to 44 700. Snippets shrink first, then the
      # lowest-ranked hits are dropped until the payload fits.
      - SEARCH_SNIPPET_CHARS=${SEARCH_SNIPPET_CHARS:-1200}
      - SEARCH_PAYLOAD_BUDGET_CHARS=${SEARCH_PAYLOAD_BUDGET_CHARS:-24000}
      - SEARCH_MIN_SNIPPET_CHARS=${SEARCH_MIN_SNIPPET_CHARS:-120}
      # Per-kind floor over the keyword/vector rankings. Kept well below SEARCH_MAX_RESULTS
      # on purpose: a floor of 10 per kind reserves 20 slots and max_results stops meaning
      # anything, which is how an 8-result search returned 20.
      - COLLECTION_SEARCH_MIN_PER_KIND=${COLLECTION_SEARCH_MIN_PER_KIND:-3}
      - COLLECTION_SEARCH_MAX_PER_KIND=${COLLECTION_SEARCH_MAX_PER_KIND:-15}
      # The hybrid half: query embeddings + the cross-encoder reranker (one server
      # serves both). Empty disables the vector branch and the search is keyword-only.
      - EMBEDDINGS_URL=${EMBEDDINGS_URL:-}
      - RERANK_URL=${RERANK_URL:-}
      - GPU_CONNECT_TIMEOUT_MS=${GPU_CONNECT_TIMEOUT_MS:-2000}
      - GPU_CIRCUIT_BREAK_SECONDS=${GPU_CIRCUIT_BREAK_SECONDS:-60}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ${MCP_SHARED_SECRET_FILE_HOST:-/dev/null}:/run/secrets/mcp_shared_secret:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8085/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - hoover4

  # ---------------------------------------------------------------- MCP: todo
  # The agent's plan for one conversation: a goal and a list of steps, read and written
  # through four tools. The rules live in processing/database/chat_todos.py, which the
  # chat workflow reads directly. This container is a wrapper over that module, which
  # is why its build context is main_services rather than main_services/agents.
  #
  # No ClickHouse environment: the store uses the pipeline's own client, which addresses
  # `clickhouse` on this network. Being on the network is the whole configuration.
  hoover4-mcp-todo:
    build:
      # Wider than every other server's on purpose, see the Dockerfile. The context is
      # narrowed by main_services/.dockerignore.
      context: ${HOOVER4_REPO_ROOT}/main_services
      dockerfile: agents/agent_todo_server/Dockerfile
    image: hoover4-mcp-todo:local
    container_name: hoover4-mcp-todo
    ports:
      - "127.0.0.1:${MCP_TODO_PORT}:8088"
    environment:
      - HOST=0.0.0.0
      - PORT=8088
      - SERVER_NAME=${TODO_SERVER_NAME:-hoover4_todo}
      # The plan belongs to one user's one conversation, and both halves of that key
      # arrive as headers. acl-style bearer check in front of them, same secret file.
      - MCP_SHARED_SECRET_FILE=/run/secrets/mcp_shared_secret
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ${MCP_SHARED_SECRET_FILE_HOST:-/dev/null}:/run/secrets/mcp_shared_secret:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - hoover4


  # ------------------------------------------------------------------- Agents
  # Internal search agent: collection RAG only. This is what the website's AI Chat page
  # talks to, and the reason its tool set is narrow. A chat about the user's documents
  # should not quietly turn into a web search.
  hoover4-internal-search-agent:
    build:
      context: ${HOOVER4_REPO_ROOT}/main_services/agents/research_agent
      dockerfile: Dockerfile
    image: hoover4-research-agent:local
    container_name: hoover4-internal-search-agent
    ports:
      - "127.0.0.1:${INTERNAL_SEARCH_AGENT_PORT}:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      # The LLM API key and the MCP shared secret are bind-mounted files, never env
      # values (deploy.py; hoover4.ini stores host paths). agent.py falls back to the
      # _FILE vars when the plain ones are unset.
      - LLM_API_KEY_FILE=/run/secrets/llm_api_key
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.0}
      # Token streaming. It must stay off on vLLM 0.11, where streamed tool-call deltas
      # arrive without `arguments` and never accumulate, so the agent silently makes zero
      # tool calls. Verified safe on vLLM 0.17.1 + Qwen3.5. Flip to false if that ever
      # regresses. The symptom is an agent that answers from nothing with no tool calls.
      - LLM_STREAMING=${LLM_STREAMING:-true}
      # Rendered by deploy.py from the active LLM provider in hoover4.ini.
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - AGENT_NAME=${INTERNAL_SEARCH_AGENT_NAME:-Internal Search Agent}
      - AGENT_PROFILE=internal_search
      # Left EMPTY on purpose, and emptier than it looks: the prompt is not a constant
      # this could hold. It is rendered per graph from the tools that graph actually
      # binds, in main_services/agents/research_agent/research_agent/prompts/, so the tool
      # list in the prose and the tool list on the model are the same list. The Manticore
      # MATCH syntax reaches the model separately, as the collection server's own
      # `instructions` at tool-discovery time. Set this only to override for an
      # experiment; it replaces the words and deliberately not the profile, which is what
      # decides tool binding.
      - SYSTEM_PROMPT=${INTERNAL_SEARCH_AGENT_SYSTEM_PROMPT:-}
      # Collections, plus the todo server: a plan is not a research tool and both
      # profiles keep one.
      - MCP_SERVERS=http://hoover4-mcp-collections:8085/mcp,http://hoover4-mcp-todo:8088/mcp
      - MCP_SHARED_SECRET_FILE=/run/secrets/mcp_shared_secret
      # Context compaction: at this fraction of the model's stated context window the
      # older tool results stop being sent to the model, while the calls that made them
      # stay. Unset means the agent's own default, which is the shipped trigger. It does
      # not fire on the traffic this stack produces today. See research_agent/compaction.py.
      #
      # When eviction is not enough, layer two replaces the older messages with one
      # handoff document written by LLM_MODEL_COMPACTION, or by the answering model when
      # that is unset. KEEP_RECENT_MESSAGES is how many trailing messages it leaves alone
      # on top of the ones it may never touch.
      - AGENT_COMPACTION_FRACTION=${AGENT_COMPACTION_FRACTION:-}
      - AGENT_COMPACTION_KEEP_RECENT=${AGENT_COMPACTION_KEEP_RECENT:-}
      - AGENT_COMPACTION_KEEP_RECENT_MESSAGES=${AGENT_COMPACTION_KEEP_RECENT_MESSAGES:-}
      - LLM_MODEL_COMPACTION=${LLM_MODEL_COMPACTION:-}
      - RELOAD=false
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-}
      # llm_call_events / ai_service_telemetry writers. Best-effort;
      # chat still works if ClickHouse is unreachable.
      - CLICKHOUSE_URL=${CLICKHOUSE_URL:-http://clickhouse:8123}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-hoover4}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-hoover4}
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE:-Hoover4_Processing}
    volumes:
      - ${LLM_API_KEY_FILE_HOST:-/dev/null}:/run/secrets/llm_api_key:ro
      - ${MCP_SHARED_SECRET_FILE_HOST:-/dev/null}:/run/secrets/mcp_shared_secret:ro
    depends_on:
      - hoover4-mcp-collections
      - hoover4-mcp-todo
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - hoover4

  # Full research agent: collections plus the open-web tools. Two callers: the chat
  # page when "Internet tools" is ticked (HOOVER4_FULL_AGENT_URL on the website
  # service), and the Temporal long-running research task (RESEARCH_AGENT_URL on the
  # worker). Both address it by container name over the shared `hoover4` network, the
  # published loopback port below is for host-side debugging only.
  hoover4-full-research-agent:
    build:
      context: ${HOOVER4_REPO_ROOT}/main_services/agents/research_agent
      dockerfile: Dockerfile
    image: hoover4-research-agent:local
    container_name: hoover4-full-research-agent
    ports:
      - "127.0.0.1:${FULL_RESEARCH_AGENT_PORT}:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      # See the internal search agent: keys are bind-mounted files, never env values.
      - LLM_API_KEY_FILE=/run/secrets/llm_api_key
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.0}
      # Token streaming. It must stay off on vLLM 0.11, where streamed tool-call deltas
      # arrive without `arguments` and never accumulate, so the agent silently makes zero
      # tool calls. Verified safe on vLLM 0.17.1 + Qwen3.5. Flip to false if that ever
      # regresses. The symptom is an agent that answers from nothing with no tool calls.
      - LLM_STREAMING=${LLM_STREAMING:-true}
      # Rendered by deploy.py from the active LLM provider in hoover4.ini.
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - AGENT_NAME=${FULL_RESEARCH_AGENT_NAME:-Full Research Agent}
      # Also the one profile that binds `run_subagent`: this agent may delegate parts of
      # a question to several workers at once, each running the `research_subagent`
      # profile in-process on these same MCP connections. The workers' own profile does
      # not bind the delegation tool, which is the whole of the one-level depth limit.
      - AGENT_PROFILE=full_research
      # As above: empty means "render this profile's templates against the bound tools".
      # The collection MCP server contributes the MATCH syntax through its own
      # instructions, so it does not need repeating here.
      - SYSTEM_PROMPT=${FULL_RESEARCH_AGENT_SYSTEM_PROMPT:-}
      # Rendered by deploy.py from internet_tools_enabled. Off is collections and
      # todo. On adds metasearch, browser and whois. Do not add a second web-search
      # server here; every source belongs inside metasearch.
      - MCP_SERVERS=${FULL_RESEARCH_MCP_SERVERS:-http://hoover4-mcp-collections:8085/mcp,http://hoover4-mcp-todo:8088/mcp}
      - MCP_SHARED_SECRET_FILE=/run/secrets/mcp_shared_secret
      # See the internal search agent: the compaction trigger, as a fraction of the
      # model's stated context window, and the summarisation that follows when eviction
      # is not enough. Unset means the agent's shipped default.
      - AGENT_COMPACTION_FRACTION=${AGENT_COMPACTION_FRACTION:-}
      - AGENT_COMPACTION_KEEP_RECENT=${AGENT_COMPACTION_KEEP_RECENT:-}
      - AGENT_COMPACTION_KEEP_RECENT_MESSAGES=${AGENT_COMPACTION_KEEP_RECENT_MESSAGES:-}
      - LLM_MODEL_COMPACTION=${LLM_MODEL_COMPACTION:-}
      # Delegation caps. Every one of them is enforced in code, not asked for in the
      # prompt. See research_agent/subagents.py, which also explains why the per-turn
      # total is a separate cap from the per-call one. Unset means the shipped default.
      # There is no setting for the depth: a worker does not have the tool.
      - AGENT_SUBAGENT_MAX_TASKS=${AGENT_SUBAGENT_MAX_TASKS:-}
      - AGENT_SUBAGENT_CONCURRENCY=${AGENT_SUBAGENT_CONCURRENCY:-}
      - AGENT_SUBAGENT_TOOL_TURNS=${AGENT_SUBAGENT_TOOL_TURNS:-}
      - AGENT_SUBAGENT_MAX_PER_TURN=${AGENT_SUBAGENT_MAX_PER_TURN:-}
      # Uvicorn worker processes. Each holds its own graph cache and MCP connections.
      # The citation HandleTable lives in hoover4-mcp-collections, so these workers
      # do not split a session's [Dn] handles.
      - UVICORN_WORKERS=${FULL_RESEARCH_AGENT_WORKERS:-4}
      - RELOAD=false
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-}
      - CLICKHOUSE_URL=${CLICKHOUSE_URL:-http://clickhouse:8123}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-hoover4}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-hoover4}
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE:-Hoover4_Processing}
    volumes:
      - ${LLM_API_KEY_FILE_HOST:-/dev/null}:/run/secrets/llm_api_key:ro
      - ${MCP_SHARED_SECRET_FILE_HOST:-/dev/null}:/run/secrets/mcp_shared_secret:ro
      - ${HOOVER4_REPO_ROOT}/main_services/agents/research_agent/main.py:/app/main.py:ro
    depends_on:
      - hoover4-mcp-collections
      - hoover4-mcp-todo
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - hoover4

