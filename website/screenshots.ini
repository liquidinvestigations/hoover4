viewport = 600x900
actions =
    sleep 3000

; The BOTTOM of the deep fixture -- all 42 numbered folders, depth 45 on screen. The tree
; indents by ladder rung rather than by depth, and ancestor elision is what keeps the
; ladder short enough to keep stepping, so every visible row here must be indented past
; the row above it. A flat run is the defect this page exists to catch.
[storage-shapes-deepest]
url = /file_browser/testdata_shapes/om5jb250YWluZXJfaGFzaGBkcGF0aHiAL2RlZXAtc3R1ZmYvMS8yLzMvNC81LzYvNy84LzkvMTAvMTEvMTIvMTMvMTQvMTUvMTYvMTcvMTgvMTkvMjAvMjEvMjIvMjMvMjQvMjUvMjYvMjcvMjgvMjkvMzAvMzEvMzIvMzMvMzQvMzUvMzYvMzcvMzgvMzkvNDAvNDEvNDI=/9g==/9g==
actions =
    sleep 3500
    wait_text_in #x-storage-tree :: more levels…
    wait_text_in #x-storage-tree :: depth 44
    eval const rows = Array.from(document.querySelectorAll('#x-storage-tree .x-facet-list-item')).filter(r => /depth \d+/.test(r.innerText)); const pads = rows.map(r => parseFloat(getComputedStyle(r).paddingLeft)); if (pads.length < 6) throw new Error('expected the tail of the chain, got ' + pads.length + ' rows'); for (let i = 1; i < pads.length; i++) { if (pads[i] <= pads[i - 1]) throw new Error('the ladder stopped stepping at ' + pads.join(',')); } return {ok: true, pads};

; The remembered width, restored from local storage on a fresh load. The pane is dragged
; by hand and there is no verb for that, but persistence is the half that can silently
; rot: a stored value that stops being read looks exactly like a default. The last action
; clears the key again -- the tab and its storage outlive this section.
[storage-sidebar-remembered-width]
url = /file_browser/testdata_shapes/om5jb250YWluZXJfaGFzaGBkcGF0aHiAL2RlZXAtc3R1ZmYvMS8yLzMvNC81LzYvNy84LzkvMTAvMTEvMTIvMTMvMTQvMTUvMTYvMTcvMTgvMTkvMjAvMjEvMjIvMjMvMjQvMjUvMjYvMjcvMjgvMjkvMzAvMzEvMzIvMzMvMzQvMzUvMzYvMzcvMzgvMzkvNDAvNDEvNDI=/9g==/9g==
actions =
    sleep 1500
    eval window.localStorage.setItem('hoover4.sidebar-width-css-px', '600'); return {ok: true};
    goto /file_browser/testdata_shapes/om5jb250YWluZXJfaGFzaGBkcGF0aHiAL2RlZXAtc3R1ZmYvMS8yLzMvNC81LzYvNy84LzkvMTAvMTEvMTIvMTMvMTQvMTUvMTYvMTcvMTgvMTkvMjAvMjEvMjIvMjMvMjQvMjUvMjYvMjcvMjgvMjkvMzAvMzEvMzIvMzMvMzQvMzUvMzYvMzcvMzgvMzkvNDAvNDEvNDI=/9g==/9g==
    sleep 3500
    eval const pane = document.querySelector('#x-sidebar-resize').parentElement; if (pane.style.width !== '600px') throw new Error('the remembered width was not restored: ' + pane.style.width); return {ok: true};
    eval window.localStorage.removeItem('hoover4.sidebar-width-css-px'); return {ok: true};

