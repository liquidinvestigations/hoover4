; Pages captured by ./take-screenshots.sh, in order.
;
; One section per screenshot. The section name becomes the file stem, prefixed with its
; index, so reordering renumbers everything -- append rather than insert when you can.
;
;   url             path on the site, appended to the base URL
;   actions         one per line: verb argument
;   viewport        WIDTHxHEIGHT; when present, replaces the run's --resolutions list for
;                   this one scenario, and the capture goes to a directory named for the
;                   declared size (such as `600x900/`) instead of `720p/` or `1080p/`. A
;                   layout test that must hold at one declared width belongs here; leave
;                   it unset to capture at every selected resolution instead.
;   full_page       true to capture past the fold, as a supplementary image beside the
;                   exact-size primary capture, never in place of it
;   settle_ms       quiet time before and after the actions, default 700
;   expect          one or more of `missing_page`, `error_display`, `error_bar`, comma
;                   separated. Declares that this scenario is BUILT to reach that negative
;                   state, and reclassifies the matching observation from
;                   `application_error` to `expected_outcome`. `allow_error_markers` and
;                   `allow_http_errors` only suppress an unrelated, already-known
;                   exemption; they do not assert that the state was observed, so a
;                   scenario built to demonstrate one uses `expect` instead.
;   scroll_captures one or more pixel offsets, comma separated. An extra same-size capture
;                   at each offset, for a page taller than the viewport, beside the
;                   primary capture at offset 0.
;   manual_asset    the stable filename `docs/user-manual/User_Manual.md` links for this
;                   scenario's capture. The runner records it in the manifest beside the
;                   capture it names; it never renames the PNG file itself, so a document
;                   that changes keeps the manual's link valid.
;
; Verbs: goto, wait_text, wait_css, click_text, click_css, type_css (SEL :: TEXT),
;        wait_text_in / click_text_in (SELECTOR :: TEXT), press_enter, hover_css,
;        scroll, sleep, eval
;
; The long base64 segments are CBOR-encoded route parameters. They are written out rather
; than driven through the UI because typing into the home box and waiting for a
; navigation is three failure modes to reach a page that a URL reaches in one. See
; `frontend/src/data_definitions/url_param.rs`; `9g==` is `None`.
;
; A page whose route or assertions are tied to one dataset names it in `requires_dataset`
; (several, comma-separated, if it needs more than one; `any` if it needs one of the four
; datasets `main_services/verify-stack.sh` always ingests -- testdata_testfiles,
; testdata_zips, testdata_shapes, other_emails -- but not a specific one). `./take-screenshots.sh`
; skips a page whose dataset is not on the running site, with the missing dataset named, rather
; than failing it. A page with no `requires_dataset` renders without the corpus.

[DEFAULT]
settle_ms = 800

