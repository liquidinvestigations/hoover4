; ---------------------------------------------------------------- the table browser
;
; A parsed spreadsheet opens on its grid: `Table` is declared before `Text` in
; `DocumentSourceItem`, and the source list is sorted by declaration order, so the first
; source of a workbook is the grid rather than the tab-separated flattening of it. The
; viewer-state segment is `9g==` (None) in every entry below, which is exactly what
; "no source picked yet, take the first one" looks like in a URL. The third segment names
; the right-hand tab and is NOT optional -- `9g==` there is a parse failure the router
; renders as "Page not found".
;
; These need the `testdata_excelsc` and `testdata_wide` datasets, which hold the
; spreadsheet fixture folder and one 350-column CSV.

[view-doc-table-grid]
requires_dataset = testdata_excelsc
url = /view_document/onJjb2xsZWN0aW9uX2RhdGFzZXRwdGVzdGRhdGFfZXhjZWxzY2lmaWxlX2hhc2h4QGY5NzUxZThjMjkwNzk5YmU5ZmQ0M2Y1NTQ5OTdhYzJlYWUyZDEwMThlYjc0MTUzODg2ZWZlNjM1NWNmY2EwZmU=/9g==/oWxzZWxlY3RlZF90YWJoRW50aXRpZXM=
actions =
    sleep 4000
    wait_text Order ID
    ; 9995 rows are stored and 9994 of them are data: row 1 is the header row, whose text
    ; is drawn once as the column labels. If it ever comes back as a data row this reads
    ; 9995 and the wait fails.
    wait_text of 9994

; A descending sort on a column that has a blank, on the last page, so the blank row is
; on screen. Rows with no cell in the sort column are appended after the sorted ones in
; BOTH directions -- which is the one sort path no fixture exercised until this pinned it.
