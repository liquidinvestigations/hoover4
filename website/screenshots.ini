; ---------------------------------------------------------------- operations log
;
; These pages need operations rows to exist. `main_services/verify-stack.sh` dispatches
; its ingests through the operations CLI, so running it is what populates the log; with
; an empty table these capture an empty state, which proves the route exists and nothing
; else.

; The log itself: every operation ever dispatched, newest first, with its progress, its
; estimate and its outcome.
[admin-operations]
url = /admin/operations
full_page = true
actions =
    wait_css #x-ops-filter-state
    sleep 1200

; The state filter really filters. The count of rows below must change, which is the
; thing a filter that renders and does nothing would not do.
[admin-operations-state-errored]
url = /admin/operations
full_page = true
actions =
    wait_css #x-ops-filter-state
    eval const el=document.querySelector('#x-ops-filter-state');const s=Object.getOwnPropertyDescriptor(window.HTMLSelectElement.prototype,'value').set;s.call(el,'errored');el.dispatchEvent(new Event('change',{bubbles:true}));return {ok:true};
    sleep 2000

; Choosing a collection filters the list AND brings up that collection's failure rate by
; task type, which is the panel this whole page exists for.
[admin-operations-collection-testdata]
url = /admin/operations
full_page = true
actions =
    wait_css #x-ops-filter-state
    eval const el=document.querySelector('#x-ops-filter-collection');const s=Object.getOwnPropertyDescriptor(window.HTMLSelectElement.prototype,'value').set;s.call(el,'testdata');el.dispatchEvent(new Event('change',{bubbles:true}));return {ok:true};
    wait_text task type(s) failing above
    sleep 2000

; A per-dataset workflow button, captured enabled and unclicked. The button has no
; confirmation step before it dispatches -- one click starts the workflow -- and the
; supplied test identity does not authorize a dispatch, so the "Workflow started" state
; is unreachable here; this observes the control beside the dataset's own detail rows
; instead.
[admin-dataset-rescan-dispatch]
requires_dataset = testdata_diskfiles
url = /admin/collections/testdata/datasets/testdata_diskfiles
actions =
    wait_text Rescan disk
    sleep 800

; The log for whatever is in flight when the run reaches it: a progress bar and an
; estimate against a running operation. Nothing here starts one, so an idle stack shows
; the log with no running row, which is the page working rather than failing.
[admin-operations-running]
url = /admin/operations
full_page = true
actions =
    wait_css #x-ops-filter-state
    sleep 3000

; The point of the page. An operation whose stages all ran still reports the documents it
; failed on, so a run that finished over failures does not read as a clean one.
[admin-operations-partial-failure]
url = /admin/operations
full_page = true
actions =
    wait_css #x-ops-filter-state
    sleep 25000

; A destructive kind demands its target typed out before it will re-run. The button is
; disabled until the text matches, and the server refuses it as well.
[admin-operations-destructive-confirm]
url = /admin/operations
full_page = true
actions =
    wait_css #x-ops-filter-state
    eval const el=document.querySelector('#x-ops-filter-state');const s=Object.getOwnPropertyDescriptor(window.HTMLSelectElement.prototype,'value').set;s.call(el,'errored');el.dispatchEvent(new Event('change',{bubbles:true}));return {ok:true};
    wait_css input[placeholder^="type "]
    sleep 1500

; The re-run control, captured enabled beside the existing rows without being clicked.
; A click dispatches a new operation with a new id immediately, with no confirmation step
; for a non-destructive row, and the supplied test identity does not authorize that
; dispatch, so the "Dispatched" state is unreachable here. The first ENABLED button is
; the one this looks for: a destructive row's button stays disabled until its target is
; typed, and the newest row is often one of those.
[admin-operations-rerun]
url = /admin/operations
full_page = true
actions =
    wait_css #x-ops-filter-state
    eval const b=[...document.querySelectorAll('button')].find(x=>x.textContent.trim()==='Re-run'&&!x.disabled);return {ok:!!b};
    sleep 2000

; The same list scoped to one collection, embedded on that collection's page.
[admin-collection-operations]
url = /admin/collections/testdata
full_page = true
actions =
    wait_text Operations
    sleep 2000

; The same document, opened by a link that names one entity -- the shape a chat
; transcript produces. The panel narrows to that value and its card is already open, so
; what this captures is the card itself: the rule, what the validator checked, and what
; acceptance does not prove.
[view-doc-entity-card]
requires_dataset = testdata_testfiles
url = /view_
full_page = true
actions =
    sleep 3000
    wait_text What this does not prove

; A link naming a value the document does not carry. The point of the page is that the
; panel says so: an empty list here would be indistinguishable from a document with no
; entities in it.
[view-doc-entity-card-stale]
requires_dataset = testdata_testfiles
url = /view_
actions =
    sleep 3000
    wait_text has no entity

; These aliases execute the source, geometry, and delayed-completion PDF procedure.

[qa-pdf-full-source-switch]
url = /
procedure = manual-pdf

[qa-pdf-full-delayed-source-switch]
url = /
procedure = manual-pdf

[qa-pdf-preview-source-switch]
url = /
procedure = manual-pdf
