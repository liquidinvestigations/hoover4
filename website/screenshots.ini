; ---------------------------------------------------------------- regression flows

; Apply a folder filter, then REOPEN the pane. The tick has to still be there: the query
; stores term ids, not node keys, so the pane can only know what is selected by resolving
; the ids back through the term dictionary. It used to show an empty tree over a live
; filter, and the only way to change the filter was to clear it.
[filter-filelocation-reopen]
url = /search/o3Njb2xsZWN0aW9uX2RhdGFzZXRzgGxxdWVyeV9zdHJpbmdgbWZhY2V0X2ZpbHRlcnOg/0/9g==/9g==
actions =
    sleep 1500
    click_css #x-search-open-filters
    wait_text All filters
    click_text File location
    wait_text Filtering on a folder
    sleep 1200
    click_css #x-tree-d-testdata_shapes
    sleep 1500
    click_text_in #x-filter-modal :: the-directory
    sleep 800
    click_text Show
    sleep 2500
    wait_text_in #x-filter-chips :: the-directory
    click_css #x-search-open-filters
    wait_text All filters
    click_text File location
    wait_text Filtering on a folder
    sleep 2500
    click_css #x-tree-d-testdata_shapes
    sleep 1500

; The point of the FileLocations panel, in one page: `parent.zip` is ingested at
; /location-1 and /location-2, the same hash at two paths. The title bar can only ever
; name one of them.
[view-doc-file-locations-multi]
url = /view_document/onJjb2xsZWN0aW9uX2RhdGFzZXRtdGVzdGRhdGFfemlwc2lmaWxlX2hhc2h4QGM1ZjI1MTgzMTFmYjNlNjA2NDkyMDAzNmJjY2E5YzBiZjg1NDAyNDY0ZWQ0ZGM3NDk4NWQ1NWFjODQ2NjBlNWI=/o2pmaW5kX3F1ZXJ5YG9zZWxlY3RlZF9zb3VyY2VtRmlsZUxvY2F0aW9uc3RzZWxlY3RlZF9zb3VyY2VfcGFnZfY=/oWxzZWxlY3RlZF90YWJoRW50aXRpZXM=
actions =
    sleep 3000
    wait_text location-2

; A filename-only hit: `readme` is in no document's TEXT anywhere in the corpus, so the
; /README card must say what matched instead of echoing its own title as a body snippet.
[search-filename-only-match]
url = /search/o3Njb2xsZWN0aW9uX2RhdGFzZXRzgGxxdWVyeV9zdHJpbmdmcmVhZG1lbWZhY2V0X2ZpbHRlcnOg/0/9g==/9g==
actions =
    sleep 2000
    wait_text Matched by filename

; ---------------------------------------------------------------- the unified storage tree

; The whole point of the tree: ONE hierarchy, collections > datasets > folders. Arriving
; by URL expands the chain down to the folder the page is showing, and the collections
; the page is NOT in stay collapsed next to it.
[storage-tree-unified]
url = /file_browser/testdata_shapes/om5jb250YWluZXJfaGFzaGBkcGF0aG4vdGhlLWRpcmVjdG9yeQ==/9g==/9g==
actions =
    sleep 2500
    wait_text_in #x-storage-tree :: other
    wait_text_in #x-storage-tree :: testdata
    eval const e = document.documentElement; if (e.scrollWidth > e.clientWidth + 1) throw new Error('the page scrolls sideways'); return {ok: true};

; A second dataset in a second collection expanded by hand, next to the one the URL
; names: two datasets' folders on screen at once, which the old split sidebar could not
; show at all.
[storage-tree-two-datasets]
url = /file_browser/testdata_zips/om5jb250YWluZXJfaGFzaGBkcGF0aGsvbG9jYXRpb24tMQ==/9g==/9g==
actions =
    sleep 2500
    click_css #x-tree-d-other_emails
    sleep 2000

; The same tree at 600 px, where the sidebar is nearly half the window. Nothing may
; scroll sideways, however deep the row.
[storage-tree-unified-600px]
url = /file_browser/testdata_shapes/om5jb250YWluZXJfaGFzaGBkcGF0aHg-L2RlZXAtc3R1ZmYvMS8yLzMvNC81LzYvNy84LzkvMTAvMTEvMTIvMTMvMTQvMTUvMTYvMTcvMTgvMTkvMjA=/9g==/9g==
viewport = 600x900
actions =
    sleep 3000
    eval const e = document.documentElement; if (e.scrollWidth > e.clientWidth + 1) throw new Error('the page scrolls sideways'); return {ok: true};

; The collection landing page: its datasets as cards with the counts and sizes the
; pipeline already materialises.
[storage-collection-landing]
url = /file_browser/c/testdata
actions =
    sleep 2500
    wait_text Documents
    wait_text Total size

[storage-collection-landing-other]
url = /file_browser/c/other
actions =
    sleep 2500
    wait_text Documents

; A dataset page is its root listing, which is where a dataset row in the tree lands.
[storage-dataset-landing]
url = /file_browser/testdata_zips/om5jb250YWluZXJfaGFzaGBkcGF0aGEv/9g==/9g==
actions =
    sleep 2500
    wait_text location-1

; Ticking a DATASET row selects its VFS root as a `file_paths` term -- the same mechanism
; a folder tick uses, so the chip and the filter need to know nothing about datasets.
[filter-pane-filelocation-dataset-ticked]
url = /search/o3Njb2xsZWN0aW9uX2RhdGFzZXRzgGxxdWVyeV9zdHJpbmdgbWZhY2V0X2ZpbHRlcnOg/0/9g==/9g==
actions =
    sleep 1500
    click_css #x-search-open-filters
    wait_text All filters
    click_text File location
    wait_text Filtering on a folder
    sleep 1500
    click_text_in #x-storage-tree :: shapes
    sleep 1500

; And applied: one chip, and a result list narrowed to that dataset. The chip names the
; dataset — a `file_paths` value is a `vfs_node` TERM ID, and a dataset root's node key
; carries no path worth showing, so this is the whole resolve-and-prettify path in one
; page. It used to read `#229645745`.
[search-filelocation-dataset-applied]
url = /search/o3Njb2xsZWN0aW9uX2RhdGFzZXRzgGxxdWVyeV9zdHJpbmdgbWZhY2V0X2ZpbHRlcnOg/0/9g==/9g==
actions =
    sleep 1500
    click_css #x-search-open-filters
    wait_text All filters
    click_text File location
    wait_text Filtering on a folder
    sleep 1500
    click_text_in #x-storage-tree :: shapes
    sleep 1200
    click_text Show
    sleep 2500
    wait_text_in #x-filter-chips :: testdata_shapes

; The collection row is a link, not just a disclosure: clicking it lands on the
