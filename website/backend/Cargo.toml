[package]
name = "backend"
edition = "2024"


[dependencies]
tokio = { version = "1.39.0", features = ["full"] }
futures = "0.3.31"
bytes = "1.10.1"
tokio-util = "0.7.10"
anyhow = "1"
common = { path = "../common" }
reqwest = { version = "0.12.24", features = ["json", "stream"] }
serde_json = "1"
serde = "1"
clickhouse = { version = "0.14.2", features = ["time"] }
time = "0.3"
rand = "0.9"
axum-extra = { version = "0.10", features = ["cookie"] }
sha256 = "1.6.0"
axum = "0.8.6"
tracing = "0.1"
# The client Garage tests its own S3 implementation against. Fully async: nothing in
# the request path blocks, which is what a Dioxus server function requires.
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "sigv4a", "rustls"] }
# `byte-stream-poll-next` is what makes a GetObject body a `Stream`, which the two
# streaming download routes hand straight to axum's `Body::from_stream`. Without it
# `ByteStream` has no `Stream` impl at all and the only way to serve an object is to
# buffer it whole.
aws-smithy-types = { version = "1", features = ["byte-stream-poll-next"] }
serde_bytes="0.11"
base64 = "0.22"
# Directory-descriptor access (`openat`, `mkdirat` with `O_NOFOLLOW`) beneath the dataset
# mounts, so a symbolic link cannot move a listing or a new folder outside a mount.
rustix = { version = "1", features = ["fs"] }
# The upload receiver: the digests of manifests and acknowledged prefixes, and the
# `Upload-Expires` date of the tus responses.
sha2 = "0.10"
hex = "0.4"
httpdate = "1"

[dev-dependencies]
# `test-util` gives the paused clock the readiness gate tests drive by hand.
tokio = { version = "1.39.0", features = ["full", "test-util"] }



[lints]
workspace = true