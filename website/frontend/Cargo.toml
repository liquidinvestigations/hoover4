[package]
name = "frontend"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.9", features = ["router", "fullstack", "logger"] }
dioxus-free-icons={version="0.10.0", features=[
    "material-design-icons-action",
    "material-design-icons-file",
    "material-design-icons-communication",
    "material-design-icons-social",
    "material-design-icons-image",
    "material-design-icons-navigation",
    "material-design-icons-editor",
    "material-design-icons-toggle",
    # Plan 3: MdFilterList / MdSort / MdArchive live in `content`, MdStorage in
    # `device`. Pure-Rust SVG data, no runtime cost — but a missing feature is a
    # compile error naming only the icon, which reads like a typo.
    "material-design-icons-content",
    "material-design-icons-device",
    "octicons",
]}
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false }
base64 = "0.22.1"
serde = "1"
futures-util = "0.3.31"
ciborium = "0.2.2"
common = { path = "../common" }
backend = { path = "../backend", optional = true }
axum = { version = "0.8.6", optional = true }
gloo-timers = "0.3"
# Cross-platform async sleep. `n0-future::time::sleep` picks the right timer per target
# (browser timers under wasm, tokio elsewhere), which `gloo-timers` cannot do — it is
# wasm-only, so a poll loop written against it breaks the server-side render build.
# This is the crate `_crack_utils::sleep_ms` wraps; used directly because _crack_utils
# lives outside this repo and would not resolve inside the website container.
n0-future = "0.3.2"
anyhow = "1"
serde_json = "1"
web-sys = {version = "0.3", features = ["Window", "Navigator", "Clipboard", "Url", "Permissions"]}
tokio = { version = "1.48", features = ["rt-multi-thread", "full"], optional = true}
wasm-bindgen = "0.2.105"
wasm-bindgen-futures = "0.4.55"
serde-wasm-bindgen = "0.6.5"
html-escape= "0.2.13"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server", "dep:backend", "dep:tokio", "dep:axum"]

[lints]
workspace = true