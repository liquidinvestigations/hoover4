[package]
name = "common"
edition = "2024"

[dependencies]
serde = "1"
serde_json = "1"
# The hash of a non-ASCII node id in a board session id (`board_types::node_key`).
sha2 = "0.10"

[dev-dependencies]
# The URL round-trip test decodes a CBOR blob in the legacy three-field shape: the
# bookmark-compatibility guarantee is only meaningful against the real encoder the
# frontend's `UrlParam` uses.
ciborium = "0.2"



[lints]
workspace = true