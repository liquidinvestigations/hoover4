; ---------------------------------------------------------------- chat

[ai-chat-compaction-line]
summary = Selects the named compaction chat and opens its visible record.
url = /ai_chat/c/{{chat_fixture:compaction}}/9g==/9g==
actions =
    wait_eval const row=document.querySelector('.x-chat-compaction');return {ok:!!row&&row.innerText.includes('Context compacted')&&row.innerText.includes('Show the record')};
    click_text_in .x-chat-compaction :: Show the record
    wait_eval const row=document.querySelector('.x-chat-compaction');return {ok:!!row&&!!row.querySelector('p,ul,ol,h1,h2,h3')};
