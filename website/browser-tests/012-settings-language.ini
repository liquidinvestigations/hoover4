[settings-language]
summary = Selects German on the settings page, verifies the change without reload, the server-rendered German page after reload, and returns to the browser language.
url = /settings
actions =
    wait_css #x-settings-interface-choices
    wait_eval return {ok:document.querySelector('#x-settings-page h1').innerText==='Settings'&&document.querySelector('#x-settings-interface-choices [data-language=""]').getAttribute('aria-checked')==='true'};
    click_css #x-settings-interface-choices [data-language="de"]
    wait_eval return {ok:document.querySelector('#x-settings-page h1').innerText==='Einstellungen'&&document.querySelector('#x-settings-interface-choices [data-language="de"]').getAttribute('aria-checked')==='true',h1:document.querySelector('#x-settings-page h1').innerText};
    eval window.__qaBefore=true;location.reload();return {ok:true};
    wait_eval return {ok:!window.__qaBefore&&!!document.querySelector('#x-settings-interface-choices'),h1:document.querySelector('#x-settings-page h1')?.innerText};
    eval return fetch('/settings').then(r=>r.text()).then(t=>{window.__qaHtml={german:t.includes('Einstellungen'),english:t.includes('>Settings<')};});
    wait_eval return {ok:!!window.__qaHtml&&window.__qaHtml.german&&!window.__qaHtml.english,html:window.__qaHtml};
    wait_eval return {ok:document.querySelector('#x-settings-page h1').innerText==='Einstellungen'&&document.querySelector('[lang="de"]')!==null};
    click_css #x-settings-agent-choices [data-language="hr"]
    wait_eval return {ok:document.querySelector('#x-settings-agent-choices [data-language="hr"]').getAttribute('aria-checked')==='true'&&document.querySelector('#x-settings-agent-choices [data-language=""]').innerText.includes('Hrvatski')};
    click_css #x-settings-agent-choices [data-language=""]
    wait_eval return {ok:document.querySelector('#x-settings-agent-choices [data-language=""]').getAttribute('aria-checked')==='true'};
    click_css #x-settings-interface-choices [data-language=""]
    wait_eval return {ok:document.querySelector('#x-settings-page h1').innerText==='Settings'};
