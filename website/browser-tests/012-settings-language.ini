[settings-language]
summary = Selects German on the language settings page, verifies the change and the rail flag without reload, the server-rendered German page after reload, and returns to the browser language.
url = /settings/language
actions =
    wait_css #x-settings-interface-choices
    wait_eval window.__qaEnglish=document.querySelector('#x-settings-page h1').innerText;return {ok:window.__qaEnglish==='Language settings'&&document.querySelector('#x-settings-interface-choices [data-language=""]').getAttribute('aria-checked')==='true'&&document.querySelector('a.x-rail-language').getAttribute('href')==='/settings/language',h1:window.__qaEnglish};
    click_css #x-settings-interface-choices [data-language="de"]
    wait_eval return {ok:document.querySelector('#x-settings-page h1').innerText!==window.__qaEnglish&&document.querySelector('#x-settings-interface-choices [data-language="de"]').getAttribute('aria-checked')==='true'&&document.querySelector('a.x-rail-language').dataset.interfaceLanguage==='de',h1:document.querySelector('#x-settings-page h1').innerText};
    eval window.__qaBefore=true;location.reload();return {ok:true};
    wait_eval return {ok:!window.__qaBefore&&!!document.querySelector('#x-settings-interface-choices'),h1:document.querySelector('#x-settings-page h1')?.innerText};
    eval return fetch('/settings/language').then(r=>r.text()).then(t=>{window.__qaHtml={german:t.includes('lang="de"'),english:t.includes('>Language settings<')};});
    wait_eval return {ok:!!window.__qaHtml&&window.__qaHtml.german&&!window.__qaHtml.english,html:window.__qaHtml};
    wait_eval return {ok:document.querySelector('[lang="de"]')!==null&&document.querySelector('a.x-rail-language img').getAttribute('src').endsWith('/de.svg')};
    click_css #x-settings-agent-choices [data-language="hr"]
    wait_eval return {ok:document.querySelector('#x-settings-agent-choices [data-language="hr"]').getAttribute('aria-checked')==='true'&&document.querySelector('#x-settings-agent-choices [data-language=""]').innerText.includes('Hrvatski')};
    click_css #x-settings-agent-choices [data-language=""]
    wait_eval return {ok:document.querySelector('#x-settings-agent-choices [data-language=""]').getAttribute('aria-checked')==='true'};
    click_css #x-settings-interface-choices [data-language=""]
    wait_eval return {ok:document.querySelector('#x-settings-page h1').innerText==='Language settings'&&document.querySelector('a.x-rail-language').dataset.interfaceLanguage==='en'};
