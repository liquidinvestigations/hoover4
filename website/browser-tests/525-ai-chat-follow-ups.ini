; The suggested follow-up questions under an answer are bordered buttons, aligned right
; and at most half the transcript wide. A click fills the composer.
[ai-chat-follow-ups]
summary = Verifies the suggested question buttons and that a click fills the composer.
url = /ai_chat/c/{{chat_fixture:web_citations}}/9g==/9g==
actions =
    wait_css .x-chat-follow-ups .x-chat-follow-up
    eval document.querySelector('.x-chat-follow-ups').scrollIntoView({block:'center'});return {ok:true};
    wait_eval const g=document.querySelector('.x-chat-follow-ups');const b=g.querySelector('.x-chat-follow-up');const p=g.parentElement.getBoundingClientRect();const r=g.getBoundingClientRect();const s=getComputedStyle(b);return {ok:g.getAttribute('role')==='group'&&!!g.querySelector('.x-chat-follow-ups-mark svg')&&s.borderTopStyle==='solid'&&s.borderTopColor==='rgb(26, 115, 232)'&&Math.abs(r.right-p.right)<=4&&r.width<=Math.max(280,p.width*0.5)+1,width:r.width,parent:p.width};
    click_css .x-chat-follow-ups .x-chat-follow-up
    wait_eval return {ok:document.querySelector('[data-chat-composer]')?.value==='Compare the source passages.'&&document.activeElement===document.querySelector('[data-chat-composer]')};
