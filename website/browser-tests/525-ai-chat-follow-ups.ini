; The three suggestion cards share one row. A click fills and focuses the composer.
[ai-chat-follow-ups]
summary = Verifies the suggested question buttons and that a click fills the composer.
url = /ai_chat/c/{{chat_fixture:web_citations}}/9g==/9g==
actions =
    wait_css .x-chat-follow-ups .x-chat-follow-up
    eval document.querySelector('.x-chat-follow-ups').scrollIntoView({block:'center'});return {ok:true};
    wait_eval const g=document.querySelector('.x-chat-follow-ups');const cards=[...g.querySelectorAll('.x-chat-follow-up')];const boxes=cards.map(b=>b.getBoundingClientRect());const s=getComputedStyle(cards[0]);const heading=g.querySelector('.x-chat-follow-ups-heading');const icon=heading?.querySelector('svg');return {ok:g.getAttribute('role')==='group'&&heading.innerText==='Suggested next...'&&icon?.getBoundingClientRect().width===13&&cards.length===3&&boxes.every(b=>Math.abs(b.top-boxes[0].top)<1&&Math.abs(b.width-boxes[0].width)<1)&&s.borderTopColor==='rgb(26, 115, 232)'&&getComputedStyle(g).borderTopStyle==='solid',widths:boxes.map(b=>b.width)};
    wait_eval const b=document.querySelector('button[aria-label="Send"]');return {ok:!!b&&b.disabled&&!!b.querySelector('svg')};
    click_css .x-chat-follow-ups .x-chat-follow-up
    wait_eval return {ok:document.querySelector('[data-chat-composer]')?.value==='Compare the source passages.'&&document.activeElement===document.querySelector('[data-chat-composer]')};
    wait_eval const b=document.querySelector('button[aria-label="Send"]');const svg=b.querySelector('svg').getBoundingClientRect();const r=b.getBoundingClientRect();return {ok:!b.disabled&&b.classList.contains('x-navigation-button')&&Math.abs((svg.left+svg.right-r.left-r.right)/2)<=1&&Math.abs((svg.top+svg.bottom-r.top-r.bottom)/2)<=1};
    hover_css button[aria-label="Send"]
    wait_css .hover-card-content
    wait_text_in .hover-card-content :: Send
