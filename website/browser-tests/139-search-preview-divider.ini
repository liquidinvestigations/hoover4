; The divider between the search results and the preview is dragged, and its width is
; remembered after a reload. The last action clears the key.
[search-preview-divider]
summary = Verifies divider limits, retained width, search field width, and card text size.
url = /search/o3Njb2xsZWN0aW9uX2RhdGFzZXRzgGxxdWVyeV9zdHJpbmdpZWFzeWNoYWlybWZhY2V0X2ZpbHRlcnOg/0/9g==/9g==
actions =
    wait_css #x-search-preview-resize
    wait_css .x-card-text
    wait_eval const input=document.querySelector('#x-search-input-search-box');const cards=[...document.querySelectorAll('#x-search-panel-results-wrapper .x-result-item-card')];return {ok:Math.abs(input.getBoundingClientRect().width-375)<=1&&cards.length>0&&cards.every(card=>{const text=card.querySelector('.x-card-text');const style=getComputedStyle(text.firstElementChild);return Math.abs(card.getBoundingClientRect().height-112)<=1&&style.fontSize==='13px'&&style.lineHeight==='19px'&&text.getBoundingClientRect().height<=58;})};
    eval localStorage.removeItem('hoover4.search-preview-width-css-px');document.querySelector('#x-search-preview-resize').dispatchEvent(new MouseEvent('dblclick',{bubbles:true}));return {ok:true};
    eval const h=document.querySelector('#x-search-preview-resize');window.__w0=h.parentElement.getBoundingClientRect().width;const r=h.getBoundingClientRect();window.__x=r.left+3;h.dispatchEvent(new MouseEvent('mousedown',{bubbles:true,cancelable:true,clientX:window.__x,clientY:r.top+40,button:0}));return {ok:true,w0:window.__w0};
    sleep 300
    eval const o=[...document.querySelectorAll('div')].find(d=>d.style.position==='fixed'&&d.style.cursor==='col-resize');if(!o)throw new Error('no drag overlay');o.dispatchEvent(new MouseEvent('mousemove',{bubbles:true,clientX:window.__x+(100),clientY:300}));return {ok:true};
    sleep 300
    eval const o=[...document.querySelectorAll('div')].find(d=>d.style.position==='fixed'&&d.style.cursor==='col-resize');o.dispatchEvent(new MouseEvent('mouseup',{bubbles:true,clientX:window.__x,clientY:300}));return {ok:true};
    wait_eval const w=document.querySelector('#x-search-preview-resize').parentElement.getBoundingClientRect().width;const s=Number(localStorage.getItem('hoover4.search-preview-width-css-px'));return {ok:Math.abs(w-window.__w0)>=30&&Math.abs(s-w)<=1,w,s,w0:window.__w0};
    eval sessionStorage.setItem('hoover4.test-divider-origin',String(performance.timeOrigin));location.reload();return {ok:true};
    wait_eval return performance.timeOrigin!==Number(sessionStorage.getItem('hoover4.test-divider-origin'))&&document.readyState==='complete'&&typeof window.hydration_callback==='function';
    wait_css #x-search-preview-resize
    wait_eval const h=document.querySelector('#x-search-preview-resize');if(!h)return {ok:false};const w=h.parentElement.getBoundingClientRect().width;const s=Number(localStorage.getItem('hoover4.search-preview-width-css-px'));return {ok:s>0&&Math.abs(s-w)<=1,w,s};
    eval const h=document.querySelector('#x-search-preview-resize');const r=h.getBoundingClientRect();window.__x=r.left+3;h.dispatchEvent(new MouseEvent('mousedown',{bubbles:true,cancelable:true,clientX:window.__x,clientY:r.top+40,button:0}));return {ok:true};
    sleep 300
    eval const o=[...document.querySelectorAll('div')].find(d=>d.style.position==='fixed'&&d.style.cursor==='col-resize');if(!o)throw new Error('no drag overlay');o.dispatchEvent(new MouseEvent('mousemove',{bubbles:true,clientX:0,clientY:300}));return {ok:true};
    sleep 300
    eval const o=[...document.querySelectorAll('div')].find(d=>d.style.position==='fixed'&&d.style.cursor==='col-resize');o.dispatchEvent(new MouseEvent('mouseup',{bubbles:true,clientX:0,clientY:300}));return {ok:true};
    wait_eval const page=document.querySelector('#x-page-container');const row=document.querySelector('#x-search-results-bottom-space');const left=document.querySelector('#x-search-results-left-panel');const right=document.querySelector('#x-search-preview-resize').parentElement;return {ok:page.scrollWidth<=page.clientWidth+1&&row.scrollWidth<=row.clientWidth+1&&left.getBoundingClientRect().width>=399&&right.getBoundingClientRect().right<=page.getBoundingClientRect().right+1,pageWidth:page.clientWidth,scrollWidth:page.scrollWidth,leftWidth:left.getBoundingClientRect().width,rightWidth:right.getBoundingClientRect().width};
    eval sessionStorage.setItem('hoover4.test-divider-origin',String(performance.timeOrigin));location.reload();return {ok:true};
    wait_eval return performance.timeOrigin!==Number(sessionStorage.getItem('hoover4.test-divider-origin'))&&document.readyState==='complete'&&typeof window.hydration_callback==='function';
    wait_css #x-search-preview-resize
    wait_eval const page=document.querySelector('#x-page-container');const row=document.querySelector('#x-search-results-bottom-space');const w=document.querySelector('#x-search-preview-resize').parentElement.getBoundingClientRect().width;const expected=Math.min(Number(localStorage.getItem('hoover4.search-preview-width-css-px')),row.clientWidth*0.7,row.clientWidth-400);return {ok:page.scrollWidth<=page.clientWidth+1&&row.scrollWidth<=row.clientWidth+1&&Math.abs(w-expected)<=1,pageWidth:page.clientWidth,scrollWidth:page.scrollWidth,rightWidth:w,expected};
    eval const h=document.querySelector('#x-search-preview-resize');const r=h.getBoundingClientRect();window.__x=r.left+3;h.dispatchEvent(new MouseEvent('mousedown',{bubbles:true,cancelable:true,clientX:window.__x,clientY:r.top+40,button:0}));return {ok:true};
    sleep 300
    eval const o=[...document.querySelectorAll('div')].find(d=>d.style.position==='fixed'&&d.style.cursor==='col-resize');if(!o)throw new Error('no drag overlay');o.dispatchEvent(new MouseEvent('mousemove',{bubbles:true,clientX:innerWidth,clientY:300}));return {ok:true};
    sleep 300
    eval const o=[...document.querySelectorAll('div')].find(d=>d.style.position==='fixed'&&d.style.cursor==='col-resize');o.dispatchEvent(new MouseEvent('mouseup',{bubbles:true,clientX:innerWidth,clientY:300}));return {ok:true};
    wait_eval const page=document.querySelector('#x-page-container');const right=document.querySelector('#x-search-preview-resize').parentElement;return {ok:page.scrollWidth<=page.clientWidth+1&&Math.abs(right.getBoundingClientRect().width-360)<=1,pageWidth:page.clientWidth,scrollWidth:page.scrollWidth,rightWidth:right.getBoundingClientRect().width};
    eval localStorage.removeItem('hoover4.search-preview-width-css-px');sessionStorage.removeItem('hoover4.test-divider-origin');return {ok:true};
