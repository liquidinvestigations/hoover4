; A find text that only column 350 holds brings column 350 into the grid, and the
; selection survives a reload of the URL that the viewer wrote.
[view-doc-table-column-find]
summary = Brings a matching column beyond the first 60 into the grid and keeps it after reload.
requires_dataset = p73tables_fixtures
url = /view_document/onJjb2xsZWN0aW9uX2RhdGFzZXRycDczdGFibGVzX2ZpeHR1cmVzaWZpbGVfaGFzaHhANGYxOTc2YTExYmJkYzM5Zjk4ZmM5ODM3NGI3NGIyYmFhNmJkYTIzOTE4NzY2N2ZhZGEwODM4MWQ2MzQ1ZjlkZA==/pGpmaW5kX3F1ZXJ5aW5lZWRsZTM1MG9zZWxlY3RlZF9zb3VyY2X2dHNlbGVjdGVkX3NvdXJjZV9wYWdl9mt0YWJsZV9zdGF0ZfY=/oWxzZWxlY3RlZF90YWJoRW50aXRpZXM=
actions =
    wait_eval const h=[...document.querySelectorAll('thead th')].map(e=>e.innerText.trim());return {ok:h.some(x=>x.includes('col350'))&&h.length<=61,count:h.length};
    wait_eval return {ok:document.querySelector('tbody').innerText.includes('needle350')};
    eval window.__p73_url=location.href;location.reload();return {ok:true};
    sleep 3000
    wait_eval const h=[...document.querySelectorAll('thead th')].map(e=>e.innerText.trim());return {ok:h.some(x=>x.includes('col350')),count:h.length};
