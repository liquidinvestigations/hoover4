
; The log for whatever is in flight when the run reaches it: a progress bar and an
; estimate against a running operation. Nothing here starts one, so an idle stack shows
; the log with no running row, which is the page working rather than failing.
[admin-operations-running]
summary = Exercises the admin operations running case.
url = /admin/operations
full_page = true
actions =
    wait_css #x-ops-filter-state
    sleep 3000
