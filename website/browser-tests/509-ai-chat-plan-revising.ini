; ---------------------------------------------------------------- chat

[ai-chat-plan-revising]
summary = Asks for changes on the plan card of the newest conversation and shows the card while the planner revises the plan.
url = /ai_chat/history
actions =
    wait_css a[href^="/ai_chat/c/"]
    click_css a[href^="/ai_chat/c/"]
    wait_css [data-plan-state="awaiting_review"] [data-plan-action="reject-open"]
    click_css [data-plan-state="awaiting_review"] [data-plan-action="reject-open"]
    type_css [data-plan-comment] :: Write the plan into the plan tree with the plan tools. Append one node for each collection section under the root, and two task nodes under each section.
    click_css [data-plan-action="reject"]
    wait_css [data-plan-state="revising"]
    sleep 3000
