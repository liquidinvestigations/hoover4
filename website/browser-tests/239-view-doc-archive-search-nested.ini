    wait_eval const a=[...document.querySelectorAll('#x-search-results-left-panel a[target="_blank"][href^="/view_document/"]')];const dec=t=>atob(t.replace(/-/g,'+').replace(/_/g,'/'));const ids=a.map(x=>dec(x.getAttribute('href').split('/')[2]));const q=dec(location.pathname.split('/')[2]);const want=['f7281c8a9cc404816f019382bd121c5fff28e0b816f632f43069b1f7c40c3e6e', '2228e662341d939650d313b8971984d99b0d50791f7b4c06034b6f254436a3c3'];const all=ids.every(x=>x.includes('testdata_diskfiles'));const has=want.every(w=>ids.some(x=>x.includes(w)));return {ok:ids.length>0&&all&&has&&ids.length===want.length&&q.includes('file_paths')&&q.includes('testdata_diskfiles')&&q.includes('collection_dataset'),count:ids.length,all,has,url:location.pathname};
