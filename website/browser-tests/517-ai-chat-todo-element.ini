; ---------------------------------------------------------------- chat

[ai-chat-todo-element]
summary = Selects the named todo chat and checks the separate card and changed item state.
url = /ai_chat/c/{{chat_fixture:todo}}/9g==/9g==
actions =
    wait_css [data-todo-change="true"] [data-card-chip="Todo"]
    click_css [data-todo-change="true"] [data-card-chip="Todo"] button
    wait_eval const row=document.querySelector('[data-todo-change="true"]');const card=row?.querySelector('[data-card-chip="Todo"]');return {ok:!!card&&!row.closest('.x-chat-tool-run')&&card.innerText.includes('version')&&card.innerText.includes('pending:')&&card.innerText.includes('Show raw JSON')};
    eval for(const card of document.querySelectorAll('[data-todo-change="true"] [data-card-chip="Todo"]')){const button=[...card.querySelectorAll('button')].find(button=>button.innerText==='Expand');if(button)button.click()}return {ok:true};
    wait_eval const cards=[...document.querySelectorAll('[data-todo-change="true"] [data-card-chip="Todo"]')];return {ok:cards.some(card=>card.innerText.includes('done:')&&!!card.querySelector('s'))};
