; ---------------------------------------------------------------- chat

[ai-chat-todo-element]
summary = Verifies current goals and bullet lists with completed tasks crossed out.
url = /ai_chat/c/{{chat_fixture:todo}}/9g==/9g==
actions =
    wait_css [data-todo-change="true"] .x-chat-todo-list
    wait_eval const row=document.querySelector('[data-todo-change="true"]');const card=row?.querySelector('.x-chat-todo-list');return {ok:!!card&&!row.closest('.x-chat-tool-run')&&!card.querySelector('button,[data-card-chip],ol')&&!/version|raw JSON|pending:|done:/.test(card.innerText)&&!!card.querySelector('ul')&&getComputedStyle(card.querySelector('ul')).listStyleType==='disc'&&getComputedStyle(card).backgroundColor==='rgb(0, 0, 0)'&&getComputedStyle(card).color==='rgb(255, 255, 255)'};
    wait_eval const cards=[...document.querySelectorAll('[data-todo-change="true"] .x-chat-todo-list')];return {ok:cards.some(card=>!!card.querySelector('li s'))};
