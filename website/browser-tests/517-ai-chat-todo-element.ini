; ---------------------------------------------------------------- chat

[ai-chat-todo-element]
summary = Selects the named todo chat and checks the separate card and changed item state.
url = /ai_chat/c/{{chat_fixture:todo}}/9g==/9g==
actions =
    wait_css [data-todo-change="true"] .x-chat-todo-diff
    wait_eval const row=document.querySelector('[data-todo-change="true"]');const card=row?.querySelector('.x-chat-todo-diff');return {ok:!!card&&!row.closest('.x-chat-tool-run')&&!card.querySelector('button,[data-card-chip]')&&!card.innerText.includes('version')&&!card.innerText.includes('raw JSON')&&card.innerText.includes('pending:')};
    wait_eval const cards=[...document.querySelectorAll('[data-todo-change="true"] .x-chat-todo-diff')];return {ok:cards.some(card=>card.innerText.includes('done:')&&!!card.querySelector('[data-todo-diff="-1"] s')&&!!card.querySelector('[data-todo-diff="1"]'))};
