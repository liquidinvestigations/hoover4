; ---------------------------------------------------------------- chat

[ai-chat-todo-element]
summary = Checks the task summaries, the done item and its reason, the todo call cards in their groups, and the grouped reasoning.
url = /ai_chat/c/{{chat_fixture:todo}}/9g==/9g==
actions =
    wait_css [data-todo-change="true"] .x-chat-todo-list
    wait_eval const cards=[...document.querySelectorAll('[data-todo-change="true"] .x-chat-todo-list')];const card=cards[0];const parent=card?.parentElement;const style=card&&getComputedStyle(card);return {ok:cards.length===2&&!card.closest('.x-chat-tool-run')&&!card.querySelector('button,[data-card-chip],ol')&&getComputedStyle(card.querySelector('ul')).listStyleType==='disc'&&style.backgroundColor==='rgb(245, 245, 247)'&&style.color!=='rgb(255, 255, 255)'&&card.getBoundingClientRect().width<=parent.getBoundingClientRect().width*0.8+1&&!!card.querySelector('.x-chat-todo-list-icon svg'),count:cards.length,background:style?.backgroundColor};
    wait_eval const card=[...document.querySelectorAll('[data-todo-change="true"] .x-chat-todo-list')][1];const done=card?.querySelector('li[data-todo-done="true"]');const reason=done?.querySelector('strong');return {ok:!!done?.querySelector('s')&&!!reason&&reason.innerText.trim().split(/\s+/).length<=3&&reason.title==='found the sample document',reason:reason?.innerText};
    wait_eval return {ok:!document.querySelector('[data-chat-answer]')?.parentElement?.querySelector(':scope > .x-chat-reasoning')&&!document.querySelector('[data-chat-activity]')};
    eval document.querySelectorAll('.x-chat-tool-run-toggle').forEach(button=>{if(button.innerText.includes('Show'))button.click()});return {ok:true};
    wait_eval const calls=[...document.querySelectorAll('[data-todo-call="true"] [data-card-chip="Todo"]')];return {ok:calls.length===2&&calls.every(call=>!!call.closest('.x-chat-tool-run')),count:calls.length};
    eval for(const card of document.querySelectorAll('[data-todo-call="true"] [data-card-chip="Todo"]')){const button=[...card.querySelectorAll('button')].find(button=>button.innerText==='Expand');if(button)button.click()}return {ok:true};
    wait_eval const cards=[...document.querySelectorAll('[data-todo-call="true"] [data-card-chip="Todo"]')];return {ok:cards.length===2&&cards.every(card=>!!card.querySelector('[data-todo-arguments]')&&card.innerText.includes('Show raw JSON'))&&cards[1].innerText.includes('"note": "found the sample document"')};
    wait_eval const reasoning=[...document.querySelectorAll('.x-chat-reasoning')];return {ok:reasoning.length===1&&!!reasoning[0].closest('.x-chat-tool-run'),count:reasoning.length};
