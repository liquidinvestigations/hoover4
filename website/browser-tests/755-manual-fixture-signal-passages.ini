[manual-fixture-signal-passages]
summary = Shows a scored passage in the public Enron email corpus.
requires_dataset = enron_maildir
url = /search/o3Njb2xsZWN0aW9uX2RhdGFzZXRzgW1lbnJvbl9tYWlsZGlybHF1ZXJ5X3N0cmluZ2BtZmFjZXRfZmlsdGVyc6FyY29sbGVjdGlvbl9kYXRhc2V0gaFmU3RyaW5nbWVucm9uX21haWxkaXI=/0/9g==/9g==
manual_asset = document-red-flags.png
actions =
	click_css #x-search-open-filters
	wait_text All filters
	click_text Entities
	click_text Red flags
	wait_css input[placeholder="Search red flags…"]
	wait_text Marketing and bulk mail
	click_text_in #x-filter-modal :: Marketing and bulk mail
	wait_eval const button=document.querySelector('#x-filter-modal > div:last-child button:last-child');return /^Show [1-9][0-9]* results?$/.test(button?.textContent.trim()||'');
	click_css #x-filter-modal > div:last-child button:last-child
	wait_eval const query=location.pathname.split('/')[2].replace(/-/g,'+').replace(/_/g,'/');return !document.querySelector('#x-filter-modal')&&atob(query).includes('red_flags')&&!!document.querySelector('#x-search-panel-results-wrapper li');

	wait_css .x-result-item-card
	eval const a=document.querySelector(".x-result-item-card a[href^=\"/view_document/\"]");if(!a)throw new Error("No full document link");location.href=a.getAttribute("href");return {ok:true};
	wait_css .x-red-flag-passage
	eval document.querySelector("[data-red-flags=\"true\"]").scrollIntoView({block:"start"});return {ok:true};
	wait_css .x-red-flag-excerpt
