; Image previews. A HEIC image shows its stored JPEG preview, an SVG with a data URI
; image shows its 480 px preview, and a video player shows its first frame as the poster.
; The dataset `testdata_previews` holds copies of `sample1.heic`, `svg-data-uri.svg` and
; `sample-mkv-file.mkv` from the upstream fixture corpus.
