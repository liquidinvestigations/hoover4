[storage-root-search]
summary = Verifies the name search of the storage root, its reload, a result that opens its folder, and Back to the same results.
requires_dataset = testdata_shapes
url = /file_browser?q=many-a-child
manual_asset = storage-root-search.png
actions =
    wait_css .x-storage-search-row
    wait_eval return (document.querySelector('.x-storage-search-summary')?.innerText || '').includes('of') && (document.querySelector('.x-storage-search-row')?.innerText || '').includes('shapes');
    eval window.x_first_rows = [...document.querySelectorAll('.x-storage-search-row')].map(r => r.innerText).join('|'); return {ok: true};
    goto /file_browser?q=many-a-child
    wait_css .x-storage-search-row
    wait_eval return document.querySelector('input[placeholder*="all collections"]').value === 'many-a-child';
    click_css .x-storage-search-row a
    wait_eval return location.pathname.startsWith('/file_browser/testdata_shapes/');
    history_back
    wait_eval return location.search.includes('q=many-a-child') && !!document.querySelector('.x-storage-search-row');
