[search-no-similar-word]
summary = Verifies a zero result without a close indexed word.
url = /search/o3Njb2xsZWN0aW9uX2RhdGFzZXRzgGxxdWVyeV9zdHJpbmdrenp4cXZ0cnBsbXhtZmFjZXRfZmlsdGVyc6A=/0/9g==/9g==
actions =
    wait_css #x-search-no-results
    wait_eval const panel=document.querySelector('#x-search-results-scroll');const left=document.querySelector('#x-search-results-left-panel');return {ok:!!panel&&panel.scrollHeight<=panel.clientHeight+1&&left.scrollHeight<=left.clientHeight+1};
    eval const panel=document.querySelector('#x-search-results-scroll');panel.scrollTop=10000;return {ok:panel.scrollTop===0};
    wait_eval return {ok:document.querySelector('#x-search-no-results').innerText.includes('No similar words were found in the selected collections.')};
