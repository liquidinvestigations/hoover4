; A 1000-column table stores every column and the grid shows the first 60, with no
; yellow note. The picker counts the shown columns and refuses a 61st.
[view-doc-table-wide-sixty]
summary = Shows 60 of 1000 stored columns and refuses a 61st in the picker.
requires_dataset = p73tables_fixtures
url = /view_document/onJjb2xsZWN0aW9uX2RhdGFzZXRycDczdGFibGVzX2ZpeHR1cmVzaWZpbGVfaGFzaHhANGYxOTc2YTExYmJkYzM5Zjk4ZmM5ODM3NGI3NGIyYmFhNmJkYTIzOTE4NzY2N2ZhZGEwODM4MWQ2MzQ1ZjlkZA==/9g==/oWxzZWxlY3RlZF90YWJoRW50aXRpZXM=
actions =
    wait_text col60
    wait_eval const h=[...document.querySelectorAll('thead th')].map(e=>e.innerText.trim());const p=document.querySelector('#x-page-container')||document.body;return {ok:h.some(x=>x.includes('col60'))&&!h.some(x=>x.includes('col61'))&&!p.innerText.includes('larger than the browser')&&!p.innerText.includes('at most 60'),count:h.length};
    pointer_click_css button[aria-label="Choose visible columns"]
    wait_css [role="dialog"][aria-modal="true"]
    wait_eval const d=document.querySelector('[role="dialog"][aria-modal="true"]');const boxes=[...d.querySelectorAll('input[type="checkbox"]')];return {ok:d.innerText.includes('60 of 60 shown')&&boxes.length===1000&&boxes.filter(b=>b.checked).length===60&&boxes[60].disabled&&!boxes[0].disabled,checked:boxes.filter(b=>b.checked).length};
    pointer_click_css [role="dialog"] input[type="checkbox"]
    wait_eval const d=document.querySelector('[role="dialog"][aria-modal="true"]');const boxes=[...d.querySelectorAll('input[type="checkbox"]')];return {ok:d.innerText.includes('59 of 60 shown')&&!boxes[60].disabled&&location.pathname.length>0};
    pointer_click_css button[aria-label="Show the first 60 columns"]
    wait_eval const d=document.querySelector('[role="dialog"][aria-modal="true"]');return {ok:d.innerText.includes('60 of 60 shown')};
