; ---------------------------------------------------------------- chat

[ai-chat-question-card]
summary = Selects the named question chat and checks an option fills the reply box.
url = /ai_chat/c/{{chat_fixture:question}}/9g==/9g==
actions =
    wait_eval const root=document.querySelector('[data-chat-asked]');const box=document.querySelector('textarea');return {ok:!!root&&root.textContent.trim().length>0&&!!box};
    eval const button=[...document.querySelectorAll('button')].find(e=>e.innerText.trim()==='Tables from 2007');if(!button)throw new Error('No question option');window.__questionOption=button.innerText.trim();button.click();return {ok:true};
    wait_eval const box=document.querySelector('textarea');return {ok:!!box&&box.value===window.__questionOption};
