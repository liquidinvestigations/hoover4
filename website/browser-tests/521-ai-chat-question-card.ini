; ---------------------------------------------------------------- chat

[ai-chat-question-card]
summary = Opens the stored question chat and checks that its options are plain text and the composer stays.
url = /ai_chat/c/{{chat_fixture:question}}/9g==/9g==
actions =
    wait_eval const root=document.querySelector('[data-chat-asked]');const box=document.querySelector('[data-chat-composer]');return {ok:!!root&&root.textContent.trim().length>0&&!!box};
    wait_eval const items=[...document.querySelectorAll('.x-chat-question-options li')].map(e=>e.innerText.trim());return {ok:items.includes('Tables from 2007')&&items.includes('All tables'),items};
    eval const button=[...document.querySelectorAll('button')].find(e=>e.innerText.trim()==='Tables from 2007');if(button)throw new Error('A stored question option is a button');return {ok:true};
