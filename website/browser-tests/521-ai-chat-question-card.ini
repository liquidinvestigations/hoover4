; ---------------------------------------------------------------- chat

[ai-chat-question-card]
summary = Selects the named question chat and checks an option fills the reply box.
url = /ai_chat/c/{{chat_fixture:question}}/9g==/9g==
actions =
    wait_eval const q=document.querySelector('[data-plan-question]');const box=document.querySelector('[data-plan-question-reply]');return {ok:!!q&&q.innerText.trim().length>0&&!!box};
    eval const q=document.querySelector('[data-plan-question]');const button=q?.parentElement?.querySelector('button');if(!button)throw new Error('No question option');window.__questionOption=button.innerText.trim();button.click();return {ok:!!window.__questionOption};
    wait_eval const box=document.querySelector('[data-plan-question-reply]');return {ok:!!box&&box.value===window.__questionOption&&!document.querySelector('[data-plan-action="question-reply"]').disabled};
