; The create page shows the board form with every collection selected and the internet
; tools on. Each field has a visible label and no placeholder, the Collections checkbox is
; checked, and the back link has an icon and no arrow character. The agent language control
; is beside Create board and opens the language settings in a new tab.
[ai-board-create]
summary = Shows the form that creates a board, with every collection selected and a label on each field.
url = /ai_chat/boards/new
full_page = true
actions =
    wait_css .x-board-create
    wait_css .x-board-collection
    wait_eval const boxes=[...document.querySelectorAll('.x-board-collection')];const all=document.querySelector('.x-board-collections-all');return {ok:boxes.length>0&&boxes.every(b=>b.checked)&&all.checked&&!all.indeterminate&&document.querySelector('.x-board-internet-tools').checked,boxes:boxes.length};
    wait_eval const fields=[...document.querySelectorAll('.x-board-title,.x-board-goal,.x-board-context,.x-board-hints')];const back=[...document.querySelectorAll('a')].find(a=>a.innerText.trim()==='AI Chat');return {ok:fields.length===4&&fields.every(f=>!f.placeholder&&f.closest('label')&&f.closest('label').innerText.trim().length>0)&&!!back&&!!back.querySelector('svg')&&!back.innerText.includes('←')&&!document.querySelector('.x-board-source-error'),labels:fields.map(f=>f.closest('label')&&f.closest('label').innerText.split('\n')[0])};
    wait_eval const c=document.querySelector('.x-board-create');const a=c&&c.parentElement.querySelector('a.x-agent-language');return {ok:!!a&&a.getAttribute('href')==='/settings/language'&&a.getAttribute('target')==='_blank'&&!!a.dataset.agentLanguage&&!!document.querySelector('.x-board-language-label'),language:a&&a.dataset.agentLanguage};
