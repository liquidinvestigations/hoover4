[view-doc-text-single-entry-absent]
summary = Opens an old link to entry 5 of a source with one stored text segment, shows no page overlay, and returns to the sole stored segment through its link in the absent-page text.
requires_dataset = p63pages_boundaries
url = /view_
actions =
    wait_text_in #x-document-text-viewer :: No text is stored for Text segment 5.
    wait_eval const l=document.querySelector('[data-text-sole-page]');const v=document.querySelector('#x-document-text-viewer');return {ok:!!l&&l.getAttribute('data-text-sole-page')==='1'&&l.textContent.trim()==='Text segment 1'&&v.innerText.includes('Open Text segment 1.')&&!document.querySelector('[data-text-page-controls]')&&!document.querySelector('[data-text-content-navigation]'),link:l?.textContent,text:v?.innerText.slice(0,200),overlay:!!document.querySelector('[data-text-page-controls]')};
    click_css [data-text-sole-page]
    wait_eval const t=document.querySelector('#x-document-text-viewer pre')?.innerText||'';const v=document.querySelector('#x-document-text-viewer');return {ok:t.length>0&&!v.innerText.includes('No text is stored')&&!document.querySelector('[data-text-page-controls]'),text:t.slice(0,80),url:location.pathname};
    eval location.reload();return {ok:true};
    sleep 1500
    wait_eval const t=document.querySelector('#x-document-text-viewer pre')?.innerText||'';return {ok:t.length>0&&!document.querySelector('[data-text-sole-page]'),text:t.slice(0,80),url:location.pathname};
