; Resizing preserves filters while the toolbar keeps one row.
[search-chip-overflow]
summary = Verifies chip overflow, resizing, category opening, removal, and clearing.
requires_dataset = testdata_shapes
url = 
actions =
    wait_css #x-filter-chips [data-chip]
    wait_eval const row=document.querySelector('#x-search-toolbar-row');const wrap=document.querySelector('#x-filter-chips');const chips=[...wrap.querySelectorAll('[data-chip]')];const hidden=chips.filter(c=>c.hasAttribute('data-chip-omitted'));const more=wrap.querySelector('.x-filter-chips-more');const clear=wrap.querySelector('.x-filter-chips-clear').getBoundingClientRect();const bar=document.querySelector('#x-search-input-top-bar').getBoundingClientRect();const visible=chips.filter(c=>!c.hasAttribute('data-chip-omitted')).map(c=>c.getBoundingClientRect());return {ok:chips.length===7&&Number.parseInt(more.innerText)===hidden.length&&bar.height===53&&Math.abs(clear.right-row.getBoundingClientRect().right)<=10&&visible.every(r=>r.top>=bar.top&&r.bottom<=bar.bottom),hidden:hidden.length,height:bar.height};
    eval window.__chipPath=location.pathname;document.querySelector('#x-search-toolbar-row').style.width='900px';return {ok:true};
    wait_eval const chips=[...document.querySelectorAll('[data-chip]')];const n=chips.filter(c=>c.hasAttribute('data-chip-omitted')).length;window.__firstHidden=chips.find(c=>c.hasAttribute('data-chip-omitted'))?.querySelector('span')?.innerText;return {ok:n>0&&Number.parseInt(document.querySelector('.x-filter-chips-more').innerText)===n&&location.pathname===window.__chipPath};
    click_css .x-filter-chips-more
    wait_css #x-filter-modal
    wait_eval const selected=[...document.querySelectorAll('#x-filter-modal .x-facet-list-item')].find(b=>getComputedStyle(b).backgroundColor==='rgba(0, 0, 0, 0.06)');return {ok:selected?.innerText.trim()===window.__firstHidden};
    click_text_in #x-filter-modal :: Cancel
    wait_eval return {ok:!document.querySelector('#x-filter-modal')&&location.pathname===window.__chipPath};
    eval const row=document.querySelector('#x-search-toolbar-row');row.style.flexShrink='0';row.style.width='2800px';return {ok:true};
    wait_eval const chips=[...document.querySelectorAll('[data-chip]')];return {ok:chips.length===7&&chips.every(c=>!c.hasAttribute('data-chip-omitted'))&&getComputedStyle(document.querySelector('.x-filter-chips-more')).display==='none'&&location.pathname===window.__chipPath&&document.querySelector('#x-search-input-top-bar').getBoundingClientRect().height===53};
    eval const row=document.querySelector('#x-search-toolbar-row');row.style.flexShrink='1';row.style.width='100%';return {ok:true};
    wait_eval return {ok:document.querySelector('#x-search-toolbar-row').getBoundingClientRect().width<=innerWidth};
    click_css [data-chip]:not([data-chip-omitted]) button[title="Remove this filter"]
    wait_eval return {ok:document.querySelectorAll('[data-chip]').length===6&&location.pathname!==window.__chipPath};
    click_css .x-filter-chips-clear
    wait_eval return {ok:!document.querySelector('#x-filter-chips')&&document.querySelector('#x-search-input-top-bar').getBoundingClientRect().height===53};
    eval location.href=window.__chipPath;return {ok:true};
    wait_css #x-filter-chips [data-chip]
    wait_eval const n=document.querySelectorAll('[data-chip-omitted]').length;return {ok:Number.parseInt(document.querySelector('.x-filter-chips-more').innerText)===n&&document.querySelectorAll('[data-chip]').length===7};
