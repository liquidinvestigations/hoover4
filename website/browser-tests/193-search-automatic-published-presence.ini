[search-automatic-published-presence]
summary = Verify published OCR presence excludes absent, unknown, and unsupported output.
url = /search/pHNjb2xsZWN0aW9uX2RhdGFzZXRzgGxxdWVyeV9zdHJpbmdwYXV0b21hdGljZml4dHVyZW1mYWNldF9maWx0ZXJzoXJjb2xsZWN0aW9uX2RhdGFzZXSBoWZTdHJpbmd3cmVsZWFzZV9icm93c2VyX3ByaW1hcnltcmFuZ2VfZmlsdGVyc6A=/0/9g==/9g==
requires_dataset = release_browser_primary
actions =
    wait_eval return {ok:document.querySelectorAll('#x-search-panel-results-wrapper .x-result-item-card').length===6};
    click_css #x-search-open-filters
    click_text_in #x-filter-modal :: OCR
    wait_css .x-filter-published-ocr input[type=checkbox]
    wait_eval const box=document.querySelector(".x-filter-published-ocr").getBoundingClientRect(),lists=document.querySelector(".x-ocr-facets").getBoundingClientRect();return {ok:box.bottom<=lists.top};
    click_css .x-filter-published-ocr input
    eval [...document.querySelectorAll("#x-filter-modal button")].at(-1).click();return {ok:true};
    wait_eval const expected=["34c2a225930cb540261d14d2c9679a88ee40e7730656ac030e433571ad663b71", "3a1cd61765ff77429ea0738ef2bf999276a1d0430a34acc612f8611f250bcabd"],cards=[...document.querySelectorAll('#x-search-panel-results-wrapper .x-result-item-card')];return {ok:cards.length===2&&cards.every(c=>expected.includes(c.dataset.fileHash)),hashes:cards.map(c=>c.dataset.fileHash)};
    wait_text Has published OCR text
    click_css #x-search-open-filters
    click_text_in #x-filter-modal :: OCR
    wait_eval return {ok:document.querySelector(".x-filter-published-ocr input").checked};
