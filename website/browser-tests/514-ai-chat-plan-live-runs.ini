; ---------------------------------------------------------------- chat

[ai-chat-plan-live-runs]
summary = Opens the newest conversation while its plan executes and shows the plan card with the sections and the live sub-agent runs of the current batch.
url = /ai_chat/history
actions =
    wait_css a[href^="/ai_chat/c/"]
    click_css a[href^="/ai_chat/c/"]
    wait_css [data-plan-live-runs]
    sleep 1500
