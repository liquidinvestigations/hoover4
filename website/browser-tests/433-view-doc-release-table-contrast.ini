[view-doc-release-table-contrast]
summary = Verify sort and filter contrast, keyboard focus, and keyboard sorting.
requires_dataset = release_browser_primary
url = /view_document/onJjb2xsZWN0aW9uX2RhdGFzZXR3cmVsZWFzZV9icm93c2VyX3ByaW1hcnlpZmlsZV9oYXNoeEA1ZDI0MzJkNjAzMGE0OTMyYjRlODRiYTBjNTExZjg3YzNmN2UzOTQ3NjkyMGFlMjI3OTZlMzk2ZDc1OWNlYWM2/o2pmaW5kX3F1ZXJ5YG9zZWxlY3RlZF9zb3VyY2X2dHNlbGVjdGVkX3NvdXJjZV9wYWdl9g==/oWxzZWxlY3RlZF90YWJoTWV0YWRhdGE=
actions =
    wait_css .x-table-sort
    eval const rgba=s=>{const n=s.match(/[\d.]+/g).map(Number);return[n[0],n[1],n[2],n[3]??1];};const lum=c=>c.slice(0,3).map(x=>{x/=255;return x<=0.04045?x/12.92:((x+0.055)/1.055)**2.4;}).reduce((v,x,i)=>v+x*[0.2126,0.7152,0.0722][i],0);const ratios=[...document.querySelectorAll('.x-table-sort,.x-table-column-filter')].map(e=>{const fg=rgba(getComputedStyle(e).color);let node=e,bg=[255,255,255,1];while(node){const next=rgba(getComputedStyle(node).backgroundColor);if(next[3]>0){bg=next;break;}node=node.parentElement;}const blended=fg.slice(0,3).map((x,i)=>x*fg[3]+bg[i]*(1-fg[3]));return(lum(bg)+0.05)/(lum(blended)+0.05);});return {ok:ratios.length===6&&ratios.every(x=>x>=3),ratios};
    eval document.querySelector('.x-table-sort').focus();return {ok:document.activeElement.matches('.x-table-sort')};
    press_key Tab
    press_key Shift+Tab
    wait_eval const e=document.activeElement;return {ok:e.matches('.x-table-sort')&&getComputedStyle(e).outlineStyle==='solid'&&parseFloat(getComputedStyle(e).outlineWidth)>=2};
    press_enter
    wait_css .x-table-sort[data-sorted="ascending"]
    eval const rgba=s=>{const n=s.match(/[\d.]+/g).map(Number);return[n[0],n[1],n[2],n[3]??1];};const lum=c=>c.slice(0,3).map(x=>{x/=255;return x<=0.04045?x/12.92:((x+0.055)/1.055)**2.4;}).reduce((v,x,i)=>v+x*[0.2126,0.7152,0.0722][i],0);const ratios=[...document.querySelectorAll('.x-table-sort,.x-table-column-filter')].map(e=>{const fg=rgba(getComputedStyle(e).color);let node=e,bg=[255,255,255,1];while(node){const next=rgba(getComputedStyle(node).backgroundColor);if(next[3]>0){bg=next;break;}node=node.parentElement;}const blended=fg.slice(0,3).map((x,i)=>x*fg[3]+bg[i]*(1-fg[3]));return(lum(bg)+0.05)/(lum(blended)+0.05);});return {ok:ratios.length===6&&ratios.every(x=>x>=3),ratios};
    eval document.querySelector('.x-table-sort').focus();return {ok:true};
    press_key Tab
    press_key Shift+Tab
    wait_eval return {ok:document.activeElement.matches('.x-table-sort')};
