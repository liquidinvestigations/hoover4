[view-doc-release-table-generation]
summary = Verify a page from another published generation requires a fresh table read.
requires_dataset = release_browser_primary
url = /view_document/onJjb2xsZWN0aW9uX2RhdGFzZXR3cmVsZWFzZV9icm93c2VyX3ByaW1hcnlpZmlsZV9oYXNoeEA1ZDI0MzJkNjAzMGE0OTMyYjRlODRiYTBjNTExZjg3YzNmN2UzOTQ3NjkyMGFlMjI3OTZlMzk2ZDc1OWNlYWM2/o2pmaW5kX3F1ZXJ5YG9zZWxlY3RlZF9zb3VyY2X2dHNlbGVjdGVkX3NvdXJjZV9wYWdl9g==/oWxzZWxlY3RlZF90YWJoTWV0YWRhdGE=
init_script = window.__fixtureResponse=(body,options)=>{const response=new Response(body,options);Object.defineProperty(response,'url',{value:location.href});return response;};window.__generationChanged=false;window.__generationFetch=window.fetch;window.fetch=function(u,o){const promise=window.__generationFetch.apply(this,arguments);if(String(u&&u.url||u).includes('/api/get_table_page')&&!window.__generationChanged){window.__generationChanged=true;return promise.then(async response=>{const page=await response.json();page.generation++;return window.__fixtureResponse(JSON.stringify(page),{headers:{'Content-Type':'application/json'}});});}return promise;};
actions =
    wait_css .x-table-read-error
    wait_text The table changed. Retry the table read.
    click_css .x-table-read-error button
    wait_css tbody td
    wait_eval return {ok:!document.querySelector('.x-table-read-error')&&document.querySelector('tbody')?.innerText.includes('row-0-')};
