; ---------------------------------------------------------------- chat

[ai-chat-delegation-running]
summary = Opens the newest conversation while its plan executes and shows the running section runs with their live state.
url = /ai_chat/history
actions =
    wait_css a[href^="/ai_chat/c/"]
    click_css a[href^="/ai_chat/c/"]
    wait_css [data-plan-live-runs] [data-plan-live-run="running"]
    sleep 2000
