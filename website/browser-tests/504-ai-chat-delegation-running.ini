; ---------------------------------------------------------------- chat

[ai-chat-delegation-running]
summary = Opens the newest conversation while its sub-agents run and shows the run_subagent card with their live state.
url = /ai_chat/history
actions =
    wait_css a[href^="/ai_chat/c/"]
    click_css a[href^="/ai_chat/c/"]
    wait_css [data-subagent-card]
    wait_css [data-subagent-state="running"]
    sleep 2000
