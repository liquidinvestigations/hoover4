
[qa-storage-cold-expansion]
summary = Exercises the qa storage cold expansion case.
requires_dataset = testdata_zips, testdata_shapes
url = /file_browser/testdata_shapes/om5jb250YWluZXJfaGFzaGBkcGF0aGEv/9g==/9g==
actions =
    wait_css #x-tree-d-testdata_zips
    eval const btn=document.querySelector('#x-tree-d-testdata_zips'); if(!btn) throw Error('missing zips disclosure'); btn.scrollIntoView({block:'nearest'}); const expanded=btn.getAttribute('aria-expanded')==='true'; window.__qa_zips_expand={alreadyExpanded:expanded}; if(!expanded) btn.click(); return {ok:true, alreadyExpanded:expanded};
    wait_text_in #x-storage-tree :: location-1
