[view-doc-release-projection]
summary = Verify four mapped text matches and navigation in the retained projection fixture.
requires_dataset = release_browser_primary
url = /view_
actions =
    wait_css [data-match-counter]
    wait_eval const e=document.querySelector("[data-match-counter]");return {ok:e?.getAttribute("data-match-counter")==="1 / 4",counter:e?.outerHTML};
    click_css button[aria-label="Next Hit"]
    wait_eval return {ok:document.querySelector("[data-match-counter]")?.getAttribute("data-match-counter")==="2 / 4"};
    click_css button[aria-label="Next Hit"]
    click_css button[aria-label="Next Hit"]
    wait_eval return {ok:document.querySelector("[data-match-counter]")?.getAttribute("data-match-counter")==="4 / 4"};
