; ---------------------------------------------------------------- chat

[ai-chat-plan-review]
summary = Opens the newest conversation and shows the plan card that waits for review, with approve, ask for changes and stop.
url = /ai_chat/history
actions =
    wait_css a[href^="/ai_chat/c/"]
    click_css a[href^="/ai_chat/c/"]
    wait_css [data-plan-state="awaiting_review"] [data-plan-action="approve"]
    sleep 1500
