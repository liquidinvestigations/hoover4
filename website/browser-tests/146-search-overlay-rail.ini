; A page overlay covers the page area only. While the filter popup is open, the bug
; control of the rail stays on top and the feedback image shows the open popup.
[search-overlay-rail]
summary = Keeps the rail usable over an open filter popup and captures the popup in a feedback report.
url = /search/o3Njb2xsZWN0aW9uX2RhdGFzZXRzgGxxdWVyeV9zdHJpbmdpZWFzeWNoYWlybWZhY2V0X2ZpbHRlcnOg/0/9g==/9g==
actions =
    wait_css .x-result-item-card
    click_css #x-search-open-filters
    wait_text All filters
    wait_eval const rail=document.querySelector('#x-nav-sidebar').getBoundingClientRect();const o=[...document.querySelectorAll('div')].find(d=>getComputedStyle(d).position==='fixed'&&getComputedStyle(d).zIndex==='2000');if(!o)return {ok:false,reason:'no overlay'};const r=o.getBoundingClientRect();const b=document.querySelector('#x-feedback-button').getBoundingClientRect();const hit=document.elementFromPoint((b.left+b.right)/2,(b.top+b.bottom)/2);return {ok:r.left>=rail.right-1&&Math.abs(r.right-innerWidth)<=1&&r.top<=1&&Math.abs(r.bottom-innerHeight)<=1&&document.querySelector('#x-nav-sidebar').contains(hit),overlay:[r.left,r.top,r.right,r.bottom],rail:rail.right};
    click_css #x-feedback-button
    wait_css #x-feedback-overlay #x-feedback-sizes
    wait_eval const img=document.querySelector('#x-feedback-image');if(!img||!img.complete||!img.naturalWidth)return {ok:false};const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;const g=c.getContext('2d');g.drawImage(img,0,0);const k=img.naturalWidth/innerWidth;const rail=document.querySelector('#x-nav-sidebar').getBoundingClientRect().right;const px=(x,y)=>[...g.getImageData(Math.round(x*k),Math.round(y*k),1,1).data].slice(0,3);const page=px(rail+12,innerHeight-12);const railPx=px(rail/2,innerHeight/2);const mean=v=>(v[0]+v[1]+v[2])/3;return {ok:mean(page)<200&&mean(railPx)<80,page,rail:railPx};
    click_text_in #x-feedback-overlay :: Cancel
