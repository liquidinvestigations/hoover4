
; A destructive kind demands its target typed out before it will re-run. The button is
; disabled until the text matches, and the server refuses a mismatched target as well.
; This capture types a wrong target, asserts the button stays disabled, types the
; matching target, asserts the button enables, and never clicks Re-run. When no errored
; destructive row exists, the scenario is incomplete_execution.
[admin-operations-destructive-confirm]
summary = Exercises confirmation and render states within one destructive operation row.
url = /admin/operations
full_page = true
actions =
    wait_css #x-ops-filter-state
    eval const el=document.querySelector('#x-ops-filter-state');const s=Object.getOwnPropertyDescriptor(window.HTMLSelectElement.prototype,'value').set;s.call(el,'errored');el.dispatchEvent(new Event('change',{bubbles:true}));return {ok:true};
    sleep 800
    wait_eval if(document.body.innerText.includes('Could not reach the server.'))throw new Error('operations request failed');return {ok:!!document.querySelector('table tbody tr')||document.body.innerText.includes('No operations recorded for this filter.')};
    wait_eval const row=[...document.querySelectorAll('tr[data-op-id]')].find(r=>r.querySelector('input[placeholder^="type "]'));if(!row)return {incomplete:true,reason:'no errored destructive row'};window.__capture_destructive_op_id=row.dataset.opId;return {ok:true,op_id:row.dataset.opId};
    eval const row=[...document.querySelectorAll('tr[data-op-id]')].find(r=>r.dataset.opId===window.__capture_destructive_op_id);const input=row?.querySelector('input[placeholder^="type "]');if(!input)throw new Error('destructive input disappeared');const set=Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype,'value').set;set.call(input,'wrong-target');input.dispatchEvent(new Event('input',{bubbles:true}));return {ok:true};
    wait_eval const row=[...document.querySelectorAll('tr[data-op-id]')].find(r=>r.dataset.opId===window.__capture_destructive_op_id);const button=[...row.querySelectorAll('button')].find(x=>x.textContent.trim()==='Re-run');return {ok:!!button&&button.disabled,wrong_target_rejected:!!button&&button.disabled};
    eval const row=[...document.querySelectorAll('tr[data-op-id]')].find(r=>r.dataset.opId===window.__capture_destructive_op_id);const input=row.querySelector('input[placeholder^="type "]');const wanted=(input.placeholder.match(/^type (.+) to confirm$/)||[])[1]||'';if(!wanted)throw new Error('confirmation target missing');const set=Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype,'value').set;set.call(input,wanted);input.dispatchEvent(new Event('input',{bubbles:true}));return {ok:true};
    wait_eval const row=[...document.querySelectorAll('tr[data-op-id]')].find(r=>r.dataset.opId===window.__capture_destructive_op_id);const button=[...row.querySelectorAll('button')].find(x=>x.textContent.trim()==='Re-run');return {ok:!!button&&!button.disabled,confirm_ready:!!button&&!button.disabled,clicked:false};
