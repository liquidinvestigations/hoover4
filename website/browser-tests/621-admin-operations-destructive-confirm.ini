
; A destructive kind demands its target typed out before it will re-run. The button is
; disabled until the text matches, and the server refuses a mismatched target as well.
; This capture types a wrong target, asserts the button stays disabled, types the
; matching target, asserts the button enables, and never clicks Re-run. When no errored
; destructive row exists, the scenario is incomplete_execution.
[admin-operations-destructive-confirm]
summary = Exercises the admin operations destructive confirm case.
url = /admin/operations
full_page = true
actions =
    wait_css #x-ops-filter-state
    eval const el=document.querySelector('#x-ops-filter-state');const s=Object.getOwnPropertyDescriptor(window.HTMLSelectElement.prototype,'value').set;s.call(el,'errored');el.dispatchEvent(new Event('change',{bubbles:true}));return {ok:true};
    wait_eval const input=document.querySelector('input[placeholder^="type "]'); if(!input) return {incomplete:true, reason:'no errored destructive row'}; return {ok:true};
    eval const input=document.querySelector('input[placeholder^="type "]'); const proto=Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype,'value').set; proto.call(input, 'wrong-target'); input.dispatchEvent(new Event('input',{bubbles:true})); const button=[...document.querySelectorAll('button')].find(x=>x.textContent.trim()==='Re-run'); if(!button||!button.disabled) throw new Error('wrong target left Re-run enabled'); return {wrong_target_rejected:true};
    eval const input=document.querySelector('input[placeholder^="type "]'); const wanted=(input.placeholder.match(/^type (.+) to confirm$/)||[])[1]||''; const proto=Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype,'value').set; proto.call(input, wanted); input.dispatchEvent(new Event('input',{bubbles:true})); const button=[...document.querySelectorAll('button')].find(x=>x.textContent.trim()==='Re-run'); if(!button||button.disabled) throw new Error('matching target did not enable Re-run'); return {confirm_ready:true, clicked:false};
