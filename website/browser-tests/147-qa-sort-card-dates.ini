; The size and date lines under the card controls follow the sort of the list. Newest
; first shows the latest date of each document, oldest first its earliest date, and a
; document with two dates shows the larger one under newest first. The controls column
; stays inside row 2 and the card stays 112px high. The query `meeting` has documents
; with two dates on the first page of both directions.
