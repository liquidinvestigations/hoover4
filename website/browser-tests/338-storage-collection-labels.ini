[storage-collection-labels]
summary = Verify collection labels remain stable during delayed storage refreshes.
requires_dataset = release_browser_primary
url = /search/pHNjb2xsZWN0aW9uX2RhdGFzZXRzgGxxdWVyeV9zdHJpbmdwYXV0b21hdGljZml4dHVyZW1mYWNldF9maWx0ZXJzoXJjb2xsZWN0aW9uX2RhdGFzZXSBoWZTdHJpbmd3cmVsZWFzZV9icm93c2VyX3ByaW1hcnltcmFuZ2VfZmlsdGVyc6A=/0/9g==/9g==
init_script = window.__nameFetch=window.fetch;window.__holdNames=true;window.fetch=function(u,o){const s=String(u&&u.url||u);const reply=window.__nameFetch.apply(this,arguments);if(s.includes('/api/list_storage_tree')&&window.__holdNames)return reply.then(r=>new Promise(resolve=>{window.__releaseNames=()=>resolve(r);}));return reply;};
actions =
    wait_eval return {ok:typeof window.__releaseNames==='function'};
    wait_css .x-result-item-card
    wait_eval return {ok:[...document.querySelectorAll('.x-document-collection-name')].every(e=>!e.textContent.trim())};
    eval window.__holdNames=false;window.__releaseNames();return {ok:true};
    wait_eval return {ok:[...document.querySelectorAll('.x-document-collection-name')].some(e=>e.textContent==='Release browser fixtures')};
    click_css .x-result-item-card
    wait_eval return {ok:[...document.querySelectorAll('.x-document-collection-name')].some(e=>!e.closest('.x-result-item-card')&&e.textContent==='Release browser fixtures')};
    eval window.__labels=[...document.querySelectorAll('.x-document-collection-name')].map(e=>e.textContent);window.__releaseNames=null;window.__holdNames=true;window.dispatchEvent(new Event('focus'));return {ok:true};
    wait_eval return {ok:typeof window.__releaseNames==='function'&&JSON.stringify(window.__labels)===JSON.stringify([...document.querySelectorAll('.x-document-collection-name')].map(e=>e.textContent))};
    eval window.__holdNames=false;window.__releaseNames();return {ok:true};
    wait_eval return {ok:JSON.stringify(window.__labels)===JSON.stringify([...document.querySelectorAll('.x-document-collection-name')].map(e=>e.textContent))};
