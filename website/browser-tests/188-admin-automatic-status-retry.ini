[admin-automatic-status-retry]
summary = Verify failed status reads remain visible and refresh loads coverage.
url = /admin/collections/release_browser/datasets/release_browser_primary
requires_dataset = release_browser_primary
init_script = window.__statusFetch=window.fetch;window.__statusFailed=false;window.fetch=function(u,o){if(String(u&&u.url||u).includes('/api/admin_get_dataset_ocr')&&!window.__statusFailed){window.__statusFailed=true;return Promise.reject(new TypeError('controlled status transport failure'));}return window.__statusFetch.apply(this,arguments);};
actions =
    wait_css .x-automatic-ocr .x-error-bar
    eval const p=document.querySelector(".x-automatic-ocr");return {ok:!p.querySelector("input,select")};
    click_css .x-automatic-ocr button
    wait_css [data-ocr-state="applied"]
    wait_eval return {ok:!document.querySelector(".x-automatic-ocr .x-error-bar")};
    eval document.querySelector(".x-automatic-ocr").scrollIntoView({block:"start"});return {ok:true};
