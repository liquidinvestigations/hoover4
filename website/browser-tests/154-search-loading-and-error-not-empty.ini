[search-loading-and-error-not-empty]
summary = Verifies that a pending search shows loading and a failed search shows the failure, and that neither shows the empty-result view.
requires_dataset = testdata_testfiles
url = /search/o3Njb2xsZWN0aW9uX2RhdGFzZXRzgGxxdWVyeV9zdHJpbmdpZWFzeWNoYWlybWZhY2V0X2ZpbHRlcnOg/0/9g==/9g==
actions =
    wait_text documents found
    eval window.__hold=true;window.__fail=false;window.__originalFetch=window.fetch;window.fetch=async function(input,init){const url=String(input instanceof Request?input.url:input);if(url.includes('search_for_results')){while(window.__hold)await new Promise(r=>setTimeout(r,100));if(window.__fail)throw new TypeError('Injected search failure');}return window.__originalFetch.call(this,input,init);};return {ok:true};
    type_css #x-search-input-search-box input :: zzxqvtrplmx
    press_enter #x-search-input-search-box input
    wait_eval const p=document.querySelector('#x-search-results-left-panel');return {ok:location.pathname.split('/')[2]!=='o3Njb2xsZWN0aW9uX2RhdGFzZXRzgGxxdWVyeV9zdHJpbmdpZWFzeWNoYWlybWZhY2V0X2ZpbHRlcnOg'&&!!p&&p.innerText.includes('Loading...')&&!document.querySelector('.x-empty-search-results')&&!document.querySelector('#x-search-failed')};
    sleep 1500
    wait_eval const p=document.querySelector('#x-search-results-left-panel');return {ok:p.innerText.includes('Loading...')&&!document.querySelector('.x-empty-search-results')};
    eval window.__fail=true;window.__hold=false;return {ok:true};
    wait_css #x-search-failed
    wait_eval return {ok:!document.querySelector('.x-empty-search-results')};
    eval window.__fail=false;return {ok:true};
    click_text_in #x-search-failed :: Retry
    wait_css #x-search-no-results
    wait_eval return {ok:!document.querySelector('#x-search-failed')};
    eval window.fetch=window.__originalFetch;return {ok:true};
