; ---------------------------------------------------------------- chat

[ai-chat-kept-captures]
summary = Shows two page screenshots kept only for the person and one screenshot sent to the model, with the same artifacts after a reload.
url = /ai_chat/c/{{chat_fixture:captures}}/9g==/9g==
actions =
    wait_css [data-chat-answer]
    eval document.querySelectorAll('.x-chat-tool-run-toggle').forEach(button=>{if(button.innerText.includes('Show'))button.click()});return {ok:true};
    wait_eval const imgs=[...document.querySelectorAll('.x-tool-images img')];const srcs=imgs.map(i=>i.getAttribute('src'));const sent=imgs.filter(i=>i.alt.endsWith(' that the model received'));const kept=imgs.filter(i=>!i.alt.endsWith(' that the model received'));const loaded=imgs.every(i=>i.complete&&i.naturalWidth===320&&i.naturalHeight===180);const pinned=srcs.every(s=>/^\/_chat_artifact\/[0-9a-f-]{36}\/thumb\.webp$/.test(s))&&new Set(srcs).size===3;const before=sessionStorage.getItem('h4-kept-captures');const same=(sessionStorage.setItem('h4-kept-captures',JSON.stringify(srcs)),sessionStorage.setItem('h4-kept-origin',String(performance.timeOrigin)),true);return {ok:imgs.length===3&&kept.length===2&&sent.length===1&&loaded&&pinned&&same&&kept.every(i=>/^Screenshot of Captured source [12] /.test(i.alt))&&/^Screenshot of Captured source 3 /.test(sent[0].alt),srcs,alts:imgs.map(i=>i.alt),before,loaded,pinned};
    eval location.reload();return {ok:true};
    wait_css [data-chat-answer]
    eval document.querySelectorAll('.x-chat-tool-run-toggle').forEach(button=>{if(button.innerText.includes('Show'))button.click()});return {ok:true};
    wait_eval const imgs=[...document.querySelectorAll('.x-tool-images img')];const srcs=imgs.map(i=>i.getAttribute('src'));const sent=imgs.filter(i=>i.alt.endsWith(' that the model received'));const kept=imgs.filter(i=>!i.alt.endsWith(' that the model received'));const loaded=imgs.every(i=>i.complete&&i.naturalWidth===320&&i.naturalHeight===180);const pinned=srcs.every(s=>/^\/_chat_artifact\/[0-9a-f-]{36}\/thumb\.webp$/.test(s))&&new Set(srcs).size===3;const before=sessionStorage.getItem('h4-kept-captures');const same=before===JSON.stringify(srcs)&&sessionStorage.getItem('h4-kept-origin')!==String(performance.timeOrigin);return {ok:imgs.length===3&&kept.length===2&&sent.length===1&&loaded&&pinned&&same&&kept.every(i=>/^Screenshot of Captured source [12] /.test(i.alt))&&/^Screenshot of Captured source 3 /.test(sent[0].alt),srcs,alts:imgs.map(i=>i.alt),before,loaded,pinned};
    eval sessionStorage.removeItem('h4-kept-captures');sessionStorage.removeItem('h4-kept-origin');return {ok:true};
