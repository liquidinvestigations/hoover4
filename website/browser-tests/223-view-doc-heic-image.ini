; A HEIC image probes as a one-frame video with no duration. The page lists only the image
; source and shows no source error. The browser has no HEIC decoder, so the viewer shows a
; note with a download link. The rail hints sit level with their icons, outside the rail.
[view-doc-heic-image]
summary = Opens a HEIC image without a source error and checks the rail hints beside their icons.
requires_dataset = testdata_diskfiles
