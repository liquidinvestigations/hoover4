actions =
    wait_css #x-image-preview-failed
    wait_eval const t=document.body.innerText;return {ok:!document.querySelector('#x-source-load-notice')&&!t.includes('Video')&&document.querySelector('#x-image-preview-failed a[download]')!==null};
    hover_css #x-nav-sidebar a[href="/ai_chat"]
    eval const c=[...document.querySelectorAll('.x-rail-hint')].find(e=>e.getBoundingClientRect().height>0);const i=document.querySelector('#x-nav-sidebar a[href="/ai_chat"] svg').getBoundingClientRect();const s=document.querySelector('#x-nav-sidebar').getBoundingClientRect();const r=c?c.getBoundingClientRect():null;return {ok:true,card:r&&[r.left,r.top,r.width,r.height],icon:[i.left,i.top,i.width,i.height],rail_right:s.right,text:c&&c.innerText};
    wait_eval const c=[...document.querySelectorAll('.x-rail-hint')].find(e=>e.getBoundingClientRect().height>0);if(!c)return {ok:false};const r=c.closest('.hover-card-content').getBoundingClientRect();const i=document.querySelector('#x-nav-sidebar a[href="/ai_chat"] svg').getBoundingClientRect();const s=document.querySelector('#x-nav-sidebar').getBoundingClientRect();const dc=Math.abs((r.top+r.bottom)/2-(i.top+i.bottom)/2);const st=getComputedStyle(c);return {ok:c.innerText==='AI Chat'&&dc<=1&&r.height<=34&&r.left>=s.right&&r.left<=s.right+12&&st.backgroundColor==='rgb(255, 255, 255)'&&st.fontSize==='15px',dc,h:r.height,left:r.left,rail:s.right,bg:st.backgroundColor,fs:st.fontSize};
    hover_css #x-feedback-button
    wait_eval const c=[...document.querySelectorAll('.x-rail-hint')].find(e=>e.getBoundingClientRect().height>0&&e.innerText.includes('Bug'));if(!c)return {ok:false};const r=c.closest('.hover-card-content').getBoundingClientRect();const i=document.querySelector('#x-feedback-button svg').getBoundingClientRect();const dc=Math.abs((r.top+r.bottom)/2-(i.top+i.bottom)/2);return {ok:c.innerText==='Bug Report & Feedback Form'&&dc<=1,dc};
