; ---------------------------------------------------------------- chat

[ai-chat-todo-history]
summary = Checks that the reported todo sequence, an identical write, a refused mark, a replacement and an unstored version give four summaries and nine call cards.
url = /ai_chat/c/{{chat_fixture:todo_history}}/9g==/9g==
actions =
    wait_css [data-todo-change="true"] .x-chat-todo-list
    wait_eval const versions=[...document.querySelectorAll('[data-todo-change="true"]')].map(e=>e.getAttribute('data-todo-version'));return {ok:JSON.stringify(versions)==='["1","3","5","6"]',versions};
    wait_eval const card=document.querySelector('[data-todo-version="5"] .x-chat-todo-list');const ids=[...card.querySelectorAll('li')].map(li=>li.getAttribute('data-todo-item'));const old=card.querySelector('li[data-todo-item="1"]');return {ok:JSON.stringify(ids)==='["1","4","2","3"]'&&!!old.querySelector('s')&&old.querySelector('strong')?.innerText==='replaced by a',ids};
    wait_eval const reason=document.querySelector('[data-todo-version="6"] li[data-todo-item="4"] strong');return {ok:reason?.innerText==='found the conversion'&&reason.title==='found the conversion in the unit table of the sample document',reason:reason?.innerText};
    wait_eval const cards=[...document.querySelectorAll('.x-chat-todo-list')];return {ok:cards.every(card=>card.scrollWidth<=card.clientWidth+1&&card.getBoundingClientRect().width<=card.parentElement.getBoundingClientRect().width*0.8+1)};
    eval document.querySelectorAll('.x-chat-tool-run-toggle').forEach(button=>{if(button.innerText.includes('Show'))button.click()});return {ok:true};
    wait_eval const calls=[...document.querySelectorAll('[data-todo-call="true"] [data-card-chip="Todo"]')];return {ok:calls.length===9&&calls.every(call=>!!call.closest('.x-chat-tool-run')),count:calls.length};
    wait_eval const calls=[...document.querySelectorAll('[data-todo-call="true"] [data-card-chip="Todo"]')];return {ok:calls[4].innerText.includes('unchanged')&&calls[5].innerText.includes('failed')&&calls[8].innerText.includes('version 7'),labels:calls.map(call=>call.innerText.split('\n')[0])};
    eval const card=document.querySelectorAll('[data-todo-call="true"] [data-card-chip="Todo"]')[6];[...card.querySelectorAll('button')].find(button=>button.innerText==='Expand')?.click();return {ok:true};
    wait_eval const card=document.querySelectorAll('[data-todo-call="true"] [data-card-chip="Todo"]')[6];return {ok:card.innerText.includes('"replacements"')&&card.innerText.includes('replaces 1'),text:card.innerText.slice(0,400)};
    wait_eval const reasoning=[...document.querySelectorAll('.x-chat-reasoning')];return {ok:reasoning.length===1&&!!reasoning[0].closest('.x-chat-tool-run'),count:reasoning.length};
