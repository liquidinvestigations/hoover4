[admin-automatic-create]
summary = Verify automatic creation sends no manual OCR fields and reaches its server endpoint.
url = /admin/collections/release_browser
requires_dataset = release_browser_primary
init_script = window.__createFetch=window.fetch;window.fetch=function(u,o){if(String(u&&u.url||u).includes('/api/admin_create_dataset_automatic')){const request=new Request(u,o);return request.clone().json().then(body=>{window.__automaticCreateBody=body;body.mount_name='missing_fixture_mount';return window.__createFetch(new Request(request,{body:JSON.stringify(body)})).then(r=>{window.__automaticCreateStatus=r.status;return r;});});}return window.__createFetch.apply(this,arguments);};
expect = error_bar
actions =
    wait_css .x-automatic-ocr-policy
    eval const p=document.querySelector(".x-automatic-ocr-policy").closest(".x-admin-module");window.__createPanel=p;return {ok:!p.querySelector(".x-language-filter")&&![...p.querySelectorAll("label")].some(e=>/Tesseract|EasyOCR/.test(e.innerText))};
    wait_eval return {ok:[...window.__createPanel.querySelectorAll("select option")].some(o=>o.value==="automatic-create")};
    eval const select=[...window.__createPanel.querySelectorAll("select")].find(s=>[...s.options].some(o=>o.value==="automatic-create"));Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,"value").set.call(select,"automatic-create");select.dispatchEvent(new Event("change",{bubbles:true}));return {ok:true};
    wait_eval const b=[...window.__createPanel.querySelectorAll("button")].find(e=>e.innerText==="Create and ingest");return {ok:!!b&&!b.disabled};
    click_text_in .x-admin-module:has(.x-automatic-ocr-policy) :: Create and ingest
    wait_eval const b=window.__automaticCreateBody;return {ok:!!b&&window.__automaticCreateStatus!==undefined&&!Object.keys(b).some(k=>/ocr|tesseract|language|inherit/.test(k)),fields:b?Object.keys(b):[],status:window.__automaticCreateStatus};
    wait_css .x-admin-module:has(.x-automatic-ocr-policy) .x-error-bar
    eval window.__createPanel.scrollIntoView({block:"start"});return {ok:window.__automaticCreateStatus!==404};
