[search-first-paint-styles]
summary = Records stylesheet insertion, layout shifts and font loads on a cold-cache search page, and opens a result.
requires_dataset = testdata_testfiles
url = /search/o3Njb2xsZWN0aW9uX2RhdGFzZXRzgGxxdWVyeV9zdHJpbmdpZWFzeWNoYWlybWZhY2V0X2ZpbHRlcnOg/0/9g==/9g==
cold_cache = true
init_script = window.__qaPaint={sheets:[],shifts:[],paint:{},fonts:[]};new PerformanceObserver(l=>{for(const e of l.getEntries())window.__qaPaint.paint[e.name]=Math.round(e.startTime);}).observe({type:'paint',buffered:true});new PerformanceObserver(l=>{for(const e of l.getEntries())window.__qaPaint.shifts.push({t:Math.round(e.startTime),v:e.value,input:e.hadRecentInput,nodes:(e.sources||[]).map(s=>s.node?(s.node.nodeName+'.'+String(s.node.className||'').slice(0,30)):'')});}).observe({type:'layout-shift',buffered:true});new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes){if(n.nodeType!==1)continue;const sheet=(n.tagName==='LINK'&&/stylesheet/i.test(n.rel))||n.tagName==='STYLE';if(sheet)window.__qaPaint.sheets.push({t:Math.round(performance.now()),tag:n.tagName,href:(n.getAttribute('href')||'').split('/').pop(),state:document.readyState});}}).observe(document,{childList:true,subtree:true});document.fonts.addEventListener('loadingdone',e=>{for(const f of e.fontfaces)window.__qaPaint.fonts.push({t:Math.round(performance.now()),family:f.family,style:f.style,range:f.unicodeRange.slice(0,14)});});
actions =
    wait_text documents found
    eval const c=document.querySelector('.x-result-item-card');if(!c)throw Error('result card unavailable');c.click();return {ok:true};
    wait_css #x-search-results-right-panel
    sleep 3000
    eval const w=window.__qaPaint;const fp=w.paint['first-paint']??w.paint['first-contentful-paint'];const late=w.sheets.filter(s=>fp!==undefined&&s.t>fp);const preloads=[...document.querySelectorAll('link[rel=preload][as=font]')].map(l=>l.href);const res=performance.getEntriesByType('resource').filter(e=>e.name.endsWith('.woff2')).map(e=>({file:e.name.split('/').pop(),initiator:e.initiatorType,start:Math.round(e.startTime),end:Math.round(e.responseEnd),bytes:e.transferSize}));const preloadUse=preloads.map(h=>{const f=h.split('/').pop();const fetches=res.filter(r=>r.file===f);return {file:f,fetches:fetches.length,initiators:fetches.map(r=>r.initiator)};});const sheetsNow=[...document.querySelectorAll('link[rel=stylesheet]')].map(l=>l.getAttribute('href').split('/').pop());const result={paint:w.paint,sheetsInserted:w.sheets,lateSheets:late,sheetsNow,shifts:w.shifts,cls:w.shifts.filter(s=>!s.input).reduce((a,s)=>a+s.v,0),fonts:w.fonts,fontFiles:res,preloadUse};if(fp===undefined)throw Error('no paint entry '+JSON.stringify(result));if(late.length)throw Error('stylesheet added after first paint '+JSON.stringify(result));if(preloadUse.some(p=>p.fetches!==1))throw Error('preloaded font fetched other than once '+JSON.stringify(result));return result;
