; ---------------------------------------------------------------- chat

[ai-chat-plan-executing]
summary = Approves the current plan version of the newest conversation and shows the card while the organizer runs it, with its sections and the live sub-agent runs of the current batch.
url = /ai_chat/history
actions =
    wait_css a[href^="/ai_chat/c/"]
    click_css a[href^="/ai_chat/c/"]
    wait_css [data-plan-state="awaiting_review"] [data-plan-action="approve"]
    click_css [data-plan-state="awaiting_review"] [data-plan-action="approve"]
    wait_css [data-plan-state="executing"]
    sleep 6000
