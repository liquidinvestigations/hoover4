[manual-doc-terms]
summary = Verifies category definitions, scoring rules, page scrolling, and expandable terms.
url = /red_flag_terms
procedure = signal-terms-scroll
actions =
	wait_text Red flag terms
	wait_eval const main=document.querySelector('main.x-signal-terms');const heading=main?.querySelector('h1');return {ok:!!heading&&parseFloat(getComputedStyle(heading).fontSize)>parseFloat(getComputedStyle(main).fontSize)&&getComputedStyle(main).overflowY==='auto'};
	wait_eval const main=document.querySelector('main.x-signal-terms');const categories=[...main.querySelectorAll('section[id]')];return {ok:categories.length===26&&!main.querySelector('[role="note"]')&&!/does not|without a flag|low recall|not prove/i.test(main.innerText)&&categories.every(e=>e.innerText.includes('8 points')&&e.innerText.includes('2 distinct concepts')&&[...e.querySelectorAll('code')].map(x=>x.textContent).join('|')==='L = 1|M = 3|H = 6'),categories:categories.length};
	click_css #bribery details summary
	wait_eval const rows=[...document.querySelectorAll('#bribery details[open] tbody tr')];return {ok:rows.length>0&&rows.every(row=>row.cells.length===5&&row.cells[1].textContent.match(/^[LMH]$/)),rows:rows.length};
manual_asset = red-flag-terms.png
