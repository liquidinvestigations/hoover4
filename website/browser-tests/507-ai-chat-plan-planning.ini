; ---------------------------------------------------------------- chat

[ai-chat-plan-planning]
summary = Starts a deep-research request without internet tools and shows the plan card while the planner writes the plan.
url = /ai_chat
actions =
    wait_css textarea
    click_text Deep Research
    click_text Internet tools
    type_css textarea :: Compare the two collections other and testdata. Plan one section for each collection that says which kinds of documents it holds, with two tasks in each section.
    press_enter
    wait_css [data-plan-state="planning"]
    sleep 8000
