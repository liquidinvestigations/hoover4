
; The column controls are table-level modals. Each case names one contract that the
; screenshot harness can retain with the rendered grid.
[qa-table-modal-geometry]
summary = Exercises the qa table modal geometry case.
requires_dataset = testdata_excelsc
url = /view_document/onJjb2xsZWN0aW9uX2RhdGFzZXRwdGVzdGRhdGFfZXhjZWxzY2lmaWxlX2hhc2h4QGY5NzUxZThjMjkwNzk5YmU5ZmQ0M2Y1NTQ5OTdhYzJlYWUyZDEwMThlYjc0MTUzODg2ZWZlNjM1NWNmY2EwZmU=/9g==/oWxzZWxlY3RlZF90YWJoRW50aXRpZXM=
actions =
    sleep 4000
    wait_text Order ID
    pointer_click_css thead th:nth-child(3) button[aria-label^="Filter "]
    wait_css [role="dialog"][aria-modal="true"]
    eval const dialog=document.querySelector('[role="dialog"][aria-modal="true"]');const box=dialog.getBoundingClientRect();const cx=(box.left+box.right)/2;const cy=(box.top+box.bottom)/2;if(box.left<0||box.top<0||box.right>innerWidth||box.bottom>innerHeight||Math.abs(cx-innerWidth/2)>3||Math.abs(cy-innerHeight/2)>3)throw new Error('table modal geometry');return {label:dialog.getAttribute('aria-label'),box:[box.left,box.top,box.right,box.bottom]};
