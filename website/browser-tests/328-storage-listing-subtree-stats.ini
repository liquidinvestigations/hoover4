; The folder listing has a Files column before Size. A folder shows its file count and
; size, a container its member count and its own size, a plain file 0.
[storage-listing-subtree-stats]
summary = Shows the Files and Size columns of a folder listing with folders and archives.
requires_dataset = testdata_diskfiles
url = /file_browser/testdata_diskfiles/om5jb250YWluZXJfaGFzaGBkcGF0aGkvYXJjaGl2ZXM=/9g==/9g==
actions =
    wait_text Files
    sleep 1800
