; The folder listing has a Files column before Size. A folder shows its file count and
; size, a container its member count and its own size, a plain file 0. The storage
; sidebar on the same page shows neither value.
[storage-listing-subtree-stats]
summary = Shows the Files and Size columns of a folder listing with folders and archives.
requires_dataset = testdata_manualqa
url = /file_browser/testdata_manualqa/om5jb250YWluZXJfaGFzaGBkcGF0aGEv/9g==/9g==
actions =
    wait_eval const heads=[...document.querySelectorAll('th')].map(t=>t.innerText.trim());const i=heads.indexOf('Files');const row=[...document.querySelectorAll('tr')].find(r=>r.innerText.includes('archives'));const cells=row?[...row.querySelectorAll('td')].map(c=>c.innerText.trim()):[];return {ok:i>=0&&heads[i+1]==='Size'&&!!row&&/^[0-9]+$/.test(cells[2]||'')&&(cells[3]||'').length>0&&!document.querySelector('#x-storage-tree .x-subtree-size'),heads,cells};
    sleep 1500
