; The bug control draws the page image on a PDF document. The overlay shows the image
; and names the parts of the page that the image can show differently.
[view-doc-pdf-feedback-capture]
summary = Opens the report overlay on a PDF document and shows the drawn image with its notes.
requires_dataset = testdata_testfiles
url = /view_document/onJjb2xsZWN0aW9uX2RhdGFzZXRydGVzdGRhdGFfdGVzdGZpbGVzaWZpbGVfaGFzaHhAZDIxY2NmZjViMTZmMTVlOTkxNDhiYzNmYWFhMmEyOTc1YjA3MWExOGZiZDE1NjJjOWE0MjljNjM0YWQzYWVlMw==/9g==/oWxzZWxlY3RlZF90YWJoRW50aXRpZXM=
actions =
    wait_css #x-feedback-button
    wait_css #x-pdf-viewer
    sleep 4
    click_css #x-feedback-button
    wait_css #x-feedback-overlay #x-feedback-sizes
    wait_eval const img=document.querySelector('#x-feedback-image');const notes=[...document.querySelectorAll('.x-feedback-note')].map(n=>n.innerText);return {ok:!!img&&img.complete&&img.naturalWidth>0,notes,width:img&&img.naturalWidth};
