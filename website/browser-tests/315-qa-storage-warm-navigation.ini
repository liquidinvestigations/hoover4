
[qa-storage-warm-navigation]
summary = Exercises the qa storage warm navigation case.
requires_dataset = testdata_zips
init_script = window.__qa_cache_now=1000; performance.now=()=>window.__qa_cache_now;
url = /file_browser/testdata_zips/om5jb250YWluZXJfaGFzaGBkcGF0aGsvbG9jYXRpb24tMQ==/9g==/9g==
actions =
    wait_text parent.zip
    eval if(performance.now()!==1000)throw Error('the controlled browser clock is unavailable');return {clock:performance.now()};
    wait_css #x-storage-tree [data-node-key][title="/location-1"]
    eval const ancestor = document.querySelector('#x-storage-tree [data-node-key][title="/location-1"]'); window.__qa_storage_ancestor = ancestor; window.__qa_storage_removed = false; window.__qa_storage_before_calls = performance.getEntriesByType('resource').filter(e => e.name.includes('/api/vfs_tree_')).length; window.__qa_storage_observer=new MutationObserver(records => { for (const record of records) { for (const node of record.removedNodes) { if (node === ancestor || node.contains?.(ancestor)) window.__qa_storage_removed = true; } } }); window.__qa_storage_observer.observe(document.querySelector('#x-storage-tree'), {childList: true, subtree: true}); return {ok: true};
    click_text_in #x-storage-tree :: parent.zip
    wait_eval return location.pathname.includes('/file_browser/testdata_zips/') && location.pathname !== '/file_browser/testdata_zips/om5jb250YWluZXJfaGFzaGBkcGF0aGsvbG9jYXRpb24tMQ==/9g==/9g==';
    wait_css #x-storage-tree [aria-current="location"][title="/location-1/parent.zip"]
    wait_css #x-storage-tree [data-node-key][title="/parent"]
    eval window.__qa_storage_observer.disconnect(); const calls=performance.getEntriesByType('resource').filter(e => e.name.includes('/api/vfs_tree_')).length-window.__qa_storage_before_calls; if(!document.body.contains(window.__qa_storage_ancestor)||window.__qa_storage_removed) throw new Error('the archive ancestor was removed'); if(calls>3) throw new Error('archive navigation repeated tree requests: '+calls); return {ok:true,calls};
    eval window.__qa_storage_return_start=performance.getEntriesByType('resource').filter(e=>e.name.includes('/api/vfs_tree_')).length; return {ok:true};
    history_back
    wait_css #x-storage-tree [aria-current="location"][title="/location-1"]
    eval const calls=performance.getEntriesByType('resource').filter(e=>e.name.includes('/api/vfs_tree_')).length-window.__qa_storage_return_start; if(calls!==0) throw new Error('fresh return repeated tree requests: '+calls); return {ok:true,phase:'fresh-return',calls};
    history_forward
    wait_css #x-storage-tree [aria-current="location"][title="/location-1/parent.zip"]
    wait_css #x-storage-tree [data-node-key][title="/parent"]
    eval const calls=performance.getEntriesByType('resource').filter(e=>e.name.includes('/api/vfs_tree_')).length-window.__qa_storage_return_start; if(calls!==0) throw new Error('fresh forward repeated tree requests: '+calls); window.__qa_storage_expiry_start=performance.now(); return {ok:true,phase:'fresh-forward',calls};
    eval window.__qa_cache_now+=6000; return {clock:window.__qa_cache_now};
    history_back
    wait_css #x-storage-tree [aria-current="location"][title="/location-1"]
    wait_eval const calls=performance.getEntriesByType('resource').filter(e=>e.name.includes('/api/vfs_tree_')).length-window.__qa_storage_return_start; return {ok:calls>0,calls};
    eval if(!document.body.contains(window.__qa_storage_ancestor)) throw new Error('expiry refresh removed the archive ancestor'); return {ok:true,phase:'expired-return',ancestor_retained:true,calls:performance.getEntriesByType('resource').filter(e=>e.name.includes('/api/vfs_tree_')).length-window.__qa_storage_return_start};
