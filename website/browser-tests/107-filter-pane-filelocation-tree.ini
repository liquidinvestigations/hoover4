
; The picker is the SAME tree as the storage sidebar: collections > datasets > folders,
; every level tickable, nothing to choose under Collections first. Expanding a dataset is
; the disclosure button, not the row -- the row ticks it.
[filter-pane-filelocation-tree]
summary = Exercises the filter pane filelocation tree case.
requires_dataset = testdata_shapes
url = /search/o3Njb2xsZWN0aW9uX2RhdGFzZXRzgGxxdWVyeV9zdHJpbmdgbWZhY2V0X2ZpbHRlcnOg/0/9g==/9g==
actions =
    sleep 1500
    click_css #x-search-open-filters
    wait_text All filters
    click_text File location
    wait_text Filtering on a folder
    sleep 1200
    click_css #x-tree-d-testdata_shapes
    sleep 1500
    click_text_in #x-filter-modal :: the-directory
    sleep 1200
