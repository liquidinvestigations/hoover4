[home-release-rail-layout]
summary = Verify full rail height, language-control spacing, and horizontal scrolling.
url = /
actions =
    wait_eval const rail=document.querySelector("#x-nav-sidebar"),link=rail.querySelector('a[href="/settings/language"]');const r=rail.getBoundingClientRect(),b=link.getBoundingClientRect();return {ok:Math.abs(r.bottom-innerHeight)<=1&&innerHeight-b.bottom>=10&&document.documentElement.scrollWidth<=innerWidth,bottom:r.bottom,gap:innerHeight-b.bottom,width:document.documentElement.scrollWidth,viewport:innerWidth};
