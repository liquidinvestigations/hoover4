[search-typo-suggestions]
summary = Verifies a checked spelling query and opens it.
url = /search/o3Njb2xsZWN0aW9uX2RhdGFzZXRzgGxxdWVyeV9zdHJpbmdoZG9jdW1lbXRtZmFjZXRfZmlsdGVyc6A=/0/9g==/9g==
actions =
    wait_css #x-search-no-results
    wait_css .x-search-suggestion
    wait_eval const panel=document.querySelector('#x-search-results-scroll');const left=document.querySelector('#x-search-results-left-panel');return {ok:!!panel&&panel.scrollHeight<=panel.clientHeight+1&&left.scrollHeight<=left.clientHeight+1&&document.querySelector('#x-search-panel-results-wrapper').getBoundingClientRect().height===0};
    wait_eval return {ok:[...document.querySelectorAll('.x-search-suggestion')].some(e=>e.innerText.startsWith('document ('))};
    click_css .x-search-suggestion
    wait_eval return {ok:!document.querySelector('#x-search-no-results')};
