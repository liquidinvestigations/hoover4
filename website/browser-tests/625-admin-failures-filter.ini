
; Dataset filter reduces each group's count. Unfiltered rows show 2 operations.
[admin-failures-filter]
summary = Exercises one filter on the admin failures list.
url = /admin/failures
full_page = true
actions =
    wait_css #x-failures-filter-dataset
    eval const el=document.querySelector('#x-failures-filter-dataset');const s=Object.getOwnPropertyDescriptor(window.HTMLSelectElement.prototype,'value').set;s.call(el,'failcap_tiny3');el.dispatchEvent(new Event('change',{bubbles:true}));return {ok:true};
    wait_text 1 operation
    sleep 800
