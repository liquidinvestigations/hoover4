
; Choosing a collection filters the list AND brings up that collection's failure rate by
; task type, which is the panel this whole page exists for.
[admin-operations-collection-testdata]
summary = Exercises the admin operations collection testdata case.
url = /admin/operations
full_page = true
actions =
    wait_css #x-ops-filter-state
    eval const el=document.querySelector('#x-ops-filter-collection');const s=Object.getOwnPropertyDescriptor(window.HTMLSelectElement.prototype,'value').set;s.call(el,'testdata');el.dispatchEvent(new Event('change',{bubbles:true}));return {ok:true};
    wait_text task type(s) failing above
    sleep 2000
