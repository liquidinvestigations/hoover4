[ai-chat-web-source-versions]
summary = The case verifies linked fallback titles and selection across captured source versions.
url = /ai_chat/c/{{chat_fixture:web_versions}}/9g==/9g==
actions =
    wait_css [data-chat-answer] [data-web-citation]
    wait_eval const cards=[...document.querySelectorAll('[data-web-citation]')];const card=cards.find(card=>card.dataset.webCitation==='[W1]');return {ok:cards.length===2&&card?.querySelector('a')?.innerText==='https://example.org/source-1'&&card.querySelectorAll('[role="button"]').length===3};
    eval document.querySelectorAll('[data-web-citation="[W1]"] [role="button"]')[1].click();return {ok:true};
    wait_css #web-page-preview-text
    wait_eval return {ok:document.querySelector('[data-web-preview] input')?.value==='source text'&&document.querySelector('#web-page-find-count')?.innerText==='1/40'};
    type_css [data-web-preview] input :: Paragraph 39 contains source text.
    wait_eval const root=document.querySelector('#web-page-preview-text');const range=[...(CSS.highlights.get('web-page-current')||[])][0];const rect=range?.getBoundingClientRect();const bounds=root.getBoundingClientRect();return {ok:document.querySelector('#web-page-find-count')?.innerText==='1/1'&&!!rect&&range.toString()==='Paragraph 39 contains source text.'&&rect.top>=bounds.top&&rect.bottom<=bounds.bottom};
    eval document.querySelectorAll('[data-web-citation="[W1]"] [role="button"]')[2].click();return {ok:true};
    wait_eval return {ok:document.querySelector('[data-web-preview]')?.innerText.includes('Captured source 2')&&document.querySelector('[data-web-citation="[W1]"]')?.dataset.selected==='true'&&document.querySelectorAll('[data-web-citation]').length===2&&document.querySelector('#web-page-find-count')?.innerText==='1/2'};
    click_css [data-chat-answer] em button
    wait_eval return {ok:document.querySelector('[data-web-citation="[W1]"]')?.dataset.selected==='true'&&document.querySelectorAll('[data-web-citation]').length===2};
