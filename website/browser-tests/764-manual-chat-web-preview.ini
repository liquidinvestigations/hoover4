[manual-chat-web-preview]
summary = Opens a captured web citation beside its conversation.
url = /ai_chat/c/558515d63e22beccc197f9dafd1323c7edbb4859502996866f9a194886782c85/9g==/9g==
manual_asset = chat-web-preview.png
actions =
	wait_css [data-chat-composer]
