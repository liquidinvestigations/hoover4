	eval const b=[...document.querySelectorAll("button[title=\"Show the cited source\"]")].find(b=>b.innerText.startsWith("[W"));if(!b)throw new Error("Web citation missing");b.scrollIntoView({block:"center"});b.click();return {ok:true};
	wait_css [data-web-preview]
