    eval window.__h4_fetch=window.__h4_fetch||window.fetch;window.__h4_calls=0;window.fetch=function(u,o){const s=String(u&&u.url||u);if(s.includes('/api/get_text_page_view')){const n=++window.__h4_calls;const d=n===1?4000:800;return new Promise(r=>setTimeout(r,d)).then(()=>window.__h4_fetch(u,o));}return window.__h4_fetch.apply(this,arguments)};return {ok:true};
