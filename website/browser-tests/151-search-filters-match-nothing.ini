[search-filters-match-nothing]
summary = Verifies the empty state of a query without words whose filter matches nothing, and that Clear filters keeps the sort.
requires_dataset = any
url = /search/pHNjb2xsZWN0aW9uX2RhdGFzZXRzgGxxdWVyeV9zdHJpbmdgbWZhY2V0X2ZpbHRlcnOhamZpbGVfcGF0aHOBoWNJbnQBZHNvcnSiY2tleWREYXRlZGRlc2P1/0/9g==/9g==
actions =
    wait_css #x-search-no-filter-results
    wait_eval return document.querySelector('#x-search-no-filter-results').innerText.includes('No document matches the selected filters.');
    click_css #x-search-clear-filters
    wait_eval return !location.pathname.includes('pHNjb2xsZWN0aW9uX2RhdGFzZXRzgGxxdWVyeV9zdHJpbmdgbWZhY2V0X2ZpbHRlcnOhamZpbGVfcGF0aHOBoWNJbnQBZHNvcnSiY2tleWREYXRlZGRlc2P1');
    wait_eval return !document.querySelector('.x-empty-search-results') && document.querySelectorAll('#x-search-panel-results-wrapper li').length > 0;
