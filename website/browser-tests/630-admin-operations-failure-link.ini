
; Operations outcome links through to the captured tree when rows exist.
[admin-operations-failure-link]
summary = Exercises the operations-page link into a captured failure tree.
url = /admin/operations
full_page = true
actions =
    wait_css #x-ops-filter-collection
    eval const el=document.querySelector('#x-ops-filter-collection');const s=Object.getOwnPropertyDescriptor(window.HTMLSelectElement.prototype,'value').set;s.call(el,'failcap');el.dispatchEvent(new Event('change',{bubbles:true}));return {ok:true};
    wait_css .x-ops-failure-link
    click_css .x-ops-failure-link
    wait_css #x-failures-tree
    sleep 800
