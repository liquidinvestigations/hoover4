[search-count-failure-retry]
summary = Verifies that a failed hit count hides results and offers Retry.
url = /search/o3Njb2xsZWN0aW9uX2RhdGFzZXRzgGxxdWVyeV9zdHJpbmdpZWFzeWNoYWlybWZhY2V0X2ZpbHRlcnOg/0/9g==/9g==
actions =
    wait_text documents found
    eval window.__countFailure=true;window.__countCalls=0;window.__resultCalls=0;window.__originalFetch=window.fetch;window.fetch=async function(input,init){const url=String(input instanceof Request?input.url:input);if(url.includes('search_for_results_hit_count')){window.__countCalls++;if(window.__countFailure)throw new TypeError('Injected count failure');}else if(url.includes('search_for_results'))window.__resultCalls++;return window.__originalFetch.call(this,input,init);};return {ok:true};
    type_css #x-search-input-search-box input :: document
    press_enter #x-search-input-search-box input
    wait_css #x-search-failed
    wait_eval return {ok:window.__countCalls>0&&window.__resultCalls>0&&!document.querySelector('#x-search-panel-results-wrapper')};
    eval window.__countFailure=false;window.__beforeRetry=window.__countCalls;return {ok:true};
    click_text_in #x-search-failed :: Retry
    wait_text documents found
    wait_eval return {ok:window.__countCalls>window.__beforeRetry&&!document.querySelector('#x-search-failed')&&!!document.querySelector('#x-search-panel-results-wrapper')};
    eval window.fetch=window.__originalFetch;return {ok:true};
