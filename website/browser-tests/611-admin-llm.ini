
[admin-llm]
summary = Exercises the admin llm page and runs each of its five reports.
url = /admin/llm
manual_asset = admin-llm.png
full_page = true
actions =
    wait_css #x-llm-report-errors-run
    click_css #x-llm-report-errors-run
    wait_css #x-llm-report-errors-result
    click_css #x-llm-report-log-run
    wait_css #x-llm-report-log-result
    click_css #x-llm-report-tools-run
    wait_css #x-llm-report-tools-result
    click_css #x-llm-report-users-run
    wait_css #x-llm-report-users-result
    click_css #x-admin-llm-run-systemone
    wait_css #x-admin-llm-systemone
    click_text Recent failures
    wait_css #x-admin-llm-systemone-failures
    sleep 800
