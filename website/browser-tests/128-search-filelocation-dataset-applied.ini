
; And applied: one chip, and a result list narrowed to that dataset. The chip names the
; dataset — a `file_paths` value is a `vfs_node` TERM ID, and a dataset root's node key
; carries no path worth showing, so this is the whole resolve-and-prettify path in one
; page. It used to read `#229645745`.
[search-filelocation-dataset-applied]
summary = Exercises the search filelocation dataset applied case.
requires_dataset = testdata_shapes
url = /search/o3Njb2xsZWN0aW9uX2RhdGFzZXRzgGxxdWVyeV9zdHJpbmdgbWZhY2V0X2ZpbHRlcnOg/0/9g==/9g==
actions =
    sleep 1500
    click_css #x-search-open-filters
    wait_text All filters
    click_text File location
    wait_text Filtering on a folder
    sleep 1500
    click_text_in #x-storage-tree :: shapes
    sleep 1200
    click_text Show
    sleep 2500
    wait_text_in #x-filter-chips :: testdata_shapes
