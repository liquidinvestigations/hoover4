; The AI Chat homepage lists the boards of the signed-in user. The test opens the first
; board, waits for its settled graph, and shows the detail of the first goal when its node is
; clicked. The first goal has the slug goal-01 whether its id is the legacy goal or the
; slug id goal-01, so the test selects the node by its slug. A stack with no board is
; incomplete.
[ai-board-explorer]
summary = Opens a board from the AI Chat homepage, draws its graph, and selects the goal node.
url = /ai_chat
actions =
    wait_css .x-boards-overview
    wait_eval if(!document.querySelector('.x-board-card'))return {incomplete:true,reason:'no board on this stack'};return {ok:true};
    click_css .x-board-card
    wait_css .x-board-node[data-slug="goal-01"]
    eval document.querySelector('.x-board-node[data-slug="goal-01"]').dispatchEvent(new MouseEvent('click',{bubbles:true}));return {ok:true};
    wait_css .x-board-fact-detail
    wait_eval const node=document.querySelector('.x-board-node[data-slug="goal-01"]');return {ok:location.search.includes('selected=goal-01')&&['goal','goal-01'].includes(node.dataset.node),id:node.dataset.node,nodes:document.querySelectorAll('.x-board-node').length};
