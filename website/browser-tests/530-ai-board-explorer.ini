; The AI Chat homepage lists the boards of the signed-in user. The test opens the first
; board, waits for its settled graph, and shows the detail of the goal fact when its node is
; clicked. A stack with no board is incomplete.
[ai-board-explorer]
summary = Opens a board from the AI Chat homepage, draws its graph, and selects the goal node.
url = /ai_chat
actions =
    wait_css .x-boards-overview
    wait_eval if(!document.querySelector('.x-board-card'))return {incomplete:true,reason:'no board on this stack'};return {ok:true};
    click_css .x-board-card
    wait_css .x-board-node[data-node="goal"]
    eval document.querySelector('.x-board-node[data-node="goal"]').dispatchEvent(new MouseEvent('click',{bubbles:true}));return {ok:true};
    wait_css .x-board-fact-detail
    wait_eval return {ok:location.search.includes('selected=goal'),nodes:document.querySelectorAll('.x-board-node').length};
