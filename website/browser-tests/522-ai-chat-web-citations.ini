; ---------------------------------------------------------------- chat

[ai-chat-web-citations]
summary = Verifies inline web cards, captured Markdown, exact find, and hidden earlier answers.
url = /ai_chat/c/{{chat_fixture:web_citations}}/9g==/9g==
actions =
    wait_css [data-chat-answer] [data-web-citation]
    wait_eval const cards=[...document.querySelectorAll('[data-web-citation]')];return {ok:cards.every(card=>card.getBoundingClientRect().height===148&&card.querySelector('[data-result-card-label]')?.innerText===card.dataset.webCitation+'.')};
    wait_eval const cards=[...document.querySelectorAll('[data-chat-answer] [data-web-citation]')];return {ok:JSON.stringify(cards.map(card=>card.dataset.webCitation))===JSON.stringify(['[W1]','[W2]'])&&cards.every(card=>!!card.querySelector('a[href^="https://"]')&&!!card.querySelector('mark')&&!/Forms:|Kind:|Published:/.test(card.innerText))};
    wait_eval return {ok:document.querySelectorAll('[data-chat-answer] tr[data-citation-table-row]').length===0&&document.querySelectorAll('[data-unreferenced-citations] [data-web-citation="[W3]"]').length===1&&document.querySelector('[data-unreferenced-citations]').innerText.includes('The source supports claim 3.')};
    wait_eval const answer=document.querySelector('[data-chat-answer]');const cards=[...answer.querySelectorAll('[data-web-citation]')];return {ok:cards[0].compareDocumentPosition([...answer.querySelectorAll('p')].find(p=>p.innerText.includes('second page')))&Node.DOCUMENT_POSITION_FOLLOWING&&!document.body.innerText.includes('Earlier draft text')&&!document.body.innerText.includes('The answer includes source citations.')};
    wait_eval const bold=document.querySelector('[data-chat-answer] strong button');const italic=document.querySelector('[data-chat-answer] em button');return {ok:bold?.innerText==='[W1]'&&italic?.innerText==='[W2]'};
    click_css [data-chat-answer] strong button
    wait_eval return {ok:document.querySelector('[data-web-citation="[W1]"]')?.dataset.selected==='true'&&document.querySelectorAll('[data-web-citation="[W1]"]').length===1};
    wait_css #web-page-preview-text
    wait_eval return {ok:document.querySelector('#web-page-find-count')?.innerText==='1/2'&&!window.pageContentExecuted&&!document.querySelector('#web-page-preview-text [data-citation-handle]')};
    type_css [data-web-preview] input :: Știință exact match
    wait_eval return {ok:document.querySelector('#web-page-find-count')?.innerText==='1/2'&&CSS.highlights.get('web-page-find')?.size===2};
    click_css [data-web-preview] button[title="Next match"]
    wait_eval return {ok:document.querySelector('#web-page-find-count')?.innerText==='2/2'&&document.querySelector('#web-page-preview-text').scrollTop>0};
    type_css [data-web-preview] input :: ȘTIINȚĂ EXACT MATCH
    wait_eval return {ok:document.querySelector('#web-page-find-count')?.innerText==='0/0'};
    type_css [data-web-preview] input :: Știință exact match
    wait_eval return {ok:document.querySelector('#web-page-find-count')?.innerText==='1/2'};
    eval window.__web_preview_path=location.pathname;location.reload();return {ok:true};
    wait_css #web-page-preview-text
    wait_eval return {ok:document.querySelector('[data-web-preview] input')?.value==='Știință exact match'&&document.querySelector('#web-page-find-count')?.innerText==='1/2'};
    click_css [data-chat-answer] [data-web-citation="[W2]"]
    wait_eval return {ok:document.querySelector('[data-web-preview]')?.innerText.includes('Captured source 2')&&document.querySelector('#web-page-find-count')?.innerText==='1/2'};
    click_css [data-web-preview] button[title="Close preview"]
    wait_eval return {ok:!document.querySelector('[data-web-preview]')};
    eval document.querySelectorAll('.x-chat-tool-run-toggle').forEach(button=>{if(button.innerText.includes('Show'))button.click()});return {ok:true};
    wait_eval return {ok:[...document.querySelectorAll('.x-chat-tool-run')].some(group=>group.innerText.includes('Earlier answer'))};
    click_css .x-chat-follow-ups button
    wait_eval return {ok:document.querySelector('[data-chat-composer]')?.value==='Compare the source passages.'&&document.activeElement===document.querySelector('[data-chat-composer]')&&document.querySelectorAll('[data-chat-user]').length===1};
    type_css input[placeholder="Search in conversation"] :: second page
    wait_eval const input=document.querySelector('input[placeholder="Search in conversation"]');return {ok:input.parentElement.innerText.includes('1/1')&&!!document.querySelector('[data-chat-answer]').closest('[style*="outline"]')};
    wait_eval const footer=document.querySelector('.x-chat-turn-footer');const cited=document.querySelector('[data-unreferenced-citations]');return {ok:!!footer&&getComputedStyle(footer).textAlign==='center'&&getComputedStyle(footer).borderBottomStyle==='solid'&&!!(cited.compareDocumentPosition(footer)&Node.DOCUMENT_POSITION_FOLLOWING)};
    type_css input[placeholder="Search in conversation"] :: German
    wait_eval const input=document.querySelector('input[placeholder="Search in conversation"]');return {ok:input.parentElement.innerText.includes('1/2')};
    click_css input[placeholder="Search in conversation"] ~ button[title="Next match"]
    wait_eval const input=document.querySelector('input[placeholder="Search in conversation"]');return {ok:input.parentElement.innerText.includes('2/2')};
    type_css input[placeholder="Search in conversation"] :: Germany
    wait_eval const input=document.querySelector('input[placeholder="Search in conversation"]');return {ok:input.parentElement.innerText.includes('1/1')};
