; The dashboard Datasets card opens the Collections page at its Datasets section, which
; lists the datasets of every collection with their statistics and state.
[admin-datasets-section]
summary = Verifies the dashboard link to the Datasets section and its columns.
requires_dataset = any
url = /admin
actions =
    wait_css .x-admin-dashboard-card
    eval const card=[...document.querySelectorAll('.x-admin-dashboard-card')].find(c=>c.innerText.startsWith('Datasets'));card.click();return {ok:true};
    wait_css #datasets table
    wait_eval const s=document.querySelector('#datasets');const heads=[...s.querySelectorAll('th')].map(t=>t.innerText.trim());const top=s.getBoundingClientRect().top;return {ok:location.hash==='#datasets'&&heads.join('|')==='Dataset|Collection|Documents|Size|Indexed|Errors|State|Created'&&top<innerHeight/2&&top>-10,top,heads};
