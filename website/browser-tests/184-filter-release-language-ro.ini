requires_dataset = release_browser_primary
interface_language = ro
actions =
    wait_css [data-chip]
    wait_text Germană
    eval window.__canonicalQuery=location.pathname.split("/")[2];return {ok:true};
    click_css [data-chip]
    wait_css #x-filter-modal
    wait_text_in #x-filter-modal :: Germană
    type_css #x-filter-modal input[type="text"] :: germ
    wait_eval return {ok:window.__languageDone>0};
    wait_text_in #x-filter-modal :: Germană
    wait_eval return {ok:location.pathname.split("/")[2]===window.__canonicalQuery};
