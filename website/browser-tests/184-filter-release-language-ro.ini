[filter-release-language-ro]
summary = Verify translated active language filters preserve canonical query identities.
init_script = window.__languageSearches=0;window.__languageDone=0;window.__languageFetch=window.fetch;window.fetch=function(u,o){if(String(u&&u.url||u).includes("/api/search_entity_terms")){window.__languageSearches++;return window.__languageFetch.apply(this,arguments).then(r=>{window.__languageDone++;return r;});}return window.__languageFetch.apply(this,arguments);};
