[view-doc-text-sparse-pages]
summary = Opens a PDF with text on pages 3, 7 and 12, which is one text row, and shows a page marker for each later page.
requires_dataset = p63pages_boundaries
url = /view_
actions =
    wait_eval const t=document.querySelector('#x-document-text-viewer pre')?.innerText||'';const m=[...document.querySelectorAll('[data-text-page]')].map(e=>e.getAttribute('data-text-page'));return {ok:t.includes('document page 3')&&t.includes('document page 12')&&m.includes('7')&&m.includes('12'),markers:m,text:t.slice(0,80)};
    eval location.reload();return {ok:true};
    sleep 1500
    wait_eval const t=document.querySelector('#x-document-text-viewer pre')?.innerText||'';const m=[...document.querySelectorAll('[data-text-page]')].map(e=>e.getAttribute('data-text-page'));return {ok:t.includes('document page 3')&&t.includes('document page 12')&&m.includes('7')&&m.includes('12'),markers:m,text:t.slice(0,80)};
