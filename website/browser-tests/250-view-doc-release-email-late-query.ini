[view-doc-release-email-late-query]
summary = Verify a delayed match response cannot replace a new email query count.
requires_dataset = release_browser_primary
url = /view_document/onJjb2xsZWN0aW9uX2RhdGFzZXR3cmVsZWFzZV9icm93c2VyX3ByaW1hcnlpZmlsZV9oYXNoeEBlYjA4NDE2NmU4YzljZWQ0YjUzMDJhZGRkMTcyMGVkMTE1MjE2Njc1NzAwMzRlNjA4MjBlNTA1OTBmYmI2Y2Qw/o2pmaW5kX3F1ZXJ5ZnF1b2trYW9zZWxlY3RlZF9zb3VyY2X2dHNlbGVjdGVkX3NvdXJjZV9wYWdl9g==/oWxzZWxlY3RlZF90YWJoTWV0YWRhdGE=
init_script = window.__heldFetch=window.fetch;window.__heldFirst=false;window.fetch=function(u,o){const response=window.__heldFetch.apply(this,arguments);if(String(u&&u.url||u).includes('/api/get_email_document_matches')&&!window.__heldFirst){window.__heldFirst=true;return response.then(r=>new Promise(resolve=>{window.__releaseMatches=()=>{window.__matchesReleased=true;resolve(r);};}));}return response;};
actions =
    wait_eval return {ok:typeof window.__releaseMatches==="function"};
    type_css input[placeholder="Search in document"] :: harbor
    press_enter
    wait_css [data-email-match-count="1"]
    eval window.__releaseMatches();return {ok:true};
    wait_eval return {ok:window.__matchesReleased===true&&document.querySelector("[data-email-match-count]")?.dataset.emailMatchCount==="1"&&!document.querySelector(".x-email-header-hit")};
