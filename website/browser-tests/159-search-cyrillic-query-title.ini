; A query of Cyrillic words longer than the tab title. The title is cut by characters, so
; a cut inside a two-byte letter cannot stop the page.
[search-cyrillic-query-title]
summary = Verifies that a long Cyrillic query keeps the search page working and cuts the tab title by characters.
url = /search/o3Njb2xsZWN0aW9uX2RhdGFzZXRzgGxxdWVyeV9zdHJpbmdpZWFzeWNoYWlybWZhY2V0X2ZpbHRlcnOg/0/9g==/9g==
actions =
    wait_css #x-search-input-search-box input
    type_css #x-search-input-search-box input :: Ступёнь Стян: Номер Otcp: Празннща
    press_enter #x-search-input-search-box input
    wait_eval return {ok:document.title.endsWith('Ступёнь Стян: Номе...'),title:document.title};
    sleep 1500
    wait_eval return {ok:document.querySelector('#x-search-input-search-box input').value==='Ступёнь Стян: Номер Otcp: Празннща'};
