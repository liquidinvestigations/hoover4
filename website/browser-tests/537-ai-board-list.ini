
; ---------------------------------------------------------------- chat

[ai-board-list]
summary = Opens the board list from the Boards list row of the AI chat page and searches the board titles and summaries.
url = /ai_chat
actions =
    wait_css .x-board-list-link
    click_css .x-board-list-link
    wait_css .x-board-list
    wait_css .x-item-list-group
    type_css .x-item-list-search :: review
    press_enter .x-item-list-search
    wait_css mark.x-item-list-match
