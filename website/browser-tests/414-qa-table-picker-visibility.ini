
[qa-table-picker-visibility]
summary = Exercises the qa table picker visibility case.
requires_dataset = testdata_excelsc
url = /view_document/onJjb2xsZWN0aW9uX2RhdGFzZXRwdGVzdGRhdGFfZXhjZWxzY2lmaWxlX2hhc2h4QGY5NzUxZThjMjkwNzk5YmU5ZmQ0M2Y1NTQ5OTdhYzJlYWUyZDEwMThlYjc0MTUzODg2ZWZlNjM1NWNmY2EwZmU=/9g==/oWxzZWxlY3RlZF90YWJoRW50aXRpZXM=
actions =
    wait_text Order ID
    eval window.__qa_headers=Array.from(document.querySelectorAll('thead th')).map(e=>e.innerText.trim()).join('|');return {headers:window.__qa_headers};
    pointer_click_css button[aria-label="Choose visible columns"]
    wait_css [role="dialog"][aria-modal="true"]
    pointer_click_css button[aria-label="Hide all columns"]
    wait_eval const dialog=document.querySelector('[role="dialog"][aria-modal="true"]');return {ok: !!dialog && !Array.from(dialog.querySelectorAll('input[type="checkbox"]')).some(e=>e.checked)};
    eval const dialog=document.querySelector('[role="dialog"][aria-modal="true"]');if(!dialog||Array.from(dialog.querySelectorAll('input[type="checkbox"]')).some(e=>e.checked))throw new Error('hide all closed picker or left a column visible');return {hidden:true};
    pointer_click_css button[aria-label="Show all columns"]
    wait_eval const headers=Array.from(document.querySelectorAll('thead th')).map(e=>e.innerText.trim()).join('|');return {ok: headers===window.__qa_headers};
    eval const dialog=document.querySelector('[role="dialog"][aria-modal="true"]');const headers=Array.from(document.querySelectorAll('thead th')).map(e=>e.innerText.trim()).join('|');if(!dialog||Array.from(dialog.querySelectorAll('input[type="checkbox"]')).some(e=>!e.checked)||headers!==window.__qa_headers)throw new Error('show all did not preserve picker and column order');return {restored:true};
    pointer_click_css [role="dialog"] input[type="checkbox"]
    wait_eval const dialog=document.querySelector('[role="dialog"][aria-modal="true"]');return {ok: !!dialog && !dialog.querySelector('input[type="checkbox"]').checked};
    eval const dialog=document.querySelector('[role="dialog"][aria-modal="true"]');if(!dialog||dialog.querySelector('input[type="checkbox"]').checked)throw new Error('individual column toggle closed picker or did not hide column');return {individual_hidden:true};
    pointer_click_css [role="dialog"] input[type="checkbox"]
    wait_eval const dialog=document.querySelector('[role="dialog"][aria-modal="true"]');return {ok: !!dialog && !Array.from(dialog.querySelectorAll('input[type="checkbox"]')).some(e=>!e.checked)};
    eval const dialog=document.querySelector('[role="dialog"][aria-modal="true"]');if(!dialog||Array.from(dialog.querySelectorAll('input[type="checkbox"]')).some(e=>!e.checked))throw new Error('individual column restore closed picker or changed a column');return {individual_restored:true};
