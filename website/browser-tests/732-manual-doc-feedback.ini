[manual-doc-feedback]
summary = Shows the feedback form before submission.
url = /
actions =
	wait_css #x-feedback-button
	click_css #x-feedback-button
	wait_css #x-feedback-overlay #x-feedback-sizes
	wait_eval const img=document.querySelector("#x-feedback-image");return {ok:img.complete&&img.naturalWidth>0};
manual_asset = feedback-form.png
