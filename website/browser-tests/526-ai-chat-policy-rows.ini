; ---------------------------------------------------------------- chat

[ai-chat-policy-rows]
summary = Selects the named chat-checks chat and checks the labels of policy and shared tool rows.
url = /ai_chat/c/{{chat_fixture:policy}}/9g==/9g==
actions =
    wait_css [data-chat-answer]
    eval document.querySelectorAll('.x-chat-tool-run-toggle').forEach(button=>{if(button.innerText.includes('Show'))button.click()});return {ok:true};
    wait_eval const labels=[...document.querySelectorAll('.x-chat-call-origin')].map(e=>e.innerText.trim());return {ok:labels.filter(t=>t==='A chat check started this call.').length===2&&labels.filter(t=>t.startsWith('This call repeats')).length===1&&labels.length===3,labels};
    eval document.querySelectorAll('.x-chat-nag').forEach(e=>{e.open=true});return {ok:true};
    wait_eval return {ok:[...document.querySelectorAll('.x-chat-nag')].some(e=>e.innerText.includes('other search results are unread'))};
