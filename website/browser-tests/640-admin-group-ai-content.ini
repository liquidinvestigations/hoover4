
; ---------------------------------------------------------------- admin

[admin-group-ai-content]
summary = Tries to turn off AI chats and boards for a group that owns chats, and shows the refusal with the counts.
url = /admin/user_groups/admin
expect = error_bar
actions =
    wait_css .x-group-ai-enabled
    click_css .x-group-ai-enabled
    wait_text Delete the chats and boards of this group first.
    wait_css .x-group-ai-enabled:checked
