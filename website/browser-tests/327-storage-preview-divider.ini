; The divider between the folder listing and the preview is dragged, and its width is
; remembered after a reload. The last action clears the key.
[storage-preview-divider]
summary = Drags the divider between the folder listing and the preview and restores its width after a reload.
requires_dataset = testdata_shapes
url = /file_browser/testdata_shapes/om5jb250YWluZXJfaGFzaGBkcGF0aHiAL2RlZXAtc3R1ZmYvMS8yLzMvNC81LzYvNy84LzkvMTAvMTEvMTIvMTMvMTQvMTUvMTYvMTcvMTgvMTkvMjAvMjEvMjIvMjMvMjQvMjUvMjYvMjcvMjgvMjkvMzAvMzEvMzIvMzMvMzQvMzUvMzYvMzcvMzgvMzkvNDAvNDEvNDI=/9g==/9g==
actions =
    wait_css #x-storage-preview-resize
    eval localStorage.removeItem('hoover4.storage-preview-width-css-px');return {ok:true};
    eval const h=document.querySelector('#x-storage-preview-resize');window.__w0=h.parentElement.getBoundingClientRect().width;const r=h.getBoundingClientRect();window.__x=r.left+3;h.dispatchEvent(new MouseEvent('mousedown',{bubbles:true,cancelable:true,clientX:window.__x,clientY:r.top+40,button:0}));return {ok:true,w0:window.__w0};
    sleep 300
    eval const o=[...document.querySelectorAll('div')].find(d=>d.style.position==='fixed'&&d.style.cursor==='col-resize');if(!o)throw new Error('no drag overlay');o.dispatchEvent(new MouseEvent('mousemove',{bubbles:true,clientX:window.__x+(100),clientY:300}));return {ok:true};
    sleep 300
    eval const o=[...document.querySelectorAll('div')].find(d=>d.style.position==='fixed'&&d.style.cursor==='col-resize');o.dispatchEvent(new MouseEvent('mouseup',{bubbles:true,clientX:window.__x,clientY:300}));return {ok:true};
    wait_eval const w=document.querySelector('#x-storage-preview-resize').parentElement.getBoundingClientRect().width;const s=Number(localStorage.getItem('hoover4.storage-preview-width-css-px'));return {ok:Math.abs(w-window.__w0)>=30&&Math.abs(s-w)<=1,w,s,w0:window.__w0};
    goto /file_browser/testdata_shapes/om5jb250YWluZXJfaGFzaGBkcGF0aHiAL2RlZXAtc3R1ZmYvMS8yLzMvNC81LzYvNy84LzkvMTAvMTEvMTIvMTMvMTQvMTUvMTYvMTcvMTgvMTkvMjAvMjEvMjIvMjMvMjQvMjUvMjYvMjcvMjgvMjkvMzAvMzEvMzIvMzMvMzQvMzUvMzYvMzcvMzgvMzkvNDAvNDEvNDI=/9g==/9g==
    wait_css #x-storage-preview-resize
    wait_eval const h=document.querySelector('#x-storage-preview-resize');if(!h)return {ok:false};const w=h.parentElement.getBoundingClientRect().width;const s=Number(localStorage.getItem('hoover4.storage-preview-width-css-px'));return {ok:s>0&&Math.abs(s-w)<=1,w,s};
    eval localStorage.removeItem('hoover4.storage-preview-width-css-px');return {ok:true};
