; A link written before the column selection existed names hidden columns only. The grid
; reads it once: h1 and h2 stay hidden and the first 60 other columns show.
[view-doc-table-old-link]
summary = Decodes an older link with hidden columns into a 60-column selection.
requires_dataset = p73tables_fixtures
url = /view_
actions =
    wait_text h62
    wait_eval const h=[...document.querySelectorAll('thead th')].map(e=>e.innerText.trim());return {ok:!h.some(x=>/\bh1\b/.test(x)||/\bh2\b/.test(x))&&h.some(x=>x.includes('h3'))&&h.some(x=>x.includes('h62'))&&!h.some(x=>x.includes('h63')),headers:h.slice(0,4)};
