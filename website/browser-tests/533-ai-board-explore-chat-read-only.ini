; A board explore chat refuses every message, so its page shows a read-only line with a link
; to the board in place of the composer. The test opens the first board from the AI Chat
; homepage, selects its first intent, and follows the intent's explore chat link. A stack
; with no board, or a board with no explore chat, is incomplete.
[ai-board-explore-chat-read-only]
summary = Opens a board explore chat and checks that it has no composer and links back to the board.
url = /ai_chat
actions =
    wait_css .x-boards-overview
    wait_eval if(!document.querySelector('.x-board-card'))return {incomplete:true,reason:'no board on this stack'};return {ok:true};
    click_css .x-board-card
    wait_css .x-board-node[data-slug^="intent-"]
    eval document.querySelector('.x-board-node[data-slug^="intent-"]').dispatchEvent(new MouseEvent('click',{bubbles:true}));return {ok:true};
    wait_eval const link=[...document.querySelectorAll('a')].find(e=>e.innerText.trim()==='Open the explore chat');if(!link)return {ok:false};location.href=link.href;return {ok:true,href:link.getAttribute('href')};
    wait_css .x-chat-board-read-only
    wait_eval const line=document.querySelector('.x-chat-board-read-only');const link=[...line.querySelectorAll('a')].find(e=>e.innerText.trim()==='Open the board');return {ok:line.innerText.includes('Board explore chats are read-only.')&&!!link&&link.getAttribute('href').includes('/ai_chat/boards/')&&!document.querySelector('[data-chat-composer]')&&!document.querySelector('textarea'),href:link&&link.getAttribute('href')};
