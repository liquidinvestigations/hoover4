[qa-pdf-parts]
summary = Verify document page navigation across a PDF part boundary.
requires_dataset = testdata_p40large
url = /view_document/onJjb2xsZWN0aW9uX2RhdGFzZXRxdGVzdGRhdGFfcDQwbGFyZ2VpZmlsZV9oYXNoeEA5ZWFjZDJmMDZmZTBhNzA1ZjhhYzY2MTQyNTcyZjNmMWIxZGExYjRiZmI1MmM0ZjM2MTJhNTlhZTYyZGU1NGZh/o2pmaW5kX3F1ZXJ5YG9zZWxlY3RlZF9zb3VyY2WhY1BkZqNqcGFnZV9jb3VudBkD_GZlbmdpbmVgaWxhbmd1YWdlc2B0c2VsZWN0ZWRfc291cmNlX3BhZ2X2/oWxzZWxlY3RlZF90YWJoRW50aXRpZXM=
settle_ms = 1000
actions =
    eval window.__qa_rejections=[];window.addEventListener('unhandledrejection',e=>window.__qa_rejections.push(String(e.reason?.stack||e.reason)));return true;
    wait_css #x-pdf-viewer embedpdf-container
    wait_eval return window.x_pdf_lifecycle?.some(e=>e.event==='layout-ready');
    eval const e=[...document.querySelectorAll('input')].find(e=>!e.placeholder&&e.value==='1');if(!e)throw Error('page field unavailable');e.id='qa-pdf-page';e.parentElement.parentElement.id='qa-pdf-controls';return true;
    type_css #qa-pdf-page :: 100
    press_enter
    eval window.x_pdf_viewer.registry.then(registry=>window.__qa_scroll=registry.getPlugin('scroll').provides());return true;
    sleep 1000
    eval let page;try{page=window.__qa_scroll?.getCurrentPage();}catch{}return {page,field:document.querySelector('#qa-pdf-page')?.value,lifecycle:window.x_pdf_lifecycle};
    wait_eval window.x_pdf_viewer?.registry.then(registry=>window.__qa_scroll=registry.getPlugin('scroll').provides());try{return window.__qa_scroll?.getCurrentPage()===100&&document.querySelector('#qa-pdf-page')?.value==='100';}catch{return false;}
    click_css #qa-pdf-controls button:nth-of-type(3)
    sleep 500
    eval window.__qa_zoom=document.querySelector('#qa-pdf-controls').innerText.match(/[0-9]+%/)[0];return window.__qa_zoom;
    click_css #qa-pdf-controls button:nth-of-type(2)
    wait_eval return document.querySelector('#qa-pdf-page')?.value==='101';
    eval const resources=performance.getEntriesByType('resource').map(e=>e.name);const requests=resources.filter(e=>e.includes('/_download_pdf_part/'));if(!requests.some(e=>e.endsWith('/2')))throw Error('second part was not requested');if(resources.some(e=>e.includes('/_download_document/')||e.includes('/_download_ocr_pdf/')))throw Error('complete PDF was requested');return {requests,page:document.querySelector('#qa-pdf-page').value};
    eval if(!document.querySelector('#qa-pdf-controls').innerText.includes(window.__qa_zoom))throw Error('zoom changed across boundary');return window.__qa_zoom;
    click_css #qa-pdf-controls button:nth-of-type(1)
    wait_eval return !!window.x_pdf_viewer;
    eval window.x_pdf_viewer.registry.then(registry=>window.__qa_scroll=registry.getPlugin('scroll').provides());return true;
    wait_eval window.x_pdf_viewer?.registry.then(registry=>window.__qa_scroll=registry.getPlugin('scroll').provides());try{return window.__qa_scroll?.getCurrentPage()===100&&document.querySelector('#qa-pdf-page')?.value==='100';}catch{return false;}
    click_css [data-source-list=true] [data-source-label="PDF text"]
    sleep 1000
    click_css [data-source-list=true] [data-source-label="PDF"]
    sleep 1000
    eval const state={viewer:!!window.x_pdf_viewer,children:document.querySelector('#x-pdf-viewer')?.childElementCount,lifecycle:window.x_pdf_lifecycle,rejections:window.__qa_rejections};if(!state.viewer)throw Error(JSON.stringify(state));return state;
    wait_css #x-pdf-viewer embedpdf-container
    wait_eval return window.x_pdf_lifecycle.filter(e=>e.event==='open-start'&&e.pdf_url?.includes('/_download_pdf_part/')).length>=4;
    eval window.__qa_search=null;const originalFetch=window.fetch;window.fetch=async(...args)=>{const response=await originalFetch(...args);const url=typeof args[0]==='string'?args[0]:args[0].url;if(url.includes('search_document_pdf'))window.__qa_search=await response.clone().json();return response;};return true;
    type_css input[placeholder="Search in document"] :: MIT
    press_enter
    wait_eval return (window.__qa_search?.results||window.__qa_search?.Ok?.results||[]).some(hit=>hit.pageIndex>=1000);
    eval if(window.__qa_rejections.length)throw Error(window.__qa_rejections.join('\n'));return {rejections:window.__qa_rejections,lifecycle:window.x_pdf_lifecycle};
    eval const results=window.__qa_search.results||window.__qa_search.Ok.results;const total=window.__qa_search.total||window.__qa_search.Ok.total;if(results.length!==total)throw Error('search count mismatch');if(![...document.querySelectorAll('h1')].some(e=>e.textContent.replace(/\s/g,'')==='1/'+total))throw Error('displayed search count mismatch');return {total,laterPages:results.filter(hit=>hit.pageIndex>=1000).map(hit=>hit.pageIndex+1),partRequests:performance.getEntriesByType('resource').filter(e=>e.name.includes('/_download_pdf_part/')).map(e=>e.name)};
