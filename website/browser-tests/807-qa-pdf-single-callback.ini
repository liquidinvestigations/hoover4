[qa-pdf-single-callback]
summary = Verifies one PDF controller callback per opened source, stable zoom after load, search, and the viewer scroller width.
requires_dataset = testdata_manualqa
url = /view_
init_script = window.__qa={rust:[],zoom:[],viewers:new WeakSet()};for(const level of ['log','info','debug']){const original=console[level];console[level]=function(...args){const text=args.filter(a=>typeof a==='string').join(' ');if(text.includes('pdf-lifecycle rust-'))window.__qa.rust.push({t:performance.now(),text:text.slice(text.indexOf('pdf-lifecycle'),text.indexOf('pdf-lifecycle')+60)});return original.apply(this,args);};}setInterval(()=>{const v=window.x_pdf_viewer;if(!v||window.__qa.viewers.has(v))return;window.__qa.viewers.add(v);Promise.resolve(v.registry).then(r=>r.getPlugin('zoom').provides().onZoomChange(e=>window.__qa.zoom.push({t:performance.now(),level:e&&e.newZoom,gen:window.x_pdf_viewer_generation}))).catch(()=>{});},20);
actions =
    wait_css #x-pdf-viewer embedpdf-container
    wait_eval return {ok:window.__qa.rust.some(r=>r.text.startsWith('pdf-lifecycle rust-loaded '))};
    eval window.__qa.loadedAt=Math.max(...window.__qa.rust.filter(r=>r.text.startsWith('pdf-lifecycle rust-loaded ')).map(r=>r.t));return {ok:true};
    sleep 5000
    eval const p=window.__qa;const after=p.zoom.filter(z=>z.t>=p.loadedAt&&z.t<=p.loadedAt+5000);const host=document.querySelector('#x-pdf-viewer embedpdf-container');const root=host&&host.shadowRoot;const scrollers=root?[...root.querySelectorAll('*')].filter(e=>{const s=getComputedStyle(e);return /(auto|scroll)/.test(s.overflowY)&&e.clientHeight>100;}).map(e=>{const s=getComputedStyle(e);return {tag:e.tagName,cls:String(e.className).slice(0,60),offsetWidth:e.offsetWidth,clientWidth:e.clientWidth,scrollHeight:e.scrollHeight,clientHeight:e.clientHeight,gutter:s.scrollbarGutter,scrollbarWidth:s.scrollbarWidth};}):[];window.__qa.first={zoomAfterLoad:after.length,zoom:after,scrollers};if(after.length>2)throw Error('zoom changed '+after.length+' times after load: '+JSON.stringify(after));return window.__qa.first;
    wait_eval const h=[...document.querySelectorAll('h1')].map(e=>e.textContent.replace(/\s/g,'')).find(t=>/^\d+\/\d+$/.test(t));return {ok:!!h&&!h.endsWith('/0'),hits:h};
    eval const labels=[...document.querySelectorAll('[data-source-list=true] [data-source-label]')].map(e=>e.getAttribute('data-source-label'));return {ok:true,labels};
    click_css [data-source-list=true] [data-source-label="PDF"]
    wait_eval return {ok:window.__qa.rust.filter(r=>r.text.startsWith('pdf-lifecycle rust-loaded ')).length>=2};
    sleep 2000
    click_css [data-source-list=true] [data-source-label="PDF · OCR · Tesseract · eng"]
    wait_eval return {ok:window.__qa.rust.filter(r=>r.text.startsWith('pdf-lifecycle rust-loaded ')).length>=3};
    sleep 2000
    eval const zoomBefore=window.__qa.zoom.length;window.__qa.zoomBefore=zoomBefore;const e=[...document.querySelectorAll('input')].find(e=>!e.placeholder&&/^[0-9]+$/.test(e.value));if(!e)throw Error('page field unavailable');e.parentElement.parentElement.id='qa-pdf-controls';return {ok:true};
    click_css #qa-pdf-controls button:nth-of-type(3)
    sleep 2000
    eval const p=window.__qa;const seq=p.rust.map(r=>r.text.split(' ')[1]).filter(e=>e==='rust-open'||e==='rust-loaded'||e==='rust-loaded-repeat');let open=0,loaded=0,bad=[];for(const e of seq){if(e==='rust-open'){open++;loaded=0;}else if(e==='rust-loaded'){loaded++;if(loaded>1)bad.push('second rust-loaded for open '+open);}else bad.push('rust-loaded-repeat for open '+open);}const life=(window.x_pdf_lifecycle||[]).map(r=>r.event);const count=n=>life.filter(e=>e===n).length;const result={sequence:seq,opens:open,jsOpenComplete:count('open-complete'),jsLayoutReady:count('layout-ready'),jsLayoutRepeat:count('layout-ready-repeat'),zoomAfterClick:p.zoom.length-p.zoomBefore,first:p.first};if(bad.length)throw Error(bad.join('; ')+' '+JSON.stringify(result));if(seq.filter(e=>e==='rust-loaded').length<3)throw Error('fewer than three loaded sources '+JSON.stringify(result));if(result.zoomAfterClick<1)throw Error('zoom button changed nothing '+JSON.stringify(result));if(!document.querySelector('#x-pdf-viewer embedpdf-container'))throw Error('viewer gone');return result;
