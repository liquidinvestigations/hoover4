; The Feedback page finds the report that feedback-report sent, shows its image and
; context, and marks it read.
[admin-feedback]
summary = Finds a sent report, opens it, and marks it read.
url = /admin/feedback?search=Screenshot%20harness%20report&status=all&page=1
actions =
    wait_css #x-feedback-count
    wait_eval if(!document.querySelector('.x-feedback-row'))return {incomplete:true,reason:'no report from feedback-report on this stack'};return {ok:true};
    click_css .x-feedback-title
    wait_css .x-feedback-detail img
    wait_eval const img=document.querySelector('.x-feedback-detail img');const pre=document.querySelector('.x-feedback-detail pre');return {ok:img.complete&&img.naturalWidth>0&&!!pre&&pre.innerText.includes('"logs"'),width:img.naturalWidth};
    eval const b=document.querySelector('.x-feedback-read');if(b.innerText.trim()==='Mark unread'){b.click();}return {ok:true};
    wait_eval const b=document.querySelector('.x-feedback-read');return {ok:b.innerText.trim()==='Mark read'};
    click_css .x-feedback-read
    wait_eval const b=document.querySelector('.x-feedback-read');return {ok:b.innerText.trim()==='Mark unread'};
