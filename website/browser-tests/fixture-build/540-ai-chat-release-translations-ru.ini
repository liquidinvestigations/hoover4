[ai-chat-release-translations-ru]
summary = Verify production message counts, board settings, and generic tool labels in ru.
interface_language = ru
url = /_browser_fixture/translations
init_script = window.__fixtureResponse=(body,options)=>{const response=new Response(body,options);Object.defineProperty(response,'url',{value:location.href});return response;};window.__fixtureCapabilityFetch=window.fetch;window.fetch=function(u,o){if(String(u&&u.url||u).includes('/api/chat_internet_tools_enabled'))return Promise.resolve(window.__fixtureResponse('true',{headers:{'Content-Type':'application/json'}}));return window.__fixtureCapabilityFetch.apply(this,arguments);};
actions =
    wait_css [data-browser-fixture="translations"]
    wait_text_in [data-fixture-count="1"] :: 1 сообщение
    wait_text_in [data-fixture-count="2"] :: 2 сообщения
    wait_text_in [data-fixture-internet="on"] :: Включено
    wait_text_in [data-fixture-internet="off"] :: Выключено
    wait_text_in .x-chat-docrefs-toggle :: инструмент
    eval window.__closedToolText=document.querySelector('.x-chat-docrefs-toggle').innerText;return {ok:true};
    click_css .x-chat-docrefs-toggle
    wait_text_in .x-chat-docrefs-toggle :: инструмент
    wait_eval return {ok:document.querySelector('.x-chat-docrefs-toggle').innerText!==window.__closedToolText};
    wait_text_in [data-fixture-count="0"] :: 0 сообщений
    wait_text_in [data-fixture-count="5"] :: 5 сообщений
    wait_text_in [data-fixture-count="21"] :: 21 сообщение
