[view-doc-release-email-two-previews]
summary = Verify header navigation expands and scrolls only the selected preview.
requires_dataset = release_browser_primary
url = /_browser_fixture/two-
actions =
    wait_css [data-browser-fixture-preview="a"] [data-email-match-count="6"]
    wait_css [data-browser-fixture-preview="b"] [data-email-match-count="7"]
    eval window.__headerScroll=Element.prototype.scrollIntoView;Element.prototype.scrollIntoView=function(){if(this.hasAttribute("data-header-start"))window.__scrolledHeaderSlot=this.closest("[data-browser-fixture-preview]")?.dataset.browserFixturePreview;return window.__headerScroll.apply(this,arguments);};return {ok:true};
    click_css [data-browser-fixture-preview="b"] .x-email-details-toggle
    click_css [data-browser-fixture-preview="b"] .x-email-match-controls button[aria-label="Next Hit"]
    wait_css [data-browser-fixture-preview="b"] .x-email-details-panel
    wait_eval return {ok:window.__scrolledHeaderSlot==="b"&&document.querySelector('[data-browser-fixture-preview="a"] [data-email-match-count]')?.textContent==="1 / 6"&&document.querySelector('[data-browser-fixture-preview="b"] [data-email-match-count]')?.textContent==="2 / 7"};
