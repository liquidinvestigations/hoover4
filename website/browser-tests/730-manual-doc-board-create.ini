[manual-doc-board-create]
summary = Shows the form that creates a board, with every collection selected.
url = /ai_chat/boards/new
actions =
	wait_css .x-board-create
	wait_css .x-board-collection
	wait_eval const boxes=[...document.querySelectorAll('.x-board-collection')];return {ok:boxes.length>0&&boxes.every(b=>b.checked)&&document.querySelector('.x-board-internet-tools').checked,boxes:boxes.length};
manual_asset = board-create.png
