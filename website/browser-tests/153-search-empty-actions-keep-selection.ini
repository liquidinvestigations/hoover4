[search-empty-actions-keep-selection]
summary = Verifies that Clear filters and Go to page 1 keep the selected document and viewer state in the address.
requires_dataset = testdata_testfiles
url = /search/o3Njb2xsZWN0aW9uX2RhdGFzZXRzgGxxdWVyeV9zdHJpbmdpZWFzeWNoYWlybWZhY2V0X2ZpbHRlcnOg/0/9g==/9g==
actions =
    wait_text documents found
    eval const c=document.querySelector('.x-result-item-card');if(!c)throw Error('result card unavailable');c.click();return {ok:true};
    wait_eval const s=location.pathname.split('/');if(s[4]==='9g==')return false;sessionStorage.setItem('qa-selection',s.slice(4).join('/'));return {ok:true,selection:s.slice(4).join('/')};
    eval location.assign('/search/pHNjb2xsZWN0aW9uX2RhdGFzZXRzgGxxdWVyeV9zdHJpbmdgbWZhY2V0X2ZpbHRlcnOhamZpbGVfcGF0aHOBoWNJbnQBZHNvcnSiY2tleWREYXRlZGRlc2P1/0/'+sessionStorage.getItem('qa-selection'));return {ok:true};
    wait_css #x-search-clear-filters
    click_css #x-search-clear-filters
    wait_eval const s=location.pathname.split('/');return {ok:!s[2].startsWith('pHNjb2xsZWN0aW9uX2RhdGFzZXRzgGxxdWVyeV9zdHJpbmdgbWZhY2V0X2ZpbHRlcnOhamZp')&&s[3]==='0'&&s.slice(4).join('/')===sessionStorage.getItem('qa-selection'),path:location.pathname};
    eval location.assign('/search/o3Njb2xsZWN0aW9uX2RhdGFzZXRzgGxxdWVyeV9zdHJpbmdpZWFzeWNoYWlybWZhY2V0X2ZpbHRlcnOg/40/'+sessionStorage.getItem('qa-selection'));return {ok:true};
    wait_css #x-search-first-page
    click_css #x-search-first-page
    wait_eval const s=location.pathname.split('/');return {ok:s[3]==='0'&&s.slice(4).join('/')===sessionStorage.getItem('qa-selection')&&document.querySelectorAll('#x-search-panel-results-wrapper li').length>0,path:location.pathname};
