
; The same tree at 600 px, where the sidebar is nearly half the window. Nothing may
; scroll sideways, however deep the row.
[storage-tree-unified-600px]
summary = Exercises the storage tree unified 600px case.
requires_dataset = testdata_shapes
url = /file_browser/testdata_shapes/om5jb250YWluZXJfaGFzaGBkcGF0aHg-L2RlZXAtc3R1ZmYvMS8yLzMvNC81LzYvNy84LzkvMTAvMTEvMTIvMTMvMTQvMTUvMTYvMTcvMTgvMTkvMjA=/9g==/9g==
viewport = 600x900
actions =
    sleep 3000
    eval const e = document.documentElement; if (e.scrollWidth > e.clientWidth + 1) throw new Error('the page scrolls sideways'); return {ok: true};
