; The Text source category lists the sources by label and applies one as a filter chip.
[filter-pane-text-source]
summary = Verifies text source labels and applies the Raw file text filter.
requires_dataset = any
url = /search/o3Njb2xsZWN0aW9uX2RhdGFzZXRzgGxxdWVyeV9zdHJpbmdgbWZhY2V0X2ZpbHRlcnOg/0/9g==/9g==
actions =
    click_css #x-search-open-filters
    wait_text All filters
    click_text_in #x-filter-modal :: Text source
    wait_css input[placeholder="Search text sources…"]
    wait_text_in #x-filter-modal :: Raw file text
    wait_eval return {ok: !document.querySelector('#x-filter-modal').innerText.includes('filename_index')};
    click_text_in #x-filter-modal :: Raw file text
    wait_eval const button=document.querySelector('#x-filter-modal > div:last-child button:last-child');return /^Show [1-9][0-9]* results?$/.test(button?.textContent.trim()||'');
    click_css #x-filter-modal > div:last-child button:last-child
    wait_eval const chips=document.querySelector('#x-filter-chips');return {ok: !document.querySelector('#x-filter-modal')&&!!chips&&chips.innerText.includes('Text source')&&chips.innerText.includes('Raw file text')};
