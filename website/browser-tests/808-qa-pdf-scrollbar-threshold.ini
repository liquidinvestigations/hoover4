[qa-pdf-scrollbar-threshold]
summary = Sweeps the PDF viewer height across the scrollbar threshold of a one-page PDF and counts automatic zoom changes.
requires_dataset = testdata_manualpdf
viewport = 1280x720
url = /view_
init_script = window.__qa={zoom:[],viewers:new WeakSet()};setInterval(()=>{const v=window.x_pdf_viewer;if(!v||window.__qa.viewers.has(v))return;window.__qa.viewers.add(v);Promise.resolve(v.registry).then(r=>r.getPlugin('zoom').provides().onZoomChange(e=>window.__qa.zoom.push({t:performance.now(),level:e&&e.newZoom}))).catch(()=>{});},20);
actions =
    wait_css #x-pdf-viewer embedpdf-container
    wait_eval return {ok:window.__qa.zoom.length>0};
    sleep 2000
    eval window.__qaSweep={done:false,rows:[]};(async()=>{const v=document.querySelector('#x-pdf-viewer');const host=v.querySelector('embedpdf-container');const sc=()=>[...host.shadowRoot.querySelectorAll('*')].find(e=>/(auto|scroll)/.test(getComputedStyle(e).overflowY)&&e.clientHeight>50);const s0=sc();const tree=[];const walk=(e,d)=>{if(d>4)return;for(const c of e.children){const r=c.getBoundingClientRect();tree.push({d,tag:c.tagName,w:Math.round(r.width),h:Math.round(r.height),pad:getComputedStyle(c).padding,minh:getComputedStyle(c).minHeight});walk(c,d+1);}};walk(s0,0);const content=Math.max(...tree.filter(t=>t.tag!=='DIV'||t.h<s0.clientHeight).map(t=>t.h),100);window.__qaSweep.tree=tree.slice(0,25);window.__qaSweep.start={content,cw:s0.clientWidth,ow:s0.offsetWidth,ch:s0.clientHeight,vh:v.offsetHeight,zoom:window.__qa.zoom.at(-1)};const z=window.__qa.zoom;for(let h=Math.max(150,content-60);h<=content+60;h+=5){v.style.height=h+'px';v.style.flex='none';await new Promise(r=>setTimeout(r,700));const n0=z.length;await new Promise(r=>setTimeout(r,1500));const s=sc();window.__qaSweep.rows.push({h,events:z.length-n0,levels:z.slice(n0).map(e=>e.level).slice(0,6),cw:s.clientWidth,ow:s.offsetWidth,sh:s.scrollHeight,ch:s.clientHeight});}window.__qaSweep.done=true;})();return {ok:true};
    wait_eval return {ok:window.__qaSweep.rows.length>=10};
    wait_eval return {ok:window.__qaSweep.rows.length>=20};
    wait_eval return {ok:window.__qaSweep.done,count:window.__qaSweep.rows.length};
    eval const looping=window.__qaSweep.rows.filter(r=>r.events>2);if(looping.length)throw Error('automatic zoom kept changing '+JSON.stringify(looping));return {ok:true,start:window.__qaSweep.start,tree:window.__qaSweep.tree,rows:window.__qaSweep.rows};
