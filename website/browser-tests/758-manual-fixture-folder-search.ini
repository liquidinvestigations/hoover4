[manual-fixture-folder-search]
summary = Opens a public fixture folder scope in Search.
requires_dataset = testdata_zips
url = /file_browser/testdata_zips/om5jb250YWluZXJfaGFzaGBkcGF0aGEv/9g==/9g==
actions =
	sleep 2500
	wait_text location-1
	eval const link=[...document.querySelectorAll("a")].find(a=>a.textContent.includes("Open in Search"));if(!link)throw new Error("Folder search link missing");location.href=link.href;return {ok:true};
	wait_css #x-search-input-top-bar
	wait_css .x-result-item-card
manual_asset = storage-open-in-search.png
