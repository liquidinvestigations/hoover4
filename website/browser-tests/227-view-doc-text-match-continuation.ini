[view-doc-text-match-continuation]
summary = Opens page 999 inside the PDF row that starts at page 901, shows its page marker, and types page 1200 to reach the last row.
requires_dataset = p63pages_boundaries
url = /view_
actions =
    wait_eval const i=document.querySelector('[data-text-page-input]');const p=document.querySelector('[data-text-page-position]');const t=document.querySelector('#x-document-text-viewer pre')?.innerText||'';const m=document.querySelector('[data-text-page="999"]');return {ok:i?.value==="901"&&p?.textContent.trim()==="10/12"&&t.includes("page 999")&&!!m,input:i?.value,position:p?.textContent};
    type_css [data-text-page-input] :: 1200
    press_enter
    wait_eval const i=document.querySelector('[data-text-page-input]');const p=document.querySelector('[data-text-page-position]');const t=document.querySelector('#x-document-text-viewer pre')?.innerText||'';return {ok:i?.value==="1101"&&p?.textContent.trim()==="12/12"&&t.includes("finalzebra"),input:i?.value,position:p?.textContent};
    wait_eval const b=document.querySelector('[data-text-page-controls] button[aria-label="Next Page"]');return {ok:!!b&&b.disabled===true,label:"Next Page",disabled:b?.disabled};
