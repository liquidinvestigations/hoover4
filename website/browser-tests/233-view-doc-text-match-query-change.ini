    sleep 3500
    wait_eval const i=document.querySelector('[data-text-page-input]');const t=document.querySelector('#x-document-text-viewer pre')?.innerText||'';const c=document.querySelector('[data-match-counter]')?.getAttribute('data-match-counter');const e=document.querySelector('[data-text-request-error]');const a=[...document.querySelectorAll('[data-text-match-controls] [role=alert]')].map(x=>x.innerText);const s=document.querySelector('[data-text-match-status]')?.getAttribute('data-text-match-status');const n=document.querySelector('[data-text-match-controls] button[aria-label="Next Hit"]')?.disabled;const p=document.querySelector('[data-text-match-controls] button[aria-label="Previous Hit"]')?.disabled;return {ok:i?.value==="1005"&&c==="- / -"&&window.__h4_n.find_text_match_page>=4&&n===false&&p===true&&a.length===0,input:i?.value,counter:c,error:e?.innerText||null,alert:a,status:s,next_disabled:n,previous_disabled:p,text:t.slice(0,80),calls:window.__h4_n};
    click_css button[aria-label="Next Hit"]
    wait_eval const i=document.querySelector('[data-text-page-input]');const t=document.querySelector('#x-document-text-viewer pre')?.innerText||'';const c=document.querySelector('[data-match-counter]')?.getAttribute('data-match-counter');const e=document.querySelector('[data-text-request-error]');const a=[...document.querySelectorAll('[data-text-match-controls] [role=alert]')].map(x=>x.innerText);const s=document.querySelector('[data-text-match-status]')?.getAttribute('data-text-match-status');const n=document.querySelector('[data-text-match-controls] button[aria-label="Next Hit"]')?.disabled;const p=document.querySelector('[data-text-match-controls] button[aria-label="Previous Hit"]')?.disabled;return {ok:i?.value==="1200"&&t.includes("finalzebra")&&c==="1 / 1",input:i?.value,counter:c,error:e?.innerText||null,alert:a,status:s,next_disabled:n,previous_disabled:p,text:t.slice(0,80),calls:window.__h4_n};
    eval if(window.__h4_fetch)window.fetch=window.__h4_fetch;return {ok:true};
