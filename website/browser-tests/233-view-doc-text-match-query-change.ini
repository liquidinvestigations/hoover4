[view-doc-text-match-query-change]
summary = Ignores late match steps of an earlier query after a new query, and steps with the matches of the new query.
requires_dataset = p63pages_boundaries
url = /view_
actions =
    wait_eval const i=document.querySelector('[data-text-page-input]');const t=document.querySelector('#x-document-text-viewer pre')?.innerText||'';const c=document.querySelector('[data-match-counter]')?.getAttribute('data-match-counter');const e=document.querySelector('[data-text-request-error]');const a=[...document.querySelectorAll('[data-text-match-controls] [role=alert]')].map(x=>x.innerText);const s=document.querySelector('[data-text-match-status]')?.getAttribute('data-text-match-status');const n=document.querySelector('[data-text-match-controls] button[aria-label="Next Hit"]')?.disabled;const p=document.querySelector('[data-text-match-controls] button[aria-label="Previous Hit"]')?.disabled;return {ok:i?.value==="999"&&c==="1 / 1",input:i?.value,counter:c,error:e?.innerText||null,alert:a,status:s,next_disabled:n,previous_disabled:p,text:t.slice(0,80),calls:window.__h4_n};
    eval window.__h4_fetch=window.__h4_fetch||window.fetch;window.__h4_n={};const plan={find_text_match_page:[[1500,false],[1500,false]]};window.fetch=function(u,o){const s=String(u&&u.url||u);for(const k in plan){if(s.includes('/api/'+k)){const n=(window.__h4_n[k]=(window.__h4_n[k]||0)+1);const step=plan[k][n-1];if(step){return new Promise(r=>setTimeout(r,step[0])).then(()=>step[1]?Promise.reject(new TypeError('blocked by the browser scenario')):window.__h4_fetch(u,o));}}}return window.__h4_fetch.apply(this,arguments)};return {ok:true};
    type_css [data-text-page-input] :: 1005
    press_enter
