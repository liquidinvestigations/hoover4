[manual-doc-transcript]
summary = Shows an existing conversation with its tool result groups.
url = /ai_chat/history
manual_asset = chat-transcript.png
actions =
	wait_css .x-history-show-boards
	wait_eval if(!document.querySelector("a[href^=\"/ai_chat/c/\"]"))return {incomplete:true,reason:"No conversation exists for transcript capture."};return {ok:true};
	click_css a[href^="/ai_chat/c/"]
	wait_css [data-chat-composer]
	eval document.querySelectorAll(".x-chat-tool-run-toggle").forEach(b=>{if(b.innerText.includes("Show"))b.click()});return {ok:true};
	sleep 1000
