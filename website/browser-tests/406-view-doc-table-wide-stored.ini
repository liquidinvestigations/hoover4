; The 350-column CSV fixture is stored whole, because the reader keeps up to 1000 columns.
; The grid shows its first 60 columns without a truncation notice or a clamp note.
[view-doc-table-wide-stored]
summary = Shows the first 60 columns of a stored 350-column table without a notice.
requires_dataset = testdata_wide
document_fixture = screenshot_wide_table
url = /view_document/onJjb2xsZWN0aW9uX2RhdGFzZXRtdGVzdGRhdGFfd2lkZWlmaWxlX2hhc2h4QDA3ZmI2ZTc4MWM2NzA2MmJiYzAwZjdkYTM0YjI3ODE1YWM3NWNiNzAzYWIwYjRiNmViMjI5OTA5YWNiYWM0NzM=/9g==/oWxzZWxlY3RlZF90YWJoRW50aXRpZXM=
actions =
    sleep 4000
    wait_eval const h=[...document.querySelectorAll('thead th')].map(e=>e.innerText.trim());const t=document.body.innerText;return {ok:h.length>=60&&h.length<=61&&!t.includes('larger than the browser stores')&&!document.querySelector('.x-table-banner-close'),count:h.length};
