
[qa-table-modal-backdrop]
summary = Exercises the qa table modal backdrop case.
requires_dataset = testdata_excelsc
url = /view_document/onJjb2xsZWN0aW9uX2RhdGFzZXRwdGVzdGRhdGFfZXhjZWxzY2lmaWxlX2hhc2h4QGY5NzUxZThjMjkwNzk5YmU5ZmQ0M2Y1NTQ5OTdhYzJlYWUyZDEwMThlYjc0MTUzODg2ZWZlNjM1NWNmY2EwZmU=/9g==/oWxzZWxlY3RlZF90YWJoRW50aXRpZXM=
actions =
    sleep 4000
    wait_text Order ID
    pointer_click_css thead th:nth-child(3) button[aria-label^="Filter "]
    wait_css [role="dialog"][aria-modal="true"]
    eval const dialog=document.querySelector('[role="dialog"][aria-modal="true"]');const box=dialog.parentElement.getBoundingClientRect();if(box.width!==innerWidth||box.height!==innerHeight)throw new Error('table modal backdrop coverage');window.__qa_first_dialog=dialog.getAttribute('aria-label');return {backdrop:true};
    pointer_click_css thead th:nth-child(4) button[aria-label^="Filter "]
    wait_eval return {ok: !document.querySelector('[role="dialog"]')};
    eval if(window.__h4_pointer_click.hit_matches_selector||document.querySelector('[role="dialog"]'))throw new Error('covered trigger opened a filter');return {closed:true,hit:window.__h4_pointer_click.hit_target};
    pointer_click_css thead th:nth-child(4) button[aria-label^="Filter "]
    wait_css [role="dialog"][aria-modal="true"]
    eval const dialog=document.querySelector('[role="dialog"][aria-modal="true"]');if(document.querySelectorAll('[role="dialog"][aria-modal="true"]').length!==1||dialog.getAttribute('aria-label')===window.__qa_first_dialog)throw new Error('uncovered trigger did not open one different filter');return {label:dialog.getAttribute('aria-label')};
