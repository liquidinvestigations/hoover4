
[ai-chat-german]
summary = Shows the chat page in German with the agent language control, and checks that a setting change shows after the window gets the focus.
interface_language = de
url = /ai_chat
actions =
    wait_css [lang="de"] [data-chat-composer]
    wait_eval return {ok:document.querySelector('[data-chat-composer]').placeholder==='Fragen Sie den Bot…',placeholder:document.querySelector('[data-chat-composer]').placeholder};
    wait_eval const a=document.querySelector('a.x-agent-language');return {ok:!!a&&a.dataset.agentLanguage==='de'&&a.getAttribute('target')==='_blank'&&a.getAttribute('href')==='/settings/language',code:a?.dataset.agentLanguage};
    eval window.__qaSettings=window.open('/settings/language','_blank');return {ok:!!window.__qaSettings};
    wait_eval const b=window.__qaSettings.document.querySelector('#x-settings-agent-choices [data-language="fr"]');return {ok:!!b};
    eval window.__qaSettings.document.querySelector('#x-settings-agent-choices [data-language="fr"]').click();return {ok:true};
    wait_eval return {ok:window.__qaSettings.document.querySelector('#x-settings-agent-choices [data-language="fr"]').getAttribute('aria-checked')==='true'};
    eval window.dispatchEvent(new Event('focus'));return {ok:true};
    wait_eval return {ok:document.querySelector('a.x-agent-language').dataset.agentLanguage==='fr'};
    eval window.__qaSettings.document.querySelector('#x-settings-agent-choices [data-language=""]').click();return {ok:true};
    wait_eval return {ok:window.__qaSettings.document.querySelector('#x-settings-agent-choices [data-language=""]').getAttribute('aria-checked')==='true'};
    eval window.__qaSettings.close();window.dispatchEvent(new Event('focus'));return {ok:true};
    wait_eval const a=document.querySelector('a.x-agent-language');return {ok:a.dataset.agentLanguage===document.querySelector('[lang]').getAttribute('lang'),code:a.dataset.agentLanguage};
    sleep 600
