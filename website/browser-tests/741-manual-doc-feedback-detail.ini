[manual-doc-feedback-detail]
summary = Shows one existing feedback report and its controls.
url = /admin/feedback?status=all&page=1
actions =
	wait_css #x-feedback-count
	wait_eval if(!document.querySelector(".x-feedback-title"))return {incomplete:true,reason:"No feedback report exists for detail capture."};return {ok:true};
	click_css .x-feedback-title
	wait_css .x-feedback-detail
manual_asset = admin-feedback-detail.png
