[storage-collection-search]
summary = Verifies the name search of a collection page on its second page, the previous page link and Back.
requires_dataset = testdata_shapes
url = /file_browser/c/testdata?q=many-a-child&page=1
actions =
    wait_css .x-storage-search-row
    wait_eval return (document.querySelector('.x-storage-search-summary')?.innerText || '').includes('Page 2');
    wait_eval return [...document.querySelectorAll('.x-storage-search-row td:nth-child(2)')].every(c => c.title.startsWith('testdata_'));
    click_css .x-storage-search-previous
    wait_eval return location.search.includes('page=0') && (document.querySelector('.x-storage-search-summary')?.innerText || '').includes('Page 1');
    history_back
    wait_eval return location.search.includes('page=1') && (document.querySelector('.x-storage-search-summary')?.innerText || '').includes('Page 2');
