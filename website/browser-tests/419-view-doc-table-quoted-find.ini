; ---------------------------------------------------------------- the table browser

[view-doc-table-quoted-find]
summary = Verifies quoted exact table find and Unicode cell highlights.
requires_dataset = testdata_manualqa
document_fixture = manual_table_substitute
url = /view_document/onJjb2xsZWN0aW9uX2RhdGFzZXRxdGVzdGRhdGFfbWFudWFscWFpZmlsZV9oYXNoeEAyOTU0NmExNDVmZGFiYWE4YzVjMTE2NWU4ZjJiZThhNjc2ZTgyNjcwMGQ3ZjQzZjI5ZTk2NDY1NDJjNWI4MDg3/9g==/oWxzZWxlY3RlZF90YWJoRW50aXRpZXM=
actions =
    wait_text A-01
    type_css input[placeholder="Search in document"] :: "Iași"
    press_enter
    wait_eval const rows=[...document.querySelectorAll('tbody tr')];return {ok:rows.length===1&&rows[0].innerText.includes('Iași')&&[...rows[0].querySelectorAll('span')].some(span=>span.innerText==='Iași'&&span.style.background)};
    type_css input[placeholder="Search in document"] :: “Cluj”
    press_enter
    wait_eval const rows=[...document.querySelectorAll('tbody tr')];return {ok:rows.length===1&&rows[0].innerText.includes('Cluj')&&!rows[0].innerText.includes('Iași')};
    type_css input[placeholder="Search in document"] :: A-01
    press_enter
    wait_eval const rows=[...document.querySelectorAll('tbody tr')];return {ok:rows.length===1&&rows[0].innerText.includes('A-01')};
