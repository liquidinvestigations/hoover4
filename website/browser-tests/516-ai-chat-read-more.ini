; ---------------------------------------------------------------- chat

[ai-chat-read-more]
summary = Selects the named continuation chat and checks its source and part number.
url = /ai_chat/c/{{chat_fixture:read_more}}/9g==/9g==
actions =
    eval document.querySelectorAll('.x-chat-tool-run-toggle').forEach(button=>{if(button.innerText.includes('Show'))button.click()});return {ok:true};
    wait_eval const cards=[...document.querySelectorAll('[data-card-chip="Search"],[data-card-chip="Read"]')];return {ok:cards.some(card=>/read_more · part 2 of (search_collections|search_passages|read_documents) #\d+/.test(card.innerText))};
