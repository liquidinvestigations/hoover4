; A search for a value that is only on a later sheet of a workbook opens the table on
; that sheet. The header is one row that fits the pane. The sheet chooser is a dialog that
; counts the matching rows of each sheet.
[search-table-sheet-hits]
summary = Opens a workbook match on its sheet and counts matches per sheet in the chooser.
requires_dataset = testdata_polpro
url = /search/o3Njb2xsZWN0aW9uX2RhdGFzZXRzgGxxdWVyeV9zdHJpbmdrSkVSQUggQ0FMRUJtZmFjZXRfZmlsdGVyc6A=/0/9g==/9g==
actions =
    wait_text_in #x-search-results-left-panel :: Pol Pro 2014-2019.xlsx
    click_text_in #x-search-results-left-panel :: Pol Pro 2014-2019.xlsx
    wait_css .x-table-sheet-button
    wait_eval const p=document.querySelector('#x-search-results-right-panel');const rows=p.querySelectorAll('tbody tr').length;return {ok:rows>0&&!p.innerText.includes('No rows match'),rows,sheet:document.querySelector('.x-table-sheet-button').innerText};
    wait_eval const bar=document.querySelector('.x-preview-subtitle-bar');const f=bar.querySelector('input').getBoundingClientRect();const b=document.querySelector('.x-table-sheet-button').getBoundingClientRect();return {ok:Math.abs((f.top+f.bottom)/2-(b.top+b.bottom)/2)<6&&bar.scrollWidth<=bar.clientWidth+1,find:[f.top,f.width],sheet:[b.top,b.width],scroll:[bar.scrollWidth,bar.clientWidth]};
    wait_eval const t=document.querySelector('#x-search-results-right-panel').innerText;return {ok:!t.includes('xlsx ·')&&!t.includes('· xlsx'),text:t.slice(0,300)};
    click_css .x-table-sheet-button
    wait_css [role="dialog"] .x-table-sheet-option
    wait_eval const o=[...document.querySelectorAll('.x-table-sheet-option')];const hits=o.map(x=>Number(x.querySelector('.x-table-sheet-hits')?.innerText||0));const sel=o.find(x=>x.getAttribute('aria-selected')==='true');return {ok:o.length===11&&hits.reduce((a,b)=>a+b,0)>0&&Number(sel.querySelector('.x-table-sheet-hits').innerText)>0,hits};
