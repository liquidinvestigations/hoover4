; Both dividers of the document view are dragged, and their widths are remembered
; after a reload. The last action clears the keys.
[view-doc-dividers]
summary = Drags both dividers of the document view and restores their widths after a reload.
requires_dataset = testdata_testfiles
url = /view_document/onJjb2xsZWN0aW9uX2RhdGFzZXRydGVzdGRhdGFfdGVzdGZpbGVzaWZpbGVfaGFzaHhAZDIxY2NmZjViMTZmMTVlOTkxNDhiYzNmYWFhMmEyOTc1YjA3MWExOGZiZDE1NjJjOWE0MjljNjM0YWQzYWVlMw==/9g==/oWxzZWxlY3RlZF90YWJoRW50aXRpZXM=
actions =
    wait_css #x-document-details-resize
    eval localStorage.removeItem('hoover4.document-sources-width-css-px');localStorage.removeItem('hoover4.document-details-width-css-px');return {ok:true};
    eval const h=document.querySelector('#x-document-sources-resize');window.__w0=h.parentElement.getBoundingClientRect().width;const r=h.getBoundingClientRect();window.__x=r.left+3;h.dispatchEvent(new MouseEvent('mousedown',{bubbles:true,cancelable:true,clientX:window.__x,clientY:r.top+40,button:0}));return {ok:true,w0:window.__w0};
    sleep 300
    eval const o=[...document.querySelectorAll('div')].find(d=>d.style.position==='fixed'&&d.style.cursor==='col-resize');if(!o)throw new Error('no drag overlay');o.dispatchEvent(new MouseEvent('mousemove',{bubbles:true,clientX:window.__x+(-40),clientY:300}));return {ok:true};
    sleep 300
    eval const o=[...document.querySelectorAll('div')].find(d=>d.style.position==='fixed'&&d.style.cursor==='col-resize');o.dispatchEvent(new MouseEvent('mouseup',{bubbles:true,clientX:window.__x,clientY:300}));return {ok:true};
    wait_eval const w=document.querySelector('#x-document-sources-resize').parentElement.getBoundingClientRect().width;const s=Number(localStorage.getItem('hoover4.document-sources-width-css-px'));return {ok:Math.abs(w-window.__w0)>=30&&Math.abs(s-w)<=1,w,s,w0:window.__w0};
    eval const h=document.querySelector('#x-document-details-resize');window.__w0=h.parentElement.getBoundingClientRect().width;const r=h.getBoundingClientRect();window.__x=r.left+3;h.dispatchEvent(new MouseEvent('mousedown',{bubbles:true,cancelable:true,clientX:window.__x,clientY:r.top+40,button:0}));return {ok:true,w0:window.__w0};
    sleep 300
    eval const o=[...document.querySelectorAll('div')].find(d=>d.style.position==='fixed'&&d.style.cursor==='col-resize');if(!o)throw new Error('no drag overlay');o.dispatchEvent(new MouseEvent('mousemove',{bubbles:true,clientX:window.__x+(100),clientY:300}));return {ok:true};
    sleep 300
    eval const o=[...document.querySelectorAll('div')].find(d=>d.style.position==='fixed'&&d.style.cursor==='col-resize');o.dispatchEvent(new MouseEvent('mouseup',{bubbles:true,clientX:window.__x,clientY:300}));return {ok:true};
    wait_eval const w=document.querySelector('#x-document-details-resize').parentElement.getBoundingClientRect().width;const s=Number(localStorage.getItem('hoover4.document-details-width-css-px'));return {ok:Math.abs(w-window.__w0)>=30&&Math.abs(s-w)<=1,w,s,w0:window.__w0};
    goto /view_document/onJjb2xsZWN0aW9uX2RhdGFzZXRydGVzdGRhdGFfdGVzdGZpbGVzaWZpbGVfaGFzaHhAZDIxY2NmZjViMTZmMTVlOTkxNDhiYzNmYWFhMmEyOTc1YjA3MWExOGZiZDE1NjJjOWE0MjljNjM0YWQzYWVlMw==/9g==/oWxzZWxlY3RlZF90YWJoRW50aXRpZXM=
    wait_css #x-document-details-resize
    wait_eval const h=document.querySelector('#x-document-sources-resize');if(!h)return {ok:false};const w=h.parentElement.getBoundingClientRect().width;const s=Number(localStorage.getItem('hoover4.document-sources-width-css-px'));return {ok:s>0&&Math.abs(s-w)<=1,w,s};
    wait_eval const h=document.querySelector('#x-document-details-resize');if(!h)return {ok:false};const w=h.parentElement.getBoundingClientRect().width;const s=Number(localStorage.getItem('hoover4.document-details-width-css-px'));return {ok:s>0&&Math.abs(s-w)<=1,w,s};
    eval localStorage.removeItem('hoover4.document-sources-width-css-px');localStorage.removeItem('hoover4.document-details-width-css-px');return {ok:true};
