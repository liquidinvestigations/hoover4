[signal-terms]
summary = Verifies category definitions, calibration, recall notes, and expandable terms.
url = /red_flag_terms
actions =
    wait_text Red flag terms
    wait_eval const main=document.querySelector('main.x-signal-terms');const heading=main?.querySelector('h1');return {ok:!!heading&&parseFloat(getComputedStyle(heading).fontSize)>parseFloat(getComputedStyle(main).fontSize)&&getComputedStyle(main).overflowY==='auto'};
    wait_eval const categories=[...document.querySelectorAll('main > section[id]')];const notes=categories.flatMap(e=>[...e.querySelectorAll('[role="note"]')]);return {ok:categories.length===26&&notes.length===5&&categories.every(e=>e.innerText.includes('8 points')&&e.innerText.includes('2 distinct concepts')),categories:categories.length,notes:notes.length};
    click_css #bribery details summary
    wait_eval const rows=[...document.querySelectorAll('#bribery details[open] tbody tr')];return {ok:rows.length>0&&rows.every(row=>row.cells.length===5&&row.cells[1].textContent.match(/^[LMH]$/)),rows:rows.length};
    wait_eval const cell=document.querySelector('#bribery td');return {ok:parseFloat(getComputedStyle(cell).paddingLeft)>=12};
    eval const main=document.querySelector('main.x-signal-terms');main.scrollTop=main.scrollHeight;return true;
    wait_eval const main=document.querySelector('main.x-signal-terms');const last=main.querySelector('section:last-child');const bounds=main.getBoundingClientRect();const end=last.getBoundingClientRect();return {ok:main.scrollTop>0&&end.bottom<=bounds.bottom+2&&end.bottom>bounds.top};
    eval document.querySelector('main.x-signal-terms').scrollTop=0;return true;
