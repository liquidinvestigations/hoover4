; A JSON Lines file opens as a table. The nested object becomes the dot-path columns
; user.name and user.city, and the array stays one JSON text cell.
[view-doc-table-json-lines]
summary = Opens a JSON Lines file as a table with dot-path columns.
requires_dataset = p73tables_fixtures
url = /view_document/onJjb2xsZWN0aW9uX2RhdGFzZXRycDczdGFibGVzX2ZpeHR1cmVzaWZpbGVfaGFzaHhANDZmZjUyNTA5Y2UyNmM0YTlhZGI3YTIzNDNjMGE5NTA5Y2Q4MGUzZGEwODljMDg2NGFmY2JkMmJmMThjMGM1MQ==/9g==/oWxzZWxlY3RlZF90YWJoRW50aXRpZXM=
actions =
    wait_text user.name
    wait_eval const h=[...document.querySelectorAll('thead th')].map(e=>e.innerText.trim());const t=document.querySelector('tbody').innerText;return {ok:h.some(x=>x.includes('user.city'))&&h.some(x=>x.includes('tags'))&&t.includes('n1')&&t.includes('["a","b"]'),headers:h};
