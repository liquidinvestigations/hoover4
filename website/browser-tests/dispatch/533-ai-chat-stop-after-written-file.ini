[ai-chat-stop-after-written-file]
summary = Presses the stop button while a held turn waits before its second file write, and shows only the first written file in the ending row.
url = /ai_chat/history
actions =
	wait_text Browser check: stop after one written file
	click_text Browser check: stop after one written file
	wait_css button[title^="Stop the answer"]
	click_css button[title^="Stop the answer"]
	wait_text This turn was stopped.
	wait_eval const files=[...document.querySelectorAll('[data-chat-file]')].map(e=>e.getAttribute('data-chat-file'));const list=document.querySelector('[data-chat-files]');return {ok:JSON.stringify(files)==='["a.md:1"]'&&list?.getAttribute('data-chat-files')==='1'&&!document.body.innerText.includes('b.md, version'),files,stop:!!document.querySelector('button[title^="Stop the answer"]')};
	click_css [data-chat-file="a.md:1"]
	wait_text Text of a.md.
