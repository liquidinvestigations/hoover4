[storage-release-delete]
summary = Verify deleting a disposable dataset invalidates the shared storage tree.
requires_dataset = release_browser_disposable
url = /file_browser
init_script = window.__deleteStorageReads=0;window.__deleteFetch=window.fetch;window.fetch=function(u,o){if(String(u&&u.url||u).includes('/api/list_storage_tree'))window.__deleteStorageReads++;const watched=String(u&&u.url||u).includes("/api/admin_delete_dataset");return window.__deleteFetch.apply(this,arguments).then(r=>{if(watched)window.__deleteStatus=r.status;return r;});};
actions =
    wait_text Delete this dataset
    eval history.pushState(null,'','/admin/collections/release_browser/datasets/release_browser_disposable');window.dispatchEvent(new PopStateEvent('popstate'));return {ok:true};
    wait_text Delete dataset and its data
    eval window.__deleteStarted=Date.now();return {ok:true};
    click_text Delete dataset and its data
    wait_eval return {ok:window.__deleteStatus!==undefined||Date.now()-window.__deleteStarted>=20000};
    wait_eval return {ok:window.__deleteStatus!==undefined||Date.now()-window.__deleteStarted>=40000};
    wait_eval return {ok:window.__deleteStorageReads===2,requests:window.__deleteStorageReads};
    eval const error=document.querySelector(".x-error-bar");return {ok:window.__deleteStatus<400||!!error,status:window.__deleteStatus,visibleError:error?.innerText||""};
    eval history.pushState(null,'','/file_browser');window.dispatchEvent(new PopStateEvent('popstate'));return {ok:true};
    wait_css #x-storage-tree
    wait_eval return {ok:!document.querySelector('#x-storage-tree').innerText.includes('Delete this dataset')&&window.__deleteStorageReads===2,requests:window.__deleteStorageReads};
