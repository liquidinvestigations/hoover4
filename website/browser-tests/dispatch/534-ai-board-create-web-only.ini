; Creates a web-only board: every collection is cleared with the Collections checkbox, the
; internet tools stay on, and Create board opens the new board. The board starts explores, so
; pause it after the run. The case needs the internet tools of the deployment. Its one viewport
; keeps the run to one board.
[ai-board-create-web-only]
summary = Creates a board without collections, with internet tools, and opens it.
url = /ai_chat/boards/new
viewport = 1920x1080
actions =
    wait_css .x-board-collections-all
    wait_eval if(!document.querySelector('.x-board-internet-tools'))return {incomplete:true,reason:'the deployment has no internet tools'};return {ok:document.querySelector('.x-board-internet-tools').checked};
    click_css .x-board-collections-all
    wait_eval return {ok:[...document.querySelectorAll('.x-board-collection')].every(b=>!b.checked)&&!document.querySelector('.x-board-source-error')};
    type_css .x-board-title :: Web-only board check
    type_css .x-board-goal :: Which company operates the Harlow paper mill, according to public sources?
    click_css .x-board-create
    wait_eval return {ok:/\/ai_chat\/boards\/[0-9a-f]{32}/.test(location.pathname),path:location.pathname};
    wait_css .x-board-statistics
    wait_eval const dd=[...document.querySelectorAll('.x-board-stats dt')].find(d=>d.innerText.trim()==='Collections');return {ok:!!dd&&dd.nextElementSibling.innerText.trim()==='None'};
