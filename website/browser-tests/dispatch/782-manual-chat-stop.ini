[manual-chat-stop]
summary = Stops the latest demo conversation and shows its persisted marker.
url = /ai_chat/history
manual_asset = chat-stopped.png
actions =
	wait_css .x-history-show-boards
	click_css a[href^="/ai_chat/c/"]
	wait_css button[title^="Stop the answer"]
	click_css button[title^="Stop the answer"]
	wait_text This turn was stopped.
	eval const p=document.querySelector("#x-chat-transcript");p.scrollTop=p.scrollHeight;return {ok:true};
