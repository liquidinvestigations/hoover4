; ---------------------------------------------------------------- processing updates
; This scenario starts a processing update operation on a dataset.

[admin-dataset-update-processing]
summary = Selects the waiting update steps of a dataset and starts Update processing.
requires_dataset = testdata_testfiles
url = /admin/collections/testdata/datasets/testdata_testfiles
actions =
    wait_css .x-processing-updates .x-update-step
    wait_eval const b=document.querySelector('.x-update-processing');return {ok:!!b&&!b.disabled,summary:document.querySelector('.x-updates-summary')?.innerText};
    click_css .x-update-processing
    wait_text Update started
    eval return {ok:true,status:document.querySelector('.x-updates-status')?.innerText,message:[...document.querySelectorAll('.x-processing-updates p, .x-processing-updates div')].map(e=>e.innerText).find(t=>t.startsWith('Update started'))};
