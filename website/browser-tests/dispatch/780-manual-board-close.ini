[manual-board-close]
summary = Accepts the remaining proposed answers and completes the selected demo board.
url = /ai_chat/boards/d05d4de8c1f9e55871d97791e49952f1?zoom=50
manual_asset = board-review-complete.png
actions =
	wait_css .x-board-review
	eval const b=[...document.querySelectorAll("button")].find(b=>b.innerText==="Close the board");if(!b)throw new Error("Close board control missing");b.click();return {ok:true};
	wait_eval return {ok:document.querySelectorAll(".x-board-goal-answer[data-answer=\"accepted\"]").length===3&&!document.querySelector(".x-board-accept-answer")&&document.body.innerText.includes("Completed")};
