[storage-release-shared-names]
summary = Verify shared metadata requests through route changes and collection rename refresh.
url = /file_browser
requires_dataset = release_browser_primary
init_script = window.__storageRequests=0;window.__sessionRequests=0;window.__fixtureFetch=window.fetch;window.fetch=function(u,o){const s=String(u&&u.url||u);if(s.includes('/api/list_storage_tree'))window.__storageRequests++;if(s.includes('/api/whoami'))window.__sessionRequests++;return window.__fixtureFetch.apply(this,arguments);};
actions =
    wait_css #x-storage-tree
    wait_eval return {ok:window.__storageRequests===1,requests:window.__storageRequests};
    eval history.pushState(null,"","/admin/collections/release_browser");window.dispatchEvent(new PopStateEvent("popstate"));return {ok:true};
    wait_css input[placeholder="display name"]
    eval window.__originalCollectionName=document.querySelector('input[placeholder="display name"]').value;return {ok:true};
    type_css input[placeholder="display name"] :: Browser renamed collection
    click_text Save
    wait_eval return {ok:window.__storageRequests===2,requests:window.__storageRequests};
    eval history.pushState(null,"","/file_browser");window.dispatchEvent(new PopStateEvent("popstate"));return {ok:true};
    wait_text Browser renamed collection
    wait_eval return {ok:window.__storageRequests===2,requests:window.__storageRequests};
    eval history.pushState(null,"","/admin/collections/release_browser");window.dispatchEvent(new PopStateEvent("popstate"));return {ok:true};
    wait_css input[placeholder="display name"]
    eval const e=document.querySelector('input[placeholder="display name"]');Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,"value").set.call(e,window.__originalCollectionName);e.dispatchEvent(new Event("input",{bubbles:true}));return {ok:true};
    click_text Save
    wait_eval return {ok:window.__storageRequests===3,requests:window.__storageRequests};
    eval history.pushState(null,"","/file_browser");window.dispatchEvent(new PopStateEvent("popstate"));return {ok:true};
    wait_css #x-storage-tree
    wait_eval return {ok:window.__storageRequests===3,requests:window.__storageRequests};
    wait_eval return {ok:document.querySelector("#x-storage-tree").innerText.includes(window.__originalCollectionName)&&!document.querySelector("#x-storage-tree").innerText.includes("Browser renamed collection")};
