; ---------------------------------------------------------------- chat
; This scenario sends a chat message, which sends a model request.

[chat-live-group]
summary = Sends a chat message and shows its live tool group with a running timer.
url = /ai_chat
actions =
    wait_css textarea
    type_css textarea :: Summarise the documents in my collections.
    click_css button[title="Send"]
    wait_css .x-chat-tool-run
    eval const group=document.querySelector('.x-chat-tool-run');const counter=group?.querySelector('button')?.innerText.match(/(\d+)s/);if(!counter||!group.innerText.includes('running'))throw new Error('No running group timer');window.__liveCounter=Number(counter[1]);return {ok:true,before:window.__liveCounter};
    sleep 3000
    wait_eval const group=document.querySelector('.x-chat-tool-run');const counter=group?.querySelector('button')?.innerText.match(/(\d+)s/);return {ok:!!counter&&Number(counter[1])>window.__liveCounter&&![...document.querySelectorAll('[data-card-chip]')].some(card=>!card.closest('.x-chat-tool-run')&&!card.closest('[data-todo-change]')),before:window.__liveCounter,after:counter?Number(counter[1]):null};
