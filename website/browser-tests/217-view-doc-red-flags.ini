[view-doc-red-flags]
summary = Verifies the document signal section and its category definition link.
requires_dataset = testdata_testfiles
url = /view_document/onJjb2xsZWN0aW9uX2RhdGFzZXRydGVzdGRhdGFfdGVzdGZpbGVzaWZpbGVfaGFzaHhAZDIxY2NmZjViMTZmMTVlOTkxNDhiYzNmYWFhMmEyOTc1YjA3MWExOGZiZDE1NjJjOWE0MjljNjM0YWQzYWVlMw==/9g==/oWxzZWxlY3RlZF90YWJoRW50aXRpZXM=
actions =
    wait_css [data-red-flags="true"]
    wait_eval const section=document.querySelector('[data-red-flags="true"]');const link=section.querySelector('a[aria-label="View category definitions and terms"]');return {ok:!!section.querySelector('h3')&&link?.getAttribute('href')==='/red_flag_terms'&&link?.target==='_blank'&&section.innerText.includes('Other hits'),text:section.innerText};
    wait_eval const section=document.querySelector('[data-red-flags="true"]');const link=section.querySelector('h3 a');const icon=link?.querySelector('svg');const text=[...link.childNodes].find(e=>e.nodeType===Node.TEXT_NODE&&e.textContent.includes('Red flags'));return {ok:!!icon&&!!text&&!!(icon.compareDocumentPosition(text)&Node.DOCUMENT_POSITION_FOLLOWING)&&getComputedStyle(link).display==='inline-flex'&&parseFloat(getComputedStyle(link).fontSize)===14&&parseFloat(getComputedStyle(link).fontWeight)>=700};
