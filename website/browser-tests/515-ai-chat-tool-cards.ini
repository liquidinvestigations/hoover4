; ---------------------------------------------------------------- chat

[ai-chat-tool-cards]
summary = Selects the named cards chat and checks search, read, citation, and document actions.
url = /ai_chat/c/{{chat_fixture:cards}}/9g==/9g==
actions =
    wait_eval return {ok:!document.querySelector('[data-chat-document-pane]')};
    wait_css [data-chat-answer]
    wait_eval return {ok:!document.querySelector('[data-chat-answer-status]')};
    wait_css [data-citation-search-term]
    wait_eval const term=document.querySelector('[data-citation-search-term]');const passage=document.querySelector('[data-chat-answer] [data-citation-search-snippet]');return {ok:term.getAttribute('data-citation-search-term').includes('energy density')&&!!term.querySelector('a[href^="/search/"] strong em code')&&!!passage?.querySelector('[data-highlighted="true"]')};
    wait_css .x-chat-tool-run-toggle
    eval document.querySelectorAll('.x-chat-tool-run-toggle').forEach(button=>{if(button.innerText.includes('Show'))button.click()});return {ok:true};
    wait_css [data-card-chip="Search"]
    wait_css [data-card-chip="Read"]
    wait_css [data-card-chip="Cite"]
    eval for(const chip of ['Search','Read','Cite']){const card=document.querySelector(`[data-card-chip="${chip}"]`);const button=[...card.querySelectorAll('button')].find(button=>button.innerText==='Expand');if(button)button.click()}return {ok:true};
    wait_eval const cards=['Search','Read','Cite'].map(chip=>document.querySelector(`[data-card-chip="${chip}"]`));return {ok:cards.every(card=>card&&card.innerText.includes('Show raw JSON'))};
    wait_eval const card=document.querySelector('[data-card-chip="Search"]');return {ok:!!card&&/\d+ forms/.test(card.innerText)&&card.innerText.includes('Form 0:')&&card.innerText.includes('path:')&&!!card.querySelector('a[href^="/search/"]')};
    wait_eval const card=document.querySelector('[data-card-chip="Read"]');return {ok:!!card&&card.innerText.includes('page:')&&card.innerText.includes('hit_count:')&&card.innerText.includes('Show full text')};
    wait_eval const card=document.querySelector('[data-card-chip="Cite"]');return {ok:!!card&&card.innerText.includes('Quote:')&&card.innerText.includes('Reason:')&&card.innerText.includes('Quote found')};
    eval const card=document.querySelector('[data-card-chip="Search"]');const button=[...card.querySelectorAll('button')].find(button=>/^[a-f0-9]{16,64}$/.test(button.innerText.trim()));if(!button)throw new Error('No document link');window.__cards_initial_path=window.location.pathname;window.__cards_clicked_hash=button.innerText.trim();button.click();return {ok:true,hash:window.__cards_clicked_hash,initial:window.__cards_initial_path};
    wait_css [data-chat-document-pane]
    wait_eval const parts=window.location.pathname.split('/').filter(Boolean);if(parts[0]!=='ai_chat'||parts[1]!=='c'||window.location.pathname===window.__cards_initial_path)return {ok:false};const encoded=parts[3];if(!encoded)return {ok:false};const bytes=atob(encoded.replace(/-/g,'+').replace(/_/g,'/'));return {ok:bytes.includes(window.__cards_clicked_hash),selected:window.__cards_clicked_hash};
    wait_eval const card=document.querySelector('[data-card-chip="Search"]');return {ok:!!card&&[...card.querySelectorAll('a[href^="/search/"]')].some(link=>link.innerText.trim()==='Search this')};
    eval const card=document.querySelector('[data-card-chip="Search"]');const link=[...card.querySelectorAll('a[href^="/search/"]')].find(link=>link.innerText.trim()==='Search this');if(!link)throw new Error('No scoped search link');const route=new URL(link.href).pathname.split('/')[2];const bytes=Uint8Array.from(atob(route.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));let at=0;const read=()=>{const head=bytes[at++],kind=head>>5,size=head&31;const length=()=>size<24?size:size===24?bytes[at++]:size===25?(bytes[at++]<<8)|bytes[at++]:size===26?((bytes[at++]<<24)|(bytes[at++]<<16)|(bytes[at++]<<8)|bytes[at++])>>>0:(()=>{throw new Error('Unsupported CBOR length')})();if(kind===7)return size===20?false:size===21?true:size===22?null:(()=>{throw new Error('Unsupported CBOR value')})();const n=length();if(kind===0)return n;if(kind===1)return -1-n;if(kind===2){const value=bytes.slice(at,at+n);at+=n;return value}if(kind===3){const value=new TextDecoder().decode(bytes.slice(at,at+n));at+=n;return value}if(kind===4)return Array.from({length:n},read);if(kind===5){const value={};for(let i=0;i<n;i++)value[read()]=read();return value}if(kind===6)return read();throw new Error('Unsupported CBOR kind')};const query=read();const selected=query?.facet_filters?.collection_dataset?.map(value=>typeof value==='string'?value:value?.String);if(!selected?.length||selected.some(value=>typeof value!=='string'||!value))throw new Error('No selected dataset in scoped route');window.__cards_expected_route=route;window.__cards_expected_datasets=selected.sort();link.click();return {ok:true,selected:window.__cards_expected_datasets};
    wait_eval const chip=[...document.querySelectorAll('#x-filter-chips [title]')].find(node=>node.innerText.includes('Collections'));const selected=chip?.getAttribute('title')?.split(', ').filter(Boolean).sort()||[];const route=window.location.pathname.split('/')[2];return {ok:window.location.pathname.startsWith('/search/')&&route===window.__cards_expected_route&&JSON.stringify(selected)===JSON.stringify(window.__cards_expected_datasets),selected,expected:window.__cards_expected_datasets};
