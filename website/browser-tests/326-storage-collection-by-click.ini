; `storage-collection-landing` says whether a difference is in the page or in the wiring.
[storage-collection-by-click]
summary = Exercises the storage collection by click case.
requires_dataset = testdata_shapes
url = /file_browser/testdata_shapes/om5jb250YWluZXJfaGFzaGBkcGF0aGEv/9g==/9g==
actions =
    sleep 2500
    click_text_in #x-storage-tree :: testdata
    sleep 2500
    wait_text Total size
