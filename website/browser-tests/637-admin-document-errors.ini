; A dataset's error count on the Collections page links to the document errors of that
; dataset on the Errors/Failures page, with the same count.
[admin-document-errors]
summary = Follows a dataset error count to its document errors and compares the counts.
url = /admin/collections
actions =
    wait_css #datasets table
    eval const a=document.querySelector('#datasets .x-admin-error-count');if(!a)return {incomplete:true,reason:'no dataset has errors on this stack'};sessionStorage.setItem('x-test-error-count',a.innerText.trim());a.click();return {ok:true};
    wait_css #document-errors #x-doc-errors-table
    wait_eval const c=sessionStorage.getItem('x-test-error-count');const p=document.querySelector('#x-doc-errors-page')?.innerText||'';const ds=document.querySelector('#x-doc-errors-dataset').value;return {ok:ds!==''&&p.endsWith(', '+c+(c==='1'?' error':' errors'))&&location.hash==='#document-errors',page:p,dataset:ds};
    wait_eval const rows=[...document.querySelectorAll('.x-doc-errors-row')];const ds=document.querySelector('#x-doc-errors-dataset').value;return {ok:rows.length>0&&rows.every(r=>r.children[1].innerText.trim()===ds),rows:rows.length};
