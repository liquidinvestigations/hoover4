
; Scrubbed copy is on the failed reruns import tree, with the copy control beside it.
[admin-failure-scrubbed]
summary = Exercises the scrubbed-copy control on a failure tree.
url = /admin/operations
full_page = true
actions =
    wait_css #x-ops-filter-collection
    eval const el=document.querySelector('#x-ops-filter-collection');const s=Object.getOwnPropertyDescriptor(window.HTMLSelectElement.prototype,'value').set;s.call(el,'reruns');el.dispatchEvent(new Event('change',{bubbles:true}));return {ok:true};
    wait_css .x-ops-failure-link
    click_css .x-ops-failure-link
    wait_css #x-failures-copy-scrubbed
    wait_css #x-failures-scrubbed-copy
    wait_text The scrubbed copy is for handing a failure
    sleep 800
