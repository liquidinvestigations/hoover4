
; A second term field through the same path: `file_types` ids resolved to `doc`. One
; page per term field would be six; two is enough to say the map is consulted rather
; than a string being hard-coded at one call site.
[search-filetype-chip]
summary = Exercises the search filetype chip case.
requires_dataset = any
url = /search/o3Njb2xsZWN0aW9uX2RhdGFzZXRzgGxxdWVyeV9zdHJpbmdpZWFzeWNoYWlybWZhY2V0X2ZpbHRlcnOg/0/9g==/9g==
actions =
    sleep 1500
    click_css #x-search-open-filters
    wait_text All filters
    click_text File types
    sleep 1200
    click_text_in #x-filter-modal :: doc
    sleep 800
    click_text Show
    sleep 2500
    wait_text_in #x-filter-chips :: doc
