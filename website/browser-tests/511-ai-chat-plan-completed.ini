; ---------------------------------------------------------------- chat

[ai-chat-plan-completed]
summary = Opens the named completed plan and shows its section and final answer.
url = /ai_chat/c/{{chat_fixture:plan_completed}}/9g==/9g==
actions =
    wait_css [data-plan-state="completed"]
    wait_eval const cards=[...document.querySelectorAll('[data-plan-state="completed"]')];const card=cards.at(-1);const answers=document.querySelectorAll('[data-chat-answer]');return {ok:!!card&&!card.querySelector('[data-plan-stale]')&&card.innerText.includes('Read the sample document.')&&answers.length>=2};
    sleep 1500
