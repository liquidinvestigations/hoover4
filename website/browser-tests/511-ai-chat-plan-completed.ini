; ---------------------------------------------------------------- chat

[ai-chat-plan-completed]
summary = Opens the newest conversation after its plan ended and shows the card with each section and the final report.
url = /ai_chat/history
actions =
    wait_css a[href^="/ai_chat/c/"]
    click_css a[href^="/ai_chat/c/"]
    wait_css [data-plan-state="completed"]
    sleep 1500
