
; ---------------------------------------------------------------- entry points

[home]
summary = Exercises the home case.
url = /
manual_asset = home.png
actions =
    wait_text Hoover
    wait_eval const rail=document.querySelector('#x-nav-sidebar');const r=rail.getBoundingClientRect();const style=getComputedStyle(rail);const logo=rail.querySelector('img').getBoundingClientRect();const icons=[...rail.querySelectorAll('svg')].map(e=>e.getBoundingClientRect());const page=document.querySelector('#x-page-container').getBoundingClientRect();return {ok:r.width===46&&style.padding==='4px'&&style.borderRightWidth==='0px'&&logo.left>=r.left&&logo.right<=r.right&&icons.every(i=>Math.abs((i.left+i.right)/2-(r.left+r.right)/2)<=1)&&Math.abs(page.left-r.right)<=1,width:r.width,padding:style.padding,logo:[logo.left,logo.right],pageLeft:page.left,railRight:r.right};
