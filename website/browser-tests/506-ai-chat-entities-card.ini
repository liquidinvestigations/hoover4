; ---------------------------------------------------------------- chat

[ai-chat-entities-card]
summary = Opens a named conversation and shows the paged document entities card.
url = /ai_chat/c/{{chat_fixture:entities}}/9g==/9g==
actions =
    wait_css .x-chat-tool-run-toggle
    eval document.querySelectorAll('.x-chat-tool-run-toggle').forEach(button=>{if(button.innerText.includes('Show'))button.click()});return {ok:true};
    wait_css [data-card-chip="list_document_entities"]
    wait_text listed entities
    eval const card=document.querySelector('[data-card-chip="list_document_entities"]');const button=[...card.querySelectorAll('button')].find(button=>button.innerText==='Expand');if(button)button.click();return {ok:true};
    wait_eval const card=document.querySelector('[data-card-chip="list_document_entities"]');return {ok:!!card&&card.innerText.includes('One document was listed.')&&card.innerText.includes('IEEE')};
    sleep 1500
