
; ---------------------------------------------------------------- other surfaces

; ---------------------------------------------------------------- addresses that name nothing
;
; Neither of these is a failure any more: both are routed to the not-found page, so they
; carry no opt-out. An error marker appearing here means a routing failure has found its
; way back into the global error boundary.

[bad-url-unknown-route]
summary = Exercises the bad url unknown route case.
url = /no-such-page-exists
actions =
    sleep 2000
    wait_text Page not found
