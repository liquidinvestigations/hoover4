; The preview toolbar matches its title height. Navigation icons and the count are centered.
[search-preview-spacing]
summary = Verifies preview toolbar height and centered result controls.
url = /search/o3Njb2xsZWN0aW9uX2RhdGFzZXRzgGxxdWVyeV9zdHJpbmdpZWFzeWNoYWlybWZhY2V0X2ZpbHRlcnOg/0/9g==/9g==
actions =
    wait_css button[aria-label="Next Result"]
    click_css button[aria-label="Next Result"]
    wait_css .x-preview-subtitle-bar
    wait_eval const bar=document.querySelector('.x-preview-subtitle-bar');const row=document.querySelector('#x-search-panel-left-title-row');const count=row.querySelector('h1').getBoundingClientRect();const r=row.getBoundingClientRect();const buttons=[...document.querySelectorAll('.x-navigation-button')];return {ok:Math.abs(bar.getBoundingClientRect().height-42)<=1&&Math.abs((count.top+count.bottom-r.top-r.bottom)/2)<=1&&buttons.every(b=>{const s=b.querySelector('svg').getBoundingClientRect();const r=b.getBoundingClientRect();return Math.abs((s.left+s.right-r.left-r.right)/2)<=1&&Math.abs((s.top+s.bottom-r.top-r.bottom)/2)<=1;}),height:bar.getBoundingClientRect().height};
