
; Empty errored-operations view: no confirmation input. Valid when no errored
; destructive row exists. Incomplete when one is present.
[admin-operations-errored-empty]
summary = Exercises the admin operations errored empty case.
url = /admin/operations
full_page = true
actions =
    wait_css #x-ops-filter-state
    eval const el=document.querySelector('#x-ops-filter-state');const s=Object.getOwnPropertyDescriptor(window.HTMLSelectElement.prototype,'value').set;s.call(el,'errored');el.dispatchEvent(new Event('change',{bubbles:true}));return {ok:true};
    wait_eval const input=document.querySelector('input[placeholder^="type "]'); if(input) return {incomplete:true, reason:'errored destructive row present'}; return {ok:true};
