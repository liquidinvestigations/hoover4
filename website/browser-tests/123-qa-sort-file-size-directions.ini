
[qa-sort-file-size-directions]
summary = Exercises the qa sort file size directions case.
requires_dataset = testdata_testfiles
url = /search/o3Njb2xsZWN0aW9uX2RhdGFzZXRzgGxxdWVyeV9zdHJpbmdpZWFzeWNoYWlybWZhY2V0X2ZpbHRlcnOg/0/9g==/9g==
actions =
    wait_text Sort
    click_text Sort
    click_text File size
    wait_eval const b=document.querySelector('button[aria-label="Sort direction: descending"]'); return {ok:!!b&&!b.disabled};
    click_css button[aria-label="Sort direction: descending"]
    wait_eval const b=document.querySelector('button[aria-label="Sort direction: ascending"]'); return {ok:!!b&&!b.disabled};
    eval const b=document.querySelector('button[aria-label="Sort direction: ascending"]');if(!b||b.disabled)throw new Error('File size ascending direction unavailable');return {disabled:b.disabled};
