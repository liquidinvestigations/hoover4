
[qa-table-modal-keyboard]
summary = Exercises the qa table modal keyboard case.
requires_dataset = testdata_excelsc
url = /view_document/onJjb2xsZWN0aW9uX2RhdGFzZXRwdGVzdGRhdGFfZXhjZWxzY2lmaWxlX2hhc2h4QGY5NzUxZThjMjkwNzk5YmU5ZmQ0M2Y1NTQ5OTdhYzJlYWUyZDEwMThlYjc0MTUzODg2ZWZlNjM1NWNmY2EwZmU=/9g==/oWxzZWxlY3RlZF90YWJoRW50aXRpZXM=
actions =
    wait_text Order ID
    pointer_click_css button[aria-label="Choose visible columns"]
    wait_css [role="dialog"][aria-modal="true"]
    eval const dialog=document.querySelector('[role="dialog"][aria-modal="true"]');dialog.querySelector('button[aria-label="Close"]').focus();return {first:true};
    press_key Shift+Tab
    eval const dialog=document.querySelector('[role="dialog"][aria-modal="true"]');if(document.activeElement!==dialog)throw new Error('backward focus did not wrap to table modal');return {backward_wrap:true};
    eval const dialog=document.querySelector('[role="dialog"][aria-modal="true"]');const focusable=Array.from(dialog.querySelectorAll('input,button')).filter(e=>!e.disabled);focusable.at(-1).focus();return {last:focusable.at(-1).tagName};
    press_key Tab
    eval const dialog=document.querySelector('[role="dialog"][aria-modal="true"]');if(document.activeElement!==dialog)throw new Error('forward focus did not wrap to table modal');return {forward_wrap:true};
    press_key Escape
    wait_eval return {ok: !document.querySelector('[role="dialog"]') && document.activeElement.getAttribute('aria-label')==='Choose visible columns'};
    eval if(document.querySelector('[role="dialog"]')||document.activeElement.getAttribute('aria-label')!=='Choose visible columns')throw new Error('picker did not return focus');return {picker_focus:true};
    pointer_click_css thead th:nth-child(4) button[aria-label^="Filter "]
    wait_css [role="dialog"][aria-modal="true"]
    press_key Escape
    wait_eval return {ok: !document.querySelector('[role="dialog"]') && document.activeElement===document.querySelector('thead th:nth-child(4) button[aria-label^="Filter "]')};
    eval if(document.querySelector('[role="dialog"]')||document.activeElement!==document.querySelector('thead th:nth-child(4) button[aria-label^="Filter "]'))throw new Error('column filter did not return focus');return {filter_focus:true};
