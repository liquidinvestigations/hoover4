[manual-doc-operation]
summary = Shows an existing operation and its detail sections.
url = /admin/operations
actions =
	wait_css #x-ops-filter-state
	wait_eval if(!document.querySelector(".x-ops-detail-link"))return {incomplete:true,reason:"No operation exists for detail capture."};return {ok:true};
	click_css .x-ops-detail-link
	wait_css #x-op-detail-counts
	wait_css #x-op-detail-plans
	wait_css #x-op-detail-events
manual_asset = admin-operation.png
