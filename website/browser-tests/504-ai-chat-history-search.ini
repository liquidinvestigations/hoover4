
; ---------------------------------------------------------------- chat

[ai-chat-history-search]
summary = Searches the chat history from the search box and marks the matches in the titles and summaries.
url = /ai_chat/history
actions =
    wait_css .x-item-list-search
    type_css .x-item-list-search :: board members
    press_enter .x-item-list-search
    wait_css mark.x-item-list-match
    wait_text Matching items
