
[qa-table-data-sort-filter]
summary = Exercises the qa table data sort filter case.
requires_dataset = testdata_manualqa
document_fixture = manual_table_substitute
url = /view_document/onJjb2xsZWN0aW9uX2RhdGFzZXRxdGVzdGRhdGFfbWFudWFscWFpZmlsZV9oYXNoeEAyOTU0NmExNDVmZGFiYWE4YzVjMTE2NWU4ZjJiZThhNjc2ZTgyNjcwMGQ3ZjQzZjI5ZTk2NDY1NDJjNWI4MDg3/9g==/oWxzZWxlY3RlZF90YWJoRW50aXRpZXM=
actions =
    wait_text A-01
    pointer_click_css thead th:nth-child(4) span[title^="Sort."]
    wait_eval const values=Array.from(document.querySelectorAll('tbody tr')).map(row=>Array.from(row.children).slice(1).map(cell=>cell.innerText.trim()).join('|'));return {ok: values.join(',')==='A-01|Bucharest|10,A-02|Cluj|20,A-03|Iași|30'};
    eval const values=Array.from(document.querySelectorAll('tbody tr')).map(row=>Array.from(row.children).slice(1).map(cell=>cell.innerText.trim()).join('|'));if(values.join(',')!=='A-01|Bucharest|10,A-02|Cluj|20,A-03|Iași|30')throw new Error('numeric ascending sort differs from fixture');return {values};
    pointer_click_css thead th:nth-child(4) span[title^="Sort."]
    wait_eval const values=Array.from(document.querySelectorAll('tbody tr')).map(row=>Array.from(row.children).slice(1).map(cell=>cell.innerText.trim()).join('|'));return {ok: values.join(',')==='A-03|Iași|30,A-02|Cluj|20,A-01|Bucharest|10'};
    eval const values=Array.from(document.querySelectorAll('tbody tr')).map(row=>Array.from(row.children).slice(1).map(cell=>cell.innerText.trim()).join('|'));if(values.join(',')!=='A-03|Iași|30,A-02|Cluj|20,A-01|Bucharest|10')throw new Error('numeric descending sort differs from fixture');return {values};
    pointer_click_css thead th:nth-child(3) button[aria-label="Filter Region"]
    wait_css [role="dialog"][aria-modal="true"]
    type_css [role="dialog"] input[placeholder="Contains…"]::Cluj
    pointer_click_css button[aria-label="Apply contains filter"]
    wait_eval const values=Array.from(document.querySelectorAll('tbody tr')).map(row=>Array.from(row.children).slice(1).map(cell=>cell.innerText.trim()).join('|'));return {ok: values.length===1 && values[0]==='A-02|Cluj|20'};
    eval const values=Array.from(document.querySelectorAll('tbody tr')).map(row=>Array.from(row.children).slice(1).map(cell=>cell.innerText.trim()).join('|'));if(values.length!==1||values[0]!=='A-02|Cluj|20')throw new Error('text filter differs from fixture');return {values};
