[admin-automatic-stale-status]
summary = Verify A-to-B-to-A scope changes and newer actions reject delayed preview, progress, and action replies.
url = /admin/collections/release_browser/datasets/release_browser_primary
requires_dataset = release_browser_primary
init_script = window.__statusFetch=window.fetch;window.__holdStatus=false;window.__holdUpdate=false;window.__pendingStarts=[];window.__pendingChecks=[];window.__returned=false;window.__fixtureReply=(body,url)=>{const r=new Response(JSON.stringify(body),{headers:{'Content-Type':'application/json'}});Object.defineProperty(r,'url',{value:url});return r;};window.fetch=function(u,o){const url=String(u&&u.url||u);if(url.includes('/api/admin_start_processing_update')||url.includes('/api/admin_request_update_check')){const request=new Request(u,o),start=url.includes('/api/admin_start_processing_update'),queue=start?window.__pendingStarts:window.__pendingChecks,slot={index:queue.length};queue.push(slot);request.clone().json().then(body=>slot.body=body);return new Promise(resolve=>{slot.release=()=>resolve(window.__fixtureReply(start?'fixture-operation-'+slot.index:null,request.url));}).then(r=>{slot.resolved=true;return r;});}const p=window.__statusFetch.apply(this,arguments);if(url.includes('/api/admin_get_dataset_ocr')&&window.__holdStatus){window.__holdStatus=false;return p.then(async r=>{const v=await r.json();v.automatic_status.states.push({state:'failed',reason:'Old OCR snapshot',files:999,pages:999});const reply=window.__fixtureReply(v,r.url);return new Promise(resolve=>{window.__releaseStatus=()=>resolve(reply);});});}if(url.includes('/api/admin_get_processing_updates'))return p.then(async r=>{const v=await r.json();if(v.scope_id==='release_browser_primary'){const held=window.__holdUpdate;v.steps=[{step_id:window.__returned?'fixture_scope_new':'fixture_scope_old',title:held?'Old scope preview':window.__returned?'Returned scope preview':'Current scope preview',explanation:'Controlled scope preview',runs:'Fixture only',unit:'files',pending:held?999:window.__returned?44:33,pending_bytes:0,automatic:1,state:'Waiting',fingerprint:window.__returned?'fixture-new-scope':'fixture-old-scope',last_run_at:'',last_op_id:'',last_error:''}];if(held){window.__holdUpdate=false;v.running_op_id='fixture-old-running';v.running_state='running';v.running_done=17;v.running_total=33;const reply=window.__fixtureReply(v,r.url);return new Promise(resolve=>{window.__releaseUpdate=()=>resolve(reply);});}}return window.__fixtureReply(v,r.url);});return p;};
actions =
    wait_css [data-ocr-state="applied"]
    wait_text_in .x-processing-updates :: Current scope preview
    wait_eval return {ok:!document.querySelector(".x-update-processing").disabled};
    eval window.__holdStatus=true;window.__holdUpdate=true;document.querySelector(".x-automatic-ocr button").click();return {ok:true};
    wait_eval return {ok:typeof window.__releaseStatus==="function"&&typeof window.__releaseUpdate==="function"};
    click_css .x-update-processing
    wait_eval const s=window.__pendingStarts[0];return {ok:!!s?.release&&s.body?.collection_dataset==="release_browser_primary"&&s.body.steps.includes("fixture_scope_old"),submission:s?.body};
    eval history.pushState(null,"","/admin/collections/release_browser/datasets/release_browser_duplicate");window.dispatchEvent(new PopStateEvent("popstate"));return {ok:true};
    wait_css .x-automatic-ocr[data-dataset="release_browser_duplicate"] .x-automatic-ocr-unknown
    wait_css .x-processing-updates[data-update-scope="release_browser_duplicate"] .x-updates-status
    wait_eval const u=document.querySelector(".x-processing-updates");return {ok:!u.innerText.includes("Current scope preview")&&![...u.querySelectorAll("input")].some(e=>e.checked),generation:u.dataset.updateGeneration};
    eval window.__returned=true;history.pushState(null,"","/admin/collections/release_browser/datasets/release_browser_primary");window.dispatchEvent(new PopStateEvent("popstate"));return {ok:true};
    wait_css .x-automatic-ocr[data-dataset="release_browser_primary"] [data-ocr-state="applied"]
    wait_text_in .x-processing-updates :: Returned scope preview
    wait_eval const u=document.querySelector(".x-processing-updates");return {ok:Number(u.dataset.updateGeneration)>=2&&!document.querySelector(".x-update-processing").disabled,generation:u.dataset.updateGeneration};
    click_css .x-update-processing
    wait_eval const s=window.__pendingStarts[1];return {ok:!!s?.release&&s.body?.collection_dataset==="release_browser_primary"&&s.body.steps.length===1&&s.body.steps[0]==="fixture_scope_new",submission:s?.body};
    click_css .x-update-check
    wait_eval return {ok:!!window.__pendingChecks[0]?.release};
    eval window.__pendingChecks[0].release();return {ok:true};
    wait_text_in .x-processing-updates :: The pipeline is calculating the updates.
    eval window.__releaseStatus();window.__releaseUpdate();window.__pendingStarts[0].release();requestAnimationFrame(()=>requestAnimationFrame(()=>window.__oldReleasedTurn=true));return {ok:true};
    wait_eval const p=document.querySelector(".x-automatic-ocr"),u=document.querySelector(".x-processing-updates");return {ok:window.__oldReleasedTurn===true&&window.__pendingStarts[0].resolved&&!window.__pendingStarts[1].resolved&&p.querySelectorAll("[data-ocr-state]").length===6&&!p.innerText.includes("Old OCR snapshot")&&u.innerText.includes("Returned scope preview")&&u.innerText.includes("The pipeline is calculating the updates.")&&!u.innerText.includes("Old scope preview")&&!u.innerText.includes("fixture-operation-")&&!u.querySelector('a[href*="fixture-old-running"]')&&u.querySelector(".x-update-processing").disabled,generation:u.dataset.updateGeneration};
    eval window.__pendingStarts[1].release();requestAnimationFrame(()=>requestAnimationFrame(()=>window.__releasedTurn=true));return {ok:true};
    wait_eval const p=document.querySelector(".x-automatic-ocr"),u=document.querySelector(".x-processing-updates");return {ok:window.__releasedTurn===true&&window.__pendingStarts.every(s=>s.resolved)&&p.dataset.dataset==="release_browser_primary"&&p.querySelectorAll("[data-ocr-state]").length===6&&!p.innerText.includes("Old OCR snapshot")&&u.innerText.includes("Returned scope preview")&&u.innerText.includes("The pipeline is calculating the updates.")&&!u.innerText.includes("Old scope preview")&&!u.innerText.includes("fixture-operation-")&&!u.querySelector('a[href*="fixture-old-running"]')&&!u.querySelector(".x-update-processing").disabled,generation:u.dataset.updateGeneration};
    eval document.querySelector(".x-automatic-ocr").scrollIntoView({block:"start"});return {ok:true};
