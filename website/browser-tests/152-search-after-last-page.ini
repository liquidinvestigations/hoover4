[search-after-last-page]
summary = Verifies the empty state of a page after the last page and the Go to page 1 action.
requires_dataset = testdata_testfiles
url = /search/o3Njb2xsZWN0aW9uX2RhdGFzZXRzgGxxdWVyeV9zdHJpbmdpZWFzeWNoYWlybWZhY2V0X2ZpbHRlcnOg/40/9g==/9g==
actions =
    wait_css #x-search-after-last-page
    click_css #x-search-first-page
    wait_eval return location.pathname.split('/')[3] === '0';
    wait_eval return document.querySelectorAll('#x-search-panel-results-wrapper li').length > 0 && !document.querySelector('.x-empty-search-results');
