    wait_eval const b=document.querySelector('[data-text-match-controls] button[aria-label="Previous Hit"]');return {ok:!!b&&b.disabled===false,label:"Previous Hit",disabled:b?.disabled};
    click_css button[aria-label="Previous Hit"]
    wait_eval const i=document.querySelector('[data-text-page-input]');const p=document.querySelector('[data-text-page-position]');const t=document.querySelector('#x-document-text-viewer pre')?.innerText||'';const c=document.querySelector('[data-match-counter]')?.getAttribute('data-match-counter');return {ok:i?.value==="3"&&p?.textContent.trim()==="of 4",input:i?.value,position:p?.textContent,counter:c,text:t.slice(0,120),url:location.pathname};
    wait_eval const c=document.querySelector('[data-match-counter]')?.getAttribute('data-match-counter')||'';const m=c.match(/^(\d+) \/ (\d+)$/);return {ok:!!m&&m[1]===m[2]&&Number(m[2])>1,counter:c};
    wait_eval const a=document.querySelector('.x-hit-span-active-match');const v=document.querySelector('#x-document-text-viewer');if(!a||!v)return false;const x=a.getBoundingClientRect(),y=v.getBoundingClientRect();return {ok:x.bottom>=y.top&&x.top<=y.bottom,hit:[x.top,x.bottom],viewer:[y.top,y.bottom]};
    type_css [data-match-counter] input :: 2
    press_enter
    wait_eval const c=document.querySelector('[data-match-counter]')?.getAttribute('data-match-counter')||'';return {ok:c.startsWith('2 / '),counter:c};
    click_css [data-text-content-navigation] button:first-child
    wait_eval const i=document.querySelector('[data-text-page-input]');const p=document.querySelector('[data-text-page-position]');const t=document.querySelector('#x-document-text-viewer pre')?.innerText||'';const c=document.querySelector('[data-match-counter]')?.getAttribute('data-match-counter');return {ok:i?.value==="2"&&p?.textContent.trim()==="of 4",input:i?.value,position:p?.textContent,counter:c,text:t.slice(0,120),url:location.pathname};
    wait_eval const v=document.querySelector('#x-document-text-viewer');return {ok:!!v&&v.scrollTop===0,scrollTop:v?.scrollTop};
    eval const r=e=>{if(!e)return null;const b=e.getBoundingClientRect();return {x:Math.round(b.left),y:Math.round(b.top),w:Math.round(b.width),h:Math.round(b.height)}};const ov=(p,q)=>!!p&&!!q&&p.x<q.x+q.w&&q.x<p.x+p.w&&p.y<q.y+q.h&&q.y<p.y+p.h;const a=r(document.querySelector('[data-text-page-controls]')),b=r(document.querySelector('[data-text-match-controls]')),t=r(document.querySelector('#x-document-text-viewer')),f=r(document.querySelector('input[placeholder="Search in document"]')),s=r(document.querySelector('[data-source-trigger="true"]'));const clip=[...document.querySelectorAll('[data-text-page-controls] button,[data-text-match-controls] button')].filter(e=>{let c=e.parentElement;while(c&&getComputedStyle(c).overflow==='visible')c=c.parentElement;if(!c)return false;const x=e.getBoundingClientRect(),y=c.getBoundingClientRect();return x.right>y.right+1||x.left<y.left-1;}).map(e=>e.getAttribute('aria-label'));const pi=r(document.querySelector('[data-text-page-input]'));const crowd=[...document.querySelectorAll('[data-text-page-controls] > button,[data-text-page-controls] button')].filter(e=>ov(r(e),pi)).map(e=>e.getAttribute('aria-label'));const clash=[['page','match',a,b],['page','text',a,t],['match','text',b,t],['page','find',a,f],['match','find',b,f],['page','source',a,s],['match','source',b,s]].filter(x=>ov(x[2],x[3])).map(x=>x[0]+'/'+x[1]);return {ok:!!a&&!!b&&clash.length===0&&clip.length===0&&crowd.length===0&&document.documentElement.scrollWidth<=innerWidth,clash,clip,crowd,input:pi,page:a,match:b,text:t,find:f,source:s,viewport:[innerWidth,innerHeight],scrollWidth:document.documentElement.scrollWidth};
