
; Grouped failure list with the seeded failcap rows present.
[admin-failures]
summary = Exercises the admin failures list with rows present.
url = /admin/failures
full_page = true
actions =
    wait_eval if(document.body.innerText.includes('No captured failures match these filters.'))return {incomplete:true,reason:'no captured failures on this stack'};return {ok:!!document.querySelector('#x-failures-count-0')};
    wait_css #x-failures-filter-collection
    wait_css #x-failures-count-0
    sleep 800
