; ---------------------------------------------------------------- chat

[ai-chat-web-search]
summary = Selects the named web chat and checks slim form fields and the detail control.
url = /ai_chat/c/{{chat_fixture:web}}/9g==/9g==
actions =
    eval document.querySelectorAll('.x-chat-tool-run-toggle').forEach(button=>{if(button.innerText.includes('Show'))button.click()});return {ok:true};
    wait_css [data-web-search-card]
    click_css [data-web-search-card] button
    wait_eval const card=document.querySelector('[data-web-search-card]');return {ok:!!card&&card.innerText.includes('Form 0:')&&/Forms: [0-9]/.test(card.innerText)&&card.innerText.includes('results')};
    click_text_in [data-web-search-card] :: View search details.
    wait_text The tool returned selected results to the model.
