actions =
    wait_css #x-document-flow-scroll
    eval const toggle=document.querySelector('.x-email-details-toggle');if(toggle&&!toggle.innerText.includes('hide details'))toggle.click();return {ok:true};
    wait_text hide details
    wait_eval const t=document.querySelector('#x-document-text-viewer pre')?.innerText||'';const pc=document.querySelector('[data-text-page-controls]');const b=document.querySelector('[data-text-match-controls]');const old=!!document.querySelector('[data-text-content-navigation]')||!!document.querySelector('[data-text-page-input]');return {ok:t.length>0&&!pc&&!!b&&!old&&document.documentElement.scrollWidth<=innerWidth,overlay:!!pc,match:!!b,old,scrollWidth:document.documentElement.scrollWidth,text:t.slice(0,80)};
    wait_eval const box=document.querySelector('#x-document-flow-scroll');const pre=document.querySelector('#x-document-text-viewer pre');const details=document.querySelector('.x-email-details-panel');if(!box||!pre||!details)return {ok:false,box:!!box,pre:!!pre,details:!!details};return {ok:box.contains(details)&&box.contains(pre)&&(details.compareDocumentPosition(pre)&4)!==0};
    eval const box=document.querySelector('#x-document-flow-scroll');box.scrollTop=box.scrollHeight;return {ok:true,scrollTop:box.scrollTop};
    wait_eval const box=document.querySelector('#x-document-flow-scroll').getBoundingClientRect();const pre=document.querySelector('#x-document-text-viewer pre').getBoundingClientRect();return {ok:pre.bottom<=box.bottom+1&&pre.bottom>=box.top,pre:[pre.top,pre.bottom],box:[box.top,box.bottom]};
    eval const pc=document.querySelector('[data-text-page-controls]');const b=document.querySelector('[data-text-match-controls]');const old=!!document.querySelector('[data-text-content-navigation]')||!!document.querySelector('[data-text-page-input]');return {ok:!pc&&!!b&&!old&&document.documentElement.scrollWidth<=innerWidth,overlay:!!pc,match:!!b,old,scrollWidth:document.documentElement.scrollWidth};
    wait_eval const pc=document.querySelector('[data-text-page-controls]');const b=document.querySelector('[data-text-match-controls]');const old=!!document.querySelector('[data-text-content-navigation]')||!!document.querySelector('[data-text-page-input]');return {ok:!pc&&!!b&&!old&&document.documentElement.scrollWidth<=innerWidth,overlay:!!pc,match:!!b,old,scrollWidth:document.documentElement.scrollWidth};
