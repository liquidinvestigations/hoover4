[manual-fixture-archive-child]
summary = Shows an archive member and its file locations.
requires_dataset = testdata_zips
url = /file_browser/testdata_zips/om5jb250YWluZXJfaGFzaGBkcGF0aGEv/9g==/9g==
manual_asset = document-archive.png
actions =
	sleep 2500
	wait_text location-1
	eval const link=[...document.querySelectorAll("a")].find(a=>a.textContent.includes("Open in Search"));if(!link)throw new Error("Folder search link missing");location.href=link.href;return {ok:true};
	wait_css #x-search-input-top-bar
	wait_css .x-result-item-card
	eval const row=[...document.querySelectorAll(".x-result-item-card")].find(r=>r.innerText.includes("child.txt"));if(!row)throw new Error("No public archive child fixture found");location.href=row.querySelector("a[href^=\"/view_document/\"]").getAttribute("href");return {ok:true};
	wait_text child.txt
	click_text File Locations
	wait_text parent.zip
