[manual-fixture-archive-child]
summary = Shows a child document and its archive breadcrumb.
requires_dataset = testdata_zips
url = 
manual_asset = document-archive.png
actions =
	wait_css .x-result-item-card
	eval const row=[...document.querySelectorAll(".x-result-item-card")].find(r=>r.innerText.includes("child.txt"));if(!row)throw new Error("No public archive child fixture found");location.href=row.querySelector("a[href^=\"/view_document/\"]").getAttribute("href");return {ok:true};
	wait_text parent.zip
	wait_text child.txt
