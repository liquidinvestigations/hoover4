[admin-automatic-status]
summary = Verify stored automatic OCR states and read-only coverage.
url = /admin/collections/release_browser/datasets/release_browser_primary
requires_dataset = release_browser_primary
actions =
    wait_css .x-automatic-ocr-status[data-policy-version="1"]
    wait_css [data-ocr-state="applied"]
    wait_eval const p=document.querySelector(".x-automatic-ocr");return {ok:p.querySelectorAll("[data-ocr-state]").length===6&&p.querySelectorAll("[data-ocr-page-state]").length===6&&!p.querySelector("input,select")&&!document.querySelector(".x-language-filter"),states:[...p.querySelectorAll("[data-ocr-state]")].map(n=>n.dataset.ocrState)};
    wait_text_in .x-automatic-ocr :: FixtureTransportFailure
    wait_text_in .x-automatic-ocr :: No installed model covers this script.
    wait_text_in .x-automatic-ocr :: Use processing updates to retry
    eval document.querySelector(".x-automatic-ocr").scrollIntoView({block:"start"});return {ok:true};
