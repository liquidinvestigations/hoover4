[manual-fixture-text-source]
summary = Verifies text source labels and applies the Raw file text filter.
requires_dataset = testdata_testfiles
url = -
actions =
	click_css #x-search-open-filters
	wait_text All filters
	click_text_in #x-filter-modal :: Text source
	wait_css input[placeholder="Search text sources…"]
	wait_text_in #x-filter-modal :: Raw file text
	wait_eval return {ok: !document.querySelector('#x-filter-modal').innerText.includes('filename_index')};
manual_asset = filter-text-source.png
