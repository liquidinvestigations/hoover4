    wait_eval const sec=document.querySelector('.x-archive-section');if(!sec)return {ok:false,section:false};const h=sec.querySelector('h1')?.innerText.trim();const rows=[...sec.querySelectorAll('tr')].map(tr=>[tr.cells[0].innerText.trim(),tr.cells[1].innerText.trim(),!!tr.cells[1].querySelector('code')]);const links=[...sec.querySelectorAll('.x-archive-links a')].map(a=>[a.innerText.trim(),a.getAttribute('target')]);const guide=document.body.innerText.includes('can be missing from search');const row=k=>rows.find(x=>x[0]===k);return {ok:h==='Email Archive'&&JSON.stringify(row('Extracted files'))===JSON.stringify(['Extracted files','141',true])&&row('Processing errors')?.[2]===true&&row('Archive file size')?.[2]===true&&!!row('Archive file dates')&&!!row('Dates inside')&&!row('Dates inside')[1].startsWith('Loading')&&JSON.stringify(links)===JSON.stringify([['Browse the archive','_blank'],['search inside this archive','_blank']])&&!guide,title:h,rows,links,guide};
    eval location.href=document.querySelector('.x-archive-browse').href;return {ok:true};
