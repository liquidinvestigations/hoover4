[view-doc-release-table-sheet-race]
summary = Verify a delayed sheet reply cannot replace the current sheet.
requires_dataset = release_browser_primary
url = /view_document/onJjb2xsZWN0aW9uX2RhdGFzZXR3cmVsZWFzZV9icm93c2VyX3ByaW1hcnlpZmlsZV9oYXNoeEBkNjk5MDg1ODA5MmFiMGYxMjBjMjZiNDIyZGNjYTYxMGM4NmNhMTE0OTliMmEwZjQwYzgzN2ZmZmU1NWVkYWJh/o2pmaW5kX3F1ZXJ5ZnF1b2trYW9zZWxlY3RlZF9zb3VyY2X2dHNlbGVjdGVkX3NvdXJjZV9wYWdl9g==/oWxzZWxlY3RlZF90YWJoTWV0YWRhdGE=
init_script = window.__sheetFetch=window.fetch;window.__armSheet=false;window.__heldSheet=false;window.fetch=function(u,o){const response=window.__sheetFetch.apply(this,arguments);if(String(u&&u.url||u).includes('/api/get_table_page')&&window.__armSheet&&!window.__heldSheet){window.__heldSheet=true;return response.then(r=>new Promise(resolve=>{window.__releaseSheet=()=>{window.__sheetReleased=true;resolve(r);};}));}return response;};
actions =
    wait_text_in tbody :: sheet-one-
    eval window.__armSheet=true;return {ok:true};
    click_css .x-table-sheet-button
    click_text_in [role="dialog"] :: Second
    wait_eval return {ok:typeof window.__releaseSheet==='function'};
    click_css .x-table-sheet-button
    click_text_in [role="dialog"] :: First
    wait_text_in tbody :: sheet-one-
    eval window.__releaseSheet();return {ok:true};
    wait_eval const s=document.querySelector('tbody')?.innerText||'';return {ok:window.__sheetReleased===true&&s.includes('sheet-one-')&&!s.includes('sheet-two-')};
    click_css .x-table-sheet-button
    click_text_in [role="dialog"] :: Second
    wait_text_in tbody :: sheet-two-
