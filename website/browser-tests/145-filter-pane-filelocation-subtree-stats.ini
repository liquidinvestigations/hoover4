; The file location picker shows the stored size (centred) and the file count
; (right-aligned) on the collection, dataset and folder rows.
[filter-pane-filelocation-subtree-stats]
summary = Shows the size and file count on the file location picker rows.
requires_dataset = testdata_manualqa
url = /search/o3Njb2xsZWN0aW9uX2RhdGFzZXRzgGxxdWVyeV9zdHJpbmdgbWZhY2V0X2ZpbHRlcnOg/0/9g==/9g==
actions =
    sleep 1500
    click_css #x-search-open-filters
    wait_text All filters
    click_text File location
    wait_text Filtering on a folder
    eval document.querySelectorAll('#x-filter-modal button[title="Show all datasets here"]').forEach(b=>b.click());return {ok:true};
    wait_css #x-tree-d-testdata_manualqa
    click_css #x-tree-d-testdata_manualqa
    wait_eval const row=document.querySelector('#x-filter-modal [title="/archives"]');const size=row&&row.querySelector('.x-subtree-size');const files=row&&row.querySelector('.x-subtree-files');return {ok:!!size&&!!files&&/^[0-9]+$/.test(files.innerText.trim())&&size.innerText.trim().length>0&&getComputedStyle(size).textAlign==='center'&&getComputedStyle(files).textAlign==='right',size:size&&size.innerText,files:files&&files.innerText};
    sleep 800
