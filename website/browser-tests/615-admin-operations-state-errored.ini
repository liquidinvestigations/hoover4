
; The state filter really filters. The count of rows below must change, which is the
; thing a filter that renders and does nothing would not do.
[admin-operations-state-errored]
summary = Exercises the admin operations state errored case.
url = /admin/operations
full_page = true
actions =
    wait_css #x-ops-filter-state
    eval const el=document.querySelector('#x-ops-filter-state');const s=Object.getOwnPropertyDescriptor(window.HTMLSelectElement.prototype,'value').set;s.call(el,'errored');el.dispatchEvent(new Event('change',{bubbles:true}));return {ok:true};
    sleep 2000
