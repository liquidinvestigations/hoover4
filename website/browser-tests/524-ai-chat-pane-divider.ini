; The divider between the conversation and its side pane is dragged, and its width is
; remembered when the pane opens again. The last action clears the key.
[ai-chat-pane-divider]
summary = Drags the divider of the chat side pane and restores its width when the pane opens again.
url = /ai_chat/c/{{chat_fixture:web_citations}}/9g==/9g==
actions =
    wait_css [data-chat-answer] [data-web-citation]
    eval localStorage.removeItem('hoover4.chat-document-width-css-px');return {ok:true};
    click_css [data-chat-answer] strong button
    wait_css #x-chat-document-resize
    eval const h=document.querySelector('#x-chat-document-resize');window.__w0=h.parentElement.getBoundingClientRect().width;const r=h.getBoundingClientRect();window.__x=r.left+3;h.dispatchEvent(new MouseEvent('mousedown',{bubbles:true,cancelable:true,clientX:window.__x,clientY:r.top+40,button:0}));return {ok:true,w0:window.__w0};
    sleep 300
    eval const o=[...document.querySelectorAll('div')].find(d=>d.style.position==='fixed'&&d.style.cursor==='col-resize');if(!o)throw new Error('no drag overlay');o.dispatchEvent(new MouseEvent('mousemove',{bubbles:true,clientX:window.__x+(100),clientY:300}));return {ok:true};
    sleep 300
    eval const o=[...document.querySelectorAll('div')].find(d=>d.style.position==='fixed'&&d.style.cursor==='col-resize');o.dispatchEvent(new MouseEvent('mouseup',{bubbles:true,clientX:window.__x,clientY:300}));return {ok:true};
    wait_eval const w=document.querySelector('#x-chat-document-resize').parentElement.getBoundingClientRect().width;const s=Number(localStorage.getItem('hoover4.chat-document-width-css-px'));return {ok:Math.abs(w-window.__w0)>=30&&Math.abs(s-w)<=1,w,s,w0:window.__w0};
    click_css [data-web-preview] button[title="Close preview"]
    wait_eval return {ok:!document.querySelector('#x-chat-document-resize')};
    click_css [data-chat-answer] strong button
    wait_css #x-chat-document-resize
    wait_eval const h=document.querySelector('#x-chat-document-resize');if(!h)return {ok:false};const w=h.parentElement.getBoundingClientRect().width;const s=Number(localStorage.getItem('hoover4.chat-document-width-css-px'));return {ok:s>0&&Math.abs(s-w)<=1,w,s};
    eval localStorage.removeItem('hoover4.chat-document-width-css-px');return {ok:true};
