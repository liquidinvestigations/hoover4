; The bug control in the rail captures the page and opens the report overlay. The
; overlay shows the image and the DOM copy sizes, and the report is sent.
[feedback-report]
summary = Captures the page with the bug control and sends a feedback report.
url = /
actions =
    wait_css #x-feedback-button
    click_css #x-feedback-button
    wait_css #x-feedback-overlay #x-feedback-sizes
    wait_eval const t=document.querySelector('#x-feedback-sizes').innerText;const img=document.querySelector('#x-feedback-image');return {ok:/^Page image: [0-9.]+ KB\. DOM copy: [0-9.]+ KB\.$/.test(t)&&!!img&&img.complete&&img.naturalWidth>0,t,width:img&&img.naturalWidth};
    eval [...document.querySelectorAll('.x-feedback-kind')].find(b=>b.innerText.trim()==='Feedback').click();return {ok:true};
    wait_eval const b=[...document.querySelectorAll('.x-feedback-kind')].find(b=>b.innerText.trim()==='Feedback');return {ok:b.getAttribute('aria-checked')==='true'};
    type_css #x-feedback-title :: Screenshot harness report
    type_css #x-feedback-description :: Sent by the browser test feedback-report.
    click_css #x-feedback-send
    wait_css #x-feedback-sent
