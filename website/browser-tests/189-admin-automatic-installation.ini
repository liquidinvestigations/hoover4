[admin-automatic-installation]
summary = Verify retained manual installation defaults have no editing controls.
url = /admin/settings
requires_dataset = release_browser_primary
actions =
    wait_text Server settings
    wait_css table tbody tr
    wait_eval const rows=[...document.querySelectorAll("table tbody tr")].map(r=>r.innerText);return {ok:!rows.some(t=>t.includes("ocr.tesseract.languages")||t.includes("ocr.easyocr.languages")||t.includes("ocr.default.")),rows};
