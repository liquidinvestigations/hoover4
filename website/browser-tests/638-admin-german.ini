
[admin-german]
summary = Shows the administration dashboard in German and opens its collections page.
interface_language = de
url = /admin
actions =
    wait_css [lang="de"]
    wait_text Sammlungen
    eval Array.from(document.querySelectorAll('a')).find(a=>a.innerText.trim()==='Sammlungen')?.click();return {ok:true};
    wait_eval return {ok:location.pathname.startsWith('/admin/collections'),path:location.pathname};
    sleep 1000
