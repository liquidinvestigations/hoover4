; ---------------------------------------------------------------- chat

[ai-chat-delegation-reports]
summary = Opens the newest conversation after its sub-agents ended and shows the run_subagent card with their reports and the answer.
url = /ai_chat/history
actions =
    wait_css a[href^="/ai_chat/c/"]
    click_css a[href^="/ai_chat/c/"]
    wait_text_in [data-subagent-card] :: reports
    click_css [data-subagent-card] details summary
    sleep 1500
