; ---------------------------------------------------------------- chat

[ai-chat-delegation-reports]
summary = Opens the newest conversation after its plan ended and opens the report of the first section.
url = /ai_chat/history
actions =
    wait_css a[href^="/ai_chat/c/"]
    click_css a[href^="/ai_chat/c/"]
    wait_css details[data-plan-section-report] summary
    click_css details[data-plan-section-report] summary
    wait_css details[data-plan-section-report][open] [data-report-shape]
    sleep 1500
