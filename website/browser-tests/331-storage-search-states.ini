[storage-search-states]
summary = Verifies the storage search states for no match and for a page after the last page.
requires_dataset = any
url = /file_browser?q=zzxqvtrplmx
actions =
    wait_css .x-storage-search-empty
    goto /file_browser?q=pdf&page=99
    wait_css .x-storage-search-out-of-range
    click_text_in .x-storage-search-out-of-range :: Go to page 1
    wait_eval return location.search.includes('page=0') && !!document.querySelector('.x-storage-search-row');
