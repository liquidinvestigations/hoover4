
; ---------------------------------------------------------------- operations log
;
; These pages need operations rows to exist. `main_services/verify-stack.sh` dispatches
; its ingests through the operations CLI, so running it is what populates the log. An
; empty errored filter is a valid distinct state. Destructive confirmation needs an
; errored destructive row; when that row is absent the scenario is incomplete_execution
; and later pages still run. Re-run is never clicked. Rescan is display-only.

; The log itself: every operation ever dispatched, newest first, with its progress, its
; estimate and its outcome.
[admin-operations]
summary = Exercises the admin operations case.
url = /admin/operations
full_page = true
actions =
    wait_css #x-ops-filter-state
    sleep 1200
