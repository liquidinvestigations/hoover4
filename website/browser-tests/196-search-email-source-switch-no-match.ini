; Opens one Enron email in the search preview with raw text selected.
; "Discussion" matches only the raw text, in its X-Folder header line.
[search-email-source-switch-no-match]
summary = Verify that a picked email preview source without a match stays with the counter at 0 and that the arrows open the raw text match.
requires_dataset = enron_kaminski
url = 
actions =
    wait_css [data-email-match-count="1"]
    wait_eval const l=document.querySelector('[data-source-trigger="true"]')?.innerText.split("\n")[0];const c=document.querySelector("[data-email-match-count]")?.textContent;const h=document.querySelectorAll(".x-email-header-hit,[data-text-hit]").length;return {ok:l==="Raw file text"&&c==="1 / 1"&&h>0,label:l,count:c,hits:h};
    click_css [data-source-trigger="true"]
    wait_css [data-source-list="true"]
    eval const n="Email";const o=[...document.querySelectorAll('[data-source-list="true"] > div')].find(e=>e.innerText.split("\n")[0]===n);o?.click();return {ok:!!o,picked:n};
    sleep 3
    wait_eval const l=document.querySelector('[data-source-trigger="true"]')?.innerText.split("\n")[0];const c=document.querySelector("[data-email-match-count]")?.textContent;const h=document.querySelectorAll(".x-email-header-hit,[data-text-hit]").length;return {ok:l==="Email"&&c==="0 / 1"&&h===0,label:l,count:c,hits:h};
    click_css [data-source-trigger="true"]
    wait_css [data-source-list="true"]
    eval const n="Email body";const o=[...document.querySelectorAll('[data-source-list="true"] > div')].find(e=>e.innerText.split("\n")[0]===n);o?.click();return {ok:!!o,picked:n};
    sleep 3
    wait_eval const l=document.querySelector('[data-source-trigger="true"]')?.innerText.split("\n")[0];const c=document.querySelector("[data-email-match-count]")?.textContent;const h=document.querySelectorAll(".x-email-header-hit,[data-text-hit]").length;return {ok:l==="Email body"&&c==="0 / 1"&&h===0,label:l,count:c,hits:h};
    click_css .x-email-match-controls button[aria-label="Next Hit"]
    wait_eval const l=document.querySelector('[data-source-trigger="true"]')?.innerText.split("\n")[0];const c=document.querySelector("[data-email-match-count]")?.textContent;const h=document.querySelectorAll(".x-email-header-hit,[data-text-hit]").length;return {ok:l==="Raw file text"&&c==="1 / 1"&&h>0,label:l,count:c,hits:h};
    click_css [data-source-trigger="true"]
    wait_css [data-source-list="true"]
    eval const n="Email";const o=[...document.querySelectorAll('[data-source-list="true"] > div')].find(e=>e.innerText.split("\n")[0]===n);o?.click();return {ok:!!o,picked:n};
    sleep 3
    wait_eval const l=document.querySelector('[data-source-trigger="true"]')?.innerText.split("\n")[0];const c=document.querySelector("[data-email-match-count]")?.textContent;const h=document.querySelectorAll(".x-email-header-hit,[data-text-hit]").length;return {ok:l==="Email"&&c==="0 / 1"&&h===0,label:l,count:c,hits:h};
    click_css .x-email-match-controls button[aria-label="Previous Hit"]
    wait_eval const l=document.querySelector('[data-source-trigger="true"]')?.innerText.split("\n")[0];const c=document.querySelector("[data-email-match-count]")?.textContent;const h=document.querySelectorAll(".x-email-header-hit,[data-text-hit]").length;return {ok:l==="Raw file text"&&c==="1 / 1"&&h>0,label:l,count:c,hits:h};
