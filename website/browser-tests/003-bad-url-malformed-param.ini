
; A route parameter that is valid base64 but not valid CBOR for the type it decodes into.
; The catch-all route has to absorb this too, or a stale bookmark is a red "Error" page.
[bad-url-malformed-param]
summary = Exercises the bad url malformed param case.
url = /view_document/AAAA/9g==/9g==
manual_asset = not-found.png
actions =
    sleep 2000
    wait_text Page not found
