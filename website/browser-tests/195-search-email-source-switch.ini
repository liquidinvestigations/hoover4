; Opens one Enron email in the search preview and picks each source from the source selector.
; "capabilities" matches the subject, the email body and the raw text, in 8 targets.
[search-email-source-switch]
summary = Verify that a picked email preview source stays, selects its first match, and counts the document matches.
requires_dataset = enron_kaminski
url = /search/pXNjb2xsZWN0aW9uX2RhdGFzZXRzgGxxdWVyeV9zdHJpbmdsY2FwYWJpbGl0aWVzbWZhY2V0X2ZpbHRlcnOgbXJhbmdlX2ZpbHRlcnOgZHNvcnSiY2tleWlSZWxldmFuY2VkZGVzY_U=/1/onJjb2xsZWN0aW9uX2RhdGFzZXRuZW5yb25fa2FtaW5za2lpZmlsZV9oYXNoeEBiMzk3MjIxZmEwMWU1NzEzNDZkMDE0NTdjYTMzODk5ZDBlNDQ4MDM5MGI5Yzg3YTBiNDIxM2YyYmMxNDBkMTIy/o2pmaW5kX3F1ZXJ5bGNhcGFiaWxpdGllc29zZWxlY3RlZF9zb3VyY2X2dHNlbGVjdGVkX3NvdXJjZV9wYWdl9g==
actions =
    wait_css [data-email-match-count="8"]
    wait_eval const l=document.querySelector('[data-source-trigger="true"]')?.innerText.split("\n")[0];const c=document.querySelector("[data-email-match-count]")?.textContent;const h=document.querySelectorAll(".x-email-header-hit,[data-text-hit]").length;return {ok:l==="Email"&&c==="1 / 8"&&h>0,label:l,count:c,hits:h};
    click_css [data-source-trigger="true"]
    wait_css [data-source-list="true"]
    eval const n="Raw file text";const o=[...document.querySelectorAll('[data-source-list="true"] > div')].find(e=>e.innerText.split("\n")[0]===n);o?.click();return {ok:!!o,picked:n};
    sleep 3
    wait_eval const l=document.querySelector('[data-source-trigger="true"]')?.innerText.split("\n")[0];const c=document.querySelector("[data-email-match-count]")?.textContent;const h=document.querySelectorAll(".x-email-header-hit,[data-text-hit]").length;return {ok:l==="Raw file text"&&c==="5 / 8"&&h>0,label:l,count:c,hits:h};
    click_css [data-source-trigger="true"]
    wait_css [data-source-list="true"]
    eval const n="Email body";const o=[...document.querySelectorAll('[data-source-list="true"] > div')].find(e=>e.innerText.split("\n")[0]===n);o?.click();return {ok:!!o,picked:n};
    sleep 3
    wait_eval const l=document.querySelector('[data-source-trigger="true"]')?.innerText.split("\n")[0];const c=document.querySelector("[data-email-match-count]")?.textContent;const h=document.querySelectorAll(".x-email-header-hit,[data-text-hit]").length;return {ok:l==="Email body"&&c==="2 / 8"&&h>0,label:l,count:c,hits:h};
    click_css [data-source-trigger="true"]
    wait_css [data-source-list="true"]
    eval const n="Email";const o=[...document.querySelectorAll('[data-source-list="true"] > div')].find(e=>e.innerText.split("\n")[0]===n);o?.click();return {ok:!!o,picked:n};
    sleep 3
    wait_eval const l=document.querySelector('[data-source-trigger="true"]')?.innerText.split("\n")[0];const c=document.querySelector("[data-email-match-count]")?.textContent;const h=document.querySelectorAll(".x-email-header-hit,[data-text-hit]").length;return {ok:l==="Email"&&c==="1 / 8"&&h>0,label:l,count:c,hits:h};
