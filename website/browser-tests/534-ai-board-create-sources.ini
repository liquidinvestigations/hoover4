; The Collections checkbox of the create form clears every collection in one click and then
; shows the source error, with Create board disabled. One selected collection makes the
; checkbox indeterminate, and a click on it selects every collection again. With internet
; tools on, a form without collections has no error. The case needs two or more readable
; collections and the internet tools of the deployment, and it creates no board.
[ai-board-create-sources]
summary = Clears and selects all collections with the Collections checkbox and shows the source error when no source is selected.
url = /ai_chat/boards/new
actions =
    wait_css .x-board-collections-all
    wait_eval if(document.querySelectorAll('.x-board-collection').length<2||!document.querySelector('.x-board-internet-tools'))return {incomplete:true,reason:'needs two collections and internet tools'};return {ok:true};
    eval const box=document.querySelector('.x-board-internet-tools');if(box.checked)box.click();return {ok:!box.checked};
    click_css .x-board-collections-all
    wait_eval const boxes=[...document.querySelectorAll('.x-board-collection')];const error=document.querySelector('.x-board-source-error');return {ok:boxes.every(b=>!b.checked&&!b.disabled)&&!!error&&error.innerText.trim()==='Select a collection or turn on internet tools.'&&document.querySelector('.x-board-create').disabled,checked:boxes.filter(b=>b.checked).length};
    eval document.querySelector('.x-board-collection').click();return {ok:true};
    wait_eval const all=document.querySelector('.x-board-collections-all');return {ok:all.indeterminate===true&&!all.checked&&!document.querySelector('.x-board-source-error')&&!document.querySelector('.x-board-create').disabled};
    click_css .x-board-collections-all
    wait_eval const boxes=[...document.querySelectorAll('.x-board-collection')];const all=document.querySelector('.x-board-collections-all');return {ok:boxes.every(b=>b.checked)&&all.checked&&!all.indeterminate};
    click_css .x-board-collections-all
    eval document.querySelector('.x-board-internet-tools').click();return {ok:true};
    wait_eval const boxes=[...document.querySelectorAll('.x-board-collection')];return {ok:boxes.every(b=>!b.checked)&&document.querySelector('.x-board-internet-tools').checked&&!document.querySelector('.x-board-source-error')&&!document.querySelector('.x-board-create').disabled};
