[storage-release-cache-invalidation]
summary = Verify cached names clear before permission, principal, and logout refreshes.
requires_dataset = release_browser_primary
url = /file_browser
init_script = window.__fixtureResponse=(body,options)=>{const response=new Response(body,options);Object.defineProperty(response,'url',{value:location.href});return response;};window.__storageMode='original';window.__storageReads=0;window.__identityDenied=false;window.__cacheFetch=window.fetch;window.fetch=function(u,o){const s=String(u&&u.url||u);if(s.includes('/api/whoami')&&window.__identityDenied)return Promise.resolve(window.__fixtureResponse('fixture session ended',{status:401}));if(s.includes('/api/list_storage_tree')){window.__storageReads++;const mode=window.__storageMode;const reply=window.__cacheFetch.apply(this,arguments).then(async r=>{const tree=await r.clone().json();if(mode==='empty')return window.__fixtureResponse('[]',{headers:{'Content-Type':'application/json'}});if(mode==='duplicates')for(const n of tree)for(const d of n.datasets)d.dataset_display_name='Same display';if(mode==='unnamed')for(const n of tree){n.display_name=null;for(const d of n.datasets)d.dataset_display_name='';}return window.__fixtureResponse(JSON.stringify(tree),{status:r.status,headers:{'Content-Type':'application/json'}});});if(window.__holdStorage)return reply.then(r=>new Promise(resolve=>{window.__releaseStorage=()=>resolve(r);}));return reply;}return window.__cacheFetch.apply(this,arguments);};
actions =
    wait_css #x-storage-tree
    wait_text Release browser fixtures
    wait_eval return {ok:window.__storageReads===1,requests:window.__storageReads};
    eval window.__storageMode='empty';window.__holdStorage=true;window.dispatchEvent(new Event('focus'));return {ok:true};
    wait_eval const tree=document.querySelector('#x-storage-tree');return {ok:typeof window.__releaseStorage==='function'&&!tree.innerText.includes('Release browser fixtures')&&!tree.innerText.includes('Primary documents')};
    eval window.__holdStorage=false;window.__releaseStorage();return {ok:true};
    wait_text_in #x-storage-tree :: No collections.
    wait_eval return {ok:!document.querySelector('#x-storage-tree').innerText.includes('Release browser fixtures')&&window.__storageReads===2,requests:window.__storageReads};
    eval window.__storageMode='duplicates';window.dispatchEvent(new Event('focus'));return {ok:true};
    wait_text_in #x-storage-tree :: Same display
    wait_eval const tree=document.querySelector('#x-storage-tree'),a=tree.querySelector('[title="release_browser_primary"]'),b=tree.querySelector('[title="release_browser_duplicate"]');return {ok:!!a&&!!b&&a.title!==b.title&&window.__storageReads===3,requests:window.__storageReads};
    eval window.__storageMode='unnamed';window.dispatchEvent(new Event('focus'));return {ok:true};
    wait_text_in #x-storage-tree :: primary
    wait_eval const text=document.querySelector('#x-storage-tree').innerText;return {ok:text.includes('release_browser')&&!text.includes('Same display')&&window.__storageReads===4,requests:window.__storageReads};
    eval window.__identityDenied=true;window.dispatchEvent(new Event('focus'));return {ok:true};
    wait_eval const tree=document.querySelector('#x-storage-tree');return {ok:!tree.innerText.includes('primary')&&!tree.innerText.includes('Release browser fixtures')};
    eval window.__identityDenied=false;window.__storageMode='original';window.dispatchEvent(new Event('focus'));return {ok:true};
    wait_text_in #x-storage-tree :: Release browser fixtures
    wait_eval return {ok:window.__storageReads===5,requests:window.__storageReads};
