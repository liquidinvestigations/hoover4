
[admin-dataset-detail]
summary = Exercises the admin dataset detail case: the processing updates module replaces the plan and OCR run buttons.
requires_dataset = testdata_testfiles
url = /admin/collections/testdata/datasets/testdata_testfiles
manual_asset = admin-dataset.png
full_page = true
actions =
    wait_text Processing updates
    eval const names=[...document.querySelectorAll('button')].map(b=>b.innerText.trim());for(const want of ['Update processing','Check again','Rescan disk']){if(!names.includes(want))throw Error('missing '+want);}for(const gone of ['Run OCR','Compute plans','Execute plans']){if(names.includes(gone))throw Error('removed button present: '+gone);}if(!document.querySelector('.x-processing-updates .x-update-step'))throw Error('no update step rows');document.querySelector('.x-processing-updates').scrollIntoView({block:'start'});return {ok:true,steps:document.querySelectorAll('.x-processing-updates .x-update-step').length};
    sleep 1500
