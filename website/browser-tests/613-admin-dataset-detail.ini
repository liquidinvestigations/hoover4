
[admin-dataset-detail]
summary = Exercises the admin dataset detail case.
requires_dataset = testdata_testfiles
url = /admin/collections/testdata/datasets/testdata_testfiles
manual_asset = admin-dataset.png
full_page = true
actions =
    wait_text Run OCR
    eval const btn=[...document.querySelectorAll('button')].find(b=>b.innerText.trim()==='Run OCR');if(!btn)throw Error('missing Run OCR');if([...document.querySelectorAll('button')].some(b=>b.innerText.includes('Run all OCR again')))throw Error('removed button present');btn.scrollIntoView({block:'center'});return {ok:true};
    sleep 1500
