; ---------------------------------------------------------------- chat

[ai-chat-plan-cancelled]
summary = Stops the plan of the newest conversation from its card and shows the stopped card.
url = /ai_chat/history
actions =
    wait_css a[href^="/ai_chat/c/"]
    click_css a[href^="/ai_chat/c/"]
    wait_css [data-plan-action="cancel"]
    click_css [data-plan-action="cancel"]
    wait_css [data-plan-state="cancelled"]
    sleep 1500
