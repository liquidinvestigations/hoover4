[admin-automatic-translations-fr]
summary = Verify automatic coverage, planner reasons, and new entity update metadata in French.
url = /admin/collections/release_browser/datasets/release_browser_primary
requires_dataset = release_browser_primary
init_script = window.__updateFetch=window.fetch;window.fetch=function(u,o){const p=window.__updateFetch.apply(this,arguments);if(String(u&&u.url||u).includes('/api/admin_get_processing_updates'))return p.then(async r=>{const v=await r.json();v.steps=['entities','ocr','ocr_detection'].map(id=>({step_id:id,title:id,explanation:'fixture registry text',runs:'fixture runs',unit:'files',pending:1,pending_bytes:0,automatic:1,state:'Waiting',fingerprint:'fixture-'+id,last_run_at:'',last_op_id:'',last_error:''}));const reply=new Response(JSON.stringify(v),{headers:{'Content-Type':'application/json'}});Object.defineProperty(reply,'url',{value:r.url});return reply;});return p;};
interface_language = fr
actions =
    wait_css [data-ocr-state="applied"]
    wait_text_in .x-automatic-ocr :: OCR automatique
    wait_text_in .x-automatic-ocr :: Cyrillique
    wait_text_in .x-automatic-ocr :: Aucun modèle installé ne couvre cette écriture.
    wait_text_in .x-processing-updates :: Entités nommées
    wait_text_in .x-processing-updates :: Fichiers nécessitant une extraction
    wait_text_in .x-processing-updates :: Extraction d’entités nommées
    eval const text=document.querySelector(".x-processing-updates").innerText;return {ok:!text.includes("100 pages")&&!text.includes("fixture registry text")};
    eval document.querySelector(".x-automatic-ocr").scrollIntoView({block:"start"});return {ok:true};
