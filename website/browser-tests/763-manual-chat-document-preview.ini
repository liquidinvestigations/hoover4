[manual-chat-document-preview]
summary = Opens a cited document beside its conversation.
url = /ai_chat/c/80d53b2ac63b9bcae3ea390985a576fbbcd5294e286402271607b5c61d5d370f/9g==/9g==
manual_asset = chat-document-preview.png
actions =
