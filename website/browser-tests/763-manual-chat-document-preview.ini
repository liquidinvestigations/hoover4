	eval const b=[...document.querySelectorAll("button[title=\"Show the cited source\"]")].find(b=>b.innerText.startsWith("[D"));if(!b)throw new Error("Document citation missing");b.click();return {ok:true};
	wait_css [data-chat-document-pane]
