; ---------------------------------------------------------------- chat

[ai-chat-plan-failed]
summary = Opens the newest conversation, whose plan run failed, and shows the failed card with no action.
url = /ai_chat/history
actions =
    wait_css a[href^="/ai_chat/c/"]
    click_css a[href^="/ai_chat/c/"]
    wait_css [data-plan-state="failed"]
    sleep 1500
