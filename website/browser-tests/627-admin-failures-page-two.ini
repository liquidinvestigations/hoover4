
; Page size 1 makes page two reachable with the two seeded signatures.
[admin-failures-page-two]
summary = Exercises page two of the grouped failures list.
url = /admin/failures
full_page = true
actions =
    wait_css #x-failures-page-size
    eval const el=document.querySelector('#x-failures-page-size');const s=Object.getOwnPropertyDescriptor(window.HTMLSelectElement.prototype,'value').set;s.call(el,'1');el.dispatchEvent(new Event('change',{bubbles:true}));return {ok:true};
    sleep 1500
    click_css #x-failures-page-older
    wait_text Page 2
    sleep 800
