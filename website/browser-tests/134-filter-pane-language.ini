[filter-pane-language]
summary = Verifies language labels and applies the English filter.
requires_dataset = any
url = /search/o3Njb2xsZWN0aW9uX2RhdGFzZXRzgGxxdWVyeV9zdHJpbmdgbWZhY2V0X2ZpbHRlcnOg/0/9g==/9g==
actions =
    click_css #x-search-open-filters
    wait_text All filters
    click_text Language
    wait_css input[placeholder="Search languages…"]
    wait_text English
    click_text_in #x-filter-modal :: English
    wait_eval const button=document.querySelector('#x-filter-modal > div:last-child button:last-child');return /^Show [1-9][0-9]* results?$/.test(button?.textContent.trim()||'');
    click_css #x-filter-modal > div:last-child button:last-child
    wait_eval const query=location.pathname.split('/')[2].replace(/-/g,'+').replace(/_/g,'/');return !document.querySelector('#x-filter-modal')&&atob(query).includes('language')&&!!document.querySelector('#x-search-input-top-bar [title="English"]');
