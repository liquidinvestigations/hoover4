
; Sort by signature, both directions. The header marker flips.
[admin-failures-sort]
summary = Exercises signature sort in both directions on the failures list.
url = /admin/failures
full_page = true
actions =
    wait_eval if(document.body.innerText.includes('No captured failures match these filters.'))return {incomplete:true,reason:'no captured failures on this stack'};return {ok:!!document.querySelector('#x-failures-count-0')};
    wait_css #x-failures-sort-signature
    click_css #x-failures-sort-signature
    sleep 1200
    click_css #x-failures-sort-signature
    sleep 1200
