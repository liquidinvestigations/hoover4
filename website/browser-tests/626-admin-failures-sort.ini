
; Sort by signature, both directions. The header marker flips.
[admin-failures-sort]
summary = Exercises signature sort in both directions on the failures list.
url = /admin/failures
full_page = true
actions =
    wait_css #x-failures-sort-signature
    click_css #x-failures-sort-signature
    sleep 1200
    click_css #x-failures-sort-signature
    sleep 1200
