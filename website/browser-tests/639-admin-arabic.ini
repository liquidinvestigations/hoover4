
[admin-arabic]
summary = Shows the administration dashboard in Arabic and opens its collections page.
interface_language = ar
url = /admin
actions =
    wait_css [lang="ar"]
    wait_text المجموعات
    eval Array.from(document.querySelectorAll('a')).find(a=>a.innerText.trim()==='المجموعات')?.click();return {ok:true};
    wait_eval return {ok:location.pathname.startsWith('/admin/collections'),path:location.pathname};
    sleep 1000
