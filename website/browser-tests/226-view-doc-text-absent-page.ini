[view-doc-text-absent-page]
summary = Opens a copied link to page 9 of a sparse PDF. The page is inside one text row, so the row opens with its page marker in view.
requires_dataset = p63pages_boundaries
url = /view_
actions =
    wait_eval const v=document.querySelector('#x-document-text-viewer');const m=document.querySelector('[data-text-page="9"]');return {ok:!!m&&!v.innerText.includes('No text is stored'),marker:!!m,text:v.innerText.slice(0,80)};
    eval location.reload();return {ok:true};
    sleep 1500
    wait_eval const v=document.querySelector('#x-document-text-viewer');const m=document.querySelector('[data-text-page="9"]');return {ok:!!m&&!v.innerText.includes('No text is stored'),marker:!!m,text:v.innerText.slice(0,80)};
