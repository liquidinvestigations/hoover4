; The board explorer opens the first board of the list, draws its graph, and shows the
; detail of the goal fact when its node is clicked. A stack with no board is incomplete.
[admin-board-explorer]
summary = Opens a board, draws its graph, and selects the goal node.
url = /admin/boards
actions =
    wait_css .x-board-create
    wait_eval if(!document.querySelector('.x-board-row a'))return {incomplete:true,reason:'no board on this stack'};return {ok:true};
    click_css .x-board-row a
    wait_css .x-board-node[data-node="goal"]
    sleep 3500
    eval document.querySelector('.x-board-node[data-node="goal"]').dispatchEvent(new MouseEvent('click',{bubbles:true}));return {ok:true};
    wait_css .x-board-fact-detail
    wait_eval return {ok:location.search.includes('selected=goal'),nodes:document.querySelectorAll('.x-board-node').length};
