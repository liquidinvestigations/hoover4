; ---------------------------------------------------------------- chat

[ai-chat-todo-history-narrow]
summary = Checks that the task summaries wrap inside 80% of a narrow transcript.
url = /ai_chat/c/{{chat_fixture:todo_history}}/9g==/9g==
viewport = 420x900
actions =
    wait_css [data-todo-change="true"] .x-chat-todo-list
    wait_eval const cards=[...document.querySelectorAll('.x-chat-todo-list')];return {ok:cards.length===4&&cards.every(card=>card.scrollWidth<=card.clientWidth+1&&card.getBoundingClientRect().width<=card.parentElement.getBoundingClientRect().width*0.8+1),widths:cards.map(card=>Math.round(card.getBoundingClientRect().width))};
