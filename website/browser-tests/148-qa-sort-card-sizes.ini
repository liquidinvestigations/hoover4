; The size line under the card controls is the value of the size sort, in both directions.
[qa-sort-card-sizes]
summary = Checks the card size line against both file size sort directions and the card geometry.
requires_dataset = testdata_testfiles
url = /search/pHNjb2xsZWN0aW9uX2RhdGFzZXRzgXJ0ZXN0ZGF0YV90ZXN0ZmlsZXNscXVlcnlfc3RyaW5nYG1mYWNldF9maWx0ZXJzoGRzb3J0omNrZXloRmlsZVNpemVkZGVzY_U=/0/9g==/9g==
actions =
    wait_eval const cards=[...document.querySelectorAll('#x-search-panel-results-wrapper .x-result-item-card')];if(!cards.length||cards.some(c=>!c.querySelector('.x-card-controls')))return {ok:false};const v=cards.map(c=>({h:c.dataset.fileHash,v:c.querySelector('[data-card-size-bytes]').getAttribute('data-card-size-bytes')}));const geo=cards.every(c=>{const ctl=c.querySelector('.x-card-controls').getBoundingClientRect();const row=c.querySelector('.x-card-controls').parentElement.getBoundingClientRect();return ctl.bottom<=row.bottom+0.5&&Math.abs(c.getBoundingClientRect().height-112)<=1;});const n=v.filter(x=>x.v!=='').map(x=>Number(x.v));const firstEmpty=v.findIndex(x=>x.v==='');const emptiesLast=firstEmpty<0||v.slice(firstEmpty).every(x=>x.v==='');const sorted=n.every((x,i)=>i===0||n[i-1]>=x);return {ok:geo&&sorted&&emptiesLast&&n.length>0&&cards.every(c=>c.querySelector('.x-card-size').innerText.trim()!==''||c.querySelector('.x-card-size').getAttribute('data-card-size-bytes')===''),v,geo};
    goto /search/pHNjb2xsZWN0aW9uX2RhdGFzZXRzgXJ0ZXN0ZGF0YV90ZXN0ZmlsZXNscXVlcnlfc3RyaW5nYG1mYWNldF9maWx0ZXJzoGRzb3J0omNrZXloRmlsZVNpemVkZGVzY_Q=/0/9g==/9g==
    wait_eval const cards=[...document.querySelectorAll('#x-search-panel-results-wrapper .x-result-item-card')];if(!cards.length||cards.some(c=>!c.querySelector('.x-card-controls')))return {ok:false};const v=cards.map(c=>({h:c.dataset.fileHash,v:c.querySelector('[data-card-size-bytes]').getAttribute('data-card-size-bytes')}));const geo=cards.every(c=>{const ctl=c.querySelector('.x-card-controls').getBoundingClientRect();const row=c.querySelector('.x-card-controls').parentElement.getBoundingClientRect();return ctl.bottom<=row.bottom+0.5&&Math.abs(c.getBoundingClientRect().height-112)<=1;});const n=v.filter(x=>x.v!=='').map(x=>Number(x.v));const lastEmpty=v.map(x=>x.v==='').lastIndexOf(true);const emptiesFirst=lastEmpty<0||v.slice(0,lastEmpty+1).every(x=>x.v==='');const sorted=n.every((x,i)=>i===0||n[i-1]<=x);return {ok:geo&&sorted&&emptiesFirst&&n.length>0,v,geo};
