; The detail page of one operation, with its counts, plans and Error events.
[admin-operation-detail]
summary = Exercises the operation detail page.
url = /admin/operations
full_page = true
actions =
    wait_css #x-ops-filter-collection
    eval const el=document.querySelector('#x-ops-filter-collection');const s=Object.getOwnPropertyDescriptor(window.HTMLSelectElement.prototype,'value').set;s.call(el,'reruns');el.dispatchEvent(new Event('change',{bubbles:true}));return {ok:true};
    wait_css .x-ops-detail-link
    click_css .x-ops-detail-link
    wait_css #x-op-detail-counts
    wait_css #x-op-detail-plans
    wait_css #x-op-detail-events
    sleep 800
