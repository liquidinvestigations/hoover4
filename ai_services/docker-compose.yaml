# Hoover4 ai_services — the optional GPU tier. STANDALONE: no inbound dependencies,
# nothing here calls into main_services, and it deploys on its own with
# `./deploy --ai-services` from an identical copy of hoover4.ini.
#
# This base file declares only the private network and the model-cache volumes; every
# service is an optional overlay under compose/ selected by hoover4.ini flags:
#
#   compose/vllm.yaml       [ai_services] llm_selfhosted   (SUPPORTED BUT PARKED)
#   compose/ai-server.yaml  [ai_services] ai_server_enabled (GPU NER + embeddings)
#   compose/easyocr.yaml    [ai_services] easyocr_enabled   (no server image in tree)
#
# SECURITY (hard requirement): the two hosts must share a PRIVATE network or VPN.
# NER, embeddings and EasyOCR are UNAUTHENTICATED, and vLLM's API key is its only
# protection — an exposed hoover4-vllm is a free GPU for the internet, an exposed
# EasyOCR endpoint is a free DoS surface. Set [ai_services] bind_ip to the private
# interface.
#
# Podman notes:
#   * GPUs are requested with `devices: nvidia.com/gpu=all` (CDI). The
#     `deploy.resources.reservations.devices` block docker-compose uses is silently
#     ignored by podman-compose, which is why the old file appeared to start fine and
#     then ran on CPU. deploy.py preflights nvidia-smi and the CDI spec before any
#     GPU overlay starts.
#   * `HEALTHCHECK` from a Dockerfile is dropped for OCI images, so the healthchecks
#     that matter are declared in the overlays.
#   * deploy.py creates the `ai_services` network with explicit DNS settings — fresh
#     podman networks have no DNS until resolvers are attached.

volumes:
  # Model caches. Preserved across `./deploy --reset` unless --reset-caches is
  # passed — they are tens of gigabytes of re-download.
  ai_models_cache:
    driver: local
  vllm_huggingface_cache:
    driver: local

networks:
  # Private to this tier. Replaces the old `external: true` join of the main stack's
  # `hoover4` network: main_services reaches these services over the published ports,
  # never over a shared container network.
  ai_services:
    name: ai_services
