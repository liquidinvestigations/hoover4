# Optional overlay: GPU NER + embeddings server (enabled via
# [ai_services] ai_server_enabled = true in hoover4.ini).

# Log rotation for every service in this file, from container_log_max_size and
# container_log_max_files in hoover4.ini. A YAML anchor does not cross files, so each
# compose file carries this field, and deploy.py's tests check that no service lacks it.
x-logging: &logging
  driver: json-file
  options:
    max-size: "${CONTAINER_LOG_MAX_SIZE:-100m}"
    max-file: "${CONTAINER_LOG_MAX_FILES:-5}"

services:
  # ---------------------------------------------------------------- GPU: embeddings
  # Embeddings, reranking and NER. The processing pipeline's P4 stage calls this too
  # (NER_URL in main_services), so when the GPU tier is enabled it is not optional
  # infrastructure. It lives on the private `ai_services` network and is reached
  # cross-host on AI_SERVER_PORT, never by container name from the main stack.
  hoover4-ai-server:
    logging: *logging
    build:
      # Context is ai_services/, NOT this folder: the Dockerfile's COPY paths are
      # ./hoover4_ai_server/... (it predates the overlay split). Pointing the context
      # at the subdirectory builds nothing, and `up -d` would never tell you, because
      # it reuses the stale image.
      context: ${HOOVER4_REPO_ROOT}/ai_services
      dockerfile: hoover4_ai_server/Dockerfile
      # Compiler/thread jobs inside the build. Bounded because an unbounded build
      # sizes every backend to the host's core count at once and takes the machine
      # running it out of service; raise it on a dedicated builder.
      args:
        BUILD_JOBS: ${BUILD_JOBS:-6}
    image: hoover4-ai-server:local
    container_name: hoover4-ai-server
    ports:
      - "${AI_BIND_IP:-0.0.0.0}:${AI_SERVER_PORT}:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - OPTIMAL_BATCH_SIZE=${AI_SERVER_OPTIMAL_BATCH_SIZE:-32}
      - MAX_SEQUENCE_LENGTH=${AI_SERVER_MAX_SEQUENCE_LENGTH:-512}
      # Capability switches from hoover4.ini (deploy.py renders them). The models, the
      # embedding dimension and the precision are constants of hoover4_ai_server.py.
      - AI_SERVER_ENABLE_NER=${AI_SERVER_ENABLE_NER:-true}
      - AI_SERVER_ENABLE_EMBEDDINGS=${AI_SERVER_ENABLE_EMBEDDINGS:-true}
      - AI_SERVER_ENABLE_RERANKER=${AI_SERVER_ENABLE_RERANKER:-true}
      - AI_SERVER_NER_CONCURRENCY=${AI_SERVER_NER_CONCURRENCY:-4}
      - AI_SERVER_EMBED_CONCURRENCY=${AI_SERVER_EMBED_CONCURRENCY:-8}
      - AI_SERVER_RERANK_CONCURRENCY=${AI_SERVER_RERANK_CONCURRENCY:-4}
      # Config-drift guard (hoover4.ini is copied by hand to two hosts): the sha256 of
      # the normalised [ai_services] section, returned from /health so verify-stack.sh
      # can compare what host B was told against what host A runs.
      - HOOVER4_CONFIG_FINGERPRINT=${HOOVER4_CONFIG_FINGERPRINT:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ${HOOVER4_VOLUMES_PATH:?deploy.py renders it from [storage] volumes_path}/ai_models_cache:/root/.cache/huggingface
    devices:
      - nvidia.com/gpu=all
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 15s
      retries: 5
      # Cold start downloads ~2 GB of model weights on first run.
      start_period: 600s
    networks:
      - ai_services

networks:
  # Private to the ai_services tier (declared in the base docker-compose.yaml).
  ai_services:
    name: ai_services
