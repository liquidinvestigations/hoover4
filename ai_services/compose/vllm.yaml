# Optional overlay: the model server, Qwen3.8 Flash Next on vLLM (enabled via
# [ai_services] llm_enabled = true).
#
# It serves agent turns and every short call. The recipe is
# github.com/devopsfortunato/Qwen3.8-Flash-Next-FP4-Local-DGX-Spark at 6aab1a5 (MIT): the
# eugr/spark-vllm-b12x image pinned by digest, with the PLE queue depth patch of
# ai_services/qwen_flash. deploy.py pins the image, the checkpoint and its commit in
# QWEN_FLASH_ENV.

# Log rotation for every service in this file, from container_log_max_size and
# container_log_max_files in hoover4.ini. A YAML anchor does not cross files, so each
# compose file carries this field, and deploy.py's tests check that no service lacks it.
x-logging: &logging
  driver: json-file
  options:
    max-size: "${CONTAINER_LOG_MAX_SIZE:-100m}"
    max-file: "${CONTAINER_LOG_MAX_FILES:-5}"

services:
  # The engine downloads the checkpoint at the pinned commit into qwen_flash_hf on its
  # first start (about 96 GiB) and compiles its kernels into qwen_flash_cache. A first
  # start takes about 30 minutes.
  #
  # vLLM keeps one paged KV pool for every request. A short call uses a few blocks
  # and does not remove the cached prefix of a conversation. The oldest free blocks go
  # first when the pool is full.
  #
  # On GB10 the GPU allocations come from host memory and cannot go to swap.
  # mem_limit bounds only the host pages of the container. The engine holds about
  # 74.5 GiB beside the KV pool, and --kv-cache-memory-bytes sizes the pool. 9 GB holds
  # about 455,000 fp8 tokens and leaves room for hoover4-ai-server and GPU EasyOCR at
  # their highest use.
  #
  # SECURITY: the published port binds to bind_ip. An empty key file turns the key off.
  hoover4-vllm:
    logging: *logging
    build:
      context: ${HOOVER4_REPO_ROOT}/ai_services/qwen_flash
      args:
        BASE_IMAGE: ${QWEN_FLASH_BASE_IMAGE}
    image: ${QWEN_FLASH_IMAGE}
    container_name: hoover4-vllm
    restart: unless-stopped
    mem_limit: 90g
    ipc: host
    shm_size: 16g
    ulimits:
      core: 0
      memlock: -1
      stack: 67108864
    # The n-gram table is read from NVMe with io_uring, which the default seccomp
    # profile refuses.
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    devices:
      - nvidia.com/gpu=all
    ports:
      - "${AI_BIND_IP:-0.0.0.0}:${VLLM_PORT}:8000"
    volumes:
      # The vLLM, FlashInfer, b12x and Triton caches are folders of qwen_flash_cache.
      - ${HOOVER4_VOLUMES_PATH:?deploy.py renders it from [storage] volumes_path}/qwen_flash_cache:/root/.cache
      - ${HOOVER4_VOLUMES_PATH:?deploy.py renders it from [storage] volumes_path}/qwen_flash_hf:/root/.cache/huggingface
      - ${VLLM_API_KEY_FILE_HOST:-/dev/null}:/run/secrets/vllm_api_key:ro
    environment:
      HF_HOME: /root/.cache/huggingface
      TRITON_CACHE_DIR: /root/.cache/triton
      VLLM_PLE_TABLE_MEMORY: disk
      B12X_DISK_BACKEND: io_uring
      PLE_QUEUE_DEPTH: "256"
      CUTE_DSL_ARCH: sm_121a
      SAFETENSORS_FAST_GPU: "1"
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      VLLM_SSM_CONV_STATE_LAYOUT: DS
      VLLM_USE_AOT_COMPILE: "1"
      VLLM_USE_MEGA_AOT_ARTIFACT: "1"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      B12X_POLICY_MODE: auto
      VLLM_MXFP8_LM_HEAD: "1"
      VLLM_B12X_MOE_FP4_LAYER_MAX_INPUT_SCALE: w13
      VLLM_B12X_MOE_FP4_FORCE_A16: "1"
      B12X_W4A16_A4_PREFILL: "1"
      DO_NOT_TRACK: "1"
      VLLM_NO_USAGE_STATS: "1"
    # The wrapper adds the API key when the key file is not empty.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        key="$$(cat /run/secrets/vllm_api_key 2>/dev/null || true)";
        if [ -n "$$key" ]; then set -- "$$@" --api-key "$$key"; fi;
        exec vllm serve "$$@"
      - sh
    command:
      - ${QWEN_FLASH_CHECKPOINT}
      - --revision
      - ${QWEN_FLASH_REVISION}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --served-model-name
      - ${LLM_SERVED_NAME}
      # One paged KV pool for every request. A conversation keeps its cached prefix
      # until the pool is full. The hybrid layers keep their state at block boundaries.
      - --enable-prefix-caching
      - --mamba-cache-mode
      - align
      - --enable-chunked-prefill
      - --enable-prompt-tokens-details
      - --dtype
      - bfloat16
      - --kv-cache-dtype
      - fp8
      - --quantization
      - modelopt_mixed
      - --block-size
      - "16"
      - --load-format
      - b12x
      - --max-model-len
      - "262144"
      - --max-num-seqs
      - "8"
      - --max-num-batched-tokens
      - "4096"
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":3}'
      - --gdn-decode-kernel
      - b12x
      - --linear-backend
      - b12x
      - --moe-backend
      - b12x
      - --no-enable-flashinfer-autotune
      - --mm-encoder-tp-mode
      - data
      - --reasoning-parser
      - qwen3
      - --tool-call-parser
      - qwen3_xml
      - --enable-auto-tool-choice
      - --compilation-config
      - '{"pass_config":{"fuse_act_quant":true}}'
      - --gpu-memory-utilization
      - "0.8"
      - --kv-cache-memory-bytes
      - "9000000000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 3600s
    networks:
      - ai_services

networks:
  # Private to the ai_services tier (declared in the base docker-compose.yaml).
  ai_services:
    name: ai_services
