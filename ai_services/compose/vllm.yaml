# Optional overlay: local LLM (enabled via [ai_services] llm_selfhosted = true).
#
# SUPPORTED BUT PARKED: the overlay, the image pin and the docs stay, but nothing in
# Part 1 or Part 2 of plan 1 starts vLLM — the NVIDIA NIM cloud provider carries the
# live tests instead.
services:
  # ---------------------------------------------------------------- GPU: local LLM
  # Shares one 24 GB card with hoover4-ai-server (~2.9 GB of embedding/reranker/NER
  # weights) and the desktop session (~1.7 GB), so vLLM must be told not to claim the
  # whole device — the memory fraction is the setting to lower first if either
  # service OOMs.
  #
  # Qwen3.5-2B runs at its **full 262,144-token native context** on this card, which is
  # only possible because of the hybrid architecture: of its 24 layers only 6 are Gated
  # Attention with a growing KV cache (the other 18 are Gated-DeltaNet and hold a
  # constant recurrent state). At 2 kv-heads x 256 head_dim x 2 bytes x 2 (K,V) x 6
  # layers that is 12 KiB/token, so a full 262 K sequence costs 3 GiB of KV cache
  # instead of the ~36 GiB the same context would cost on the Qwen3-4B this replaces.
  # See ai_services/README.md for the arithmetic and the measured numbers.
  #
  # vLLM 0.17 is the first release with native Qwen3.5 (qwen3_5) support.
  #
  # SECURITY: bind_ip comes from hoover4.ini and MUST be a private-network address in
  # any real deployment — an exposed vLLM is a free GPU for the internet.
  hoover4-vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.17.1}
    container_name: hoover4-vllm
    ports:
      - "${AI_BIND_IP:-0.0.0.0}:${VLLM_PORT}:8000"
    ipc: host
    # The API key is a bind-mounted file, never an env value: hoover4.ini stores the
    # host path (vllm_api_key_file), deploy.py mounts it at /run/secrets/vllm_api_key,
    # and this wrapper exports it before exec'ing the image's own `vllm serve`.
    entrypoint: ["/bin/sh", "-c", "export VLLM_API_KEY=\"$$(cat /run/secrets/vllm_api_key 2>/dev/null || true)\"; export HUGGING_FACE_HUB_TOKEN=\"$$(cat /run/secrets/hf_token 2>/dev/null || true)\"; exec vllm serve \"$$@\"", "--"]
    command: >
      --model ${LLM_MODEL_NAME:-Qwen/Qwen3.5-2B}
      --served-model-name ${LLM_SERVED_NAME:-qwen3.5-2b}
      --gpu-memory-utilization ${VLLM_GPU_FRACTION:-0.50}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-262144}
      --enable-auto-tool-choice
      --tool-call-parser ${VLLM_TOOL_PARSER:-qwen3_xml}
    environment:
      - DO_NOT_TRACK=1
      - VLLM_NO_USAGE_STATS=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - vllm_huggingface_cache:/root/.cache/huggingface
      - ${VLLM_API_KEY_FILE_HOST:-/dev/null}:/run/secrets/vllm_api_key:ro
      - ${HF_TOKEN_FILE_HOST:-/dev/null}:/run/secrets/hf_token:ro
    devices:
      - nvidia.com/gpu=all
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 900s
    networks:
      - ai_services

volumes:
  vllm_huggingface_cache:
    driver: local

networks:
  # Private to the ai_services tier (declared in the base docker-compose.yaml).
  ai_services:
    name: ai_services
