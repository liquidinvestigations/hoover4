# Optional overlay: local LLM (enabled via [ai_services] llm_selfhosted = true).
#
# This is the model the research agents talk to. It is OpenAI-compatible, so the
# provider selection in hoover4.ini is the only thing that decides whether the stack
# uses it or a cloud endpoint.
services:
  # ---------------------------------------------------------------- GPU: local LLM
  # vllm_gpu_fraction is a fraction of the WHOLE device, shared with hoover4-ai-server
  # (~2.9 GB of embedding/reranker/NER weights), GPU EasyOCR, and any other model
  # server resident on the box. It is the setting to lower first if a neighbour OOMs.
  # On unified-memory hardware (GB10) the fraction is taken against total system
  # memory, so a value tuned for a discrete card overcommits badly here.
  #
  # max-num-seqs is the concurrency bound, and it is a correctness knob rather than a
  # tuning one: a server with one slot serialises every caller head-of-line, so a UI
  # turn queues behind a benchmark and the model looks orders of magnitude slower than
  # it is. One research agent fans out to several concurrent sub-agent streams, and
  # there is more than one conversation, so the floor is well above one.
  #
  # The reasoning parser is what moves a thinking block out of `content` and into
  # `reasoning_content`. Qwen3.5 runs with its thinking mode on by default, so without it
  # every answer arrives with the model's working prepended to it, visible to the user,
  # counted against the payload budget, and parsed by nothing.
  #
  # vLLM 0.17 is the first release with native Qwen3.5 (qwen3_5) support.
  #
  # SECURITY: bind_ip comes from hoover4.ini and MUST be a private-network address in
  # any real deployment. An exposed vLLM is a free GPU for the internet.
  hoover4-vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.17.1}
    container_name: hoover4-vllm
    ports:
      - "${AI_BIND_IP:-0.0.0.0}:${VLLM_PORT}:8000"
    ipc: host
    # The API key is a bind-mounted file, never an env value: hoover4.ini stores the
    # host path (vllm_api_key_file), deploy.py mounts it at /run/secrets/vllm_api_key,
    # and this wrapper exports it before exec'ing the image's own `vllm serve`.
    entrypoint: ["/bin/sh", "-c", "export VLLM_API_KEY=\"$$(cat /run/secrets/vllm_api_key 2>/dev/null || true)\"; export HUGGING_FACE_HUB_TOKEN=\"$$(cat /run/secrets/hf_token 2>/dev/null || true)\"; exec vllm serve \"$$@\"", "--"]
    command: >
      --model ${LLM_MODEL_NAME:-Qwen/Qwen3.5-35B-A3B}
      --served-model-name ${LLM_SERVED_NAME:-qwen3.5-35b-a3b}
      --gpu-memory-utilization ${VLLM_GPU_FRACTION:-0.50}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-262144}
      --max-num-seqs ${VLLM_MAX_NUM_SEQS:-16}
      --enable-auto-tool-choice
      --tool-call-parser ${VLLM_TOOL_PARSER:-qwen3_xml}
      --reasoning-parser ${VLLM_REASONING_PARSER:-qwen3}
    environment:
      - DO_NOT_TRACK=1
      - VLLM_NO_USAGE_STATS=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - vllm_huggingface_cache:/root/.cache/huggingface
      - ${VLLM_API_KEY_FILE_HOST:-/dev/null}:/run/secrets/vllm_api_key:ro
      - ${HF_TOKEN_FILE_HOST:-/dev/null}:/run/secrets/hf_token:ro
    devices:
      - nvidia.com/gpu=all
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 900s
    networks:
      - ai_services

volumes:
  vllm_huggingface_cache:
    driver: local

networks:
  # Private to the ai_services tier (declared in the base docker-compose.yaml).
  ai_services:
    name: ai_services
