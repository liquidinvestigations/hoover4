# Optional overlay: GPU EasyOCR server (enabled via [ai_services] easyocr_enabled).
#
# The overlay renders and is wired end-to-end, but the SERVER itself
# (ai_services/easyocr_server/) is not in the tree, so enabling this overlay fails at
# build time. That is deliberate: the flag means what the target architecture says it
# means, and failing to build beats starting a container that cannot serve.
services:
  hoover4-easyocr-gpu:
    build:
      # Narrow context on purpose, never widen to ai_services/ or the repo root,
      # which hold large untracked scratch directories that would silently bloat
      # every build.
      context: ${HOOVER4_REPO_ROOT}/ai_services/easyocr_server
      dockerfile: Dockerfile
      # Compiler/thread jobs inside the build. Bounded because an unbounded build
      # sizes every backend to the host's core count at once and takes the machine
      # running it out of service; raise it on a dedicated builder.
      args:
        BUILD_JOBS: ${BUILD_JOBS:-6}
    image: hoover4-easyocr:local
    container_name: hoover4-easyocr-gpu
    ports:
      - "${AI_BIND_IP:-0.0.0.0}:${EASYOCR_PORT}:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - EASYOCR_LANGUAGES=${EASYOCR_LANGUAGES:-en}
      - HOOVER4_CONFIG_FINGERPRINT=${HOOVER4_CONFIG_FINGERPRINT:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      # EasyOCR's own cache volume, not the ai-server's: the two hold different model
      # formats, and sharing one volume overlays EasyOCR's flat *.pth files on top of a
      # HuggingFace `hub/` tree. It happens to work because the names do not collide,
      # and it breaks the moment either side writes an index. Preserved across resets
      # like every model cache (deploy.py CACHE_VOLUME_SUFFIXES).
      - easyocr_models_cache:/root/.EasyOCR
    devices:
      - nvidia.com/gpu=all
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 600s
    networks:
      - ai_services

volumes:
  easyocr_models_cache:
    driver: local

networks:
  # Private to the ai_services tier (declared in the base docker-compose.yaml).
  ai_services:
    name: ai_services
