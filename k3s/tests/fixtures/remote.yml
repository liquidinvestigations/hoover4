# Three nodes, a public node, a calls node and a shared GPU pool. remote.zones.json holds its zones.
hoover4:
  vars:
    domain: example.org
    control_plane: server-a
    networks:
      site:
        cidr: 10.0.0.0/24
        hubs: [edge]
    lans:
      office: {cidr: 192.0.2.0/24}
    gpu_pool:
      nodes: gpu-1
  hosts:
    server-a:
      node_roles: control-plane, worker, registry, data
      networks:
        site: {address: 10.0.0.2, public_key: server-a-public-key}
      lan: {office: 192.0.2.10}
      storage: {hdd: tier-hdd}
      k3s_volume_group: tier-hdd
      stop_docker: true
      reserved: memory=6Gi,cpu=2
    worker-b:
      node_roles: worker, data
      networks:
        site: {address: 10.0.0.3, public_key: worker-b-public-key}
      lan: {office: 192.0.2.11}
      storage: {hdd: tier-hdd, ssd: tier-ssd}
      stop_docker: true
    edge:
      node_roles: public, worker
      networks:
        site: {address: 10.0.0.1, public_key: edge-public-key}
      public_address: 203.0.113.10
      storage: {nvme: tier-nvme}
      tls_dns_credentials_file: /etc/letsencrypt/cloudflare.ini
    calls:
      node_roles: calls
      ssh_host: calls-public
      networks:
        site: {address: 10.0.0.4, public_key: calls-public-key}
      public_address: 203.0.113.11
    gpu-1:
      node_roles: gpu
      networks:
        site: {address: 10.0.0.5, public_key: gpu-1-public-key, interface: wg-site, managed: false}
