# Three nodes, a public node, a calls node and a shared GPU pool, with two zones of the earlier cluster and a new one.
[site]
name = remote
suffix = example.org
control_plane = server-a
operator_user = operator
vpn_cidr = 10.0.0.0/24

[node.server-a]
roles = control-plane, worker, registry, data
ssh_address = 192.0.2.10
vpn_address = 10.0.0.2
wireguard_public_key = server-a-public-key
lan_address = 192.0.2.10
onprem = true
storage_tiers = hdd
lvm_volume_group = tier-hdd
reserved = memory=6Gi,cpu=2

[node.worker-b]
roles = worker, data
ssh_address = 192.0.2.11
vpn_address = 10.0.0.3
wireguard_public_key = worker-b-public-key
lan_address = 192.0.2.11
onprem = true
storage_tiers = hdd
lvm_volume_group = tier-hdd
avx2 = false

[node.edge]
roles = public, worker
ssh_address = 203.0.113.10
vpn_address = 10.0.0.1
wireguard_public_key = edge-public-key
public_address = 203.0.113.10
storage_tiers = nvme
lvm_volume_group = tier-nvme
tls_dns_credentials_file = /etc/letsencrypt/cloudflare.ini

[node.calls]
roles = calls
ssh_address = 203.0.113.11
vpn_address = 10.0.0.4
public_address = 203.0.113.11

[node.gpu-1]
roles = gpu
ssh_address = 10.0.0.5
vpn_address = 10.0.0.5
architecture = arm64
gpu_api_key_file = /root/vllm-key

[gpu_pool]
nodes = gpu-1
api_key_file = /home/operator/hoover4/gpu-api-key

[hoover.zone-a]
zone = zone-a
home_node = edge
stores = zone
temporal_backend = postgresql
history_source = k3s-branch
clickhouse_database_prefix = zone_a
manticore_table_prefix = zone_a_
system_bucket = zone-a-system
collection_bucket_prefix = zone-a-c-

[hoover.research]
zone = zone-c
home_node = server-a
stores = local
temporal_backend = cassandra
clickhouse_database_prefix = Research
manticore_table_prefix = research_
system_bucket = research-system
collection_bucket_prefix = research-c-
