# A Compose ini with tunings, switches, a removed Serena setting and a smaller shard count.
# The settings tests seed the operator settings from it.
[storage]
volumes_path = /srv/hoover4-volumes

[ai_services]
enabled = true
host = 192.0.2.50
llm_enabled = true

[main_services]
serena_enabled = false
internet_tools_enabled = true
worker_mem_limit = 12000M
common_workers = 3
manticore_mem_limit = 4G
manticore_vectors_mem_limit = 2G
temporal_history_shards = 64
temporal_retention = 72h
mcp_metasearch_port = 21941

[operations]
export_collection_cap = 1

[dataset_mount.testdata]
host_path = /srv/hoover4-testdata
container_path = /testdata
writable = false
