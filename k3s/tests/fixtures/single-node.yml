# One workstation with every role. single-node.zones.json holds its zone.
hoover4:
  vars:
    domain: hoover.test
    control_plane: dev
    gpu_pool:
      address: 192.0.2.50
    backup:
      node: dev
      path: /srv/hoover4-backups
  hosts:
    dev:
      node_roles: single
      local: true
      storage: {nvme: hoover4}
      k3s_volume_group: hoover4
      reserved: memory=8Gi,cpu=2
