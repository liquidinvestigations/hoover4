# One workstation with every role, and the Hoover of its earlier Compose install.
# The tests replace @REPO@ with the path of the repository.
[site]
name = workstation
suffix = hoover.test
control_plane = dev

[node.dev]
roles = single
local = true
storage_tiers = nvme
lvm_volume_group = hoover4
lvm_physical_volumes = /dev/nvme9n1p2
reserved = memory=8Gi,cpu=2

[gpu_pool]
address = 192.0.2.50
api_key_file = /etc/hoover4/gpu-api-key

[backup]
node = dev
path = /srv/hoover4-backups

[hoover.main]
zone = zone-a
home_node = dev
stores = local
temporal_backend = cassandra
history_source = compose
clickhouse_database_prefix = Hoover4
manticore_table_prefix =
system_bucket = hoover4-system
collection_bucket_prefix = hoover4-c-
source_ini = @REPO@/scripts/deploy.py_tests/fixtures/source-ini/compose-with-serena.ini
chat_control_dir = /srv/hoover4-chat-control
