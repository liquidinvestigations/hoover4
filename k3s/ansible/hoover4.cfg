# The Ansible configuration of ../deploy-k3s. The driver sets ANSIBLE_CONFIG to this file and passes the inventory,
# the known hosts file of the state folder and the limit of each run. The upstream ansible.cfg is not used.
[defaults]
roles_path = ./roles
forks = 25
host_key_checking = True
interpreter_python = auto_silent
retry_files_enabled = False
gathering = explicit
callbacks_enabled = ansible.posix.profile_tasks
deprecation_warnings = False

[privilege_escalation]
become_method = sudo

[ssh_connection]
pipelining = True
# The driver appends -o UserKnownHostsFile with the known hosts file of the state folder, because ~/.ssh is read-only
# in the operator image.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new
control_path_dir = /tmp/hoover4-ansible-cp
retries = 3
