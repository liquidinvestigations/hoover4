---
# The local node of a single-node site: the dummy link hoover4 with the fixed node address, the slice hoover4.slice
# that holds k3s and every pod, the k3s data volumes, and the local DNS server. The frontend and the trust store follow
# in ../../hoover4_local, after the cluster step writes their files.
- name: Write the unit of the fixed node address
  ansible.builtin.copy:
    dest: /etc/systemd/system/hoover4-address.service
    mode: "0644"
    content: |
      [Unit]
      Description=The fixed address of the local k3s node on the dummy link hoover4
      Before=k3s.service hoover4-dns.service hoover4-frontend.service
      After=network-pre.target
      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/bin/sh -c 'ip link show hoover4 >/dev/null 2>&1 || ip link add hoover4 type dummy'
      ExecStart=/bin/sh -c 'ip -4 addr show dev hoover4 | grep -q " {{ hoover4_node_address }}/" || ip addr add {{ hoover4_node_address }}/32 dev hoover4'
      ExecStart=/usr/bin/ip link set hoover4 up
      [Install]
      WantedBy=multi-user.target
  register: hoover4_address_unit

- name: Start the fixed node address
  ansible.builtin.systemd_service:
    name: hoover4-address.service
    enabled: true
    state: "{{ 'restarted' if hoover4_address_unit.changed else 'started' }}"
    daemon_reload: "{{ hoover4_address_unit.changed }}"

# The kubelet reserves the same memory (system-reserved), so the pods that it admits fit into this slice. The rest of
# the host, for example a Compose stack, keeps the reserved memory.
- name: Write the slice of k3s and its pods
  vars:
    limit_gib: "{{ ((ansible_facts['memtotal_mb'] / 1024) - (hoover4_reserved_memory_gib | float)) | int }}"
    cores: "{{ ansible_facts['processor_vcpus'] - (hoover4_reserved_cpus | float) }}"
  ansible.builtin.copy:
    dest: /etc/systemd/system/hoover4.slice
    mode: "0644"
    content: |
      [Unit]
      Description=Memory and CPU limits of the local k3s node and its pods
      [Slice]
      CPUAccounting=yes
      MemoryAccounting=yes
      CPUQuota={{ (cores | float * 100) | int }}%
      MemoryHigh={{ limit_gib | int - 2 }}G
      MemoryMax={{ limit_gib }}G
      TasksMax=32768
  register: hoover4_slice

# The kubelet needs every controller of the host in the cgroup of its pods. systemd enables only the controllers that it
# manages, so the unit enables the hugetlb controller for the root and the slice before k3s starts.
- name: Run k3s in the slice
  ansible.builtin.copy:
    dest: /etc/systemd/system/k3s.service.d/10-hoover4-slice.conf
    mode: "0644"
    content: "[Service]\nSlice=hoover4.slice\nExecStartPre=/bin/sh -c 'grep -qw hugetlb /sys/fs/cgroup/cgroup.controllers || exit 0; echo +hugetlb > /sys/fs/cgroup/cgroup.subtree_control; echo +hugetlb > /sys/fs/cgroup/hoover4.slice/cgroup.subtree_control;'\n"
  register: hoover4_slice_dropin

- name: Reload systemd after a changed slice
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: hoover4_slice.changed or hoover4_slice_dropin.changed

- name: Write the local DNS server configuration
  ansible.builtin.copy:
    dest: /etc/hoover4/dnsmasq.conf
    mode: "0644"
    content: |
      # The local DNS server of the single-node site. It answers only the names below {{ hoover4_domain }}.
      listen-address={{ hoover4_node_address }}
      bind-interfaces
      no-resolv
      no-hosts
      no-poll
      local=/{{ hoover4_domain }}/
      address=/{{ hoover4_domain }}/{{ hoover4_node_address }}
      log-facility=-
  register: hoover4_dns_conf

- name: Write the unit of the local DNS server
  ansible.builtin.copy:
    dest: /etc/systemd/system/hoover4-dns.service
    mode: "0644"
    content: |
      [Unit]
      Description=DNS server for the names below {{ hoover4_domain }}
      Requires=hoover4-address.service
      After=hoover4-address.service network.target
      [Service]
      ExecStart=/usr/bin/dnsmasq --keep-in-foreground --conf-file=/etc/hoover4/dnsmasq.conf --pid-file=
      ExecStartPost=/usr/bin/resolvectl dns hoover4 {{ hoover4_node_address }}
      ExecStartPost=/usr/bin/resolvectl domain hoover4 ~{{ hoover4_domain }}
      Restart=on-failure
      [Install]
      WantedBy=multi-user.target
  register: hoover4_dns_unit

- name: Start the local DNS server
  ansible.builtin.systemd_service:
    name: hoover4-dns.service
    enabled: true
    state: "{{ 'restarted' if hoover4_dns_conf.changed or hoover4_dns_unit.changed else 'started' }}"
    daemon_reload: "{{ hoover4_dns_unit.changed }}"
