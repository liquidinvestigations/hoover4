---
# The packages of a node, by OS family. zstd unpacks the Kata Containers and gVisor releases. The NFS client lets the
# kubelet mount the Hoover data folders. A single-node site keeps its dataset folders on claims, so its Arch host needs
# no NFS client, and it runs the local DNS server and the local frontend.
hoover4_packages:
  Debian: [zstd, nfs-common, lvm2, tar]
  RedHat: [zstd, nfs-utils, lvm2, tar]
  Archlinux: [lvm2, dnsmasq, zstd, nss, curl, openssl, podman]
# The WireGuard tools of a node whose interface the installer configures.
hoover4_wireguard_packages:
  Debian: [wireguard-tools]
  RedHat: [wireguard-tools]
  Archlinux: [wireguard-tools]
hoover4_modules: [overlay, br_netfilter, tun, vhost_net, vhost_vsock]
hoover4_sysctl:
  net.ipv4.ip_forward: "1"
  net.bridge.bridge-nf-call-iptables: "1"
  net.bridge.bridge-nf-call-ip6tables: "1"
  fs.inotify.max_user_instances: "8192"
  fs.inotify.max_user_watches: "1048576"
  vm.max_map_count: "262144"
hoover4_docker_units: [docker.socket, docker.service, containerd.service]
hoover4_stop_docker: false
hoover4_k3s_volume_group: ""
hoover4_backup_path: ""
