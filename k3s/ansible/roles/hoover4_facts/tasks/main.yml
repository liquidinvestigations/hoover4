---
# Read the host facts of the node: the Ansible facts of the OS and the hoover4 facts of files/hoover4-facts.py. The
# role changes nothing on the host. With hoover4_facts_dir, it writes the facts of each node into that folder of the
# operator, which the driver keeps in the state folder of the site.
- name: Read the facts of the OS
  ansible.builtin.setup:
    gather_subset: ['!all', 'min', 'hardware']

- name: Refuse an OS family without a package manager of the roles
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] in ['Debian', 'RedHat'] or (ansible_facts['os_family'] == 'Archlinux' and hoover4_single_local | bool)
    fail_msg: >-
      Node {{ inventory_hostname }} runs {{ ansible_facts['distribution'] }} ({{ ansible_facts['os_family'] }}). A node of a site
      needs a Debian or RedHat family host. Only the local node of a single-node site can be an Arch-based host.
    quiet: true

- name: Read the hoover4 facts
  ansible.builtin.script:
    cmd: hoover4-facts.py
    executable: python3
  become: true
  register: hoover4_facts_script
  changed_when: false
  check_mode: false

- name: Set the hoover4 facts
  ansible.builtin.set_fact:
    hoover4_facts: "{{ hoover4_facts_script.stdout | from_json }}"

- name: Refuse an architecture without k3s, gVisor and image builds
  ansible.builtin.assert:
    that:
      - hoover4_facts.architecture in ['x86_64', 'aarch64']
    fail_msg: "Node {{ inventory_hostname }} has the architecture {{ hoover4_facts.architecture }}. A node needs x86_64 or aarch64."
    quiet: true

# The person creates each volume group of storage, k3s_volume_group and backup. The installer changes no disk.
- name: Refuse a volume group of the site file that the node does not have
  ansible.builtin.assert:
    that:
      - hoover4_missing_groups | length == 0
    fail_msg: >-
      Node {{ inventory_hostname }} has no volume group {{ hoover4_missing_groups | join(', ') }}, which storage,
      k3s_volume_group or backup of the site file names. Create it, or correct the site file. The node has
      {{ hoover4_facts.volume_groups.keys() | list | join(', ') or 'no volume group' }}.
    quiet: true
  vars:
    hoover4_missing_groups: >-
      {{ ((hoover4_storage | default({})).values() | list + ([hoover4_k3s_volume_group] if hoover4_k3s_volume_group | default('') | length > 0 else [])
          + ([hoover4_backup_volume_group] if hoover4_backup_volume_group | default('') | length > 0 else []))
         | unique | difference(hoover4_facts.volume_groups.keys() | list) }}

- name: Write the facts of the node into the state folder
  ansible.builtin.copy:
    content: "{{ {'os_family': ansible_facts['os_family'], 'distribution': ansible_facts['distribution'], 'distribution_version': ansible_facts['distribution_version'], 'memory_mb': ansible_facts['memtotal_mb'], 'cpus': ansible_facts['processor_vcpus']} | combine(hoover4_facts) | to_nice_json }}\n"
    dest: "{{ hoover4_facts_dir }}/{{ inventory_hostname }}.json"
    mode: "0600"
  delegate_to: localhost
  become: false
  when: hoover4_facts_dir | default('') | length > 0
