---
# The WireGuard interfaces that the installer manages on a node: one for each network of the node with managed true
# (hoover4_wireguard, a list). The role writes and starts a missing interface with a new private key, and adds the
# direct peers of the site file and the routed addresses to an existing one. It removes no peer and no address.
# Run the hub first: a new peer works when both of its nodes have it.
- name: Configure each WireGuard interface of the node
  ansible.builtin.include_tasks: interface.yml
  loop: "{{ hoover4_wireguard }}"
  loop_control:
    loop_var: hoover4_network
    label: "{{ hoover4_network.network }} ({{ hoover4_network.interface }})"
