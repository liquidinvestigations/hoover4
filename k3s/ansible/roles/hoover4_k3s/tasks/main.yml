---
# Install k3s, gVisor and Kata Containers on one node. One node runs the k3s server with the embedded etcd datastore
# (cluster-init), also on a site with one node. The other nodes join it as agents. Each node uses its node address on
# its flannel interface. A second run writes the same files and restarts k3s only when an input changed. A generated
# file that differs only in its comment lines counts as changed here, so keep the comments of the templates stable.
# The architecture comes from the host, and the site file does not state it.
- name: Read the architecture of the node
  ansible.builtin.command: uname -m
  register: hoover4_machine
  changed_when: false
  check_mode: false

# A node at its LAN address has no interface in the site file. flannel uses the interface that holds the address.
- name: Read the interface of the node address
  ansible.builtin.command: ip -4 -o addr show to {{ hoover4_node_address }}/32
  register: hoover4_address_iface
  changed_when: false
  check_mode: false

- name: Set the role values of the node
  ansible.builtin.set_fact:
    hoover4_architecture: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[hoover4_machine.stdout | trim] }}"
    hoover4_unit: "{{ 'k3s' if hoover4_server | bool else 'k3s-agent' }}"
    hoover4_kubeconfig_source: "/etc/rancher/k3s/{{ 'hoover4-admin.yaml' if hoover4_single_local | bool else 'k3s.yaml' }}"
    hoover4_found_iface: "{{ (hoover4_address_iface.stdout.split() + ['', ''])[1] }}"

- name: Set the flannel interface and the runtimes of the node
  ansible.builtin.set_fact:
    hoover4_kata: "{{ hoover4_architecture == 'amd64' and not hoover4_gpu | bool }}"
    hoover4_flannel_iface: "{{ hoover4_flannel_iface if hoover4_flannel_iface | length > 0 else hoover4_found_iface }}"

- name: Refuse a node whose interface does not hold the node address
  ansible.builtin.assert:
    that: hoover4_found_iface | length > 0 and hoover4_found_iface == hoover4_flannel_iface
    fail_msg: >-
      {{ inventory_hostname }} has the node address {{ hoover4_node_address }} on
      {{ hoover4_found_iface or 'no interface' }}, not on {{ hoover4_flannel_iface or 'an interface' }}.
    quiet: true

- name: Read the mounts of the k3s data
  ansible.builtin.command: findmnt -rn {{ item }}
  loop: [/var/lib/rancher, /var/lib/kubelet]
  register: hoover4_k3s_mounts
  changed_when: false
  check_mode: false
  failed_when: hoover4_k3s_mounts.rc != 0
  when: hoover4_k3s_volume_group | length > 0

- name: Create the configuration folders
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: [/etc/rancher/k3s, /etc/gvisor, /etc/kata-containers, /var/lib/rancher/k3s/agent/etc/containerd/config-v3.toml.d]

- name: Install the runtimes
  ansible.builtin.include_tasks: runtimes.yml

- name: Prepare the tokens
  ansible.builtin.include_tasks: tokens.yml

- name: Convert a SQLite server to etcd
  ansible.builtin.include_tasks: sqlite.yml
  when: hoover4_server | bool

- name: Write the scheduler configuration
  ansible.builtin.template:
    src: scheduler-config.yaml.j2
    dest: /etc/rancher/k3s/scheduler-config.yaml
    mode: "0644"
  register: hoover4_scheduler_config
  when: hoover4_server | bool

- name: Prepare the secrets encryption
  ansible.builtin.include_tasks: secrets-encryption.yml
  vars:
    hoover4_secrets_phase: prepare
  when: hoover4_server | bool

- name: Write the k3s configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0644"
  register: hoover4_k3s_config

# The kubelet stops the pods in the shutdown grace period when systemd stops the host, and it swaps no container.
- name: Create the folder of the kubelet configuration files
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d
    state: directory
    mode: "0700"

- name: Write the kubelet configuration of hoover4
  ansible.builtin.template:
    src: kubelet-hoover4.conf.j2
    dest: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/10-hoover4.conf
    mode: "0644"
  register: hoover4_kubelet_dropin

- name: Write the registry mirror of the cluster registry
  ansible.builtin.copy:
    content: "mirrors:\n  \"registry.hoover.internal\":\n    endpoint:\n      - \"http://{{ hoover4_registry_endpoint }}\"\n"
    dest: /etc/rancher/k3s/registries.yaml
    mode: "0600"
  register: hoover4_k3s_registries
  when: hoover4_registry_endpoint | length > 0

- name: Install k3s
  ansible.builtin.include_tasks: install.yml

- name: Finish the server
  ansible.builtin.include_tasks: server.yml
  when: hoover4_server | bool
