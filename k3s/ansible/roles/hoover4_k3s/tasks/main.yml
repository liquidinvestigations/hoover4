---
# Install k3s, gVisor and Kata Containers on one node. One node runs the k3s server with the embedded etcd datastore
# (cluster-init), also on a site with one node. The other nodes join it as agents. Each node uses its node address on
# its flannel interface. A second run writes the same files and restarts k3s only when an input changed. A generated
# file that differs only in its comment lines counts as changed here, so keep the comments of the templates stable.
- name: Set the role values of the node
  ansible.builtin.set_fact:
    hoover4_unit: "{{ 'k3s' if hoover4_server | bool else 'k3s-agent' }}"
    hoover4_kata: "{{ hoover4_architecture == 'amd64' and not hoover4_gpu | bool }}"
    hoover4_kubeconfig_source: "/etc/rancher/k3s/{{ 'hoover4-admin.yaml' if hoover4_single_local | bool else 'k3s.yaml' }}"

- name: Read the addresses of the flannel interface
  ansible.builtin.command: ip -4 -o addr show {{ hoover4_flannel_iface }}
  register: hoover4_iface
  changed_when: false
  check_mode: false

- name: Refuse a node whose interface does not hold the node address
  ansible.builtin.assert:
    that: (' ' ~ hoover4_node_address ~ '/') in hoover4_iface.stdout
    fail_msg: "{{ hoover4_flannel_iface }} of {{ inventory_hostname }} does not have the node address {{ hoover4_node_address }}."
    quiet: true

- name: Read the mounts of the k3s data
  ansible.builtin.command: findmnt -rn {{ item }}
  loop: [/var/lib/rancher, /var/lib/kubelet]
  register: hoover4_k3s_mounts
  changed_when: false
  check_mode: false
  failed_when: hoover4_k3s_mounts.rc != 0
  when: hoover4_require_k3s_volumes | bool

- name: Create the configuration folders
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: [/etc/rancher/k3s, /etc/gvisor, /etc/kata-containers, /var/lib/rancher/k3s/agent/etc/containerd/config-v3.toml.d]

- name: Install the runtimes
  ansible.builtin.include_tasks: runtimes.yml

- name: Prepare the tokens
  ansible.builtin.include_tasks: tokens.yml

- name: Convert a SQLite server to etcd
  ansible.builtin.include_tasks: sqlite.yml
  when: hoover4_server | bool

- name: Write the k3s configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0644"
  register: hoover4_k3s_config

- name: Write the registry mirror of the cluster registry
  ansible.builtin.copy:
    content: "mirrors:\n  \"registry.hoover.internal\":\n    endpoint:\n      - \"http://{{ hoover4_registry_endpoint }}\"\n"
    dest: /etc/rancher/k3s/registries.yaml
    mode: "0600"
  register: hoover4_k3s_registries
  when: hoover4_registry_endpoint | length > 0

- name: Install k3s
  ansible.builtin.include_tasks: install.yml

- name: Finish the server
  ansible.builtin.include_tasks: server.yml
  when: hoover4_server | bool
