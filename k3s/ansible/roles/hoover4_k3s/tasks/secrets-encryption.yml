---
# The k3s server keeps the Secrets of the cluster encrypted at rest (secrets-encryption of config.yaml.j2). The secret
# store of the site keeps its seal key in a Secret (../../../../platform/secrets/openbao.py). A new server starts with
# encryption on. A running server without it follows the k3s procedure for an existing cluster: enable before the
# restart with the flag (phase prepare), then rotate-keys, which encrypts every Secret again, and a second restart
# (phase finish). k3s keeps the encryption configuration in its bootstrap data in etcd, encrypted with the server
# token, so an etcd snapshot with the token of the platform backup restores it.
- name: Read the secrets encryption state
  ansible.builtin.command: /usr/local/bin/k3s secrets-encrypt status
  register: hoover4_encryption
  changed_when: false
  check_mode: false
  failed_when: false

- name: Prepare the secrets encryption of a running server
  ansible.builtin.command: /usr/local/bin/k3s secrets-encrypt enable
  changed_when: true
  when:
    - hoover4_secrets_phase == 'prepare'
    - hoover4_encryption.rc == 0
    - "'no configuration file found' in hoover4_encryption.stdout"

- name: Encrypt the existing Secrets
  when:
    - hoover4_secrets_phase == 'finish'
    - hoover4_encryption.rc == 0
    - "'Encryption Status: Disabled' in hoover4_encryption.stdout"
    - "'no configuration file found' not in hoover4_encryption.stdout"
  block:
    # A run that stopped after the rotation finds another stage, and continues with the restart.
    - name: Rotate the keys and encrypt every Secret
      ansible.builtin.command: /usr/local/bin/k3s secrets-encrypt rotate-keys
      changed_when: true
      when: "'Current Rotation Stage: start' in hoover4_encryption.stdout"

    - name: Wait until the server encrypted every Secret
      ansible.builtin.command: /usr/local/bin/k3s secrets-encrypt status
      register: hoover4_encryption_rotated
      until: "'reencrypt_finished' in hoover4_encryption_rotated.stdout"
      retries: 60
      delay: 5
      changed_when: false
      failed_when: false

    - name: Restart the server with the new key
      ansible.builtin.systemd_service:
        name: "{{ hoover4_unit }}"
        state: restarted

    - name: Wait until the server reports the encryption
      ansible.builtin.command: /usr/local/bin/k3s secrets-encrypt status
      register: hoover4_encryption_done
      until: >-
        'Encryption Status: Enabled' in hoover4_encryption_done.stdout
        and 'reencrypt_finished' in hoover4_encryption_done.stdout
        and 'All hashes match' in hoover4_encryption_done.stdout
      retries: 120
      delay: 5
      changed_when: false
