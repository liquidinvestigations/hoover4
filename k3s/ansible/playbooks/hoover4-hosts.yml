---  # noqa: run-once[play]
# The host steps of a hoover4 site (../../deploy-k3s up, step hosts:prepare). The driver passes the site file as the
# inventory, the variables of config.ansible_variables() and the target nodes as the limit. The plays run on all target
# nodes in parallel. Each node installs its packages once, before the tasks that need them.
- name: Read the facts of each node
  hosts: hoover4
  gather_facts: false
  become: false
  strategy: free
  tags: [facts]
  roles:
    - role: hoover4_facts

- name: Prepare each node
  hosts: hoover4
  gather_facts: false
  become: true
  roles:
    - role: hoover4_host
    - role: hoover4_public_firewall
      when: hoover4_public_firewall | bool

# The speed of a node without a stored value, before the step hosts:k3s starts k3s on it (role hoover4_speed).
# deploy-k3s measure-speed runs only this play, with hoover4_speed_force.
- name: Measure the speed of each new node
  hosts: hoover4
  gather_facts: false
  become: false
  strategy: free
  tags: [speed]
  roles:
    - role: hoover4_speed
      when: hoover4_speed_force | default(false) | bool or not hoover4_speed_stored | bool

# The hubs first: a new peer works when both of its nodes have it.
- name: Add the WireGuard peers of each node that the installer configures
  hosts: hoover4
  gather_facts: false
  become: true
  order: sorted
  roles:
    - role: hoover4_wireguard
      when: hoover4_wireguard | length > 0
