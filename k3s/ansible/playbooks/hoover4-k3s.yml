---
# k3s on the target nodes (../../deploy-k3s up, step hosts:k3s): the server first, then the agents in parallel with
# the agent token of the server. The server play writes the admin kubeconfig into the state folder. The server is the
# node with hoover4_server, the control plane of the site file.
- name: Install the k3s server
  hosts: hoover4
  gather_facts: false
  become: true
  roles:
    - role: hoover4_k3s
      when: hoover4_server | bool

- name: Install the k3s agents
  hosts: hoover4
  gather_facts: false
  become: true
  roles:
    - role: hoover4_k3s
      when: not hoover4_server | bool
