# gVisor runs the openDesk and Hoover web applications. Kata with Cloud Hypervisor runs the stores and the parse workers.
# The role hoover4_k3s of ../ansible registers the handlers in containerd on every node.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
overhead:
  podFixed:
    # The steady cost of one gVisor pod outside its pod cgroup: its part of the kubelet, containerd and the shim, and
    # the statistics call of its sandbox (pod_fixed() of ../zones/cpu_requests.py, runtimeOverhead of
    # ../zones/cpu-requests.json). The cost of its containers and exec probes is in its request (runtime_cost()).
    cpu: 6m
    # The shim and the runsc process of a pod use about 14 MiB outside the pod cgroup (shimMemory of
    # ../zones/cpu-requests.json). The sentry runs in the pod cgroup, so the memory request covers it. The overhead
    # also raises the memory limit of the pod cgroup by this value.
    memory: 32Mi
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata
handler: kata
overhead:
  podFixed:
    # The VM, its shim and virtiofsd run in the pod cgroup (sandbox_cgroup_only). The guest has 512 MiB
    # (default_memory, ../ansible/roles/hoover4_k3s/tasks/kata.yml) plus the container limits. The host keeps each
    # guest page that the guest used once. So the pod cgroup grows to the guest size, for example with the page cache
    # of a store. The limit of the pod cgroup is the container limits plus this overhead. The overhead holds the 512
    # MiB of the guest and the memory outside the guest. That memory is the heaps of the shim, Cloud Hypervisor and
    # virtiofsd, and the kernel memory of the cgroup. It was at most 60 MiB per pod under load, and 640Mi leaves 68 MiB
    # above it. With a smaller value a full guest exceeds the cgroup, and the kernel kills the VM. The memory request
    # of a Kata workload is its measured peak (../zones/memory_requests.py). The render subtracts this value from it.
    memory: 640Mi
    # The steady cost of one Kata pod outside its pod cgroup: its part of the kubelet, containerd and the shim
    # (pod_fixed() of ../zones/cpu_requests.py). The VM runs in the pod cgroup, so the CPU request of the pod covers it.
    cpu: 5m
---
# gVisor with nvproxy for the GPU services on the GPU nodes (../ansible/roles/hoover4_k3s registers runsc-nvproxy there).
# The GPU nodes carry the taint hoover.dev/gpu=true:NoSchedule, so only a pod of this class or the nvidia class with
# the toleration runs there. The class nvidia comes from k3s, when the host has the NVIDIA container toolkit. It runs
# a GPU pod with runc: the fallback of decision D20.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor-gpu
handler: runsc-nvproxy
scheduling:
  nodeSelector:
    hoover.dev/gpu: "true"
  tolerations:
    - {key: hoover.dev/gpu, operator: Equal, value: "true", effect: NoSchedule}
overhead:
  podFixed:
    memory: 64Mi
