# gVisor runs the openDesk and Hoover web applications. Kata with Cloud Hypervisor runs the stores and the parse workers.
# The role hoover4_k3s of ../ansible registers the handlers in containerd on every node.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
overhead:
  podFixed:
    # The measured cost of a gVisor pod outside its pod cgroup: kubelet, containerd, the shim and the runsc commands of
    # its probes and statistics (runtimeOverhead of ../zones/cpu-requests.json). The scheduler adds it to each pod.
    cpu: 10m
    # The shim and the runsc process of a pod use about 14 MiB outside the pod cgroup (shimMemory of
    # ../zones/cpu-requests.json). The sentry runs in the pod cgroup, so the memory request covers it. The overhead
    # also raises the memory limit of the pod cgroup by this value.
    memory: 32Mi
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata
handler: kata
overhead:
  podFixed:
    # The VM runs in the pod cgroup. Its guest has 512 MiB (default_memory, ../ansible/roles/hoover4_k3s/tasks/kata.yml) plus the
    # container limits, and Cloud Hypervisor used 212 to 328 MiB on the public host. With a smaller overhead a guest
    # that fills its memory, for example with the page cache of a store, exceeds the cgroup, and the kernel kills the VM.
    memory: 1Gi
    # The measured cost of a Kata pod outside its pod cgroup: the shim and virtiofsd (runtimeOverhead of
    # ../zones/cpu-requests.json). The VM runs in the pod cgroup, so the CPU request of the pod covers it.
    cpu: 10m
---
# gVisor with nvproxy for the GPU services on the GPU nodes (../ansible/roles/hoover4_k3s registers runsc-nvproxy there).
# The GPU nodes carry the taint hoover.dev/gpu=true:NoSchedule, so only a pod of this class or the nvidia class with
# the toleration runs there. The class nvidia comes from k3s, when the host has the NVIDIA container toolkit. It runs
# a GPU pod with runc: the fallback of decision D20.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor-gpu
handler: runsc-nvproxy
scheduling:
  nodeSelector:
    hoover.dev/gpu: "true"
  tolerations:
    - {key: hoover.dev/gpu, operator: Equal, value: "true", effect: NoSchedule}
overhead:
  podFixed:
    memory: 64Mi
