# The Kubernetes descheduler moves running stateless pods off nodes with a high requested share, for example after a
# node joins. setup.sh applies this file. The scheduler then places each evicted pod by the requested CPU and memory
# shares of the nodes (the scheduler configuration of ../ansible/roles/hoover4_k3s/templates/scheduler-config.yaml.j2).
# LowNodeUtilization compares the requests of each node with the mean of all nodes (useDeviationThresholds):
# - A node is underused when its requested CPU and its requested memory are both more than 15 points below the mean.
# - A node is overused when its requested CPU or its requested memory is more than 15 points above the mean.
# The descheduler evicts pods only when the site has both kinds, and only until the overused node is inside the band.
# Nodes inside the band of 30 points around the mean never lose pods, so a moved pod does not move back.
# A node that joins has no requests, so it is underused until it takes its share of the pods.
# A run evicts at most 5 pods of a node and 10 pods in total, every 10 minutes, so the moves are gradual.
# The evictor never evicts:
# - a pod with a claim (PodsWithPVC). TopoLVM claims are local volumes on one node, and the store pods have claims.
# - a pod with the label hoover.dev/store (the stores of the zones and of the site), or a pod of a Job
#   (batch.kubernetes.io/job-name).
# - a pod of the PriorityClass hoover-node-bound or a higher priority (priorityThreshold). These pods can run on one
#   node only (priorityclasses.yaml).
# - a pod without a controller, a DaemonSet pod and a system-critical pod (the default protections).
# - a pod that is younger than 15 minutes, so a pod that starts in a zone create stays where it started.
# - a pod in the excluded namespaces: the platform, the operator pod, the shared stores and the calls services, whose
#   media pods name the public node.
# It allows a pod with an emptyDir volume (PodsWithLocalStorage), because that volume holds only scratch data.
# It evicts through the eviction API, so each PodDisruptionBudget applies. nodeFit evicts a pod only when another node
# fits it, with its node selector and its requests.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: descheduler
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: descheduler
rules:
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "update"]
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "persistentvolumeclaims", "persistentvolumes", "replicationcontrollers"]
    verbs: ["get", "watch", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "watch", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims", "resourceslices", "deviceclasses"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: descheduler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: descheduler
subjects:
  - kind: ServiceAccount
    name: descheduler
    namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: descheduler-policy
  namespace: kube-system
data:
  policy.yaml: |
    apiVersion: descheduler/v1alpha2
    kind: DeschedulerPolicy
    maxNoOfPodsToEvictPerNode: 5
    maxNoOfPodsToEvictTotal: 10
    profiles:
      - name: requested-cpu-spread
        pluginConfig:
          - name: DefaultEvictor
            args:
              nodeFit: true
              priorityThreshold:
                name: hoover-node-bound
              minPodAge: 15m
              podProtections:
                defaultDisabled: [PodsWithLocalStorage]
                extraEnabled: [PodsWithPVC]
              labelSelector:
                matchExpressions:
                  - {key: hoover.dev/store, operator: DoesNotExist}
                  - {key: batch.kubernetes.io/job-name, operator: DoesNotExist}
          - name: LowNodeUtilization
            args:
              useDeviationThresholds: true
              thresholds: {cpu: 15, memory: 15}
              targetThresholds: {cpu: 15, memory: 15}
              evictableNamespaces:
                exclude: [kube-system, kube-public, kube-node-lease, operator-portal, hoover-stores, hoover-data, registry,
                          topolvm-system, cert-manager, ingress, calls]
        plugins:
          balance:
            enabled: [LowNodeUtilization]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: descheduler
  namespace: kube-system
  labels: {app.kubernetes.io/name: descheduler}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: descheduler}
  template:
    metadata:
      labels: {app.kubernetes.io/name: descheduler}
      # setup.sh writes the hash of this file, so a changed policy restarts the descheduler, which reads it at start.
      annotations: {hoover.dev/source-hash: SOURCE_HASH}
    spec:
      serviceAccountName: descheduler
      priorityClassName: system-cluster-critical
      containers:
        - name: descheduler
          image: registry.k8s.io/descheduler/descheduler:v0.36.0@sha256:7ca92c0a7b4f1c51d306409da6b832005fcadb224e384795646376726734c6e5
          command: [/bin/descheduler]
          args: [--policy-config-file=/policy/policy.yaml, --descheduling-interval=10m, --v=3]
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities: {drop: [ALL]}
          livenessProbe:
            httpGet: {path: /healthz, port: 10258, scheme: HTTPS}
            initialDelaySeconds: 5
            periodSeconds: 20
          volumeMounts:
            - {name: policy, mountPath: /policy, readOnly: true}
      volumes:
        - name: policy
          configMap: {name: descheduler-policy}
