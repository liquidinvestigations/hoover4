# The Kubernetes descheduler moves a running pod to its planned node. It runs only during a deployment: deschedule.py
# runs it once as a Job in the last step of deploy-k3s up, after the zones and the call services, and deletes the Job
# when it ends. No descheduler runs between deployments, so no pod moves outside a deployment. setup.sh applies the
# account, the rights and the policy of this file.
# The admission policy of the site placement (placement-policy.yaml) gives each new pod of the stores and the zones a
# preferred node affinity for its planned node (../placement.py). A pod starts on another node when its planned node
# has no room at that time, for example while an earlier pod of the same deployment still runs.
# RemovePodsViolatingNodeAffinity with the type preferredDuringSchedulingIgnoredDuringExecution evicts such a pod
# when its planned node now has room, and the scheduler starts it there. The pass has no minimum pod age, because
# these pods started in the same deployment. A pod on its planned node is never evicted,
# and a pod without a planned node is never evicted, so a second run evicts nothing.
# The plan keeps each running pod on its node, so this pass does not balance the nodes. The plan does that for the
# pods it places.
# A run evicts at most 5 pods of a node and 10 pods in total, so the moves are gradual.
# The evictor never evicts:
# - a pod with a claim (PodsWithPVC). TopoLVM claims are local volumes on one node, and the store pods have claims.
# - a pod with the label hoover.dev/store (the stores of the zones and of the site), or a pod of a Job
#   (batch.kubernetes.io/job-name).
# - a pod of the PriorityClass hoover-node-bound or a higher priority (priorityThreshold). These pods can run on one
#   node only (priorityclasses.yaml).
# - a pod without a controller, a DaemonSet pod and a system-critical pod (the default protections).
# - a pod in the excluded namespaces: the platform, the operator pod, the shared stores and the calls services, whose
#   media pods name the public node.
# It allows a pod with an emptyDir volume (PodsWithLocalStorage), because that volume holds only scratch data.
# It evicts through the eviction API, so each PodDisruptionBudget applies. nodeFit evicts a pod only when another node
# fits it, with its node selector and its requests.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: descheduler
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: descheduler
rules:
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "update"]
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "persistentvolumeclaims", "persistentvolumes", "replicationcontrollers"]
    verbs: ["get", "watch", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "watch", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims", "resourceslices", "deviceclasses"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: descheduler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: descheduler
subjects:
  - kind: ServiceAccount
    name: descheduler
    namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: descheduler-policy
  namespace: kube-system
data:
  policy.yaml: |
    apiVersion: descheduler/v1alpha2
    kind: DeschedulerPolicy
    maxNoOfPodsToEvictPerNode: 5
    maxNoOfPodsToEvictTotal: 10
    profiles:
      - name: planned-nodes
        pluginConfig:
          - name: DefaultEvictor
            args:
              nodeFit: true
              priorityThreshold:
                name: hoover-node-bound
              podProtections:
                defaultDisabled: [PodsWithLocalStorage]
                extraEnabled: [PodsWithPVC]
              labelSelector:
                matchExpressions:
                  - {key: hoover.dev/store, operator: DoesNotExist}
                  - {key: batch.kubernetes.io/job-name, operator: DoesNotExist}
          - name: RemovePodsViolatingNodeAffinity
            args:
              nodeAffinityType: [preferredDuringSchedulingIgnoredDuringExecution]
              namespaces:
                exclude: [kube-system, kube-public, kube-node-lease, operator-portal, hoover-stores, hoover-data, registry,
                          topolvm-system, cert-manager, ingress, calls]
        plugins:
          deschedule:
            enabled: [RemovePodsViolatingNodeAffinity]
