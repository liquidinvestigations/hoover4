# The Garage of the site, one node in each pod (../../shared.py). shared.py replaces REPLICATION_FACTOR with the
# replicas of the site file and BOOTSTRAP_PEERS with the peer names of the known node ids. The RPC secret and the admin
# token come from the environment. A node advertises the address of its pod. After a restart with a new address, the
# other nodes find it again through its peer name.
# metadata_fsync and data_fsync are on, so an acknowledged write is on the volume. hoover4 keeps the defaults (off).
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"
metadata_fsync = true
data_fsync = true
replication_factor = REPLICATION_FACTOR
block_ram_buffer_max = "32MiB"
rpc_bind_addr = "[::]:3901"
bootstrap_peers = BOOTSTRAP_PEERS

[s3_api]
s3_region = "us-east-1"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage"

[admin]
api_bind_addr = "[::]:3903"
