# The rights of the zone runner (runner.py). The runner container of the operator pod (operator-login.yaml) mounts the
# token of the ServiceAccount zone-runner from the Secret zone-runner-token.
# - In a zone namespace it has every right through the RoleBinding zone-runner, which zone.py creates with each zone
#   namespace. It binds the ClusterRole zone-admin.
# - Outside the zone namespaces it can create, change and delete zone namespaces and RoleBindings, bind zone-admin,
#   read the nodes and the zone pod policy, update the XWiki extension repository, run the shared call services, read
#   the record of the coturn peer check,
#   read the Services of the Hoover NFS servers, update the operation ConfigMaps of the portal and read the GPU key.
# - In hoover-stores, the namespace of the shared ClickHouse, Garage and Temporal (../../hoover/stores/shared.py,
#   temporal.py), it runs the store clients and the Temporal CLI in the store and Temporal pods to add and remove the
#   tenant of a zone, grows the store claims, reads the Secret temporal-auth to sign the Temporal key of a zone, and
#   creates and deletes the Ingress of the object storage host of a zone (../../zones/objectstore.py). The network
#   policy garage-clients admits the ingress controller only on the S3 port of Garage.
#   deploy-k3s up creates and changes the stores and Temporal with the admin kubeconfig.
# - In operator-portal it reads and writes the ConfigMaps and Secrets of the cluster copy of the state
#   (../../clusterstate.py) and the Lease site-operation of the site lock (../../oplock.py). The Secret rights cover
#   every Secret of operator-portal, because a Role cannot name the Secrets that the runner creates.
# - The ValidatingAdmissionPolicy zone-runner-scope refuses a namespace or a RoleBinding outside the zone namespaces,
#   and a RoleBinding to a ClusterRole other than zone-admin.
# - The ValidatingAdmissionPolicy hoover-pod-limits (../../zones/manifests/zone-pods.yaml) refuses host access in the
#   pods of the zone namespaces, calls, extensions and hoover-pools. The admin kubeconfig applies it, and the runner
#   cannot change it.
# - In hoover-pools it creates, changes and deletes the processing pools of the site (../../hoover/pools.py ensure).
# - In platform-backup it creates, reads and deletes the reader pod of the platform backup
#   (../backups/backups.py snapshot_reader()). The pod reads the k3s etcd snapshots, the token and the k3s
#   configuration on the control plane. The ValidatingAdmissionPolicy k3s-snapshot-reader admits only that pod form.
# The runner cannot read or change any other object.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zone-runner
  namespace: operator-portal
---
apiVersion: v1
kind: Secret
metadata:
  name: zone-runner-token
  namespace: operator-portal
  annotations:
    kubernetes.io/service-account.name: zone-runner
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zone-admin
rules:
  - apiGroups: ['*']
    resources: ['*']
    verbs: ['*']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zone-runner
rules:
  - apiGroups: ['']
    resources: [namespaces]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [get, list, create, patch, update, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [zone-admin]
    verbs: [bind]
  - apiGroups: ['']
    resources: [nodes]
    verbs: [get, list]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingadmissionpolicies, mutatingadmissionpolicybindings]
    resourceNames: [hoover-zone-pods]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zone-runner
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: zone-runner}
subjects: [{kind: ServiceAccount, name: zone-runner, namespace: operator-portal}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zone-runner
  namespace: operator-portal
rules:
  - apiGroups: ['']
    resources: [configmaps]
    verbs: [get, list, create, patch, update, delete]
  # The zone secrets of the cluster copy, and the GPU key, from which the zone token of the GPU proxy derives
  # (../../hoover/gpu.py).
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, list, create, update, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [site-operation]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zone-runner
  namespace: operator-portal
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: zone-runner}
subjects: [{kind: ServiceAccount, name: zone-runner, namespace: operator-portal}]
---
# The shared call services (../calls/install-calls.py) and the XWiki extension repository of the zones.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zone-runner
  namespace: calls
rules:
  - apiGroups: ['', apps, networking.k8s.io]
    resources: [secrets, services, deployments, ingresses]
    verbs: [get, list, watch, create, patch, update, delete]
  # The record of the coturn peer check, which the admin kubeconfig writes (install-calls.py --probe). The runner only
  # reads it, because it cannot run the probe pod.
  - apiGroups: ['']
    resources: [configmaps]
    resourceNames: [coturn-peer-check]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zone-runner
  namespace: calls
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: zone-runner}
subjects: [{kind: ServiceAccount, name: zone-runner, namespace: operator-portal}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zone-runner
  namespace: extensions
rules:
  - apiGroups: ['', apps]
    resources: [services, deployments]
    verbs: [get, list, create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zone-runner
  namespace: extensions
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: zone-runner}
subjects: [{kind: ServiceAccount, name: zone-runner, namespace: operator-portal}]
---
# The tenant of each zone in the shared stores of the site.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zone-runner
  namespace: hoover-stores
rules:
  - apiGroups: ['']
    resources: [pods, configmaps]
    verbs: [get, list]
  - apiGroups: ['']
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: ['']
    resources: [persistentvolumeclaims]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get]
  - apiGroups: ['']
    resources: [secrets]
    resourceNames: [temporal-auth]
    verbs: [get]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, create, patch, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zone-runner
  namespace: hoover-stores
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: zone-runner}
subjects: [{kind: ServiceAccount, name: zone-runner, namespace: operator-portal}]
---
# The processing pools of the site (../../hoover/pools.py ensure): a zone create makes them when the site has none, and
# the delete of the last zone of the store layout site removes them. deploy-k3s up applies them with the admin
# kubeconfig.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zone-runner
  namespace: hoover-pools
rules:
  - apiGroups: ['', apps, batch, networking.k8s.io]
    resources: [deployments, replicasets, statefulsets, jobs, services, configmaps, secrets, networkpolicies, ingresses]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zone-runner
  namespace: hoover-pools
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: zone-runner}
subjects: [{kind: ServiceAccount, name: zone-runner, namespace: operator-portal}]
---
# The reader pod of the platform backup runs as this ServiceAccount, which has no binding and no token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k3s-snapshot-reader
  namespace: platform-backup
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zone-runner
  namespace: platform-backup
rules:
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, watch, create, delete]
  - apiGroups: ['']
    resources: [pods/exec]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zone-runner
  namespace: platform-backup
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: zone-runner}
subjects: [{kind: ServiceAccount, name: zone-runner, namespace: operator-portal}]
---
# Every pod of platform-backup must have the form of snapshot_reader() in ../backups/backups.py. The policy requires
# HELPER_IMAGE of backups.py, read-only mounts of the three host paths, no capability, no privilege escalation, no host
# namespace and the ServiceAccount k3s-snapshot-reader without a token.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: k3s-snapshot-reader
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
        scope: '*'
  matchConditions:
    - name: platform-backup
      expression: request.namespace == 'platform-backup'
  variables:
    - name: containers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])"
    - name: paths
      expression: "['/var/lib/rancher/k3s/server/db/snapshots', '/var/lib/rancher/k3s/server/token', '/etc/rancher/k3s/config.yaml']"
  validations:
    - expression: "!has(object.spec.ephemeralContainers) || size(object.spec.ephemeralContainers) == 0"
      message: A pod here has no ephemeral container.
    - expression: "variables.containers.all(c, c.image == 'docker.io/library/python:3.14-alpine@sha256:7f2ec713f0436c59df2362d973b6a05af9e87ba78f0e94f5245c302984a7a1fd')"
      message: A pod here uses the pinned image of the snapshot reader.
    - expression: "has(object.spec.volumes) && object.spec.volumes.all(v, has(v.hostPath) && v.hostPath.path in variables.paths)"
      message: A pod here mounts only the k3s snapshot folder, the token and the k3s configuration.
    - expression: "variables.containers.all(c, !has(c.volumeMounts) || c.volumeMounts.all(m, has(m.readOnly) && m.readOnly))"
      message: A pod here mounts every volume read-only.
    - expression: >
        variables.containers.all(c, has(c.securityContext)
          && has(c.securityContext.allowPrivilegeEscalation) && !c.securityContext.allowPrivilegeEscalation
          && (!has(c.securityContext.privileged) || !c.securityContext.privileged)
          && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop)
          && 'ALL' in c.securityContext.capabilities.drop && !has(c.securityContext.capabilities.add))
      message: A container here drops every capability, adds none and has no privilege escalation.
    - expression: >
        !(has(object.spec.hostNetwork) && object.spec.hostNetwork) && !(has(object.spec.hostPID) && object.spec.hostPID)
          && !(has(object.spec.hostIPC) && object.spec.hostIPC)
      message: A pod here uses no host namespace.
    - expression: >
        has(object.spec.serviceAccountName) && object.spec.serviceAccountName == 'k3s-snapshot-reader'
          && has(object.spec.automountServiceAccountToken) && !object.spec.automountServiceAccountToken
      message: A pod here runs as k3s-snapshot-reader without an API token.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: k3s-snapshot-reader
spec:
  policyName: k3s-snapshot-reader
  validationActions: [Deny]
---
# The Hoover manifests name the address of the NFS server of each data node (../hoover-data/).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zone-runner
  namespace: hoover-data
rules:
  - apiGroups: ['']
    resources: [services]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zone-runner
  namespace: hoover-data
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: zone-runner}
subjects: [{kind: ServiceAccount, name: zone-runner, namespace: operator-portal}]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: zone-runner-scope
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [namespaces]
        # The API server adds this default. Without it a second apply sends a patch that changes nothing.
        scope: '*'
      - apiGroups: [rbac.authorization.k8s.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [rolebindings]
        scope: '*'
  matchConditions:
    - name: zone-runner
      expression: request.userInfo.username == 'system:serviceaccount:operator-portal:zone-runner'
  validations:
    - expression: "request.resource.resource != 'namespaces' || request.name.matches('^(hoover-)?zone-[a-z0-9]{1,12}$')"
      message: The zone runner changes only zone namespaces.
    - expression: "request.resource.resource != 'rolebindings' || request.namespace.matches('^(hoover-)?zone-[a-z0-9]{1,12}$')"
      message: The zone runner changes RoleBindings only in zone namespaces.
    # The charts bind only Roles of their namespace. The runner binds no ClusterRole except zone-admin.
    - expression: "request.resource.resource != 'rolebindings' || request.operation == 'DELETE' || object.roleRef.kind == 'Role' || object.roleRef.name == 'zone-admin'"
      message: The zone runner binds no ClusterRole except zone-admin.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: zone-runner-scope
spec:
  policyName: zone-runner-scope
  validationActions: [Deny]
