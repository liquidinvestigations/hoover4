# A Compose development ini written before the Serena server was removed.
# The migration reader of the cluster port reads this source schema.
[storage]
volumes_path = /srv/hoover4-volumes

[ai_services]
enabled = false

[main_services]
website_release_mode = false
serena_enabled = true
serena_port = 21940
development_auth_backdoor_enabled = true
mcp_collections_port = 21930
mcp_metasearch_port = 21931
mcp_browser_port = 21932
mcp_whois_port = 21934
mcp_todo_port = 21935

[dataset_mount.testdata]
host_path = /srv/hoover4-testdata
container_path = /testdata
writable = false

[dataset_mount.uploads]
host_path = /srv/hoover4-uploads
container_path = /uploads
writable = true
