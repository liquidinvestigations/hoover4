[storage]
volumes_path = /srv/hoover4-volumes

[ai_services]
enabled = true
host = 127.0.0.1
llm_selfhosted = true
chat_llm_selfhosted = true
easyocr_enabled = true

[llm_provider.selfhosted]
enabled = true

[llm_provider.nvidia]
enabled = false

[main_services]
manticore_mem_limit = 32G
manticore_vectors_mem_limit = 16G
ner_provider = gpu
embeddings_provider = gpu
