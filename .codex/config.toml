# Codex project settings. Keep the project config and reference config identical.
# Codex loads AGENTS.md and .agents/skills without an adapter.

[features]
hooks = true

[agents]
max_concurrent_threads_per_session = 2

[mcp_servers.serena]
url = "http://127.0.0.1:21940/mcp"

[mcp_servers.hoover4-web-search]
url = "http://127.0.0.1:21931/mcp"

[mcp_servers.hoover4-browser]
url = "http://127.0.0.1:21932/mcp"

[mcp_servers.hoover4-browser.http_headers]
x-hoover4-chat-session = "host-mcp-client"
x-hoover4-user = "host"

[mcp_servers.hoover4-whois]
url = "http://127.0.0.1:21934/mcp"

[[hooks.SessionStart]]
matcher = "^(startup|resume|clear|compact)$"
hooks = [
  { type = "command", command = 'exec "$(git rev-parse --show-toplevel)/.agents/hooks/session-start-orientation.sh"', timeout = 10 },
]

[[hooks.PreToolUse]]
matcher = "^Bash$"
hooks = [
  { type = "command", command = 'exec "$(git rev-parse --show-toplevel)/.agents/hooks/deny-unscoped-search.py"', timeout = 10 },
  { type = "command", command = 'exec "$(git rev-parse --show-toplevel)/.agents/hooks/deny-long-commit-message.py"', timeout = 10 },
]

[[hooks.PreToolUse]]
matcher = "^(Edit|Write)$"
hooks = [
  { type = "command", command = 'exec "$(git rev-parse --show-toplevel)/.agents/hooks/deny-claudisms.py"', timeout = 10 },
]
